eholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='复利终值'>复利终值 — S=P(1+i)ⁿ，本金按复利计息 n 期后的本息合计 <span class=glossary-ref>（第 1 章：算术与初等代数）<\/span><\/li><li data-term='年金现值'>年金现值 — 每期支付 R 共 n 期，按利率 i 折现到今天的总额 <span class=glossary-ref>（第 1 章：算术与初等代数）<\/span><\/li><li data-term='判别式'>判别式 — 二次方程 Δ=b²−4ac，决定实根个数；二次曲线 Δ=B²−4AC 决定类型 <span class=glossary-ref>（第 1 章：算术与初等代数）<\/span><\/li><li data-term='双曲函数'>双曲函数 — 由 eˣ 与 e⁻ˣ 组合定义的函数，满足 cosh²−sinh²=1 <span class=glossary-ref>（第 2 章：函数与初等函数）<\/span><\/li><li data-term='半对数坐标'>半对数坐标 — 一个轴取对数、一个轴取线性，用来把指数律画成直线 <span class=glossary-ref>（第 2 章：函数与初等函数）<\/span><\/li><li data-term='双对数坐标'>双对数坐标 — 两个轴都取对数，用来把幂律画成直线 <span class=glossary-ref>（第 2 章：函数与初等函数）<\/span><\/li><li data-term='海伦公式'>海伦公式 — 由三边直接算三角形面积：S=√(p(p−a)(p−b)(p−c))，p 为半周长 <span class=glossary-ref>（第 3 章：几何学）<\/span><\/li><li data-term='球面三角'>球面三角 — 球面上以球心角表示的边与角构成的三角形，满足球面余弦定理 <span class=glossary-ref>（第 3 章：几何学）<\/span><\/li><li data-term='点积'>点积 — a·b=|a||b|cosθ，结果是一个数，用来算夹角与投影 <span class=glossary-ref>（第 3 章：几何学）<\/span><\/li><li data-term='叉积'>叉积 — a×b，方向垂直两者，模等于张成平行四边形面积 <span class=glossary-ref>（第 3 章：几何学）<\/span><\/li><li data-term='高斯曲率'>高斯曲率 — 两个主曲率之积 K=κ₁κ₂，是曲面的内蕴量 <span class=glossary-ref>（第 3 章：几何学）<\/span><\/li><li data-term='行列式'>行列式 — 方阵对应的一个数，其绝对值是变换对面积或体积的缩放倍数 <span class=glossary-ref>（第 4 章：线性代数）<\/span><\/li><li data-term='秩'>秩 — 矩阵所含线性无关行或列的个数，决定方程组解的结构 <span class=glossary-ref>（第 4 章：线性代数）<\/span><\/li><li data-term='特征值'>特征值 — 使 Av=λv 有非零解 v 的数 λ <span class=glossary-ref>（第 4 章：线性代数）<\/span><\/li><li data-term='四元数'>四元数 — 形如 a+bi+cj+dk 的数，乘法不交换，用于表示三维旋转 <span class=glossary-ref>（第 4 章：线性代数）<\/span><\/li><li data-term='偏导数'>偏导数 — 把其余变量视为常数时对某一变量的导数 <span class=glossary-ref>（第 5 章：微分学）<\/span><\/li><li data-term='梯度'>梯度 — 各偏导组成的向量，指向函数增长最快的方向 <span class=glossary-ref>（第 5 章：微分学）<\/span><\/li><li data-term='方向导数'>方向导数 — 函数沿某单位方向的瞬时变化率，等于梯度在该方向的投影 <span class=glossary-ref>（第 5 章：微分学）<\/span><\/li><li data-term='隐函数定理'>隐函数定理 — 若 F_y≠0，则方程 F(x,y)=0 在局部可解出 y=y(x) <span class=glossary-ref>（第 5 章：微分学）<\/span><\/li><li data-term='比值判据'>比值判据 — 若 lim a(n+1)/a(n)&lt;1 则正项级数收敛，&gt;1 则发散 <span class=glossary-ref>（第 6 章：无穷级数与积分学）<\/span><\/li><li data-term='傅里叶级数'>傅里叶级数 — 把周期函数展开成不同频率正弦余弦之和 <span class=glossary-ref>（第 6 章：无穷级数与积分学）<\/span><\/li><li data-term='雅可比行列式'>雅可比行列式 — 坐标变换偏导组成的行列式，其绝对值是面积或体积元的缩放倍数 <span class=glossary-ref>（第 6 章：无穷级数与积分学）<\/span><\/li><li data-term='积分因子'>积分因子 — 乘以它可把一阶线性方程左边化为一个乘积的导数 <span class=glossary-ref>（第 7 章：微分方程）<\/span><\/li><li data-term='特征根'>特征根 — 二阶常系数线性方程对应的二次方程的根，三种情形决定解的形式 <span class=glossary-ref>（第 7 章：微分方程）<\/span><\/li><li data-term='分离变量法'>分离变量法 — 设 u=X(x)T(t) 把偏微分方程拆成若干常微分方程的方法 <span class=glossary-ref>（第 7 章：微分方程）<\/span><\/li><li data-term='条件概率'>条件概率 — 在已知 B 发生的条件下 A 发生的概率，P(A|B)=P(A∩B)/P(B) <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><li data-term='全概率公式'>全概率公式 — P(A)=ΣP(A|Bᵢ)P(Bᵢ)，Bᵢ 构成完备事件组 <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><li data-term='中心极限定理'>中心极限定理 — 大量独立同分布随机变量之和近似正态分布 <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><li data-term='置信区间'>置信区间 — 由样本构造的区间，反复抽样时约有一定比例的区间包含真值 <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><li data-term='无偏估计'>无偏估计 — 期望等于被估计参数的估计量 <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><li data-term='第一类错误'>第一类错误 — 原假设为真却被拒绝，概率为显著性水平 α <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：查表四问<\/h2>\n<p>手册的用法不是背公式，是四步定位。任何一个计算问题，先问：它属于哪个数学对象（数、函数、图形、方程、随机量）；需要哪类运算（求值、求极值、求累积、求分布）；有没有已知公式；公式的适用条件是什么。四问答完，翻哪一节就定了。<\/p>\n<p>这个框架在全书反复用。第二章查曲线、第三章查体积、第六章查积分、第八章查分布，走的都是同一套提问顺序。<\/p>\n<h2>框架：先变换再计算<\/h2>\n<p>手册里大量技巧本质是&quot;把问题变成已会的形式&quot;。换坐标把幂律变直线，换元把复合积分变简单积分，换变量把伯努利方程变线性方程，分离变量把 PDE 变 ODE。这四件事的骨架相同：找一个变换，让陌生结构落进熟悉的模板。<\/p>\n<p>用法：拿到一个算不动的问题，先别硬算，问&quot;换个变量会不会变简单&quot;。代价是要记得变换带来的因子，比如雅可比。<\/p>\n<h2>框架：必要条件先筛，充分条件后判<\/h2>\n<p>极值用驻点筛，二阶条件判；级数用通项趋于零筛，比值法定论；假设检验用检验统计量筛，p 值定论。手册里凡是&quot;判断&quot;类问题，大多是先给一个便宜的必要条件缩小范围，再上贵的判据。<\/p>\n<p>用法：算不动的时候先看必要条件能不能排除掉大部分情形，能排除就先排除。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n要算一个具体数 → 查公式表，注意定义域和单位。\n<\/li><li>\n要给一组数据定规律 → 先试半对数，再试双对数。\n<\/li><li>\n要判断方程解的情况 → 比秩，不比行列式。\n<\/li><li>\n要算积分 → 先看能否查表，再看换元，最后分部。\n<\/li><li>\n要判断级数 → 通项先趋于零，再比值，再比较。\n<\/li><li>\n要给 PDE 定解 → 先分类，再按类型配条件。\n<\/ul>\n<h2>反模式<\/h2>\n<p><strong>不分类型直接套公式。<\/strong> 分式、根式、微分方程的套法都不一样，跳过分类这一步，后面全错。<\/p>\n<p><strong>忘记坐标变换的因子。<\/strong> 极坐标漏 r、球坐标漏 ρ²sinφ，是最常见的计算错误。<\/p>\n<p><strong>把必要条件当结论。<\/strong> 梯度为零不等于极值，通项趋于零不等于收敛。<\/p>\n<p><strong>用高精度掩盖错误模型。<\/strong> 公式用错了，算得再准也没用；手册的每一条公式都有适用前提，前提不成立就换方法。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>初等公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>复利终值<\/td><td><code>S=P(1+i)ⁿ<\/code><\/td><\/tr><tr><td>复利现值<\/td><td><code>P=S/(1+i)ⁿ<\/code><\/td><\/tr><tr><td>年金终值<\/td><td><code>S=R[(1+i)ⁿ−1]/i<\/code><\/td><\/tr><tr><td>年金现值<\/td><td><code>P=R[1−(1+i)⁻ⁿ]/i<\/code><\/td><\/tr><tr><td>二次方程求根<\/td><td><code>x=(−b±√(b²−4ac))/(2a)<\/code><\/td><\/tr><tr><td>立方和<\/td><td><code>a³+b³=(a+b)(a²−ab+b²)<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>几何与三角<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>正弦定理<\/td><td><code>a/sinA=b/sinB=c/sinC=2R<\/code><\/td><\/tr><tr><td>余弦定理<\/td><td><code>c²=a²+b²−2ab cosC<\/code><\/td><\/tr><tr><td>三角形面积<\/td><td><code>S=(1/2)ab sinC<\/code> 或海伦公式<\/td><\/tr><tr><td>球面余弦定理<\/td><td><code>cos c=cos a cos b+sin a sin b cos C<\/code><\/td><\/tr><tr><td>圆的曲率<\/td><td><code>κ=1/R<\/code><\/td><\/tr><tr><td>高斯曲率<\/td><td><code>K=κ₁κ₂<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>线性代数<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式或判据<\/th><\/tr><\/thead><tbody><tr><td>2×2 行列式<\/td><td><code>ad−bc<\/code><\/td><\/tr><tr><td>可逆判据<\/td><td><code>det(A)≠0<\/code><\/td><\/tr><tr><td>唯一解<\/td><td>`rank(A)=rank([A<\/td><td>b])=n`<\/td><\/tr><tr><td>特征方程<\/td><td><code>det(A−λI)=0<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>微积分<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>导数定义<\/td><td><code>f&#x27;(x)=lim[f(x+h)−f(x)]/h<\/code><\/td><\/tr><tr><td>分部积分<\/td><td><code>∫u dv=uv−∫v du<\/code><\/td><\/tr><tr><td>泰勒展开<\/td><td><code>Σf⁽ᵏ⁾(a)(x−a)ᵏ/k!<\/code><\/td><\/tr><tr><td>梯度<\/td><td><code>∇f=(f_x,f_y,f_z)<\/code><\/td><\/tr><tr><td>方向导数<\/td><td><code>∇f·l<\/code><\/td><\/tr><tr><td>隐函数求导<\/td><td><code>dy/dx=−F_x/F_y<\/code><\/td><\/tr><tr><td>极坐标面积元<\/td><td><code>r dr dθ<\/code><\/td><\/tr><tr><td>球坐标体积元<\/td><td><code>ρ²sinφ dρ dφ dθ<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>级数与方程<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式或判据<\/th><\/tr><\/thead><tbody><tr><td>比值判据<\/td><td><code>lim a(n+1)/a(n)&lt;1<\/code> 收敛<\/td><\/tr><tr><td>p 级数<\/td><td><code>p&gt;1<\/code> 收敛<\/td><\/tr><tr><td>几何级数<\/td><td><code>Σxⁿ=1/(1−x)<\/code>，`<\/td><td>x<\/td><td>&lt;1`<\/td><\/tr><tr><td>傅里叶系数<\/td><td><code>aₙ=(1/π)∫f cos nx dx<\/code><\/td><\/tr><tr><td>一阶线性<\/td><td>积分因子 <code>e^(∫Pdx)<\/code><\/td><\/tr><tr><td>二阶特征根<\/td><td><code>λ²+pλ+q=0<\/code><\/td><\/tr><tr><td>PDE 分类<\/td><td><code>B²−4AC<\/code>：&lt;0 椭圆，=0 抛物，&gt;0 双曲<\/td><\/tr><\/tbody><\/table>\n<h2>概率与统计<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>组合<\/td><td><code>C(n,k)=n!/(k!(n−k)!)<\/code><\/td><\/tr><tr><td>贝叶斯<\/td><td>`P(B<\/td><td>A)=P(A<\/td><td>B)P(B)/P(A)`<\/td><\/tr><tr><td>二项分布<\/td><td><code>C(n,k)p^k(1−p)^(n−k)<\/code><\/td><\/tr><tr><td>泊松分布<\/td><td><code>λ^k e^(−λ)/k!<\/code><\/td><\/tr><tr><td>正态密度<\/td><td><code>(1/√(2π)σ)e^(−(x−μ)²/(2σ²))<\/code><\/td><\/tr><tr><td>样本方差<\/td><td><code>Σ(xᵢ−x̄)²/(n−1)<\/code><\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
