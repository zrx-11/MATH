='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> sin x / x 在 x→0 时极限为 1 的证明中，关键不等式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> sin x &gt; x<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> cos x &lt; sin x/x &lt; 1<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> tan x &lt; x<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> sin x &lt; cos x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> (1+1/n)^n 当 n→∞ 时的极限记作什么？（填一个字母）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：极大与极小<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 直线 L 同侧两点 P、Q，L 上使 PR+RQ 最小的点 R 满足？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> PR 与 RQ 垂直<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> PR、RQ 与 L 成等角<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> R 是 PQ 的中点投影<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> R 到 P、Q 距离相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 固定周长的一切平面闭曲线中，围成面积最大的是什么图形？（填两字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：微积分<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 微积分基本定理第一半说的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 连续函数必可积<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 积分上限函数的导数等于被积函数<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 导数等于切线斜率<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 原函数一定存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> ∫₀¹ x² dx 的值是多少？（写成 a/b 形式）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪一组概念是同一件事在不同变换群下的版本？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 长度、交比、连通性<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 欧氏几何、仿射几何、射影几何、拓扑<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 归纳法、极限、积分<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 有理数、实数、复数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 把归纳法、极限、定积分按依赖顺序排列，正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 极限→归纳法→定积分<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 归纳法→极限→定积分<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 定积分→极限→归纳法<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 三者互不依赖<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 球面上任一简单多面体满足 V−E+F 等于多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='算术基本规律'>算术基本规律 — 交换律、结合律、分配律这五条对整数成立的等式，是全部算术推理的起点 <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='数学归纳法'>数学归纳法 — 验第一项成立，再证任意一项成立能推出下一项，两步覆盖全部自然数 <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='素数'>素数 — 大于 1 且只能被 1 和自身整除的整数 <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='算术基本定理'>算术基本定理 — 每个大于 1 的整数都能唯一分解为素数乘积，不计次序 <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='同余'>同余 — 两个整数除以 m 后余数相同，记作 a ≡ b (mod m) <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='辗转相除法'>辗转相除法 — 用取余反复迭代求最大公因数，依据 gcd(a,b)=gcd(b,a mod b) <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='有理数'>有理数 — 能写成两个整数之比的数，比值不依赖所选的度量单位 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='不可公度'>不可公度 — 两条线段不能用同一个单位同时量尽，等价于长度之比不是有理数 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='区间套'>区间套 — 一串嵌套的闭区间，长度趋于零，它锁定一个点，可用来定义实数 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='戴德金分割'>戴德金分割 — 把有理数分成左右两半且左半无最大元、右半无最小元，这个切口定义一个实数 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='可数'>可数 — 能与自然数一一对应的集合，例如有理数 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='基数'>基数 — 衡量集合大小的量，可数集合的基数为 ℵ₀ <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='代数数'>代数数 — 某个整系数多项式的根 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='超越数'>超越数 — 不是任何整系数多项式根的实数，例如 π 与 e <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='数域'>数域 — 对加减乘除封闭的数集，例如有理数、实数、复数 <span class=glossary-ref>（第 3 章：几何作图与数域的代数）<\/span><\/li><li data-term='二次扩张'>二次扩张 — 在当前数域上添加一个平方根所得的扩域，次数为 2 <span class=glossary-ref>（第 3 章：几何作图与数域的代数）<\/span><\/li><li data-term='反演'>反演 — 关于圆的变换，把点 P 映到射线 OP 上的 P′ 且 OP·OP′ = r² <span class=glossary-ref>（第 3 章：几何作图与数域的代数）<\/span><\/li><li data-term='射影变换'>射影变换 — 把直线映成直线的变换，来自中心投影，会破坏长度、角度和平行 <span class=glossary-ref>（第 4 章：射影几何、公理体系与非欧几何）<\/span><\/li><li data-term='交比'>交比 — 共线四点构成的长度比之商，在射影变换下不变 <span class=glossary-ref>（第 4 章：射影几何、公理体系与非欧几何）<\/span><\/li><li data-term='对偶原理'>对偶原理 — 射影平面里把点与线互换，命题与其对偶同时成立 <span class=glossary-ref>（第 4 章：射影几何、公理体系与非欧几何）<\/span><\/li><li data-term='同胚'>同胚 — 双向连续且可逆的映射，拓扑学判断两个图形是否相同的标准 <span class=glossary-ref>（第 5 章：拓扑学）<\/span><\/li><li data-term='亏格'>亏格 — 曲面上洞的个数，可定向闭曲面满足 χ=2−2g <span class=glossary-ref>（第 5 章：拓扑学）<\/span><\/li><li data-term='单侧曲面'>单侧曲面 — 只有一个面的曲面，沿法向量走一圈会走到反面，莫比乌斯带是最简例子 <span class=glossary-ref>（第 5 章：拓扑学）<\/span><\/li><li data-term='极限'>极限 — 任意给定误差后，从某项起所有值都落在误差范围内 <span class=glossary-ref>（第 6 章：函数与极限）<\/span><\/li><li data-term='连续'>连续 — 函数在一点的极限存在且等于该点函数值 <span class=glossary-ref>（第 6 章：函数与极限）<\/span><\/li><li data-term='介值定理'>介值定理 — 闭区间上的连续函数从负走到正，必经过零 <span class=glossary-ref>（第 6 章：函数与极限）<\/span><\/li><li data-term='紧致集'>紧致集 — 闭且有界的集合，连续函数在其上必取到最大最小值 <span class=glossary-ref>（第 6 章：函数与极限）<\/span><\/li><li data-term='驻点'>驻点 — 导数为零的点，是极值点的必要条件而非充分条件 <span class=glossary-ref>（第 7 章：极大与极小）<\/span><\/li><li data-term='鞍点'>鞍点 — 沿一个方向上升、沿另一个方向下降的驻点 <span class=glossary-ref>（第 7 章：极大与极小）<\/span><\/li><li data-term='变分法'>变分法 — 在曲线族里找使某个量取极值的曲线，必要条件由欧拉-拉格朗日方程给出 <span class=glossary-ref>（第 7 章：极大与极小）<\/span><\/li><li data-term='定积分'>定积分 — 矩形和当分划无限加密时的极限，结果与分法无关 <span class=glossary-ref>（第 8 章：微积分）<\/span><\/li><li data-term='导数'>导数 — 差商的极限，几何上是切线斜率，物理上是瞬时变化率 <span class=glossary-ref>（第 8 章：微积分）<\/span><\/li><li data-term='牛顿-莱布尼茨公式'>牛顿-莱布尼茨公式 — 定积分等于原函数在端点的差，把求面积降级为找原函数 <span class=glossary-ref>（第 8 章：微积分）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：问题驱动扩张<\/h2>\n<p>柯朗讲每一个新结构，都先把&quot;旧结构不够用&quot;的具体场景摆出来，再引入新定义。数系是全书的原型：自然数不够度量，所以有分数；分数不够表示对角线，所以有无理数；实数不够解方程，所以有复数。这个顺序在几何（欧氏到射影到拓扑）和微积分（有限和到极限）里反复出现。<\/p>\n<p>用法：遇到一个陌生定义时，先问&quot;它解决的是哪个算不下去的场景&quot;。答不上来，说明还没读懂。<\/p>\n<h2>框架：变换与不变量<\/h2>\n<p>判断一个命题属于哪门几何，看它在哪类变换下还成立。长度只在刚体运动下不变，交比在射影变换下不变，洞数在任意连续变形下不变。这个框架能把四门几何排成一条链。<\/p>\n<p>用法：拿到一个命题，先用最宽松的变换去试。如果它在连续变形下仍成立，那是拓扑命题，可以用更粗的工具；如果只在刚体运动下成立，就得用度量。<\/p>\n<h2>框架：先存在再定位<\/h2>\n<p>极值问题是这个框架最清楚的展示，但它的适用范围更广。任何&quot;找最优&quot;的问题，先得说清最优解在不在，再谈怎么找。变分法、微分方程解的存在性、概率里的期望存在性都遵循同一条纪律。<\/p>\n<p>用法：动手算之前先问&quot;候选集合是不是紧的&quot;。不是的话，先改提法或加约束。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n要证&quot;对所有自然数成立&quot;→ 归纳法；要证&quot;存在某个数&quot;→ 构造或反证。\n<\/li><li>\n要证&quot;不可能&quot;→ 找不变量或代数次数，不要试图穷举失败原因。\n<\/li><li>\n要求极限 → 先看单调性与有界性，不行再用定义硬算，最后考虑夹逼。\n<\/li><li>\n要判断两个图形是否相同 → 先试连续变形，再看洞数，最后才用量度。\n<\/li><li>\n要求极值 → 先查紧致性，再用驻点或不等式，最后验证全局。\n<\/ul>\n<h2>反模式<\/h2>\n<p><strong>拿特例当证明。<\/strong> 验了 n=1、2、3 就宣布公式成立，是最常见的错误。柯朗在讲归纳法时专门拆解了这种想法。<\/p>\n<p><strong>先算后证存在。<\/strong> 对着一个不存在的最优解做半天推导，历史上等周问题和狄利克雷原理都栽在这上面。<\/p>\n<p><strong>把记号当运算。<\/strong> <code>dy/dx<\/code> 看着像分数，实际是记号。把它当分数随意约分，会在高阶情形出错。<\/p>\n<p><strong>用直观代替定义。<\/strong> &quot;连续就是一笔画&quot;这类说法在初等情形够用，一旦遇到处处连续处处不可导的函数就失灵。定义是判据，直观是向导，两者不能互换。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>等差级数求和<\/td><td><code>n·a + d·n(n−1)/2<\/code><\/td><\/tr><tr><td>等比级数求和<\/td><td><code>a(qⁿ−1)/(q−1)<\/code>，q≠1<\/td><\/tr><tr><td>前 n 项平方和<\/td><td><code>n(n+1)(2n+1)/6<\/code><\/td><\/tr><tr><td>二项式系数递推<\/td><td><code>C(n,k)=C(n−1,k−1)+C(n−1,k)<\/code><\/td><\/tr><tr><td>最大公因数<\/td><td><code>gcd(a,b)=gcd(b, a mod b)<\/code><\/td><\/tr><tr><td>费马小定理<\/td><td>p 素、p∤a 时 <code>a^(p−1) ≡ 1 (mod p)<\/code><\/td><\/tr><tr><td>欧拉公式<\/td><td>简单多面体 <code>V−E+F=2<\/code><\/td><\/tr><tr><td>欧拉示性数与亏格<\/td><td>可定向闭曲面 <code>χ=2−2g<\/code><\/td><\/tr><tr><td>交比<\/td><td><code>(A,B;C,D)=(AC/BC)/(AD/BD)<\/code><\/td><\/tr><tr><td>棣莫弗公式<\/td><td><code>(cosθ+i sinθ)ⁿ=cos nθ+i sin nθ<\/code><\/td><\/tr><tr><td>均值不等式<\/td><td><code>(a+b)/2 ≥ √(ab)<\/code>，等号 a=b<\/td><\/tr><tr><td>重要极限<\/td><td><code>lim sin x/x = 1<\/code>（x→0，弧度制）<\/td><\/tr><tr><td>欧拉数<\/td><td><code>e = lim(1+1/n)ⁿ ≈ 2.71828<\/code><\/td><\/tr><tr><td>基本定理<\/td><td><code>d/dx ∫ₐˣ f = f(x)<\/code>；<code>∫ₐᵇ f = F(b)−F(a)<\/code><\/td><\/tr><tr><td>指数方程<\/td><td><code>y&#x27;=ky<\/code> 的解 <code>y=Ce^(kt)<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>常用判据<\/h2>\n<table><thead><tr><th>问题<\/th><th>判据<\/th><\/tr><\/thead><tbody><tr><td>正 n 边形可作？<\/td><td>n = 2^k × 互不相同的费马素数之积<\/td><\/tr><tr><td>三次多项式不可约？<\/td><td>无有理根（有理根只可能是常数项因数除以首项因数）<\/td><\/tr><tr><td>数列收敛？<\/td><td>单调 + 有界；或按 ε-N 定义给出 N<\/td><\/tr><tr><td>连续函数有最值？<\/td><td>定义域闭且有界<\/td><\/tr><tr><td>点是极值点？<\/td><td>驻点 + 导数变号（或二阶导符号）<\/td><\/tr><tr><td>两个曲面同胚？<\/td><td>同亏格且同定向性<\/td><\/tr><\/tbody><\/table>\n<h2>三个古希腊难题的失败原因<\/h2>\n<table><thead><tr><th>问题<\/th><th>要求的数<\/th><th>卡在哪<\/th><\/tr><\/thead><tbody><tr><td>倍立方<\/td><td>³√2<\/td><td>次数 3，不是 2 的幂<\/td><\/tr><tr><td>三等分 60°<\/td><td>2cos20°<\/td><td>次数 3，不是 2 的幂<\/td><\/tr><tr><td>正七边形<\/td><td>cos(2π/7)<\/td><td>次数 3，不是 2 的幂<\/td><\/tr><tr><td>化圆为方<\/td><td>√π<\/td><td>π 是超越数，不属于代数数<\/td><\/tr><\/tbody><\/table>\n<h2>四门几何守住的量<\/h2>\n<table><thead><tr><th>几何<\/th><th>变换<\/th><th>不变量<\/th><\/tr><\/thead><tbody><tr><td>欧氏<\/td><td>刚体运动<\/td><td>长度、角度、面积<\/td><\/tr><tr><td>仿射<\/td><td>平移+线性变换<\/td><td>平行、中点、共线<\/td><\/tr><tr><td>射影<\/td><td>中心投影<\/td><td>交比、共线<\/td><\/tr><tr><td>拓扑<\/td><td>任意连续变形<\/td><td>连通性、洞数、定向性<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
