oncepts/实数连续统.md", "chapterIds": ["ch02"]}, {"id": "c03", "title": "数域与尺规代数", "file": "concepts/数域与尺规代数.md", "chapterIds": ["ch03"]}, {"id": "c04", "title": "变换群与不变量", "file": "concepts/变换群与不变量.md", "chapterIds": ["ch04", "ch05"]}, {"id": "c05", "title": "欧拉示性数", "file": "concepts/欧拉示性数.md", "chapterIds": ["ch05"]}, {"id": "c06", "title": "极限", "file": "concepts/极限.md", "chapterIds": ["ch06", "ch08"]}, {"id": "c07", "title": "极值与存在性", "file": "concepts/极值与存在性.md", "chapterIds": ["ch07"]}, {"id": "c08", "title": "微积分基本定理", "file": "concepts/微积分基本定理.md", "chapterIds": ["ch08"]}], "glossary": [{"term": "算术基本规律", "def": "交换律、结合律、分配律这五条对整数成立的等式，是全部算术推理的起点", "chapterId": "ch01"}, {"term": "数学归纳法", "def": "验第一项成立，再证任意一项成立能推出下一项，两步覆盖全部自然数", "chapterId": "ch01"}, {"term": "素数", "def": "大于 1 且只能被 1 和自身整除的整数", "chapterId": "ch01"}, {"term": "算术基本定理", "def": "每个大于 1 的整数都能唯一分解为素数乘积，不计次序", "chapterId": "ch01"}, {"term": "同余", "def": "两个整数除以 m 后余数相同，记作 a ≡ b (mod m)", "chapterId": "ch01"}, {"term": "辗转相除法", "def": "用取余反复迭代求最大公因数，依据 gcd(a,b)=gcd(b,a mod b)", "chapterId": "ch01"}, {"term": "有理数", "def": "能写成两个整数之比的数，比值不依赖所选的度量单位", "chapterId": "ch02"}, {"term": "不可公度", "def": "两条线段不能用同一个单位同时量尽，等价于长度之比不是有理数", "chapterId": "ch02"}, {"term": "区间套", "def": "一串嵌套的闭区间，长度趋于零，它锁定一个点，可用来定义实数", "chapterId": "ch02"}, {"term": "戴德金分割", "def": "把有理数分成左右两半且左半无最大元、右半无最小元，这个切口定义一个实数", "chapterId": "ch02"}, {"term": "可数", "def": "能与自然数一一对应的集合，例如有理数", "chapterId": "ch02"}, {"term": "基数", "def": "衡量集合大小的量，可数集合的基数为 ℵ₀", "chapterId": "ch02"}, {"term": "代数数", "def": "某个整系数多项式的根", "chapterId": "ch02"}, {"term": "超越数", "def": "不是任何整系数多项式根的实数，例如 π 与 e", "chapterId": "ch02"}, {"term": "数域", "def": "对加减乘除封闭的数集，例如有理数、实数、复数", "chapterId": "ch03"}, {"term": "二次扩张", "def": "在当前数域上添加一个平方根所得的扩域，次数为 2", "chapterId": "ch03"}, {"term": "反演", "def": "关于圆的变换，把点 P 映到射线 OP 上的 P′ 且 OP·OP′ = r²", "chapterId": "ch03"}, {"term": "射影变换", "def": "把直线映成直线的变换，来自中心投影，会破坏长度、角度和平行", "chapterId": "ch04"}, {"term": "交比", "def": "共线四点构成的长度比之商，在射影变换下不变", "chapterId": "ch04"}, {"term": "对偶原理", "def": "射影平面里把点与线互换，命题与其对偶同时成立", "chapterId": "ch04"}, {"term": "同胚", "def": "双向连续且可逆的映射，拓扑学判断两个图形是否相同的标准", "chapterId": "ch05"}, {"term": "亏格", "def": "曲面上洞的个数，可定向闭曲面满足 χ=2−2g", "chapterId": "ch05"}, {"term": "单侧曲面", "def": "只有一个面的曲面，沿法向量走一圈会走到反面，莫比乌斯带是最简例子", "chapterId": "ch05"}, {"term": "极限", "def": "任意给定误差后，从某项起所有值都落在误差范围内", "chapterId": "ch06"}, {"term": "连续", "def": "函数在一点的极限存在且等于该点函数值", "chapterId": "ch06"}, {"term": "介值定理", "def": "闭区间上的连续函数从负走到正，必经过零", "chapterId": "ch06"}, {"term": "紧致集", "def": "闭且有界的集合，连续函数在其上必取到最大最小值", "chapterId": "ch06"}, {"term": "驻点", "def": "导数为零的点，是极值点的必要条件而非充分条件", "chapterId": "ch07"}, {"term": "鞍点", "def": "沿一个方向上升、沿另一个方向下降的驻点", "chapterId": "ch07"}, {"term": "变分法", "def": "在曲线族里找使某个量取极值的曲线，必要条件由欧拉-拉格朗日方程给出", "chapterId": "ch07"}, {"term": "定积分", "def": "矩形和当分划无限加密时的极限，结果与分法无关", "chapterId": "ch08"}, {"term": "导数", "def": "差商的极限，几何上是切线斜率，物理上是瞬时变化率", "chapterId": "ch08"}, {"term": "牛顿-莱布尼茨公式", "def": "定积分等于原函数在端点的差，把求面积降级为找原函数", "chapterId": "ch08"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "companion": "what-is-mathematics学习伴侣.html", "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "数学归纳法证明中，假设 P(n) 成立这一步的作用是？", "options": ["证明 P(n) 对所有 n 成立", "作为递推步的前提，用来推出 P(n+1)", "验证基底情形", "证明命题的唯一性"], "answer": 1, "explain": "归纳假设是递推步的出发点，本身不构成结论。基底步由另一条独立完成。"}, {"id": "q02", "chapterId": "ch01", "type": "blank", "question": "gcd(1071, 1029) 的值是？（填整数）", "options": [], "answer": "21", "explain": "1071−1029=42，1029=42×24+21，42=21×2，最后非零余数为 21。"}, {"id": "q01", "chapterId": "ch02", "type": "single", "question": "√2 不是有理数的证明中，设 p、q 互素这一步的作用是？", "options": ["保证 q 不为 0", "保证 p、q 都是偶数", "为 p、q 同为偶数与互素的矛盾埋下条件", "说明 √2 是小数"], "answer": 2, "explain": "推导出 p、q 都是偶数后，必须用互素来制造矛盾；不做最简假设就没有矛盾。"}, {"id": "q02", "chapterId": "ch02", "type": "blank", "question": "0.272727… 化成最简分数是多少？（写成 a/b 形式）", "options": [], "answer": "3/11", "explain": "设 x=0.2727…，100x=27.2727…，相减得 99x=27，x=27/99=3/11。"}, {"id": "q01", "chapterId": "ch03", "type": "single", "question": "尺规作图能构造的数，其代数次数必须是？", "options": ["任意整数", "2 的幂", "素数", "3 的倍数"], "answer": 1, "explain": "每一步作图只引入平方根，域扩张次数每次乘 2，总次数是 2 的幂。"}, {"id": "q02", "chapterId": "ch03", "type": "blank", "question": "正多边形可作判据中，奇素因子必须是形如 2^(2^m)+1 的什么素数？（填两字）", "options": [], "answer": "费马", "explain": "高斯判据要求奇素因子是费马素数，例如 3、5、17、257、65537。"}, {"id": "q01", "chapterId": "ch04", "type": "single", "question": "在射影变换下保持不变的量是？", "options": ["线段长度", "两条直线的夹角", "交比", "图形面积"], "answer": 2, "explain": "长度、角度、面积都被射影变换破坏，交比由共线四点的长度比构成，尺度因子相消。"}, {"id": "q02", "chapterId": "ch04", "type": "blank", "question": "非欧几何的相容性通过构造什么来保证？（填两字）", "options": [], "answer": "模型", "explain": "模型把非欧公理翻译成欧氏体系内成立的命题，非欧的矛盾会变成欧氏的矛盾。"}, {"id": "q01", "chapterId": "ch05", "type": "single", "question": "一个多面体算出 V−E+F=0，它最可能是？", "options": ["球面", "环面", "平面", "圆柱侧面"], "answer": 1, "explain": "χ=2−2g，χ=0 对应 g=1，即有一个洞的闭曲面，典型是环面。"}, {"id": "q02", "chapterId": "ch05", "type": "blank", "question": "莫比乌斯带只有几个面？（填数字）", "options": [], "answer": "1", "explain": "它不可定向，沿法向量走一圈到达反面，因此只有一个面。"}, {"id": "q01", "chapterId": "ch06", "type": "single", "question": "sin x / x 在 x→0 时极限为 1 的证明中，关键不等式是？", "options": ["sin x > x", "cos x < sin x/x < 1", "tan x < x", "sin x < cos x"], "answer": 1, "explain": "由面积比较得 sin x < x < tan x，取倒数整理得 cos x < sin x/x < 1，再用夹逼定理。"}, {"id": "q02", "chapterId": "ch06", "type": "blank", "question": "(1+1/n)^n 当 n→∞ 时的极限记作什么？（填一个字母）", "options": [], "answer": "e", "explain": "这是 e 的定义式，数列单调递增且有上界，极限约 2.71828。"}, {"id": "q01", "chapterId": "ch07", "type": "single", "question": "直线 L 同侧两点 P、Q，L 上使 PR+RQ 最小的点 R 满足？", "options": ["PR 与 RQ 垂直", "PR、RQ 与 L 成等角", "R 是 PQ 的中点投影", "R 到 P、Q 距离相等"], "answer": 1, "explain": "对 P 作对称点 P′，R 是 P′Q 与 L 的交点，此时入射角等于反射角。"}, {"id": "q02", "chapterId": "ch07", "type": "blank", "question": "固定周长的一切平面闭曲线中，围成面积最大的是什么图形？（填两字）", "options": [], "answer": "圆", "explain": "这是等周问题的结论，等号情形为圆，证明需要先确立存在性。"}, {"id": "q01", "chapterId": "ch08", "type": "single", "question": "微积分基本定理第一半说的是？", "options": ["连续函数必可积", "积分上限函数的导数等于被积函数", "导数等于切线斜率", "原函数一定存在"], "answer": 1, "explain": "d/dx ∫ₐˣ f(t)dt = f(x)，这是把积分与微分接起来的一步。"}, {"id": "q02", "chapterId": "ch08", "type": "blank", "question": "∫₀¹ x² dx 的值是多少？（写成 a/b 形式）", "options": [], "answer": "1/3", "explain": "原函数 x³/3，代入上下限得 1/3；用矩形和极限也能得到同一结果。"}, {"id": "q01", "chapterId": "__all", "type": "single", "question": "下列哪一组概念是同一件事在不同变换群下的版本？", "options": ["长度、交比、连通性", "欧氏几何、仿射几何、射影几何、拓扑", "归纳法、极限、积分", "有理数、实数、复数"], "answer": 1, "explain": "厄兰格纲领把几何按变换群分类，四门几何是同一件事的不同宽松程度。"}, {"id": "q02", "chapterId": "__all", "type": "single", "question": "把归纳法、极限、定积分按依赖顺序排列，正确的是？", "options": ["极限→归纳法→定积分", "归纳法→极限→定积分", "定积分→极限→归纳法", "三者互不依赖"], "answer": 1, "explain": "归纳法管自然数，极限需要实数完备性，定积分是矩形和的极限，并且算 ∫x² 时用到了归纳法证出的平方和公式。"}, {"id": "q03", "chapterId": "__all", "type": "blank", "question": "球面上任一简单多面体满足 V−E+F 等于多少？（填数字）", "options": [], "answer": "2", "explain": "χ=2 对应亏格 0，球面与任何简单多面体同胚。"}], "flashcards": [{"id": "ch01-f01", "chapterId": "ch01", "front": "归纳法要做几步，各是什么？", "back": "两步：基底步验证 P(1)；递推步假设 P(n) 推出 P(n+1)", "tags": ["归纳法"]}, {"id": "ch01-f02", "chapterId": "ch01", "front": "为什么五条算术规律不能算显然？", "back": "同样的规律对别的运算对象会失效，例如硫酸加水不满足交换律", "tags": ["归纳法"]}, {"id": "ch01-f03", "chapterId": "ch01", "front": "算术基本定理说了什么？", "back": "每个大于 1 的整数都能唯一分解为素数乘积，不计次序", "tags": ["数论"]}, {"id": "ch01-f04", "chapterId": "ch01", "front": "辗转相除法的合法性依据是哪条等式？", "back": "gcd(a,b)=gcd(b, a mod b)", "tags": ["数论"]}, {"id": "ch01-f05", "chapterId": "ch01", "front": "等差级数求和公式是什么？", "back": "n·a + d·n(n−1)/2，首项 a，公差 d", "tags": ["数论"]}, {"id": "ch02-f01", "chapterId": "ch02", "front": "为什么说有理数稠密但仍有洞？", "back": "任意两个有理数之间有有理数，但 √2 的位置上没有有理数", "tags": ["数系"]}, {"id": "ch02-f02", "chapterId": "ch02", "front": "区间套定义实数靠哪两个条件？", "back": "区间层层嵌套，长度趋于零", "tags": ["数系"]}, {"id": "ch02-f03", "chapterId": "ch02", "front": "康托对角线证明的核心一步是什么？", "back": "构造一个新数，让它在第 n 位与列表中第 n 个数不同，从而不在列表里", "tags": ["数系"]}, {"id": "ch02-f04", "chapterId": "ch02", "front": "√2 反证法的矛盾从哪来？", "back": "推出 p、q 都是偶数，与已约到最简的前提冲突", "tags": ["数系"]}, {"id": "ch02-f05", "chapterId": "ch02", "front": "代数数与超越数的分界是什么？", "back": "代数数是某整系数多项式的根，超越数不是任何这样的根", "tags": ["数系"]}, {"id": "ch03-f01", "chapterId": "ch03", "front": "尺规作图在代数上对应哪种运算？", "back": "四则运算加开平方，即反复做二次扩张", "tags": ["尺规"]}, {"id": "ch03-f02", "chapterId": "ch03", "front": "倍立方体为什么不可作？", "back": "需要 ³√2，它是 x³−2=0 的根，代数次数 3，不是 2 的幂", "tags": ["尺规"]}, {"id": "ch03-f03", "chapterId": "ch03", "front": "正 n 边形可作的判据是什么？", "back": "n 为 2 的幂乘若干互不相同的费马素数", "tags": ["尺规"]}, {"id": "ch03-f04", "chapterId": "ch03", "front": "化圆为方为什么比另外三个难题更难？", "back": "π 是超越数，不能靠代数次数排除，需要林德曼定理", "tags": ["尺规"]}, {"id": "ch03-f05", "chapterId": "ch03", "front": "马歇罗尼定理说了什么？", "back": "凡是尺规能作的图，只用圆规也能作", "tags": ["尺规"]}, {"id": "ch04-f01", "chapterId": "ch04", "front": "厄兰格纲领的一句话内容是什么？", "back": "一门几何由它的变换群决定，几何命题是群下的不变量", "tags": ["变换"]}, {"id": "ch04-f02", "chapterId": "ch04", "front": "射影几何守住哪个量？", "back": "交比，即共线四点的长度比之商", "tags": ["变换"]}, {"id": "ch04-f03", "chapterId": "ch04", "front": "对偶原理怎么用？", "back": "把命题里的点和线互换、关联关系反向，得到的命题同样成立", "tags": ["变换"]}, {"id": "ch04-f04", "chapterId": "ch04", "front": "公理体系的相容性怎么保证？", "back": "构造模型，把公理翻译成另一个已知无矛盾体系里的命题", "tags": ["公理"]}, {"id": "ch04-f05", "chapterId": "ch04", "front": "双曲几何与欧氏几何的差别在哪条公理？", "back": "平行公理：过直线外一点至少可作两条不相交直线", "tags": ["公理"]}, {"id": "ch05-f01", "chapterId": "ch05", "front": "欧拉公式怎么写？", "back": "对简单多面体 V−E+F=2", "tags": ["拓扑"]}, {"id": "ch05-f02", "chapterId": "ch05", "front": "欧拉示性数与亏格的关系？", "back": "可定向闭曲面 χ=2−2g", "tags": ["拓扑"]}, {"id": "ch05-f03", "chapterId": "ch05", "front": "莫比乌斯带为什么只有一个面？", "back": "沿法向量走一圈会到反面，曲面不可定向", "tags": ["拓扑"]}, {"id": "ch05-f04", "chapterId": "ch05", "front": "若尔当曲线定理说什么？", "back": "平面上一条简单闭曲线把平面分成内部和外部", "tags": ["拓扑"]}, {"id": "ch05-f05", "chapterId": "ch05", "front": "拓扑性质的定义是什么？", "back": "在双向连续的变形下保持不变的性质", "tags": ["拓扑"]}, {"id": "ch06-f01", "chapterId": "ch06", "front": "数列收敛到 L 的定义怎么陈述？", "back": "对任意 ε>0 存在 N，使 n>N 时 |aₙ−L|<ε", "tags": ["极限"]}, {"id": "ch06-f02", "chapterId": "ch06", "front": "函数在一点连续要满足什么？", "back": "极限存在且等于该点的函数值", "tags": ["极限"]}, {"id": "ch06-f03", "chapterId": "ch06", "front": "介值定理的前提是什么？", "back": "闭区间上的连续函数，端点值异号则有零点", "tags": ["极限"]}, {"id": "ch06-f04", "chapterId": "ch06", "front": "sin x/x→1 为什么要求弧度制？", "back": "只有弧度制下扇形面积才等于 x/2，面积比较才成立", "tags": ["极限"]}, {"id": "ch06-f05", "chapterId": "ch06", "front": "紧致集的两个条件是什么？", "back": "闭且有界", "tags": ["极限"]}, {"id": "ch07-f01", "chapterId": "ch07", "front": "驻点、极值点、拐点三者关系？", "back": "极值点必是驻点，驻点未必是极值点，x³ 在 0 处是拐点", "tags": ["极值"]}, {"id": "ch07-f02", "chapterId": "ch07", "front": "费马点满足什么角度条件？", "back": "三条连线两两成 120°，内角均小于 120° 时存在", "tags": ["极值"]}, {"id": "ch07-f03", "chapterId": "ch07", "front": "均值不等式怎么写？", "back": "(a+b)/2 ≥ √(ab)，等号当且仅当 a=b", "tags": ["极值"]}, {"id": "ch07-f04", "chapterId": "ch07", "front": "为什么极值问题要先证存在性？", "back": "不紧致的候选集合可能根本没有最优点，后面的计算会落空", "tags": ["极值"]}, {"id": "ch07-f05", "chapterId": "ch07", "front": "变分法给出的必要条件是什么？", "back": "一阶变分为零，即曲线满足欧拉-拉格朗日方程", "tags": ["极值"]}, {"id": "ch08-f01", "chapterId": "ch08", "front": "定积分的定义要注意哪一点？", "back": "矩形和的极限必须与分法和取点无关", "tags": ["微积分"]}, {"id": "ch08-f02", "chapterId": "ch08", "front": "导数的三种解释是什么？", "back": "切线斜率、瞬时速度、变化率，三者是同一个数", "tags": ["微积分"]}, {"id": "ch08-f03", "chapterId": "ch08", "front": "微积分基本定理两半分别说什么？", "back": "积分上限函数求导得被积函数；定积分等于原函数端点差", "tags": ["微积分"]}, {"id": "ch08-f04", "chapterId": "ch08", "front": "e 为什么在微分方程里到处都是？", "back": "eˣ 的导数等于自己，凡增长率与当前量成正比的过程解都是指数函数", "tags": ["微积分"]}, {"id": "ch08-f05", "chapterId": "ch08", "front": "dy/dx 是真分数吗？", "back": "不是，它是记号；链式法则像约分是定理保证的结果", "tags": ["微积分"]}]}, "pages": {"ch01": {"html": "<h1>第 1 章：自然数与数学归纳法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：会做整数四则运算\n<\/li><li>\n<strong>对应原书<\/strong>：第 1 章「自然数」§1—§2，第 1 章补充「数论」§1—§4（原书 p42—119）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出算术的五条基本规律，并解释为什么它们需要被当成公理而不是&quot;显然的事&quot;。\n<\/li><li>\n用数学归纳法完整写出一个求和公式的证明，指出基底步和递推步各在哪。\n<\/li><li>\n用辗转相除法求两个整数的最大公因数，并说明它为什么能给出算术基本定理。\n<\/li><li>\n判断一个归纳证明错在哪里，说出它失效的具体一步。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>自然数的全部算术都能从五条规律推出来；数学归纳法是把无穷多个待证情形压成&quot;第一步 + 每一步&quot;的证明机器。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：算术的基本规律（难度：基础）<\/h3>\n<p><strong>规律<\/strong>在这里不是&quot;通常如此&quot;，而是&quot;对任意两个整数都成立&quot;。把这句话写成符号，才有办法讨论：<\/p>\n<ul><li>\n交换律：<code>a + b = b + a<\/code>，<code>a · b = b · a<\/code>\n<\/li><li>\n结合律：<code>(a + b) + c = a + (b + c)<\/code>，<code>(a · b) · c = a · (b · c)<\/code>\n<\/li><li>\n分配律：<code>a · (b + c) = a · b + a · c<\/code>\n<\/ul>\n<p>柯朗在书里做了一个容易被跳过的动作：他拿化学举例。硫酸倒进水里得到稀硫酸，水倒进纯硫酸里会把容器炸掉。两种&quot;加法&quot;的结果完全不同，交换律在这里失效。这个例子的用处不是讲化学，而是说明<strong>这几条规律只对特定的运算对象成立<\/strong>，它们不靠&quot;看起来显然&quot;来保证。<\/p>\n<p><strong>类比<\/strong>：五条规律像游戏规则。象棋里&quot;马走日&quot;不是因为马想走日，而是规则这么定；一旦换了棋盘，规则就得重新立。这个类比的边界在于：整数不是人定的游戏，它有实际计数模型（书里用方框里的点来演示加法和乘法），规律之所以成立，是因为那个模型里确实成立。<\/p>\n<h3>概念：数学归纳法（难度：基础）<\/h3>\n<p>要证明&quot;对所有自然数 n，某命题 P(n) 成立&quot;，逐个验证 n=1,2,3… 永远验不完。归纳法把它换成两步：<\/p>\n<ol><li>\n<strong>基底步<\/strong>：验证 P(1) 成立。\n<\/li><li>\n<strong>递推步<\/strong>：假设 P(n) 成立，推出 P(n+1) 也成立。\n<\/ol>\n<p>两步做完，结论就对所有自然数成立。<\/p>\n<p><strong>类比<\/strong>：一排多米诺骨牌。推倒第一块，并保证&quot;任意一块倒下都会撞倒下一块&quot;，那么整排都会倒。这个类比的边界有两处：骨牌必须是连续排列的（对应&quot;每个 n 都能推到 n+1&quot;，中间不能断），而且骨牌必须是有限或可数无限的一排（归纳法管不了实数连续统，那是第 2 章要处理的问题）。<\/p>\n<p>写递推步时常见的写法是&quot;假设 P(n) 成立&quot;，这个假设叫<strong>归纳假设<\/strong>。它不是循环论证：你假设的是第 n 块已倒，要证的是第 n+1 块会倒，两件事不同。<\/p>\n<h3>概念：等差级数与等比级数（难度：基础）<\/h3>\n<p><strong>等差级数<\/strong>是相邻两项差为常数 d 的数列之和：<\/p>\n<p><code>a + (a+d) + (a+2d) + … + (a+(n−1)d) = n·a + d·n(n−1)/2<\/code><\/p>\n<p><strong>等比级数<\/strong>是相邻两项比为常数 q 的数列之和（q ≠ 1 时）：<\/p>\n<p><code>a + aq + aq² + … + aq^(n−1) = a(q^n − 1)/(q − 1)<\/code><\/p>\n<p>书里特意提醒：这两个公式不是&quot;背下来的&quot;，都能用归纳法证。等差那个还可以用高斯小时候的办法：把和倒着写一遍再相加，每一对都等于首项加末项。<\/p>\n<h3>概念：二项式定理与帕斯卡三角（难度：进阶）<\/h3>\n<p><code>(a+b)^n<\/code> 展开后每项的系数是组合数 <code>C(n,k)<\/code>，排列成三角形就是帕斯卡三角。它满足 <code>C(n,k) = C(n−1,k−1) + C(n−1,k)<\/code>，这条递推关系正是归纳法证明二项式定理的关键一步。<\/p>\n<p>书里用这个例子说明一件事：<strong>归纳法不只证等式，也能证&quot;结构如何生成&quot;<\/strong>。帕斯卡三角的每一行由上一行相加得到，这是构造性的，不只是计数。<\/p>\n<h3>概念：素数与算术基本定理（难度：基础）<\/h3>\n<p><strong>素数<\/strong>是大于 1 且只能被 1 和自身整除的整数。<strong>算术基本定理<\/strong>说：每个大于 1 的整数都能唯一地分解成素数的乘积（不计次序）。<\/p>\n<p>这里的&quot;唯一&quot;需要证明，而且证明用的是反证法加最小反例：假设有不满足的整数，取其中最小的 n，它会导出更小的反例，矛盾。<\/p>\n<p>书里还给了素数无穷多的欧几里得证明：假设只有有限个素数 p₁…pₖ，构造 N = p₁p₂…pₖ + 1，N 除以任何一个 pᵢ 都余 1，所以 N 要么自己是新素数，要么含新素因子。两种情况都和&quot;只有这些素数&quot;矛盾。<\/p>\n<h3>概念：同余与费马小定理（难度：进阶）<\/h3>\n<p><strong>同余<\/strong>是&quot;除以 m 余数相同&quot;的等价关系，记作 <code>a ≡ b (mod m)<\/code>。它把整数按余数分成 m 类，加减乘都能在这 m 类上做，这一结构后来在第 4 章的公理体系里叫<strong>剩余类环<\/strong>。<\/p>\n<p><strong>费马小定理<\/strong>：若 p 是素数且 a 不被 p 整除，则 <code>a^(p−1) ≡ 1 (mod p)<\/code>。<\/p>\n<p>它的一个实用后果是快速检验一个大数是否为素数（费马检验），但书里也提醒这类检验会漏（伪素数存在）。<\/p>\n<h3>概念：欧几里得算法与连分数（难度：进阶）<\/h3>\n<p><strong>辗转相除法<\/strong>求最大公因数：用较大数除以较小数取余，再把除数当被除数、余数当除数，直到余数为 0，最后一个非零余数就是最大公因数。<\/p>\n<p>它为什么有效，靠一条等式：<code>gcd(a,b) = gcd(b, a mod b)<\/code>。因为 a 和 b 的任何公因数都整除 a − qb，反之亦然。<\/p>\n<p>书里把这个算法一路推到<strong>连分数<\/strong>：把除法过程中的商依次排开，就得到 a/b 的连分数展开，它给出有理数的最佳逼近。这条线索在第 2 章讲无理数时会再出现一次。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[五条算术规律] --&gt; B[整数的计数模型]\n    A --&gt; C[代数式变形]\n    C --&gt; D[归纳法证明求和公式]\n    D --&gt; E[二项式定理]\n    A --&gt; F[整除与同余]\n    F --&gt; G[算术基本定理]\n    F --&gt; H[辗转相除法]\n    H --&gt; I[连分数与最佳逼近]\n    G --&gt; J[素数的分布问题]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左上是全章的起点，两条主线分别是&quot;代数恒等式&quot;和&quot;整除结构&quot;。前者通向求和公式与二项式定理，后者通向素数、最大公因数和连分数。第 2 章会从右下角那条线接着往下走。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：归纳法像对账。你核对了第一笔，又证明了&quot;任意一笔对得上就能让下一笔也对上&quot;，那么整本账都对得上。失效边界：账页必须是连续编号的，跳号的地方就断链了。<\/p>\n<p><strong>实例<\/strong>：证明 <code>1 + 3 + 5 + … + (2n−1) = n²<\/code>。<\/p>\n<p>基底步：n = 1 时左边 = 1，右边 = 1² = 1，成立。<\/p>\n<p>递推步：假设 <code>1 + 3 + … + (2n−1) = n²<\/code>。要证 n+1 的情形成立，即<\/p>\n<p><code>1 + 3 + … + (2n−1) + (2n+1) = (n+1)²<\/code><\/p>\n<p>左边用归纳假设替换前 n 项，得 <code>n² + (2n+1) = n² + 2n + 1 = (n+1)²<\/code>。等号右边正是要证的形式，递推步完成。<\/p>\n<p>两步合起来，对一切自然数 n 成立。<\/p>\n<p><strong>第二个实例<\/strong>：求 <code>gcd(1071, 1029)<\/code>。<\/p>\n<p>1071 − 1029 = 42，所以 1071 ≡ 42 (mod 1029)，<code>gcd(1071,1029) = gcd(1029,42)<\/code>。 1029 = 42 × 24 + 21，<code>gcd(1029,42) = gcd(42,21)<\/code>。 42 = 21 × 2 + 0，余数为 0，最大公因数是 21。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为归纳法验了几项就算证完了<\/strong>——验 n = 1,2,3 只说明前三块骨牌倒了。递推步必须写成&quot;假设 P(n) 推出 P(n+1)&quot;，缺这一步就没有覆盖到无穷。\n<\/li><li>\n<strong>别以为递推步可以从 P(n) 直接推到 P(n+1) 而不做假设<\/strong>——那等于把要证的东西用了一次。递推步的合法性来自归纳假设。\n<\/li><li>\n<strong>别以为&quot;显然&quot;是可以接受的证明<\/strong>——柯朗用化学反例说明，直觉上的显然只对熟悉的运算对象成立。数学里要的是从公理出发的推导。\n<\/li><li>\n<strong>别以为归纳法能证明实数命题<\/strong>——实数不可数，没有&quot;下一块骨牌&quot;，实数上的命题要走第 2 章的极限与完备性。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：数学归纳法证明中，&quot;假设 P(n) 成立&quot;这一步的作用是（　）。\n<ul>\n<li>\nA. 证明 P(n) 对所有 n 成立\n<\/li><li>\nB. 作为递推步的前提，用来推出 P(n+1)\n<\/li><li>\nC. 验证基底情形\n<\/li><li>\nD. 证明命题的唯一性\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：归纳假设是递推步的出发点，本身不构成结论。基底步单独由 A 之外的第一步完成。<\/p>\n<ol><li>\n<strong>填空<\/strong>：<code>gcd(1071, 1029)<\/code> 的值是（　）。\n<\/ol>\n<p><strong>答案：21<\/strong>。解析：1071 与 1029 之差为 42，1029 = 42×24+21，42 = 21×2，最后非零余数为 21。<\/p>\n<ol><li>\n<strong>简答<\/strong>：证明素数有无穷多个，并指出证明中&quot;构造 N = p₁p₂…pₖ + 1&quot;为什么能导出矛盾。\n<\/ol>\n<p><strong>答案要点<\/strong>：假设素数有限，列出全部 p₁…pₖ。令 N 为它们乘积加 1。N 除以任一 pᵢ 余 1，故没有任何 pᵢ 整除 N。N &gt; 1，按算术基本定理它必有素因子，这个素因子不在列表中，与&quot;已经列全&quot;矛盾。所以素数不能有限。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n五条算术规律不是&quot;显然&quot;，它们是对整数计数模型成立、对别的对象可能失效的规则。\n<\/li><li>\n归纳法 = 基底步 + 递推步；两条都写完才算证完，缺一条覆盖不到全体。\n<\/li><li>\n辗转相除法的合法性来自 <code>gcd(a,b) = gcd(b, a mod b)<\/code>，它同时是算术基本定理和连分数的入口。\n<\/ul>", "kind": "chapter", "title": "第 1 章：自然数与数学归纳法"}, "ch02": {"html": "<h1>第 2 章：数学中的数系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 1 章（归纳法、同余）\n<\/li><li>\n<strong>对应原书<\/strong>：第 2 章 §1—§6，第 2 章补充「集合代数」（原书 p120—210）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n从&quot;度量长度&quot;出发说明分数为什么必须成为独立的数，而不只是未完成的除法。\n<\/li><li>\n用反证法证明 √2 不是有理数，并说清这个证明依赖的整除前提。\n<\/li><li>\n说明为什么有理数在数轴上是&quot;稠密&quot;的却仍然到处都是洞，以及区间套怎么把这些洞补上。\n<\/li><li>\n区分可数与不可数，说清康托对角线证明的关键一步。\n<\/li><li>\n解释复数为什么不是&quot;凭空造出来的符号&quot;，以及代数基本定理说了什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>数系的每一步扩张都是被一次&quot;算不下去&quot;逼出来的：分数补上除法的缺口，无理数补上度量的缺口，复数补上方程求根的缺口。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：从度量到分数（难度：基础）<\/h3>\n<p>自然数用来数个数。度量一件连续的量（长度、重量、时间）时，事情变了：一截绳子的长度往往不是&quot;整 3 个单位&quot;，而是落在 3 和 4 之间。处理办法是把单位等分成 n 份，用 <code>m/n<\/code> 去表示。这一步把<strong>度量问题<\/strong>变成了<strong>计数问题<\/strong>，也把 <code>m/n<\/code> 从一个&quot;测量记录&quot;变成独立的数。<\/p>\n<p>关键转折在于：一旦 <code>m/n<\/code> 独立成数，它就得服从算术规律，而这些规律必须<strong>定义<\/strong>出来，不能从度量里直接看出来。书里给的定义是：<\/p>\n<p><code>a/b + c/d = (ad + bc)/(bd)<\/code>，<code>(a/b)(c/d) = ac/(bd)<\/code>，<code>a/b = c/d<\/code> 当且仅当 <code>ad = bc<\/code><\/p>\n<p>为什么要定成这样？因为只有这样定，第 1 章那五条规律才在分数范围内继续成立。柯朗的说法很直接：这些规则是按我们的意志加上去的，除了相容和好用，没有先验的必要性。<\/p>\n<p><strong>类比<\/strong>：给新员工定报销规则。规则不是从天上掉下来的，是你定的；但定完以后必须和已有的财务制度对得上，否则整套账就乱了。类比失效的边界：数学规则还要满足&quot;扩张后旧结论不变&quot;，这一条比公司制度更硬。<\/p>\n<h3>概念：不可公度与无理数（难度：进阶）<\/h3>\n<p>正方形的对角线与边长之比 <code>√2<\/code> 不能写成两个整数之比。证明用反证法：设 <code>√2 = p/q<\/code> 且 p、q 已约到最简（互素），则 <code>p² = 2q²<\/code>，所以 p 是偶数，设 p = 2r，代回得 <code>4r² = 2q²<\/code>，即 <code>q² = 2r²<\/code>，q 也是偶数。p 和 q 都是偶数，与&quot;已约到最简&quot;矛盾。<\/p>\n<p>这个证明的关键前提是<strong>每个有理数都能写成最简分数<\/strong>，也就是第 1 章的算术基本定理。逻辑链条不能断在这里：如果约分不唯一，反证法就失效了。<\/p>\n<p><strong>不可公度<\/strong>（不能用同一个单位同时量尽）这件事在当时是危机：毕达哥拉斯学派相信万物皆可用整数比表达，这个发现直接推翻了它。<\/p>\n<h3>概念：极限与区间套（难度：进阶）<\/h3>\n<p>有理数稠密：任意两个有理数之间还有有理数。但稠密不等于没有洞，<code>√2<\/code> 的位置上就没有有理数。<\/p>\n<p>补洞的办法是<strong>区间套<\/strong>：取一串嵌套的区间 <code>[a₁,b₁] ⊃ [a₂,b₂] ⊃ …<\/code>，长度趋于 0。如果这些区间的端点都是有理数而长度可以任意小，它们就&quot;锁定&quot;了一个点。这个点可能是有理数，也可能不是；把所有这样的锁定位置都算进来，就得到<strong>实数连续统<\/strong>。<\/p>\n<p>书里还给了另一条等价路径：<strong>戴德金分割<\/strong>。把一个有理数集分成左右两半，左半没有最大元、右半没有最小元，这个&quot;切口&quot;本身就定义了一个实数。两条路径的共同点是把&quot;数&quot;从&quot;可以用分数表示&quot;改成&quot;可以用有理数逼近&quot;。<\/p>\n<p><strong>类比<\/strong>：用越来越窄的取景框对准一颗星，框可以小到任意程度，星的位置就由这串框定下来。失效边界：框必须真的一层套一层并且宽度趋于 0，光换位置而不收缩是锁不住的。<\/p>\n<h3>概念：可数与不可数（难度：高难）<\/h3>\n<p><strong>可数<\/strong>指能和自然数一一对应。有理数是可数的：把分数按分子分母之和排序，<code>1/1, 1/2, 2/1, 1/3, 2/2, 3/1, …<\/code>，每个有理数都会在某一层出现。<\/p>\n<p>实数不可数，康托的对角线证明：假设 0 到 1 之间的实数能排成一列，把每个写成无限小数，构造一个新数，它的第 n 位与第 n 个数的第 n 位不同。这个新数在每一位上都和第 n 个数不同，所以不在列表中，与&quot;已经排全&quot;矛盾。<\/p>\n<p><strong>基数<\/strong>是集合大小的度量。可数集合的基数是 ℵ₀，连续统的基数更大。<\/p>\n<h3>概念：复数与代数基本定理（难度：进阶）<\/h3>\n<p>方程 <code>x² + 1 = 0<\/code> 在实数里无解。引入 <code>i² = −1<\/code> 后，<code>a + bi<\/code> 构成复数。复数有几何解释：平面上的点，加法是向量平移，乘法是&quot;模相乘、角相加&quot;。由此得到<strong>棣莫弗公式<\/strong> <code>(cos θ + i sin θ)^n = cos nθ + i sin nθ<\/code>。<\/p>\n<p><strong>代数基本定理<\/strong>：每个次数 ≥ 1 的复系数多项式至少有一个复根。它的意义是数系扩张到此为止：再往上的方程不会逼出新的数。<\/p>\n<h3>概念：代数数与超越数（难度：高难）<\/h3>\n<p><strong>代数数<\/strong>是某个整系数多项式的根；不是代数数的实数叫<strong>超越数<\/strong>。刘维尔构造出第一个超越数（用连分数的逼近速度做文章），后来康托用基数论证说明超越数不仅存在，而且比代数数&quot;多得多&quot;。<\/p>\n<h3>概念：集合代数（难度：基础）<\/h3>\n<p>补充部分把集合的并与交写成一套运算律：交换、结合、分配，还有德摩根律 <code>(A∪B)&#x27; = A&#x27;∩B&#x27;<\/code>。它和算术共用同一套骨架，这一点在第 6 章讲函数时会被用上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    N[自然数] --&gt; Z[整数]\n    Z --&gt; Q[有理数]\n    Q --&gt;|度量缺口| R1[无理数]\n    R1 --&gt; R[实数连续统]\n    R --&gt; C[复数]\n    Q --&gt;|区间套/戴德金分割| R\n    R --&gt;|代数基本定理| C\n    Q --&gt; AL[代数数]\n    R --&gt; TR[超越数]\n    AL --&gt; TR<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条从有理数出发的路在实数处汇合。向上的箭头标出的是&quot;为什么必须扩张&quot;，不是时间顺序。代数数与超越数是实数内部的另一条分界线，和&quot;有理/无理&quot;这条线交叉。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数系扩张像修路。先有土路（自然数），发现过不了河就架桥（分数），发现桥墩地基不够深就往下打桩（无理数），最后发现整片区域都需要连通（连续统）。失效边界：修路是补缺口，数学扩张还必须保证旧路上的规则在新路上照样成立。<\/p>\n<p><strong>实例<\/strong>：把 <code>0.333…<\/code> 写成最简分数。<\/p>\n<p>设 <code>x = 0.333…<\/code>，则 <code>10x = 3.333…<\/code>，两式相减得 <code>9x = 3<\/code>，所以 <code>x = 1/3<\/code>。这个推导的合法性来自第 1 章的等比级数求和：<code>0.333… = 3/10 + 3/100 + …<\/code> 是首项 <code>3/10<\/code>、公比 <code>1/10<\/code> 的无穷等比级数，和为 <code>(3/10)/(1 − 1/10) = 1/3<\/code>。<\/p>\n<p><strong>第二个实例<\/strong>：用棣莫弗公式求 <code>(1+i)^8<\/code>。写成极坐标：<code>1+i = √2 (cos45° + i sin45°)<\/code>，于是 <code>(1+i)^8 = (√2)^8 (cos360° + i sin360°) = 16<\/code>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为有理数稠密就等于没有洞<\/strong>——稠密说的是任意两个有理数之间还有有理数，它并不保证每个位置都有有理数。<code>√2<\/code> 就在那里但不是有理数。\n<\/li><li>\n<strong>别以为&quot;无限小数&quot;都是无理数<\/strong>——循环小数全是有理数，<code>0.333… = 1/3<\/code>；只有不循环的无限小数才对应无理数。\n<\/li><li>\n<strong>别以为复数是为了好玩造出来的符号<\/strong>——它是为了让每个多项式方程都有根，代价是放弃&quot;数必须能比大小&quot;这条直觉。\n<\/li><li>\n<strong>别以为可数就是&quot;无穷多&quot;<\/strong>——自然数和有理数都无穷多且可数，实数也无穷多但不可数。可数衡量的是能不能编号，不是数量多少。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：√2 不是有理数的证明中，&quot;设 √2 = p/q 且 p、q 互素&quot;这一步的作用是（　）。\n<ul>\n<li>\nA. 保证 q 不为 0\n<\/li><li>\nB. 保证 p、q 都是偶数\n<\/li><li>\nC. 为&quot;p、q 同为偶数&quot;与&quot;互素&quot;的矛盾埋下条件\n<\/li><li>\nD. 说明 √2 是小数\n<\/ul>\n<\/ol>\n<p><strong>答案：C<\/strong>。解析：推导得到 p、q 都是偶数后，必须用&quot;互素&quot;来制造矛盾。若不做最简假设，同为偶数并不构成矛盾。<\/p>\n<ol><li>\n<strong>填空<\/strong>：<code>0.272727…<\/code> 化成最简分数是（　）。\n<\/ol>\n<p><strong>答案：3/11<\/strong>。解析：设 x = 0.272727…，100x = 27.2727…，相减得 99x = 27，x = 27/99 = 3/11。<\/p>\n<ol><li>\n<strong>简答<\/strong>：说明为什么&quot;有理数在数轴上稠密&quot;和&quot;实数不可数&quot;这两件事可以同时成立。\n<\/ol>\n<p><strong>答案要点<\/strong>：稠密是拓扑性质，指任意小区间内都有有理数；不可数是基数性质，指有理数无法与实数一一对应。有理数在数轴上到处都有，但&quot;到处有&quot;只保证每个区间非空，不保证覆盖全部点。康托对角线证明给出的是：把实数排成一列必然漏掉某个数，因此实数的基数大于可数基数，尽管有理数在其中稠密。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n分数成为独立的数，靠的是把加法乘法和相等定义出来，并让五条规律继续成立。\n<\/li><li>\n实数 = 有理数 + 用区间套或戴德金分割锁定的那些位置；&quot;稠密&quot;补不了这个洞。\n<\/li><li>\n复数的合法性来自几何解释和代数基本定理，不是来自&quot;定义一个符号&quot;。\n<\/ul>", "kind": "chapter", "title": "第 2 章：数学中的数系"}, "ch03": {"html": "<h1>第 3 章：几何作图与数域的代数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2 章（代数数、复数）\n<\/li><li>\n<strong>对应原书<\/strong>：第 3 章「几何作图 数域的代数」第 1 部分与第 2 部分（原书 p211—276）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明尺规作图允许的每一步对应哪种代数运算，并写出可作图点所在的数域。\n<\/li><li>\n证明倍立方体、三等分任意角、作正七边形在尺规下不可实现，指出每个证明卡在哪条代数条件上。\n<\/li><li>\n说清&quot;化圆为方&quot;为什么比前三个更难，它需要的是超越性而不是代数次数。\n<\/li><li>\n解释反演变换怎么把直线和圆互相变，以及马歇罗尼定理说了什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>尺规能做的事，代数上就是&quot;从已知数出发反复加减乘除和开平方&quot;；三个古希腊难题做不出来，是因为它们要求的数不落在这个范围里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：可作图与数域（难度：进阶）<\/h3>\n<p>尺规作图只有两类动作：过两点作直线，以一点为圆心过另一点作圆。两直线的交点、直线与圆的交点、两圆的交点，是唯一能产生新点的位置。把这些交点坐标算出来，会发现它们只用到四则运算和<strong>开平方<\/strong>。<\/p>\n<p>由此得到一个关键结论：从长度为 1 的线段出发，所有可作图线段的长度都落在某个<strong>数域<\/strong>里，而这个数域是从有理数出发、每次添一个平方根扩张出来的。这类扩张叫<strong>二次扩张<\/strong>，扩出来的次数是 2 的幂。<\/p>\n<p>这里的<strong>数域<\/strong>指一个对加减乘除封闭的数集。有理数本身是一个域，实数、复数也是。<\/p>\n<p><strong>类比<\/strong>：可作图点像用固定工具箱搭出来的位置。工具箱里只有直尺和圆规，能搭出的高度是有限的层级；每加一层平方根，就多一层台阶。做不到的东西不是手艺不够，是台阶不够高。失效边界：如果允许三等分角尺或其他工具，台阶就变了，结论随之改变（书里第 2 部分正是讲这个）。<\/p>\n<h3>概念：正多边形的可作图性（难度：进阶）<\/h3>\n<p>正 n 边形可作，等价于 <code>cos(2π/n)<\/code> 可作。高斯给出了完整判据：n 必须是 2 的幂乘以若干个<strong>互不相同的费马素数<\/strong>（形如 <code>2^(2^k) + 1<\/code> 的素数）。<\/p>\n<p>前几个费马素数是 3、5、17、257、65537。所以正 3、4、5、6、8、10、12、15、16、17 边形可作，正 7、9、11、13 边形不可作。正十七边形可作是高斯 19 岁的成果，也是他决定投身数学的理由。<\/p>\n<h3>概念：三个不可解问题（难度：高难）<\/h3>\n<p><strong>倍立方体<\/strong>：要求作出 <code>³√2<\/code>。这个数是三次方程 <code>x³ − 2 = 0<\/code> 的根。若 <code>x³ − 2<\/code> 在有理数上不可约，则 <code>³√2<\/code> 的代数次数是 3，不是 2 的幂，所以不可作。不可约性用有理根检验：候选有理根只有 ±1、±2，代入均不为 0，因此没有一次因式，三次多项式不可约。<\/p>\n<p><strong>三等分任意角<\/strong>：以 60° 为例，三等分要作出 20°，等价于解 <code>4cos³20° − 3cos20° = cos60° = 1/2<\/code>。令 <code>x = 2cos20°<\/code>，方程变成 <code>x³ − 3x − 1 = 0<\/code>。这个三次方程没有有理根（候选 ±1 代入得 −3 和 1），所以不可约，<code>2cos20°<\/code> 的代数次数是 3，不可作。<\/p>\n<p><strong>正七边形<\/strong>：<code>cos(2π/7)<\/code> 满足一个三次不可约方程（由分圆多项式 <code>x⁶ + x⁵ + … + 1<\/code> 约化而来），次数是 3，不可作。<\/p>\n<p><strong>化圆为方<\/strong>：要求作出 <code>√π<\/code>。这里的问题不在次数，而在<strong>π 是超越数<\/strong>（林德曼 1882 年证明）。超越数不是任何整系数多项式的根，连&quot;代数次数&quot;都谈不上，所以尺规更够不着。前三个难题的证明只用到代数次数，这个要用到超越性，难度不在一个层级。<\/p>\n<p><strong>类比<\/strong>：前三个难题像要打开一把锁，钥匙的齿数不对；化圆为方是连锁孔的形状都不在钥匙库里。失效边界：这个类比只说明难度差别，不说明证明方法差别。<\/p>\n<h3>概念：反演变换（难度：进阶）<\/h3>\n<p><strong>反演<\/strong>关于一个圆（圆心 O、半径 r）把点 P 映到射线 OP 上的 P′，满足 <code>OP · OP′ = r²<\/code>。它有两个好用性质：<\/p>\n<ul><li>\n过 O 的直线不变，不过 O 的直线变成过 O 的圆；不过 O 的圆变成不过 O 的圆。\n<\/li><li>\n角度保持不变（保角），只是方向反转。\n<\/ul>\n<p><strong>阿波罗尼斯问题<\/strong>（作一个圆与给定三个圆相切）用反演可以大幅简化：把其中一个圆反演成直线，问题就退化成&quot;作圆与两条直线和一个圆相切&quot;。书里用这个例子说明变换的价值：不是把问题算得更快，而是把问题变成另一个已知能解的问题。<\/p>\n<h3>概念：只规作图与机械工具（难度：进阶）<\/h3>\n<p><strong>马歇罗尼定理<\/strong>：凡是尺规能作的图，只用圆规也能作。这条定理推翻了一个直觉：直尺不是必需品。证明思路是用圆规模拟&quot;作直线与圆相交&quot;，代价是步骤变多。<\/p>\n<p>书里还讲了<strong>连杆机构<\/strong>：用铰接的杆件画出直线（波西里叶-利普金连杆）或实现反演（哈特反演器）。这类装置的意义在于，它把&quot;作图&quot;从纸面搬到了机械，后来影响了蒸汽机与机床的设计。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[有理数域 Q] --&gt;|添一个平方根| B[二次扩张]\n    B --&gt;|再添平方根| C[可作图数域]\n    C --&gt; D[可作图点]\n    E[三次不可约方程] --&gt;|代数次数 3| F[不可作图]\n    G[超越数 π] --&gt;|不是代数数| F\n    D --&gt; H[正多边形判据]\n    H --&gt; I[费马素数 3 5 17 257 65537]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左侧是&quot;能作&quot;的链条，每加一层平方根扩一次域；右侧是&quot;不能作&quot;的两类理由，一类是次数不是 2 的幂，一类是根本不在代数数里。中间那条判据把两边连起来。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：可作图数域像一个只能用加法、乘法、除法和&quot;开平方&quot;按钮的计算器。按多少次都行，但按不出立方根。倍立方体要的正是立方根，所以按钮不够用。失效边界：这个类比没有说清&quot;为什么开平方对应尺规&quot;，那需要看圆与直线交点的坐标公式。<\/p>\n<p><strong>实例<\/strong>：验证 <code>x³ − 3x − 1 = 0<\/code> 没有有理根。<\/p>\n<p>有理根定理说，整系数多项式的有理根 <code>p/q<\/code>（最简）必满足 p 整除常数项、q 整除首项系数。这里首项系数是 1，常数项是 −1，所以候选只有 ±1。代入：<code>1 − 3 − 1 = −3 ≠ 0<\/code>，<code>−1 + 3 − 1 = 1 ≠ 0<\/code>。两个候选都不成立，方程无有理根。三次多项式若无一次因式则不可约，因此 <code>2cos20°<\/code> 的代数次数为 3，三等分 60° 不可作。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;作不出来&quot;是因为没人足够聪明<\/strong>——不可能性有证明，证明的对象是工具允许的运算范围，不是人的能力。\n<\/li><li>\n<strong>别以为尺规作图的限制只是&quot;工具简陋&quot;<\/strong>——真正的限制是代数结构：只允许二次扩张。换成允许标记刻度的直尺，倍立方体就能作。\n<\/li><li>\n<strong>别以为化圆为方和另外三个是同一类难题<\/strong>——前三个靠代数次数排除，化圆为方靠 π 的超越性，后者需要 1882 年的林德曼定理。\n<\/li><li>\n<strong>别以为圆规比直尺弱<\/strong>——马歇罗尼定理说明只用圆规就够，直尺可以省掉。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：尺规作图能构造的数，其代数次数必须是（　）。\n<ul>\n<li>\nA. 任意整数\n<\/li><li>\nB. 2 的幂\n<\/li><li>\nC. 素数\n<\/li><li>\nD. 3 的倍数\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：每一步作图只引入平方根，域扩张次数每次乘 2，总次数是 2 的幂。<\/p>\n<ol><li>\n<strong>填空<\/strong>：正 n 边形可作的必要条件是 n 形如 <code>2^k · p₁p₂…pₛ<\/code>，其中各 <code>pᵢ<\/code> 是互不相同的（　）素数。\n<\/ol>\n<p><strong>答案：费马<\/strong>。解析：高斯的判据要求这些奇素因子必须是形如 <code>2^(2^m)+1<\/code> 的费马素数。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么&quot;化圆为方&quot;不能用&quot;代数次数不是 2 的幂&quot;来排除？\n<\/ol>\n<p><strong>答案要点<\/strong>：那条判据只适用于代数数。π 是超越数，不是任何整系数多项式的根，因此没有代数次数可言。要排除它必须证明 π 的超越性（林德曼定理），这属于另一类论证。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n尺规的代数本质是二次扩张，可作图数的次数是 2 的幂，这条判据一次性排掉三个古希腊难题。\n<\/li><li>\n正多边形判据：2 的幂乘互不相同的费马素数。\n<\/li><li>\n反演把直线和圆互换并保角，阿波罗尼斯问题因此可以降级成切直线的问题。\n<\/ul>", "kind": "chapter", "title": "第 3 章：几何作图与数域的代数"}, "ch04": {"html": "<h1>第 4 章：射影几何、公理体系与非欧几何<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 3 章（数域与不可能性）\n<\/li><li>\n<strong>对应原书<\/strong>：第 4 章 §1—§5（原书 p277—365）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;在什么变换下不变&quot;给几何分类，说出欧氏几何、仿射几何、射影几何分别守住什么。\n<\/li><li>\n说明交比为什么是射影不变量，而长度、角度、平行都不是。\n<\/li><li>\n写出射影平面上的对偶原理，并把一个定理的对偶定理写出来。\n<\/li><li>\n解释公理体系的相容性与独立性各是什么，为什么非欧几何的模型能证明它相容。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>几何学的种类由&quot;允许做什么变换&quot;决定；换个变换集合，守住的量就变，几何就换了一门。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：按变换分类的几何（难度：基础）<\/h3>\n<p>克莱因在 1872 年的厄兰格纲领里给了一个统一说法：一门几何由它的<strong>变换群<\/strong>决定，几何命题就是在这个变换群下保持不变的性质。<\/p>\n<ul><li>\n<strong>欧氏几何<\/strong>：允许刚体运动（平移、旋转、反射）。守住长度、角度、面积。\n<\/li><li>\n<strong>仿射几何<\/strong>：允许更一般的仿射变换（含拉伸、剪切）。长度和角度丢了，平行性和&quot;中点&quot;还在。\n<\/li><li>\n<strong>射影几何<\/strong>：允许射影变换（含把平行线变成相交、把有限点送到无穷远）。平行也不保了，守住的更少。\n<\/li><li>\n<strong>拓扑<\/strong>：允许任意连续变形。连直线都不保，只剩连通性、洞的个数这类性质。\n<\/ul>\n<p>书里用一个很直观的实验说明这件事：把一个画着圆和两条垂直直径的软木块夹到老虎钳里压扁一半，圆变椭圆，直角不成直角，圆上各点到中心等距也不成立。但&quot;中心平分每条直径&quot;这条依然成立。压扁这个变换守住了什么、丢了什么，一目了然。<\/p>\n<p><strong>类比<\/strong>：同样是描述一个人，&quot;身高体重&quot;在换装后不变，&quot;衣服颜色&quot;一换就变，&quot;是不是同一个人&quot;怎么换都不变。选哪组描述，等于选哪门几何。失效边界：几何的变换是数学上精确的映射群，不是随便换装。<\/p>\n<h3>概念：射影变换与交比（难度：进阶）<\/h3>\n<p><strong>射影变换<\/strong>来自透视：把一张平面上的图形投到另一张平面上，直线还是直线，但长度、角度、平行都被破坏。<\/p>\n<p>在这种变换下活下来的量是<strong>交比<\/strong>。四个共线点 A、B、C、D 的交比定义为<\/p>\n<p><code>(A,B;C,D) = (AC/BC) ÷ (AD/BD)<\/code><\/p>\n<p>注意它用的是同一条直线上的长度之比，比值上面的长度扭曲会在上下相抵，所以交比在射影变换下不变。<\/p>\n<p><strong>无穷远点<\/strong>的作用是让射影几何的定理不用分情况。平行线在射影平面里交于无穷远点，&quot;任意两条直线必相交&quot;于是没有例外。<\/p>\n<h3>概念：对偶原理（难度：进阶）<\/h3>\n<p>在射影平面里，&quot;点&quot;和&quot;直线&quot;的角色可以互换：把&quot;两点确定一条直线&quot;和&quot;两直线交于一点&quot;对照着看，命题结构完全一样。这就是<strong>对偶原理<\/strong>：一个射影命题成立，把点和线互换、把关联关系反向，得到的对偶命题也成立。<\/p>\n<p>书里用帕斯卡定理和布里安雄定理做了演示：圆内接六边形的三组对边交点共线（帕斯卡），圆外切六边形的三组对顶点连线共点（布里安雄）。两条定理互为对偶，证明只需要做一次。<\/p>\n<h3>概念：公理体系（难度：进阶）<\/h3>\n<p>希尔伯特把欧氏几何整理成若干组公理：关联公理、顺序公理、合同公理、平行公理、连续公理。整理完要回答两个问题：<\/p>\n<ul><li>\n<strong>相容性<\/strong>：这些公理会不会推出矛盾？办法是造一个模型，把公理翻译成某个已知体系里成立的命题。欧氏几何可以用解析几何的实数模型来担保。\n<\/li><li>\n<strong>独立性<\/strong>：某条公理能不能从其他公理推出来？如果不能，它就是独立的。平行公理的独立性靠造一个让其他公理成立、平行公理不成立的模型，也就是非欧几何。\n<\/ul>\n<p><strong>类比<\/strong>：公理体系像一套法律条文。相容性是&quot;这套法律不会自相矛盾&quot;，独立性是&quot;这条法不能从别的法推出来，必须单独立&quot;。失效边界：法律可以有意含糊，数学公理不允许，每条都得能判定真假。<\/p>\n<h3>概念：非欧几何（难度：高难）<\/h3>\n<p>把平行公理换成罗巴切夫斯基公理：过直线外一点，至少有两条直线与已知直线不相交。得到的体系就是<strong>双曲几何<\/strong>。<\/p>\n<p>在双曲几何里，三角形内角和小于 180°，相似三角形一定全等（因为没有可以随意缩放的角度结构），过不在同一直线上的三点不一定有外接圆。<\/p>\n<p>它相容吗？有模型就相容。<strong>庞加莱圆盘<\/strong>是一个模型：把圆盘内部当平面，其中的&quot;直线&quot;是与边界正交的圆弧。在这个模型里，过一点可以作多条与给定&quot;直线&quot;不相交的&quot;直线&quot;，而欧氏几何的其他公理照样成立。模型的存在把双曲几何的相容性归结到欧氏几何的相容性上。<\/p>\n<p>黎曼后来给出另一条路：把平行公理换成&quot;没有平行线&quot;，得到<strong>椭圆几何<\/strong>（球面几何是它的一个局部版本）。三种几何的差别只在对平行公理的选择，其余公理共用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    T[变换群] --&gt; E[欧氏 刚体运动]\n    T --&gt; A[仿射 平移拉伸剪切]\n    T --&gt; P[射影 透视]\n    T --&gt; TP[拓扑 连续变形]\n    E --&gt; E1[守住 长度 角度 面积]\n    A --&gt; A1[守住 平行 中点]\n    P --&gt; P1[守住 交比]\n    TP --&gt; T1[守住 连通性 洞数]\n    P --&gt; D[对偶原理 点线互换]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：越往下变换越宽松，守住的量越少。这条阶梯是本章的主轴，第 5 章的拓扑学就在最下面一级。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：射影几何像从不同角度看同一张照片。正面看是矩形，斜着看是梯形，边长和角度都变了，但&quot;四条边、两组对边交于两点&quot;这个结构没变。交比就是那个不随视角改变的比值。失效边界：透视是中心投影，射影变换比它更一般，还包括把无穷远拉进有限区域的情形。<\/p>\n<p><strong>实例<\/strong>：验证交比在简单射影变换下的不变性。取直线上四点 A=0、B=1、C=3、D=6。交比 <code>(A,B;C,D) = (AC/BC)/(AD/BD) = (3/2)/(6/5) = 15/12 = 1.25<\/code>。作变换 <code>x ↦ 2x + 1<\/code>（一种仿射变换，也是射影变换的特例），四点变为 1、3、7、13。<code>AC&#x27; = 6<\/code>，<code>BC&#x27; = 4<\/code>，<code>AD&#x27; = 12<\/code>，<code>BD&#x27; = 10<\/code>，交比 <code>(6/4)/(12/10) = 1.5/1.2 = 1.25<\/code>。数值一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为非欧几何是&quot;错误的几何&quot;<\/strong>——它和欧氏几何一样相容，只是选了不同的平行公理。哪一个描述真实空间，要靠物理测量回答，不靠直觉。\n<\/li><li>\n<strong>别以为公理是&quot;显然为真&quot;的命题<\/strong>——现代理解里公理是体系内的出发点，选它不选它看你想建什么体系。希尔伯特的说法是：点、线、面可以换成桌子、椅子、酒杯，只要满足公理，定理照样成立。\n<\/li><li>\n<strong>别以为射影几何只是&quot;画法几何&quot;<\/strong>——它是一种结构，交比和对偶原理在代数几何、计算机视觉里都在用。\n<\/li><li>\n<strong>别以为无穷远点是个凑数的东西<\/strong>——它让射影平面成为封闭的、没有例外情况的平面，定理因此可以统一表述。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：在射影变换下保持不变的量是（　）。\n<ul>\n<li>\nA. 线段长度\n<\/li><li>\nB. 两条直线的夹角\n<\/li><li>\nC. 交比\n<\/li><li>\nD. 图形面积\n<\/ul>\n<\/ol>\n<p><strong>答案：C<\/strong>。解析：长度、角度、面积都会被射影变换破坏，交比由同一直线上的长度比构成，比值中的尺度因子相消。<\/p>\n<ol><li>\n<strong>填空<\/strong>：非欧几何的相容性可以通过构造（　）来保证，例如庞加莱圆盘模型。\n<\/ol>\n<p><strong>答案：模型<\/strong>。解析：模型把非欧公理翻译成欧氏体系内成立的命题，于是非欧的矛盾会变成欧氏的矛盾。<\/p>\n<ol><li>\n<strong>简答<\/strong>：写出&quot;两点确定一条直线&quot;在射影平面里的对偶命题，并说明为什么它成立。\n<\/ol>\n<p><strong>答案要点<\/strong>：对偶命题是&quot;两条直线确定一个交点&quot;。在射影平面里任意两条直线都相交，平行线交于无穷远点，所以这个对偶命题成立，不需要额外条件。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n厄兰格纲领一句话：几何 = 变换群 + 不变量。选群等于选几何。\n<\/li><li>\n射影几何守住交比，丢掉长度、角度、平行；对偶原理让定理成对出现。\n<\/li><li>\n非欧几何靠模型获得相容性，平行公理的三选一（唯一、多条、没有）分出三类几何。\n<\/ul>", "kind": "chapter", "title": "第 4 章：射影几何、公理体系与非欧几何"}, "ch05": {"html": "<h1>第 5 章：拓扑学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 4 章（变换与不变量）\n<\/li><li>\n<strong>对应原书<\/strong>：第 5 章 §1—§4 与附录（原书 p366—414）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用欧拉公式 <code>V − E + F = 2<\/code> 检验一个多面体是否与球面同胚，并解释这个数为什么不依赖棱柱怎么切。\n<\/li><li>\n判断两个图形是否拓扑等价，说出你用了哪条变形规则。\n<\/li><li>\n说明若尔当曲线定理在说什么，以及它在球面上为什么失效。\n<\/li><li>\n用亏格和欧拉示性数给闭曲面分类。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>拓扑学研究的是&quot;随便怎么揉都不变&quot;的性质，它把几何从量长度换成数洞。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：拓扑性质（难度：基础）<\/h3>\n<p><strong>拓扑性质<\/strong>是在任意连续变形（不撕裂、不粘合）下保持不变的性质。它不是&quot;大致不变&quot;，而是严格的：变形必须是双向连续且可逆的映射，叫<strong>同胚<\/strong>。<\/p>\n<p>在橡皮膜上画一个圆和两条互相垂直的直径，膜怎么拉怎么扭，&quot;两条线交于一点并且把圆分成四块&quot;这条始终成立，而&quot;它们是直角&quot;早就不成立了。这条就是拓扑性质。<\/p>\n<p><strong>类比<\/strong>：把图形当成面团。可以揉、压、拉，不能撕开也不能把两块粘上。拓扑学研究的是面团揉成什么形状之后还剩什么。失效边界：拓扑允许的变形不能把洞填上，也不能把新洞戳出来，这一点让洞的个数成为核心指标。<\/p>\n<h3>概念：欧拉公式（难度：基础）<\/h3>\n<p>对<strong>简单多面体<\/strong>（表面能连续变形为球面、没有洞的多面体），有<\/p>\n<p><code>V − E + F = 2<\/code><\/p>\n<p>其中 V 是顶点数，E 是棱数，F 是面数。正方体：8 − 12 + 6 = 2。三棱锥：4 − 6 + 4 = 2。<\/p>\n<p>这个公式的价值在于它是拓扑的：把一个正方体削去一个角，V、E、F 都变了，但组合 <code>V − E + F<\/code> 还是 2，因为削角只是连续变形，洞的个数没变。<\/p>\n<p>反过来，环面（甜甜圈）上 <code>V − E + F = 0<\/code>，因为它有一个洞。这个差值正是洞的计数器。<\/p>\n<h3>概念：连通性与若尔当曲线定理（难度：进阶）<\/h3>\n<p><strong>连通<\/strong>指不能分成两个不相交的非空开集之并。直观说法是一条能走通的路。<\/p>\n<p><strong>若尔当曲线定理<\/strong>：平面上一条简单闭曲线（不自交的封闭曲线）把平面分成内部和外部两块。听起来像废话，证明却不容易，因为它涉及&quot;内部&quot;这个概念的严格化。<\/p>\n<p>书里还提到它的一个后果：多边形版本的证明更初等，可以靠射线与边的交点个数是奇数还是偶数来判定内点外点。这个判定法在计算机图形学里就是&quot;奇偶规则&quot;。<\/p>\n<p>在球面上，若尔当曲线定理仍然成立；在环面上就不成立了，环面上一条绕洞的闭曲线可能切不开曲面，也可能切开后两侧都带洞。<\/p>\n<h3>概念：不动点定理（难度：高难）<\/h3>\n<p>把一张纸揉成一团塞进原来那张纸的范围内，总有至少一个点回到了它原来的位置，这是布劳威尔不动点定理的直观版本。严格表述：闭圆盘到自身的连续映射必有不动点。<\/p>\n<p>它在经济学（一般均衡存在性）、微分方程（解的存在性）里被反复使用，因为它把&quot;存在某个解&quot;这类问题转化成&quot;某个连续映射有不动点&quot;。<\/p>\n<h3>概念：曲面的分类与亏格（难度：进阶）<\/h3>\n<p><strong>亏格<\/strong>是曲面上的洞的个数，直观理解为&quot;最多能剪几刀而不把曲面剪成两块&quot;。<\/p>\n<p>闭曲面（紧致、无边界）的分类：<\/p>\n<ul><li>\n可定向的：亏格 g 的曲面，欧拉示性数 <code>χ = 2 − 2g<\/code>。球面 g=0，环面 g=1，双环面 g=2。\n<\/li><li>\n不可定向的：克莱因瓶、射影平面。莫比乌斯带是最有名的单侧曲面，它只有一个面、一条边，沿中线剪开会得到一个更长的带子而不是两个。\n<\/ul>\n<p><strong>单侧曲面<\/strong>指沿法向量走一圈会回到出发点的反面。书里用莫比乌斯带演示这件事，做法很具体：拿一条纸带，扭转半圈后把两端粘上。<\/p>\n<p><strong>类比<\/strong>：亏格是&quot;洞的预算&quot;。球面没有预算，剪一刀就成两块；环面有一份预算，绕一圈剪开还是一整块。失效边界：这个说法对可定向闭曲面成立，克莱因瓶这类不可定向曲面要另算，书里用 <code>χ<\/code> 统一处理。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[橡皮膜上的图形] --&gt;|连续变形 不撕不粘| B[同胚类]\n    B --&gt; C[欧拉示性数 χ]\n    C --&gt; D[球面 χ=2 亏格0]\n    C --&gt; E[环面 χ=0 亏格1]\n    C --&gt; F[克莱因瓶 χ=0 不可定向]\n    B --&gt; G[连通性]\n    B --&gt; H[若尔当曲线 分内外]\n    B --&gt; I[不动点定理]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从&quot;允许什么样变形&quot;出发，落到一个数 <code>χ<\/code>。这个数把曲面分成几族，同族的曲面互相同胚。右边三支是拓扑学最常用的三条结论，各自对应一类问题。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：拓扑学像盘点一家店的资产，只数保险柜有几个，不关心保险柜多大、什么颜色。变形可以改大小颜色，改不了柜子个数。失效边界：拓扑还管&quot;能不能从 A 走到 B&quot;，连通性和洞的分布不是单纯计数能覆盖的。<\/p>\n<p><strong>实例<\/strong>：数一个足球的 <code>V − E + F<\/code>。传统足球用 12 个五边形和 20 个六边形拼成，共 32 个面。每个五边形的边与六边形共享，每条棱被两个面共用，所以 <code>E = (12×5 + 20×6)/2 = (60 + 120)/2 = 90<\/code>。顶点处总是一个五边形和两个六边形相接，每个顶点被 3 个面共用，<code>V = (12×5 + 20×6)/3 = 180/3 = 60<\/code>。代入：60 − 90 + 32 = 2，与球面一致。<\/p>\n<p><strong>第二个实例<\/strong>：判断&quot;环面减去一个开圆盘&quot;的欧拉示性数。原环面 χ=0，挖掉一个开圆盘相当于剪开一个洞并留下边界，χ 减 1，得 −1。这个曲面带一条边界，不能直接用闭曲面公式。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为拓扑等价就是&quot;看起来像&quot;<\/strong>——必须是双向连续的映射，一个圆和一个方框同胚，一个圆和一个&quot;8&quot;字不同胚。\n<\/li><li>\n<strong>别以为欧拉公式对所有多面体都成立<\/strong>——它只对简单多面体成立。带洞的多面体（比如框形）算出来不是 2，差值正好反映洞数。\n<\/li><li>\n<strong>别以为莫比乌斯带只是个折纸游戏<\/strong>——它是最简单的不可定向曲面，说明&quot;双侧&quot;这件事不是曲面的必然属性。\n<\/li><li>\n<strong>别以为若尔当曲线定理是显然的<\/strong>——&quot;简单闭曲线把平面分成两块&quot;这句话里，&quot;内部&quot;要先定义清楚，严格证明需要拓扑工具。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：一个多面体算出 <code>V − E + F = 0<\/code>，它最可能是（　）。\n<ul>\n<li>\nA. 球面\n<\/li><li>\nB. 环面\n<\/li><li>\nC. 平面\n<\/li><li>\nD. 圆柱侧面\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：<code>χ = 2 − 2g<\/code>，χ=0 对应 g=1，即有一个洞的闭曲面，典型代表是环面。<\/p>\n<ol><li>\n<strong>填空<\/strong>：莫比乌斯带只有（　）个面和一条边。\n<\/ol>\n<p><strong>答案：1<\/strong>。解析：它不可定向，沿法向量走一圈会到反面，所以只有一个面。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么欧拉公式是拓扑性质而不是度量性质？\n<\/ol>\n<p><strong>答案要点<\/strong>：V、E、F 都是计数，不涉及长度、角度、面积。连续变形可以改变棱长和角度，但顶点数、棱数、面数在&quot;不撕裂不粘合&quot;的变形下保持对应关系，因此 <code>V − E + F<\/code> 不变。它只依赖曲面的洞数，而洞数是拓扑不变量。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n拓扑 = 允许任意连续变形的几何，核心指标是连通性、洞数和定向性。\n<\/li><li>\n欧拉示性数 <code>χ = V − E + F<\/code> 是洞的计数器：球面 2，环面 0，每多一个洞减 2。\n<\/li><li>\n闭曲面按&quot;可定向/不可定向&quot;和亏格分类，莫比乌斯带是单侧曲面的最小模型。\n<\/ul>", "kind": "chapter", "title": "第 5 章：拓扑学"}, "ch06": {"html": "<h1>第 6 章：函数与极限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2 章（实数连续统）\n<\/li><li>\n<strong>对应原书<\/strong>：第 6 章 §1—§6，第 6 章补充（原书 p415—502）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 ε-δ 语言写出&quot;函数在一点连续&quot;的定义，并说清它和&quot;图像一笔画&quot;的差别。\n<\/li><li>\n判断一个数列是否收敛，算出 <code>q^n<\/code>、<code>(1+1/n)^n<\/code> 这类常见极限。\n<\/li><li>\n说出布尔查诺定理与维尔斯特拉斯极值定理各断言了什么，为什么它们都依赖实数完备性。\n<\/li><li>\n解释 <code>sin x / x → 1 (x→0)<\/code> 为什么成立，以及它和弧度制的关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>极限把&quot;越来越接近&quot;变成一句可以判断真假的话：不管你把误差压到多小，后面总有一项比它更小。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：函数（难度：基础）<\/h3>\n<p><strong>函数<\/strong>是从定义域到值域的对应规则：每个输入对应唯一输出。柯朗强调，函数不等于&quot;有一个解析式子&quot;。素数的个数 <code>π(n)<\/code> 没有简单公式，它照样是函数；三角形面积是三边长的函数；气缸里气体的体积是压强和温度的函数。<\/p>\n<p>这个观点在历史上打了一仗：18 世纪很多人认为函数必须能用幂级数写出，19 世纪才发现那太窄。<\/p>\n<p><strong>反函数<\/strong>把输入输出对调，条件是原函数必须一一对应。<strong>复合函数<\/strong>是串联，<code>f(g(x))<\/code> 先算 g 再算 f。<\/p>\n<h3>概念：数列的极限（难度：基础）<\/h3>\n<p>数列 <code>aₙ<\/code> 收敛到 L，意思是：对任意给定的 ε &gt; 0，都存在一个 N，使得当 n &gt; N 时，<code>|aₙ − L| &lt; ε<\/code>。<\/p>\n<p>这句话的结构值得拆开看。ε 是别人给的误差要求，N 是你的回应。别人要得多小都行，你都得找到一个起点，从那以后所有项都进到误差范围里。<strong>N 可以依赖 ε<\/strong>，这个依赖是定义的核心。<\/p>\n<p><strong>类比<\/strong>：验收货物。客户说&quot;误差不能超过 0.01 毫米&quot;，你指出&quot;从第 500 件起都达标&quot;。客户改成 0.001，你重新算，可能说&quot;从第 2000 件起&quot;。只要每次都能给出一个起点，就算收敛。失效边界：如果无论怎么往后找，总有项跳出范围，那就是发散；&quot;看起来越来越近&quot;不算证明。<\/p>\n<p>常见的两个极限：<\/p>\n<ul><li>\n<code>q^n → 0<\/code>（|q| &lt; 1）。因为 <code>|q|^n<\/code> 单调减且有下界 0，由单调有界定理收敛，极限只能是 0。\n<\/li><li>\n<code>(1 + 1/n)^n → e<\/code>。这个数列单调增、有上界，极限定义为 e ≈ 2.71828。\n<\/ul>\n<p>书里同时用这个极限引出 <code>e<\/code>，又用内接正多边形周长引出 <code>π<\/code>，两个常数都不是&quot;规定&quot;的，而是某个极限过程的结果。<\/p>\n<h3>概念：函数的极限与连续（难度：进阶）<\/h3>\n<p><code>lim(x→a) f(x) = L<\/code> 的 ε-δ 定义：对任意 ε &gt; 0，存在 δ &gt; 0，使得当 <code>0 &lt; |x − a| &lt; δ<\/code> 时，<code>|f(x) − L| &lt; ε<\/code>。<\/p>\n<p><strong>连续<\/strong>在这个语言里就是 <code>lim(x→a) f(x) = f(a)<\/code>，即极限存在且等于函数值。<\/p>\n<p><strong>类比<\/strong>：连续像一条没有台阶的路，你走一小步，高度也只变一小点。图像上&quot;一笔画&quot;只是直观说法，严格的判据是上面的极限等式。失效边界：有些函数处处连续却处处不可微（比如维尔斯特拉斯函数），&quot;能一笔画&quot;并不蕴含&quot;光滑&quot;。<\/p>\n<h3>概念：布尔查诺定理与极值定理（难度：高难）<\/h3>\n<p><strong>布尔查诺定理<\/strong>（介值定理）：闭区间上的连续函数从负值走到正值，中间必经过 0。<\/p>\n<p><strong>维尔斯特拉斯极值定理<\/strong>：闭区间上的连续函数必取得最大值和最小值。<\/p>\n<p>这两条定理看起来都&quot;显然&quot;，但它们的证明依赖实数完备性，也就是第 2 章的区间套。在有界闭区间上，连续函数的值域是闭区间，这件事在有理数范围内就不成立。<\/p>\n<p><strong>紧致集<\/strong>是这两个定理的舞台：闭且有界的集合。在这样的集合上，任何开覆盖都有有限子覆盖，这是把&quot;局部性质&quot;推到&quot;整体性质&quot;的桥。<\/p>\n<h3>概念：sin x / x 的极限（难度：进阶）<\/h3>\n<p><code>lim(x→0) sin x / x = 1<\/code>。<\/p>\n<p>证明靠面积比较：在单位圆里，取圆心角 x（弧度），比较三个面积：三角形、扇形、大三角形。得到 <code>sin x &lt; x &lt; tan x<\/code>，同除以 <code>sin x<\/code> 得 <code>1 &lt; x/sin x &lt; 1/cos x<\/code>，取倒数并夹逼，<code>cos x &lt; sin x / x &lt; 1<\/code>。当 x→0 时 <code>cos x → 1<\/code>，由夹逼得极限为 1。<\/p>\n<p>这里用到的前提是<strong>弧度制<\/strong>：只有用弧度，扇形面积才等于 <code>x/2<\/code>。如果用角度，这个极限会变成 π/180。这是弧度制在微积分里不可替代的原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[实数完备性 区间套] --&gt; B[单调有界定理]\n    B --&gt; C[数列极限存在]\n    A --&gt; D[布尔查诺介值定理]\n    A --&gt; E[维尔斯特拉斯极值定理]\n    C --&gt; F[欧拉数 e]\n    D --&gt; G[连续函数取遍中间值]\n    E --&gt; H[闭区间上有最大最小值]\n    G --&gt; I[方程有解的判据]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：所有箭头最终指回左上角那条完备性。没有它，下面每一条都会失效。这是本章和上一章的分界：第 2 章把洞补上，第 6 章才能在补好的数轴上谈极限。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：ε-δ 像两个人讨价还价。对方出价 ε（要多精确），你还价 δ（走多近），只要每次都能还上价，交易就算成立。失效边界：讨价还价可以僵持，数学里必须对所有 ε 都能给出 δ，差一个都不行。<\/p>\n<p><strong>实例<\/strong>：证明 <code>q^n → 0<\/code>（0 &lt; q &lt; 1）。设 <code>q = 1/(1+h)<\/code>，h &gt; 0，则 <code>q^n = 1/(1+h)^n<\/code>。由二项式定理 <code>(1+h)^n ≥ 1 + nh<\/code>，所以 <code>0 &lt; q^n ≤ 1/(1+nh)<\/code>。给定 ε，解 <code>1/(1+nh) &lt; ε<\/code> 得 <code>n &gt; (1/ε − 1)/h<\/code>。取 N 为这个数的整数部分加一，则 n &gt; N 时 <code>|q^n| &lt; ε<\/code>。收敛性得证，且给出了 N 的具体算法。<\/p>\n<p><strong>第二个实例<\/strong>：求 <code>lim(n→∞) (1 + 1/n)^n<\/code> 的大致值。n=1 得 2；n=2 得 2.25；n=10 得 2.5937；n=100 得 2.7048；n=1000 得 2.7169。逐渐逼近 e ≈ 2.71828，且始终从下方逼近，符合&quot;单调递增有上界&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为极限就是&quot;代入数值&quot;<\/strong>——<code>sin x / x<\/code> 在 x=0 处没有定义，但极限存在。极限关心的是趋近过程，不是那一点的值。\n<\/li><li>\n<strong>别以为连续就一定可导<\/strong>——连续只保证没有跳跃，不保证没有尖角或无限震荡。<code>|x|<\/code> 在 0 处连续但不可导。\n<\/li><li>\n<strong>别以为单调有界定理对有理数也成立<\/strong>——它依赖实数完备性，在有理数里一个单调递增有上界的序列可能收敛到无理数，从而&quot;没有极限&quot;。\n<\/li><li>\n<strong>别以为 ε-δ 只是形式主义<\/strong>——它是判断&quot;能不能任意逼近&quot;的唯一严格标准，工程师用的误差分析就是它的实际版本。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：<code>lim(x→0) sin x / x = 1<\/code> 的证明中，关键的不等式是（　）。\n<ul>\n<li>\nA. <code>sin x &gt; x<\/code>\n<\/li><li>\nB. <code>cos x &lt; sin x / x &lt; 1<\/code>\n<\/li><li>\nC. <code>tan x &lt; x<\/code>\n<\/li><li>\nD. <code>sin x &lt; cos x<\/code>\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：由面积比较得 <code>sin x &lt; x &lt; tan x<\/code>，取倒数并整理得 <code>cos x &lt; sin x/x &lt; 1<\/code>，再用夹逼定理。<\/p>\n<ol><li>\n<strong>填空<\/strong>：<code>lim(n→∞) (1 + 1/n)^n<\/code> 的值是（　）。\n<\/ol>\n<p><strong>答案：e<\/strong>。解析：这是 e 的定义式，数列单调递增且有上界 3，极限存在，记作 e ≈ 2.71828。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么维尔斯特拉斯极值定理要求区间&quot;闭且有界&quot;？举一个去掉条件后失效的例子。\n<\/ol>\n<p><strong>答案要点<\/strong>：闭保证极限点不被排除，有界保证不会跑到无穷。反例：<code>f(x) = x<\/code> 在开区间 (0,1) 上连续，但没有最大值也没有最小值；<code>f(x) = 1/x<\/code> 在 (0,1] 上连续但无上界，取不到最大值。两个条件各去掉一个，定理都不成立。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n极限的定义是&quot;对任意 ε 存在 N 或 δ&quot;，N 和 δ 可以依赖 ε，这个依赖是全部内容。\n<\/li><li>\n连续 = 极限等于函数值；可导比连续强，两者不等价。\n<\/li><li>\n布尔查诺定理和极值定理都站在实数完备性上，把它们抽掉，结论就不成立。\n<\/ul>", "kind": "chapter", "title": "第 6 章：函数与极限"}, "ch07": {"html": "<h1>第 7 章：极大与极小<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 6 章（极限、连续）\n<\/li><li>\n<strong>对应原书<\/strong>：第 7 章 §1—§10（原书 p503—591）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;等角反射&quot;解出最短路径问题，并写出赫伦定理的证明。\n<\/li><li>\n区分驻点、极大点、极小点和鞍点，说明为什么&quot;导数为零&quot;不是充分条件。\n<\/li><li>\n用均值不等式证明固定周长下正方形面积最大。\n<\/li><li>\n说明等周问题为什么需要存在性证明，而不只是解方程。\n<\/li><li>\n说出变分法在做什么，它和普通极值问题的区别在哪。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>极值问题有两层：先证明最优解存在，再找出它。只做第二层，很容易对着一个不存在的解算半天。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：反射与最短路径（难度：基础）<\/h3>\n<p>给定直线 L 和同侧两点 P、Q，求 L 上一点 R 使 <code>PR + RQ<\/code> 最小。做法是把 P 关于 L 作对称点 P′，连接 P′Q 与 L 的交点就是 R。<\/p>\n<p>证明：对 L 上任意点 R′，<code>PR′ = P′R′<\/code>（对称），所以 <code>PR′ + R′Q = P′R′ + R′Q ≥ P′Q<\/code>（三角不等式），等号只在 R′=R 时成立。而 <code>P′Q = PR + RQ<\/code>，所以 R 是最小点。<\/p>\n<p>这个结论还有一个物理解释：光线反射时入射角等于反射角，正是因为光走的是最短路径。赫伦在公元一世纪就注意到这件事，它算是费马原理的雏形。<\/p>\n<p><strong>类比<\/strong>：把 L 当镜子，看自己的像在哪，然后直接朝像走过去。这条路在地面上看是折线，在&quot;镜子后面&quot;看是直线。失效边界：这招只在 L 是直线时好用，曲线镜面要另算。<\/p>\n<h3>概念：驻点与极值（难度：进阶）<\/h3>\n<p><strong>驻点<\/strong>是导数等于零的点。在可微函数上，极值点必然是驻点，但驻点未必是极值点，<code>f(x) = x³<\/code> 在 0 处导数为零，那里既不是极大也不是极小，是<strong>拐点<\/strong>。<\/p>\n<p>判断要靠二阶导数或导数变号：<code>f&#x27;&#x27;&gt;0<\/code> 是极小，<code>f&#x27;&#x27;&lt;0<\/code> 是极大，<code>f&#x27;&#x27;=0<\/code> 要往高阶看。<\/p>\n<p>多元函数更麻烦，除了极大极小，还有<strong>鞍点<\/strong>：沿一个方向上升、沿另一个方向下降。判定用海森矩阵的正定性。<\/p>\n<p>书里还提到一个拓扑视角：极小极大点。在球面这样的紧致曲面上，任何连续函数至少有两点是&quot;沿某条闭曲线上的极值&quot;，这是山路引理的雏形，后来成了变分法的核心工具。<\/p>\n<h3>概念：施瓦茨三角形问题（难度：进阶）<\/h3>\n<p>在锐角三角形里作内接三角形，使周长最小。答案是<strong>垂足三角形<\/strong>：三条高的垂足连成的三角形。<\/p>\n<p>这个结论有一串等价说法：光线在三角形内反射一圈回到原点，路径正是垂足三角形；把三角形反复镜像展开，最短路径变成一条直线。书里给了两种证法，一种用镜像展开，一种用初等几何。<\/p>\n<h3>概念：施泰纳问题（难度：进阶）<\/h3>\n<p>给定三角形，求一点 P 使 <code>PA + PB + PC<\/code> 最小。答案是<strong>费马点<\/strong>：当三个内角都小于 120° 时，费马点满足三边张角都是 120°；若有一角 ≥ 120°，最小点就是那个钝角顶点。<\/p>\n<p>这个问题的解法也是旋转 60° 造等边三角形，把三段折线拉直。<\/p>\n<p>书里把它推广成<strong>道路网问题<\/strong>：给若干城市修最短的连通路网，允许在中间加分叉点。答案是最小生成树与施泰纳树的组合，分叉点处的三条边两两成 120°。这个结论今天用在芯片布线和水管网络设计上。<\/p>\n<h3>概念：均值不等式与极值（难度：基础）<\/h3>\n<p>两个正数的算术平均不小于几何平均：<\/p>\n<p><code>(a + b)/2 ≥ √(ab)<\/code>，等号当且仅当 a = b。<\/p>\n<p>用法：固定 <code>a + b = S<\/code>，则 <code>ab ≤ (S/2)²<\/code>，等号在 a=b 时取到。这就是&quot;周长固定时正方形面积最大&quot;的证明。<\/p>\n<p>推广到 n 个正数：<code>(a₁+…+aₙ)/n ≥ (a₁…aₙ)^(1/n)<\/code>。这个不等式是极值问题里最省力的工具，很多时候不用求导就能出结果。<\/p>\n<h3>概念：最小二乘法（难度：进阶）<\/h3>\n<p>给一组数据点，要找一条直线使&quot;偏差平方和&quot;最小。<strong>最小二乘<\/strong>的名字来自这里：不是让偏差之和最小（正负会抵消），而是让平方和最小。<\/p>\n<p>解法是对截距和斜率分别求偏导并令其为零，得到一个二元一次方程组。这套方法后来成了统计回归的基础。<\/p>\n<h3>概念：等周问题与变分法（难度：高难）<\/h3>\n<p><strong>等周问题<\/strong>：在所有周长相同的平面闭曲线中，圆围成的面积最大。<\/p>\n<p>它的难点不在列方程，而在<strong>存在性<\/strong>：在所有候选曲线里，凭什么断定最优的那条一定存在？书里 §7 专门讲这件事，用一个&quot;取一列越来越好的曲线，取极限&quot;的论证，需要事先限制曲线族的紧致性。没有这一步，后面的推导都是空的。<\/p>\n<p><strong>变分法<\/strong>处理的是&quot;函数的函数&quot;的极值，也就是在曲线族里找一条最优曲线。它的基本方程是欧拉-拉格朗日方程，由&quot;一阶变分为零&quot;导出。等周问题、最速降线问题、测地线问题都是它的例子。<\/p>\n<p><strong>类比<\/strong>：普通极值是山坡上找最低点，变分法是&quot;在所有可能的路线里找最短的那条&quot;。失效边界：变分法给的是必要条件（一阶变分为零），存在性和是否真的是极小还要另证，这一点和普通极值一样。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[极值问题] --&gt; B[几何直观法 反射 展开]\n    A --&gt; C[微分法 驻点]\n    A --&gt; D[不等式法 均值不等式]\n    A --&gt; E[变分法 欧拉-拉格朗日方程]\n    B --&gt; F[最短路径 垂足三角形]\n    C --&gt; G[需判二阶条件]\n    D --&gt; H[等周 固定周长最大面积]\n    E --&gt; I[先证存在性]\n    I --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条解题路线，右边那条最硬，因为它多了&quot;存在性&quot;这一关。其余三条各自有适用场景，反射法管直线与角，微分法管可微函数，不等式法管对称结构。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：找最低点像在山里找谷底。可以顺着坡度走（求导），也可以先看地图确认这座山真的有个谷底（存在性）。只顺着走，可能走到一个平台就停了，也可能走出边界。失效边界：数学里的&quot;平台&quot;是驻点，&quot;走出边界&quot;是开区间，两者的处理办法不同。<\/p>\n<p><strong>实例<\/strong>：用均值不等式证明&quot;周长 4L 的矩形中正方形面积最大&quot;。设长宽为 x、y，<code>x + y = 2L<\/code>。面积 <code>xy ≤ ((x+y)/2)² = L²<\/code>，等号当 x=y=L 时成立，此时是正方形。最大面积 L²，对应周长 4L。<\/p>\n<p><strong>第二个实例<\/strong>：求 <code>PA + PB + PC<\/code> 最小的费马点位置。以 AB 为边向外作等边三角形 ABD，连接 CD。对任意 P，把 △APB 绕 A 旋转 60°，P 落到 P′，则 <code>PA = PP′<\/code>，<code>PB = P′D<\/code>（因为旋转把 B 送到 D）。于是 <code>PA + PB + PC = PP′ + P′D + PC ≥ CD<\/code>，等号当 P、P′、D、C 共线时成立，此时 P 在 CD 上且三边张角 120°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为导数为零就是极值<\/strong>——<code>x³<\/code> 在 0 处导数为零但不是极值。必须看导数是否变号或二阶导数的符号。\n<\/li><li>\n<strong>别以为极值一定在驻点<\/strong>——在闭区间上，端点也可能取到最大值，端点不是驻点。\n<\/li><li>\n<strong>别以为等周问题&quot;显然&quot;是圆<\/strong>——直觉给出答案，但证明要过存在性这一关，还要证明圆确实满足条件。历史上这个问题拖了很久才被严格解决。\n<\/li><li>\n<strong>别以为最小二乘是&quot;让误差最小&quot;<\/strong>——它最小化的是平方和，对异常点敏感，这也是它后来被稳健回归补充的原因。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：直线 L 同侧两点 P、Q，L 上使 <code>PR + RQ<\/code> 最小的点 R 满足（　）。\n<ul>\n<li>\nA. PR 与 RQ 垂直\n<\/li><li>\nB. PR、RQ 与 L 成等角\n<\/li><li>\nC. R 是 PQ 的中点投影\n<\/li><li>\nD. R 到 P、Q 距离相等\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：由对称点构造，R 是 P′Q 与 L 的交点，此时入射角等于反射角，两条线段与 L 成等角。<\/p>\n<ol><li>\n<strong>填空<\/strong>：固定周长的一切平面闭曲线中，围成面积最大的是（　）。\n<\/ol>\n<p><strong>答案：圆<\/strong>。解析：这是等周问题的结论，等号情形为圆，证明需要先确立存在性再用变分或几何论证。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么&quot;导数为零&quot;只是极值的必要条件而不是充分条件？\n<\/ol>\n<p><strong>答案要点<\/strong>：极值点处若可微，切线水平，所以导数为零，这给出必要性。反过来，导数为零只说明切线水平，函数在该点可能继续上升（如 x³），因此不充分。判断需要看导数在两侧是否变号，或二阶导数的符号。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n反射法把折线拉直，是解决&quot;直线上的最短路径&quot;的标准手法。\n<\/li><li>\n极值问题分两步：存在性、定位。跳过第一步，后面的计算可能对着一个不存在的东西做。\n<\/li><li>\n均值不等式是最省力的极值工具，对称结构下优先试它，再考虑求导。\n<\/ul>", "kind": "chapter", "title": "第 7 章：极大与极小"}, "ch08": {"html": "<h1>第 8 章：微积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 6 章（极限）、第 7 章（极值）\n<\/li><li>\n<strong>对应原书<\/strong>：第 8 章 §1—§7，第 8 章补充（原书 p592—733）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用矩形逼近写出定积分的定义，并把 <code>∫₀¹ x² dx<\/code> 真的算出来。\n<\/li><li>\n从极限定义算出 <code>x²<\/code> 的导数，说清导数的三种解释（斜率、速度、变化率）为什么一致。\n<\/li><li>\n写出微积分基本定理的两半，并解释它为什么把&quot;求面积&quot;和&quot;求斜率&quot;这两个问题连成一件。\n<\/li><li>\n用微分方程描述指数增长，并解出 <code>y = Ce^(kt)<\/code>。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>微分和积分是同一个运算的两个方向：一个把整体切成小段看变化率，一个把无数小段拼回整体，基本定理说这两件事互为逆运算。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：定积分（难度：进阶）<\/h3>\n<p>求曲线下的面积，办法是把它切成竖条。把区间 <code>[a,b]<\/code> 分成 n 段，每段宽度 <code>Δx<\/code>，在第 i 段上任取一点 <code>ξᵢ<\/code>，用高 <code>f(ξᵢ)<\/code> 的矩形代替那一小条，求和：<\/p>\n<p><code>Sₙ = Σ f(ξᵢ) Δx<\/code><\/p>\n<p>当 n 增大、<code>Δx → 0<\/code>，如果这个和趋于一个与分法和取点都无关的数，就把它定义为<strong>定积分<\/strong> <code>∫ₐᵇ f(x) dx<\/code>。<\/p>\n<p>&quot;与分法和取点无关&quot;这句话是定义的关键。少了它，不同切法会得到不同结果，面积就没意义了。<\/p>\n<p><strong>类比<\/strong>：用方格纸量地图上的湖面。格子越小，估计越准；但只要湖岸足够规整，格子细到一定程度后结果就稳定下来。失效边界：函数不连续或震荡太厉害时，细格子也稳不下来，那就不叫可积。<\/p>\n<h3>概念：导数的三种身份（难度：进阶）<\/h3>\n<p><strong>导数<\/strong>是差商的极限：<\/p>\n<p><code>f&#x27;(x) = lim(h→0) [f(x+h) − f(x)] / h<\/code><\/p>\n<p>它有三种解释，指向同一个数：<\/p>\n<ul><li>\n<strong>几何<\/strong>：曲线在这一点切线的斜率。\n<\/li><li>\n<strong>物理<\/strong>：位置对时间的导数就是速度，再求一次是加速度。\n<\/li><li>\n<strong>变化率<\/strong>：任何量对另一个量的瞬时变化。\n<\/ul>\n<p>用定义算 <code>x²<\/code> 的导数：<code>[(x+h)² − x²]/h = (2xh + h²)/h = 2x + h<\/code>，令 h→0 得 <code>2x<\/code>。全过程只用了代数展开和极限，没有神秘操作。<\/p>\n<p><strong>莱布尼茨记号<\/strong> <code>dy/dx<\/code> 把导数写成一个比值，看起来像分数。这个记号在链式法则里特别好用，因为 <code>dy/dx = (dy/du)(du/dx)<\/code> 真的像分数相乘。但它是记号，不是真的除法，<code>dy<\/code> 和 <code>dx<\/code> 单独没有定义。<\/p>\n<h3>概念：微积分基本定理（难度：高难）<\/h3>\n<p>定理分两半：<\/p>\n<p><strong>第一半<\/strong>：若 <code>F(x) = ∫ₐˣ f(t) dt<\/code>，则 <code>F&#x27;(x) = f(x)<\/code>。求积函数对上限求导，得到被积函数。<\/p>\n<p><strong>第二半<\/strong>（牛顿-莱布尼茨公式）：<code>∫ₐᵇ f(x) dx = F(b) − F(a)<\/code>，其中 F 是 f 的任一原函数。<\/p>\n<p>为什么成立？第一半说的是&quot;累积量的变化率等于流入速度&quot;。把水槽灌水，水位是累积，水龙头流量是导数。第二半说：要算总累积，只要找任意一个&quot;流量的原函数&quot;，用末状态减初状态。<\/p>\n<p>这个定理的威力在于它把一个求和极限问题变成了&quot;找原函数&quot;，而找原函数有一套机械法则（幂函数、三角函数、指数函数的公式表加换元、分部积分）。这是微积分能成为通用工具的原因。<\/p>\n<p><strong>类比<\/strong>：开车旅行。速度表读数是导数，里程表读数是积分。里程表的增量等于速度对时间的积分，而&quot;末读数减初读数&quot;就能算总里程，不用把每一秒的速度都加起来。失效边界：这个类比对&quot;变速但不停车&quot;的情形有效，遇到倒车（速度为负）也成立，因为积分带符号。<\/p>\n<h3>概念：指数函数与 e（难度：进阶）<\/h3>\n<p><code>e<\/code> 定义为 <code>lim(1+1/n)^n<\/code>，它出现在&quot;增长率与当前量成正比&quot;的一切过程中。以 e 为底的指数函数 <code>eˣ<\/code> 有一个别处没有的性质：它的导数等于自己。<\/p>\n<p>由这个性质解微分方程 <code>y&#x27; = ky<\/code>，得到 <code>y = C e^(kt)<\/code>。放射性衰变（k&lt;0）、复利（k&gt;0）、简谐振动（写成复数形式）都是这个方程。<\/p>\n<p>书里还给出 <code>ln x<\/code> 的级数展开，用它可以手算对数。这个级数收敛得慢，实际计算要用加速技巧，但思路是从这里来的。<\/p>\n<h3>概念：微分方程入门（难度：进阶）<\/h3>\n<p><strong>微分方程<\/strong>是含导数的方程。<code>y&#x27; = ky<\/code> 是最简单的一类，解是上面那个指数函数。<\/p>\n<p>牛顿动力学定律 <code>F = ma<\/code> 写成 <code>F = m d²x/dt²<\/code>，它是一个二阶微分方程，给定初始位置和初始速度就能定解。这是&quot;用方程描述世界&quot;的模板：定律给出局部关系，解给出全局轨迹。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[函数 f] --&gt;|差商极限| B[导数 f&#x27;]\n    A --&gt;|矩形和极限| C[定积分 ∫f]\n    B --&gt;|基本定理第一半| D[F x = ∫ f 可导且 F&#x27;=f]\n    C --&gt;|基本定理第二半| E[牛顿-莱布尼茨公式]\n    D --&gt; E\n    E --&gt; F[找原函数即可算面积]\n    B --&gt; G[微分方程 y&#x27;=ky]\n    G --&gt; H[指数解 Ce kt]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间那条虚线是本章的枢纽。左边两条路分别从&quot;切&quot;和&quot;拼&quot;出发，在基本定理处会合，右边是它的直接应用。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：微积分像把一段录像拆成帧再拼回去。导数是一帧一帧看变化，积分是把所有帧连成完整运动。基本定理说，只要知道每一帧的变化量，就能还原全片，不必逐帧累加。失效边界：录像是离散的，数学取的是连续极限，中间的&quot;无穷小&quot;要靠极限定义才站得住。<\/p>\n<p><strong>实例<\/strong>：用定义算 <code>∫₀¹ x² dx<\/code>。<\/p>\n<p>把 <code>[0,1]<\/code> 分成 n 等份，取右端点，<code>Sₙ = Σ(i/n)² (1/n) = (1/n³) Σ i²<\/code>。<\/p>\n<p>用第 1 章的平方和公式 <code>Σ i² = n(n+1)(2n+1)/6<\/code>，得<\/p>\n<p><code>Sₙ = (1/n³) · n(n+1)(2n+1)/6 = (2n³ + 3n² + n)/(6n³)<\/code><\/p>\n<p>令 n→∞，分子分母同除以 n³：<code>(2 + 3/n + 1/n²)/6 → 2/6 = 1/3<\/code>。<\/p>\n<p>所以 <code>∫₀¹ x² dx = 1/3<\/code>。用基本定理验证：<code>x³/3<\/code> 是原函数，代入上下限得 <code>1/3 − 0 = 1/3<\/code>，两条路结果一致。<\/p>\n<p><strong>第二个实例<\/strong>：解 <code>y&#x27; = 2y<\/code>，<code>y(0) = 5<\/code>。通解 <code>y = Ce^(2t)<\/code>，代入初值 <code>C = 5<\/code>，得 <code>y = 5e^(2t)<\/code>。检验：<code>y&#x27; = 10e^(2t) = 2 · 5e^(2t) = 2y<\/code>，成立。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为积分就是&quot;面积&quot;<\/strong>——定积分是带符号的。曲线在 x 轴下方时积分是负的，面积要取绝对值。物理上&quot;位移&quot;和&quot;路程&quot;的差别就来自这里。\n<\/li><li>\n<strong>别以为导数就是&quot;切线斜率&quot;<\/strong>——斜率只是几何解释。同一个数在物理里是速度，在经济学里是边际成本，换场景不换运算。\n<\/li><li>\n<strong>别以为 <code>dy/dx<\/code> 可以当分数随便约<\/strong>——它是记号。链式法则看起来像约分，是因为定理保证了这个形式成立，不是因为 <code>dy<\/code> 真的是个数。\n<\/li><li>\n<strong>别以为基本定理对所有函数都成立<\/strong>——它要求 f 连续（或至少可积且原函数存在）。有反例说明条件不能省。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：微积分基本定理第一半说的是（　）。\n<ul>\n<li>\nA. 连续函数必可积\n<\/li><li>\nB. 积分上限函数的导数等于被积函数\n<\/li><li>\nC. 导数等于切线斜率\n<\/li><li>\nD. 原函数一定存在\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：<code>d/dx ∫ₐˣ f(t)dt = f(x)<\/code>，这是把积分和微分接起来的那一步。<\/p>\n<ol><li>\n<strong>填空<\/strong>：<code>∫₀¹ x² dx<\/code> 的值是（　）。\n<\/ol>\n<p><strong>答案：1/3<\/strong>。解析：原函数 <code>x³/3<\/code>，代入上下限得 1/3。也可用矩形和极限验证。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么说微分方程 <code>y&#x27; = ky<\/code> 的解一定是指数形式？给出推导。\n<\/ol>\n<p><strong>答案要点<\/strong>：把方程写成 <code>y&#x27;/y = k<\/code>，左边是 <code>ln|y|<\/code> 的导数，所以 <code>(ln|y|)&#x27; = k<\/code>，积分得 <code>ln|y| = kt + C<\/code>，取指数得 <code>y = ±e^C e^(kt)<\/code>，合并常数记作 <code>y = Ce^(kt)<\/code>。这个方法要求 y 不为零，y 恒为零也是一个解。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n定积分是矩形和的极限，且要求结果与分法无关；这一点决定了哪些函数可积。\n<\/li><li>\n导数是差商的极限，三种解释共用同一个数，换场景不换运算。\n<\/li><li>\n基本定理把&quot;求面积&quot;降级成&quot;找原函数&quot;，它是微积分成为通用工具的枢纽。\n<\/ul>", "kind": "chapter", "title": "第 8 章：微积分"}, "c01": {"html": "<h1>数学归纳法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>先验证第一项成立，再证明&quot;任意一项成立就能推出下一项成立&quot;，两步做完，全部自然数都覆盖。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是处理&quot;无穷多个情形&quot;的第一件工具。没有它，求和公式、整除性质、递推结构都只能验几个算几个。柯朗把它放在全书第一章，因为后面每一章几乎都要用它。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[P 1 成立] --&gt; B[假设 P n]\n    B --&gt; C[推出 P n+1]\n    C --&gt; D[全体自然数成立]\n    A --&gt; E[骨牌第一块倒]\n    C --&gt; F[每块能撞倒下一块]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间那条回路是递推步，它把&quot;一个点&quot;变成&quot;一整条链&quot;。左上角是链的起点，没有它，链挂不住。<\/p>\n<h2>详解<\/h2>\n<p>归纳法有两个容易被混淆的部分。<\/p>\n<p><strong>基底步<\/strong>是验证起点，通常只有一项，偶尔要验两项（当递推式依赖前两项时）。<\/p>\n<p><strong>递推步<\/strong>是先假设 P(n) 成立（这个假设叫归纳假设），再推出 P(n+1)。它证明的是一条条件句：如果第 n 项成立，那么第 n+1 项也成立。它本身不产生任何结论，必须和基底步合起来才有力量。<\/p>\n<p><strong>类比<\/strong>：一排多米诺。推倒第一块是基底，摆好间距保证每块都能撞倒下一块是递推。两件事都做到，整排才倒。这个类比的失效边界在&quot;连续性&quot;：骨牌要连续排列，对应的是归纳法只能覆盖自然数这样有&quot;下一个&quot;的结构，实数上就没有下一块。<\/p>\n<p><strong>实例<\/strong>：证明 <code>1 + 2 + … + n = n(n+1)/2<\/code>。基底 n=1 时两边都是 1。递推时假设前 n 项和为 <code>n(n+1)/2<\/code>，加上 n+1 得 <code>n(n+1)/2 + (n+1) = (n+1)(n+2)/2<\/code>，正是 n+1 的公式。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为验了前几项就等于证明了<\/strong>——不管验多少项，都是有限个，覆盖不到无穷。\n<\/li><li>\n<strong>别以为归纳假设是循环论证<\/strong>——假设的是 P(n)，证的是 P(n+1)，两者不同，不构成循环。\n<\/li><li>\n<strong>别以为归纳法可以倒着用<\/strong>——它从最小元出发往上推，不能从大往小推，除非另做&quot;强归纳&quot;或&quot;良序原理&quot;的论证。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章 §2<\/td><td>等差、等比、平方和、二项式定理<\/td><td>所有求和公式都用归纳法证<\/td><\/tr><tr><td>第 1 章 §2 第 7 小节<\/td><td>再谈归纳法<\/td><td>说明归纳法的适用边界与常见误用<\/td><\/tr><tr><td>第 8 章 §1<\/td><td>矩形和求极限<\/td><td>平方和公式在这里被用来算出 ∫₀¹x²<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：算术五条基本规律\n<\/li><li>\n后续：数列与级数（第 1 章）、极限（第 6 章）、定积分（第 8 章）\n<\/ul>", "kind": "concept", "title": "数学归纳法"}, "c02": {"html": "<h1>实数连续统<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章、第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>实数是把有理数的&quot;洞&quot;全部补上之后得到的数集，补洞的方式是区间套或戴德金分割。<\/p>\n<h2>为什么重要<\/h2>\n<p>极限、连续、微积分全都建立在它上面。有理数稠密但到处是洞，没有连续统，<code>√2<\/code> 就没有落脚处，单调有界数列也可能&quot;没有极限&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    Q[有理数 稠密但有洞] --&gt;|区间套 长度趋于0| R[实数]\n    Q --&gt;|戴德金分割 切口| R\n    R --&gt; A[完备性 单调有界必收敛]\n    A --&gt; B[介值定理]\n    A --&gt; C[极值定理]\n    A --&gt; D[微积分基本定理]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条补洞路线等价，都能得到同一个实数集。下面的三条定理都靠完备性支撑，它们不是&quot;常识&quot;，是有条件的结论。<\/p>\n<h2>详解<\/h2>\n<p><strong>区间套<\/strong>的做法：取一串嵌套闭区间 <code>[aₙ, bₙ]<\/code>，长度趋于 0，端点都是有理数。这串区间锁定了一个位置。把所有可能被锁定的位置都算进数集，就得到实数。<\/p>\n<p><strong>戴德金分割<\/strong>的做法：把有理数分成左右两半，左半没有最大元、右半没有最小元。这个切口本身就定义了一个实数。<\/p>\n<p>两种做法等价：每个区间套给出一个切口，每个切口也对应一串区间。<\/p>\n<p><strong>完备性<\/strong>是实数区别于有理数的唯一本质特征。它的几种等价表述：单调有界数列必收敛；柯西列必收敛；闭区间套必有公共点。第 2 章用区间套引入，第 6 章用单调有界证极限存在，两处是同一件事的不同说法。<\/p>\n<p><strong>类比<\/strong>：有理数像撒在一条线上的芝麻，密到任意一段都有，但线本身有缝。实数是把线填实。这个类比的失效边界在于&quot;缝&quot;的严格含义：不是视觉上的空隙，而是&quot;存在一个有上界的集合却没有最小上界&quot;。<\/p>\n<p><strong>实例<\/strong>：数列 <code>1.4, 1.41, 1.414, …<\/code>（√2 的逐位逼近）单调递增且有上界 1.5。它的极限不是有理数。若只有有理数，这个数列&quot;没有极限&quot;；补上实数后它收敛到 <code>√2<\/code>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为稠密就等于连续<\/strong>——稠密说的是任意两个元素之间还有元素，连续说的是每个&quot;应该有&quot;的位置上都真的有点。\n<\/li><li>\n<strong>别以为实数就是&quot;所有小数&quot;<\/strong>——小数只是表示法。实数的定义靠序结构和完备性，不靠十进制展开。\n<\/li><li>\n<strong>别以为完备性只是技术细节<\/strong>——去掉它，介值定理、极值定理、微积分基本定理全部失效。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章 §2<\/td><td>不可公度线段与无理数<\/td><td>用区间套定义无理数，给出戴德金分割作为另一条路<\/td><\/tr><tr><td>第 2 章 §4<\/td><td>无限的数学分析<\/td><td>有理数可数、连续统不可数，康托基数<\/td><\/tr><tr><td>第 6 章 §2<\/td><td>单调序列<\/td><td>单调有界必收敛，用它证 <code>qⁿ→0<\/code> 与 <code>(1+1/n)ⁿ→e<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：有理数、算术基本定理\n<\/li><li>\n后续：极限（第 6 章）、连续性与介值定理（第 6 章）、定积分（第 8 章）\n<\/ul>", "kind": "concept", "title": "实数连续统"}, "c03": {"html": "<h1>数域与尺规代数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>可作图线段的长度落在从有理数出发、逐次添加平方根得到的数域里，扩张次数只会是 2 的幂。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;作不出来&quot;从一句抱怨变成一条定理。三个古希腊难题不是手艺问题，是代数结构问题：要求的数不在这个数域里。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[已知线段 长度 1] --&gt; B[Q 有理数域]\n    B --&gt;|作圆与直线交点| C[二次扩张]\n    C --&gt;|重复| D[2^k 次数域]\n    D --&gt; E[可作图点坐标]\n    F[三次不可约] --&gt; G[次数 3 不在此列]\n    G --&gt; H[倍立方 三等分 正七边]\n    I[π 超越] --&gt; J[连代数数都不是]\n    J --&gt; K[化圆为方]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面一条是&quot;能作&quot;的层级，下面两条是两类失败原因。左边那条链每一层都只乘 2，所以次数不会出现 3。<\/p>\n<h2>详解<\/h2>\n<p><strong>数域<\/strong>是对加减乘除封闭的数集。有理数是一个域，实数、复数也都是。从 Q 出发添一个数，如果这个数满足一个二次方程，扩张次数是 2；添三次方程的根，扩张次数是 3。<\/p>\n<p><strong>尺规为什么只产生二次扩张<\/strong>：直线和圆的方程都是一次的或二次的，解交点就是解一个二次方程组，结果是系数的四则运算加一个平方根。归纳到每一步，都只在当前域上做二次扩张。<\/p>\n<p><strong>判据<\/strong>：可作图数必须落在某个 <code>2^k<\/code> 次扩张里，因此它的代数次数必须是 2 的幂。这条判据一次性解决三个难题：<\/p>\n<ul><li>\n倍立方要 <code>³√2<\/code>，它满足 <code>x³−2=0<\/code>，不可约，次数 3，不可作。\n<\/li><li>\n三等分 60° 要 <code>2cos20°<\/code>，它满足 <code>x³−3x−1=0<\/code>，不可约，次数 3，不可作。\n<\/li><li>\n正七边形要 <code>cos(2π/7)<\/code>，对应的分圆多项式约化后是三次，不可作。\n<\/ul>\n<p><strong>化圆为方<\/strong>要 <code>√π<\/code>。π 是超越数（林德曼 1882），不是代数数，代数次数这个判据用不上，需要另一条论证。<\/p>\n<p><strong>类比<\/strong>：可作图数域像一个只能加、乘、除、开平方的计算器。按多少次都行，按不出立方根。这个类比的失效边界是&quot;工具&quot;这层：计算器是离散操作，尺规是连续作图，两者对应关系要靠交点方程来建立，不能直接类比。<\/p>\n<p><strong>实例<\/strong>：证明 <code>³√2<\/code> 的代数次数是 3。多项式 <code>x³−2<\/code> 若可约，必有一次因式，其有理根只能是 ±1、±2。代入：<code>1−2=−1<\/code>，<code>−1−2=−3<\/code>，<code>8−2=6<\/code>，<code>−8−2=−10<\/code>，全不为零。所以无一次因式，三次多项式不可约，<code>³√2<\/code> 的次数为 3。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为不可作是因为没找到方法<\/strong>——不可作有证明，证明的是工具允许的运算范围不足以产生该数。\n<\/li><li>\n<strong>别以为所有不可作问题都靠代数次数<\/strong>——化圆为方靠超越性，两类论证不能互换。\n<\/li><li>\n<strong>别以为尺规的限制是&quot;工具太简单&quot;<\/strong>——限制在代数结构上；允许带刻度的直尺，倍立方立刻可作。\n<\/li><li>\n<strong>别以为次数是 2 的幂就一定可作<\/strong>——还要满足具体的构造条件，判据给的是必要条件，正多边形的完整判据要看出费马素数条件。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章 §1<\/td><td>基本几何作图与正多边形<\/td><td>正 n 边形可作的费马素数判据<\/td><\/tr><tr><td>第 3 章 §2<\/td><td>可作图的数与数域<\/td><td>一般理论：可作图数必为代数数<\/td><\/tr><tr><td>第 3 章 §3<\/td><td>三个不可解的希腊问题<\/td><td>倍立方、三等分、正七边形、化圆为方逐个处理<\/td><\/tr><tr><td>第 3 章 §4—§6<\/td><td>反演、马歇罗尼、连杆<\/td><td>换工具或换变换后结论如何改变<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：有理数、代数数（第 2 章）\n<\/li><li>\n后续：群与伽罗华理论（第 3 章引出的近世代数线索）、射影变换（第 4 章）\n<\/ul>", "kind": "concept", "title": "数域与尺规代数"}, "c04": {"html": "<h1>变换群与不变量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一门几何由它允许的变换群决定，几何命题就是在这个群的变换下保持不变的陈述。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;几何&quot;从一个模糊的词变成可以分类的对象。欧氏、仿射、射影、拓扑不再是四门并列的学问，而是同一件事在不同宽松程度下的四个版本。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[刚体运动] --&gt; B[长度 角度 面积]\n    C[仿射变换] --&gt; D[平行 中点 共线]\n    E[射影变换] --&gt; F[交比 共线]\n    G[连续变形] --&gt; H[连通性 洞数 定向]\n    A --&gt; C --&gt; E --&gt; G<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从左到右变换越来越宽松，能守住的量越来越少。这条链条就是厄兰格纲领的直观版本。<\/p>\n<h2>详解<\/h2>\n<p><strong>变换群<\/strong>要满足三条：包含恒等变换，两个变换的复合仍在群里，每个变换都有逆。这三条保证&quot;能不能从 A 变到 B&quot;是一种等价关系，几何才有了分类的基础。<\/p>\n<p><strong>不变量<\/strong>是在群的所有变换下保持不变的量或性质。找不变量是几何的核心工作：长度是欧氏不变量，平行是仿射不变量，交比是射影不变量，欧拉示性数是拓扑不变量。<\/p>\n<p><strong>为什么结构越宽松，不变量越少<\/strong>：群越大，要同时满足的约束越多，能留下来的性质越少。这是包含关系的直接后果。<\/p>\n<p><strong>类比<\/strong>：用不同精度的仪器观察同一块材料。卡尺测长度，天平测质量，显微镜看结构；换仪器等于换变换群，看到的不变量不同。失效边界：仪器是物理限制，变换群是数学定义，前者的&quot;精度&quot;没有严格对应。<\/p>\n<p><strong>实例<\/strong>：判断&quot;两条线段等长&quot;属于哪门几何。在刚体运动下这是不变量，在仿射变换下不是（拉伸会改长度），在射影变换下更不是。反过来，&quot;三点共线&quot;在射影变换下仍成立，所以它属于射影几何的命题。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为拓扑学是&quot;不精确的几何&quot;<\/strong>——它有严格定义和不变量，只是不变量比欧氏几何少。\n<\/li><li>\n<strong>别以为变换越宽松定理越弱<\/strong>——宽松变换下的定理适用范围反而更广，代价是结论更粗。\n<\/li><li>\n<strong>别以为不变量一定要是数<\/strong>——连通性、可定向性、洞的个数都是不变量，不是数值。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章 §1<\/td><td>几何性质的分类<\/td><td>克莱因厄兰格纲领，按变换分类<\/td><\/tr><tr><td>第 4 章 §2—§3<\/td><td>射影变换与对偶<\/td><td>交比不变，点线对偶<\/td><\/tr><tr><td>第 5 章 §2<\/td><td>图形的拓扑性质<\/td><td>连续变形下的不变量：连通性、洞数<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：映射与变换（第 4 章）、等价关系\n<\/li><li>\n后续：拓扑不变量（第 5 章）、欧拉示性数（第 5 章）、群论（第 3 章引出的代数结构）\n<\/ul>", "kind": "concept", "title": "变换群与不变量"}, "c05": {"html": "<h1>欧拉示性数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><code>χ = V − E + F<\/code>，顶点数减棱数加面数，它只依赖曲面的洞数，不依赖怎么剖分。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是第一个被发现的拓扑不变量，把&quot;洞的个数&quot;这个几何直觉变成可计算的数。有了它，闭曲面的分类才有统一的记账方式。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[多面体剖分] --&gt; B[V 顶点数]\n    A --&gt; C[E 棱数]\n    A --&gt; D[F 面数]\n    B --&gt; E[χ = V-E+F]\n    C --&gt; E\n    D --&gt; E\n    E --&gt; F[球面 χ=2]\n    E --&gt; G[环面 χ=0]\n    E --&gt; H[亏格 g 时 χ=2-2g]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三个计数怎么组合，右边的三种取值对应三类曲面。同一个 <code>χ<\/code> 的曲面互相同胚（在可定向情形下）。<\/p>\n<h2>详解<\/h2>\n<p><strong>为什么与剖分无关<\/strong>：把一个面切一刀，面数加 1，棱数加 1，顶点数不变，<code>χ<\/code> 不变。加一条从顶点到顶点的对角线，棱数加 1，面数加 1，<code>χ<\/code> 也不变。任何细分都保持这个组合量，所以它只依赖曲面的整体形状。<\/p>\n<p><strong>亏格与 χ<\/strong>：对可定向闭曲面，<code>χ = 2 − 2g<\/code>。球面 g=0 得 2，环面 g=1 得 0，双环面 g=2 得 −2。不可定向曲面用另一套公式，但 <code>χ<\/code> 仍然是分类依据。<\/p>\n<p><strong>边界的影响<\/strong>：曲面每开一个洞（挖去一个开圆盘），<code>χ<\/code> 减 1。带边界的曲面要单独记账。<\/p>\n<p><strong>类比<\/strong>：记账。收入加资产减负债，怎么拆分条目都不改总数。这个类比的失效边界在于：<code>χ<\/code> 只抓住洞的个数，抓不住&quot;洞怎么分布&quot;，两个 <code>χ<\/code> 相同的不可定向曲面未必同胚。<\/p>\n<p><strong>实例<\/strong>：足球的 <code>χ<\/code>。12 个五边形加 20 个六边形，<code>F=32<\/code>。每条棱被两面共用，<code>E=(12×5+20×6)/2=90<\/code>。每个顶点被三面共用，<code>V=(12×5+20×6)/3=60<\/code>。<code>χ=60−90+32=2<\/code>，与球面一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 <code>χ<\/code> 相同的曲面都同胚<\/strong>——可定向闭曲面确实由 <code>χ<\/code> 决定，但不可定向情形还要看定向性。\n<\/li><li>\n<strong>别以为欧拉公式只对正多面体成立<\/strong>——任何与球面同胚的多面体都满足 <code>V−E+F=2<\/code>，不管面是否正多边形。\n<\/li><li>\n<strong>别以为 <code>χ<\/code> 是度量量<\/strong>——它由计数得到，拉伸和弯曲都不改它。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章 §1<\/td><td>多面体的欧拉公式<\/td><td><code>V−E+F=2<\/code> 对简单多面体成立<\/td><\/tr><tr><td>第 5 章 §4<\/td><td>曲面的拓扑分类<\/td><td>用亏格与 <code>χ<\/code> 分类闭曲面<\/td><\/tr><tr><td>第 5 章附录<\/td><td>五色定理<\/td><td>用欧拉公式推出每个平面图有低度顶点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：多面体与剖分（第 5 章）\n<\/li><li>\n后续：亏格与曲面分类（第 5 章）、平面图与四色问题（第 5 章）\n<\/ul>", "kind": "concept", "title": "欧拉示性数"}, "c06": {"html": "<h1>极限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章、第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>不管把允许的误差压到多小，从某一项之后所有值都落在误差范围内，这时就说极限存在。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是连续、导数、积分三个概念的共同底座。没有极限，&quot;越来越接近&quot;只是一句形容，没法判断真假。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[给定 ε 误差] --&gt; B[寻找 N 或 δ]\n    B --&gt;|找到| C[项落入误差带]\n    B --&gt;|找不到| D[不收敛]\n    C --&gt; E[极限存在]\n    E --&gt; F[连续 极限等于函数值]\n    E --&gt; G[导数 差商极限]\n    E --&gt; H[积分 矩形和极限]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：所有结论都从左上角那一步长出来。ε 是外部要求，N 和 δ 是内部回应，能不能回应决定收敛与否。<\/p>\n<h2>详解<\/h2>\n<p><strong>数列极限<\/strong>：对任意 ε&gt;0，存在 N，使 n&gt;N 时 <code>|aₙ−L|&lt;ε<\/code>。N 可以依赖 ε，这一点常被忽略。ε 越小，N 一般越大，但每次都存在。<\/p>\n<p><strong>函数极限<\/strong>：对任意 ε&gt;0，存在 δ&gt;0，使 <code>0&lt;|x−a|&lt;δ<\/code> 时 <code>|f(x)−L|&lt;ε<\/code>。这里用的是去心邻域，<code>x=a<\/code> 那一点的值不参与判断。<\/p>\n<p><strong>连续<\/strong>：在 a 处连续的判据是 <code>lim(x→a) f(x)=f(a)<\/code>，即极限存在且等于函数值。三个条件缺一不可：f 在 a 有定义、极限存在、两者相等。<\/p>\n<p><strong>单调有界定理<\/strong>：单调递增且有上界的数列必收敛。它依赖实数完备性，证明方式是取上确界，再验证它就是极限。<\/p>\n<p><strong>类比<\/strong>：验收。客户给容差，你报&quot;从第几件起达标&quot;。容差收紧就重报，只要每次都能报出一个数，就算合格。失效边界：验收是有限批次，极限要求的是无穷序列，不能验完就宣布。<\/p>\n<p><strong>实例<\/strong>：证明 <code>lim(n→∞) 1/n = 0<\/code>。给定 ε&gt;0，取 <code>N = ⌈1/ε⌉<\/code>，当 n&gt;N 时有 <code>1/n &lt; 1/N ≤ ε<\/code>。这个 N 是显式构造出来的，符合定义要求的&quot;存在&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为极限就是函数在那一点的值<\/strong>——<code>sin x/x<\/code> 在 0 处无定义，极限却是 1。\n<\/li><li>\n<strong>别以为&quot;看起来越来越近&quot;就是收敛<\/strong>——<code>1, 1/2, 1/3, …<\/code> 收敛，<code>1, 2, 3, …<\/code> 不收敛，但都可以说&quot;在变化&quot;，要看的是能否被任意误差带罩住。\n<\/li><li>\n<strong>别以为单调有界定理在有理数里也成立<\/strong>——它依赖完备性，去掉就失效。\n<\/li><li>\n<strong>别以为 ε-δ 只是形式<\/strong>——它把&quot;能不能任意逼近&quot;变成可判定的命题，工程里的误差估计就是它的实例。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章 §2<\/td><td>数列极限<\/td><td>单调有界、e 与 π 的极限定义<\/td><\/tr><tr><td>第 6 章 §3—§4<\/td><td>连续趋近的极限<\/td><td>ε-δ 定义，<code>sin x/x<\/code> 的夹逼<\/td><\/tr><tr><td>第 6 章 §5—§6<\/td><td>两个基本定理<\/td><td>介值定理、极值定理，紧致集<\/td><\/tr><tr><td>第 8 章 §1—§2<\/td><td>积分与导数<\/td><td>两者都是极限，只是求和的形状不同<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：实数连续统（第 2 章）\n<\/li><li>\n后续：连续性与介值定理（第 6 章）、导数（第 8 章）、定积分（第 8 章）\n<\/ul>", "kind": "concept", "title": "极限"}, "c07": {"html": "<h1>极值与存在性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>极值问题分两步走：先证明最优解真的存在，再找出它；只做第二步，结论随时可能是空谈。<\/p>\n<h2>为什么重要<\/h2>\n<p>初等做法（求导、列方程）只能定位候选点，不能保证候选点真的能取到，也不能保证候选点就是全局最优。等周问题、狄利克雷原理都卡在这一步上，卡了几十年。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[候选集合] --&gt; B{紧致吗 闭且有界}\n    B --&gt;|是| C[连续函数必有极值]\n    B --&gt;|否| D[可能没有最优点]\n    C --&gt; E[用驻点或变分定位]\n    D --&gt; F[先补紧致性 或改提法]\n    E --&gt; G[验证该点确为全局最优]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：右上角的判断是分水岭。紧致性不成立时，右边那条路要求你先改造问题，否则后面的计算没有立足点。<\/p>\n<h2>详解<\/h2>\n<p><strong>存在性靠紧致性<\/strong>：连续函数在有界闭集上必取到最大最小值（维尔斯特拉斯极值定理）。这条定理是第 6 章的结论，在这里成了极值问题的前置条件。<\/p>\n<p><strong>定位靠必要条件<\/strong>：可微函数的极值点必是驻点；变分问题的极值曲线必满足欧拉-拉格朗日方程。必要条件只筛掉不可能的候选，留下的还要逐个验证。<\/p>\n<p><strong>等周问题为什么难<\/strong>：曲线族不是紧致的，长度有界不保证曲线族有收敛子列（可能越来越&quot;毛糙&quot;）。必须先把曲线族限制到&quot;可求长且有界&quot;的子族上，才能用极值定理。<\/p>\n<p><strong>狄利克雷原理<\/strong>：断言某个变分问题的最小值存在且满足方程。它曾被批评&quot;循环论证&quot;（用存在性去证存在性），后来由希尔伯特用更细的紧致性论证补上。<\/p>\n<p><strong>类比<\/strong>：招聘。先确认岗位真的缺人（存在性），再筛选简历（定位）。岗位根本不存在时，筛得再细也是白费。失效边界：招聘可以取消岗位，数学问题不能，缺存在性就得改提法。<\/p>\n<p><strong>实例<\/strong>：<code>f(x)=x<\/code> 在开区间 (0,1) 上连续，没有最大值也没有最小值。同一函数在闭区间 [0,1] 上有最大值 1、最小值 0。差别只在端点是否属于定义域，这一个条件决定了极值是否存在。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为连续函数一定有极值<\/strong>——开区间上的 <code>x<\/code> 就是反例，必须闭且有界。\n<\/li><li>\n<strong>别以为驻点就是答案<\/strong>——驻点只是候选，还要判二阶条件，还要和其他候选比。\n<\/li><li>\n<strong>别以为变分法给出的一定是最小<\/strong>——它给的是驻值，可能是极大也可能是鞍点，需要二阶变分判断。\n<\/li><li>\n<strong>别以为存在性可以&quot;以后再补&quot;<\/strong>——很多推导在存在性缺失时会得出错误结论，补不回来。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章 §3<\/td><td>驻点与微分学<\/td><td>驻点是必要条件，鞍点是多元情形的新现象<\/td><\/tr><tr><td>第 7 章 §7<\/td><td>极值的存在性 狄利克雷原理<\/td><td>存在性不能跳过，历史上曾被误用<\/td><\/tr><tr><td>第 7 章 §8—§10<\/td><td>等周问题与变分法<\/td><td>曲线族的紧致性是关键前提<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：极限与连续性（第 6 章）、维尔斯特拉斯极值定理（第 6 章）\n<\/li><li>\n后续：变分法（第 7 章）、测地线与极小曲面（普林斯顿 IV.12）\n<\/ul>", "kind": "concept", "title": "极值与存在性"}, "c08": {"html": "<h1>微积分基本定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>求积函数的导数等于被积函数，且定积分等于原函数的端点差；这两句话把微分和积分接成互为逆运算。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;算面积&quot;从一个求和极限问题降级成&quot;找一个原函数&quot;。微积分能成为通用工具，靠的就是这一步降级。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[函数 f] --&gt;|矩形和取极限| B[定积分]\n    A --&gt;|差商取极限| C[导数]\n    B --&gt;|对上限求导| D[回到 f]\n    C --&gt;|找原函数| E[F 满足 F&#x27;=f]\n    E --&gt;|端点相减| B\n    D --&gt; F[第一半]\n    E --&gt; G[第二半 牛顿-莱布尼茨]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条箭头形成一个闭环。左边是定义，右边是计算公式，中间那个闭环说明两个运算互逆。<\/p>\n<h2>详解<\/h2>\n<p><strong>第一半<\/strong>：设 <code>F(x)=∫ₐˣ f(t)dt<\/code>，则 <code>F&#x27;(x)=f(x)<\/code>。证明用差商：<code>[F(x+h)−F(x)]/h<\/code> 等于 <code>f<\/code> 在 <code>[x,x+h]<\/code> 上的平均值（积分中值定理），当 h→0 时趋于 <code>f(x)<\/code>（连续性）。<\/p>\n<p><strong>第二半<\/strong>：<code>∫ₐᵇ f(x)dx = F(b)−F(a)<\/code>。证明用第一半加&quot;两个原函数只差常数&quot;。<\/p>\n<p><strong>为什么这两半合起来有威力<\/strong>：第一半说明积分是微分的一个逆运算，第二半说明只要找到任一原函数就能算定积分，不必回到矩形和。原函数有公式表（幂函数、三角函数、指数函数）和两条通用法则（换元、分部），于是积分变成了查表和变形。<\/p>\n<p><strong>类比<\/strong>：里程表和速度表。速度读数是导数，里程读数是积分，末读数减初读数就是总路程。这个类比对变速运动成立，对倒车也成立，因为积分带符号。<\/p>\n<p><strong>实例<\/strong>：算 <code>∫₁² (3x²+2x)dx<\/code>。原函数 <code>x³+x²<\/code>，代入得 <code>(8+4)−(1+1)=10<\/code>。用矩形和验证也可以，但没人愿意做。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为基本定理对所有函数都成立<\/strong>——它要求 f 连续（或至少可积且原函数存在）。\n<\/li><li>\n<strong>别以为原函数唯一<\/strong>——原函数差一个常数，端点相减时抵消，所以用哪个都行。\n<\/li><li>\n<strong>别以为积分就是面积<\/strong>——定积分带符号，x 轴下方的部分算负的。\n<\/li><li>\n<strong>别以为 <code>dy/dx<\/code> 是真分数<\/strong>——它是记号，链式法则的&quot;约分&quot;外观是定理保证的结果。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章 §1<\/td><td>面积看作极限<\/td><td>积分的定义来自矩形和<\/td><\/tr><tr><td>第 8 章 §5<\/td><td>微积分基本定理<\/td><td>两半定理与初步应用<\/td><\/tr><tr><td>第 8 章 §6<\/td><td>指数与对数<\/td><td>用基本定理算 <code>∫dx/x = ln x<\/code><\/td><\/tr><tr><td>第 8 章 §7<\/td><td>微分方程<\/td><td><code>y&#x27;=ky<\/code> 的解由积分得到<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：极限（第 6 章）、导数与积分（第 8 章）\n<\/li><li>\n后续：微分方程（第 8 章）、多元积分与格林公式（数学手册 ch06）\n<\/ul>", "kind": "concept", "title": "微积分基本定理"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：自然数与数学归纳法<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：自然数与数学归纳法<\/a><br>检查点：ch01 自测 3 题全对，能独立证明 1+3+…+(2n−1)=n²<\/li><li class='path-step' id='path-02'><strong>步骤 02：数学中的数系<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：数学中的数系<\/a><br>检查点：能复述 √2 不是有理数的完整反证<\/li><li class='path-step' id='path-03'><strong>步骤 03：几何作图与数域<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：几何作图与数域的代数<\/a><br>检查点：能说出倍立方体卡在哪条代数条件上<\/li><li class='path-step' id='path-04'><strong>步骤 04：射影几何、公理体系、非欧几何<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：射影几何、公理体系与非欧几何<\/a><br>检查点：能写出一个射影命题的对偶命题<\/li><li class='path-step' id='path-05'><strong>步骤 05：拓扑学<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：拓扑学<\/a><br>检查点：能算出足球的 V−E+F=2<\/li><li class='path-step' id='path-06'><strong>步骤 06：函数与极限<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：函数与极限<\/a><br>检查点：能按 ε-N 定义验证 1/n→0<\/li><li class='path-step' id='path-07'><strong>步骤 07：极大与极小<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：极大与极小<\/a><br>检查点：能用均值不等式证明周长固定时正方形面积最大<\/li><li class='path-step' id='path-08'><strong>步骤 08：微积分<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：微积分<\/a><br>检查点：能用矩形和算出 ∫₀¹x²dx=1/3<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：自然数与数学归纳法<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 数学归纳法证明中，假设 P(n) 成立这一步的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 证明 P(n) 对所有 n 成立<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 作为递推步的前提，用来推出 P(n+1)<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 验证基底情形<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 证明命题的唯一性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> gcd(1071, 1029) 的值是？（填整数）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/but '填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：射影几何、公理体系与非欧几何<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 在射影变换下保持不变的量是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 线段长度<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 两条直线的夹角<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 交比<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 图形面积<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 非欧几何的相容性通过构造什么来保证？（填两字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：拓扑学<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 一个多面体算出 V−E+F=0，它最可能是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 球面<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 环面<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 平面<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 圆柱侧面<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 莫比乌斯带只有几个面？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：函数与极限<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> sin x / x 在 x→0 时极限为 1 的证明中，关键不等式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> sin x &gt; x<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> cos x &lt; sin x/x &lt; 1<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> tan x &lt; x<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> sin x &lt; cos x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> (1+1/n)^n 当 n→∞ 时的极限记作什么？（填一个字母）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch07__": {"html": "<h1>测验：第 7 章：极大与极小<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 直线 L 同侧两点 P、Q，L 上使 PR+RQ 最小的点 R 满足？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> PR 与 RQ 垂直<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> PR、RQ 与 L 成等角<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> R 是 PQ 的中点投影<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> R 到 P、Q 距离相等<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p
