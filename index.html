。\n<\/li><li>\n<strong>别以为驻点就是答案<\/strong>——驻点只是候选，还要判二阶条件，还要和其他候选比。\n<\/li><li>\n<strong>别以为变分法给出的一定是最小<\/strong>——它给的是驻值，可能是极大也可能是鞍点，需要二阶变分判断。\n<\/li><li>\n<strong>别以为存在性可以&quot;以后再补&quot;<\/strong>——很多推导在存在性缺失时会得出错误结论，补不回来。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章 §3<\/td><td>驻点与微分学<\/td><td>驻点是必要条件，鞍点是多元情形的新现象<\/td><\/tr><tr><td>第 7 章 §7<\/td><td>极值的存在性 狄利克雷原理<\/td><td>存在性不能跳过，历史上曾被误用<\/td><\/tr><tr><td>第 7 章 §8—§10<\/td><td>等周问题与变分法<\/td><td>曲线族的紧致性是关键前提<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：极限与连续性（第 6 章）、维尔斯特拉斯极值定理（第 6 章）\n<\/li><li>\n后续：变分法（第 7 章）、测地线与极小曲面（普林斯顿 IV.12）\n<\/ul>", "c08": "<h1>微积分基本定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>求积函数的导数等于被积函数，且定积分等于原函数的端点差；这两句话把微分和积分接成互为逆运算。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;算面积&quot;从一个求和极限问题降级成&quot;找一个原函数&quot;。微积分能成为通用工具，靠的就是这一步降级。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[函数 f] --&gt;|矩形和取极限| B[定积分]\n    A --&gt;|差商取极限| C[导数]\n    B --&gt;|对上限求导| D[回到 f]\n    C --&gt;|找原函数| E[F 满足 F&#x27;=f]\n    E --&gt;|端点相减| B\n    D --&gt; F[第一半]\n    E --&gt; G[第二半 牛顿-莱布尼茨]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条箭头形成一个闭环。左边是定义，右边是计算公式，中间那个闭环说明两个运算互逆。<\/p>\n<h2>详解<\/h2>\n<p><strong>第一半<\/strong>：设 <code>F(x)=∫ₐˣ f(t)dt<\/code>，则 <code>F&#x27;(x)=f(x)<\/code>。证明用差商：<code>[F(x+h)−F(x)]/h<\/code> 等于 <code>f<\/code> 在 <code>[x,x+h]<\/code> 上的平均值（积分中值定理），当 h→0 时趋于 <code>f(x)<\/code>（连续性）。<\/p>\n<p><strong>第二半<\/strong>：<code>∫ₐᵇ f(x)dx = F(b)−F(a)<\/code>。证明用第一半加&quot;两个原函数只差常数&quot;。<\/p>\n<p><strong>为什么这两半合起来有威力<\/strong>：第一半说明积分是微分的一个逆运算，第二半说明只要找到任一原函数就能算定积分，不必回到矩形和。原函数有公式表（幂函数、三角函数、指数函数）和两条通用法则（换元、分部），于是积分变成了查表和变形。<\/p>\n<p><strong>类比<\/strong>：里程表和速度表。速度读数是导数，里程读数是积分，末读数减初读数就是总路程。这个类比对变速运动成立，对倒车也成立，因为积分带符号。<\/p>\n<p><strong>实例<\/strong>：算 <code>∫₁² (3x²+2x)dx<\/code>。原函数 <code>x³+x²<\/code>，代入得 <code>(8+4)−(1+1)=10<\/code>。用矩形和验证也可以，但没人愿意做。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为基本定理对所有函数都成立<\/strong>——它要求 f 连续（或至少可积且原函数存在）。\n<\/li><li>\n<strong>别以为原函数唯一<\/strong>——原函数差一个常数，端点相减时抵消，所以用哪个都行。\n<\/li><li>\n<strong>别以为积分就是面积<\/strong>——定积分带符号，x 轴下方的部分算负的。\n<\/li><li>\n<strong>别以为 <code>dy/dx<\/code> 是真分数<\/strong>——它是记号，链式法则的&quot;约分&quot;外观是定理保证的结果。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章 §1<\/td><td>面积看作极限<\/td><td>积分的定义来自矩形和<\/td><\/tr><tr><td>第 8 章 §5<\/td><td>微积分基本定理<\/td><td>两半定理与初步应用<\/td><\/tr><tr><td>第 8 章 §6<\/td><td>指数与对数<\/td><td>用基本定理算 <code>∫dx/x = ln x<\/code><\/td><\/tr><tr><td>第 8 章 §7<\/td><td>微分方程<\/td><td><code>y&#x27;=ky<\/code> 的解由积分得到<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：极限（第 6 章）、导数与积分（第 8 章）\n<\/li><li>\n后续：微分方程（第 8 章）、多元积分与格林公式（数学手册 ch06）\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：自然数与数学归纳法<\/strong><br>阅读：<a href=\"#/book/what-is-mathematics/chapter/ch01\">第 1 章：自然数与数学归纳法<\/a><br>检查点：ch01 自测 3 题全对，能独立证明 1+3+…+(2n−1)=n²<\/li><li class='path-step' id='path-02'><strong>步骤 02：数学中的数系<\/strong><br>阅读：<a href=\"#/book/what-is-mathematics/chapter/ch02\">第 2 章：数学中的数系<\/a><br>检查点：能复述 √2 不是有理数的完整反证<\/li><li class='path-step' id='path-03'><strong>步骤 03：几何作图与数域<\/strong><br>阅读：<a href=\"#/book/what-is-mathematics/chapter/ch03\">第 3 章：几何作图与数域的代数<\/a><br>检查点：能说出倍立方体卡在哪条代数条件上<\/li><li class='path-step' id='path-04'><strong>步骤 04：射影几何、公理体系、非欧几何<\/strong><br>阅读：<a href=\"#/book/what-is-mathematics/chapter/ch04\">第 4 章：射影几何、公理体系与非欧几何<\/a><br>检查点：能写出一个射影命题的对偶命题<\/li><li class='path-step' id='path-05'><strong>步骤 05：拓扑学<\/strong><br>阅读：<a href=\"#/book/what-is-mathematics/chapter/ch05\">第 5 章：拓扑学<\/a><br>检查点：能算出足球的 V−E+F=2<\/li><li class='path-step' id='path-06'><strong>步骤 06：函数与极限<\/strong><br>阅读：<a href=\"#/book/what-is-mathematics/chapter/ch06\">第 6 章：函数与极限<\/a><br>检查点：能按 ε-N 定义验证 1/n→0<\/li><li class='path-step' id='path-07'><strong>步骤 07：极大与极小<\/strong><br>阅读：<a href=\"#/book/what-is-mathematics/chapter/ch07\">第 7 章：极大与极小<\/a><br>检查点：能用均值不等式证明周长固定时正方形面积最大<\/li><li class='path-step' id='path-08'><strong>步骤 08：微积分<\/strong><br>阅读：<a href=\"#/book/what-is-mathematics/chapter/ch08\">第 8 章：微积分<\/a><br>检查点：能用矩形和算出 ∫₀¹x²dx=1/3<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：自然数与数学归纳法<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 数学归纳法证明中，假设 P(n) 成立这一步的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 证明 P(n) 对所有 n 成立<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 作为递推步的前提，用来推出 P(n+1)<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 验证基底情形<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 证明命题的唯一性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> gcd(1071, 1029) 的值是？（填整数）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：数学中的数系<\/h2><div class='quiz-item' data-qid='ch02-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> √2 不是有理数的证明中，设 p、q 互素这一步的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q01' value='0'> 保证 q 不为 0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q01' value='1'> 保证 p、q 都是偶数<\/label><label class='quiz-opt'><input type='radio' name='ch02-q01' value='2'> 为 p、q 同为偶数与互素的矛盾埋下条件<\/label><labe e='1'> 积分上限函数的导数等于被积函数<\/label><label class='quiz-opt'><input type='radio' name='ch08-q01' value='2'> 导数等于切线斜率<\/label><label class='quiz-opt'><input type='radio' name='ch08-q01' value='3'> 原函数一定存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> ∫₀¹ x² dx 的值是多少？（写成 a/b 形式）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪一组概念是同一件事在不同变换群下的版本？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 长度、交比、连通性<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 欧氏几何、仿射几何、射影几何、拓扑<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 归纳法、极限、积分<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 有理数、实数、复数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 把归纳法、极限、定积分按依赖顺序排列，正确的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 极限→归纳法→定积分<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 归纳法→极限→定积分<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 定积分→极限→归纳法<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 三者互不依赖<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 球面上任一简单多面体满足 V−E+F 等于多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='算术基本规律'>算术基本规律 — 交换律、结合律、分配律这五条对整数成立的等式，是全部算术推理的起点 <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='数学归纳法'>数学归纳法 — 验第一项成立，再证任意一项成立能推出下一项，两步覆盖全部自然数 <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='素数'>素数 — 大于 1 且只能被 1 和自身整除的整数 <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='算术基本定理'>算术基本定理 — 每个大于 1 的整数都能唯一分解为素数乘积，不计次序 <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='同余'>同余 — 两个整数除以 m 后余数相同，记作 a ≡ b (mod m) <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='辗转相除法'>辗转相除法 — 用取余反复迭代求最大公因数，依据 gcd(a,b)=gcd(b,a mod b) <span class=glossary-ref>（第 1 章：自然数与数学归纳法）<\/span><\/li><li data-term='有理数'>有理数 — 能写成两个整数之比的数，比值不依赖所选的度量单位 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='不可公度'>不可公度 — 两条线段不能用同一个单位同时量尽，等价于长度之比不是有理数 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='区间套'>区间套 — 一串嵌套的闭区间，长度趋于零，它锁定一个点，可用来定义实数 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='戴德金分割'>戴德金分割 — 把有理数分成左右两半且左半无最大元、右半无最小元，这个切口定义一个实数 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='可数'>可数 — 能与自然数一一对应的集合，例如有理数 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='基数'>基数 — 衡量集合大小的量，可数集合的基数为 ℵ₀ <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='代数数'>代数数 — 某个整系数多项式的根 <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='超越数'>超越数 — 不是任何整系数多项式根的实数，例如 π 与 e <span class=glossary-ref>（第 2 章：数学中的数系）<\/span><\/li><li data-term='数域'>数域 — 对加减乘除封闭的数集，例如有理数、实数、复数 <span class=glossary-ref>（第 3 章：几何作图与数域的代数）<\/span><\/li><li data-term='二次扩张'>二次扩张 — 在当前数域上添加一个平方根所得的扩域，次数为 2 <span class=glossary-ref>（第 3 章：几何作图与数域的代数）<\/span><\/li><li data-term='反演'>反演 — 关于圆的变换，把点 P 映到射线 OP 上的 P′ 且 OP·OP′ = r² <span class=glossary-ref>（第 3 章：几何作图与数域的代数）<\/span><\/li><li data-term='射影变换'>射影变换 — 把直线映成直线的变换，来自中心投影，会破坏长度、角度和平行 <span class=glossary-ref>（第 4 章：射影几何、公理体系与非欧几何）<\/span><\/li><li data-term='交比'>交比 — 共线四点构成的长度比之商，在射影变换下不变 <span class=glossary-ref>（第 4 章：射影几何、公理体系与非欧几何）<\/span><\/li><li data-term='对偶原理'>对偶原理 — 射影平面里把点与线互换，命题与其对偶同时成立 <span class=glossary-ref>（第 4 章：射影几何、公理体系与非欧几何）<\/span><\/li><li data-term='同胚'>同胚 — 双向连续且可逆的映射，拓扑学判断两个图形是否相同的标准 <span class=glossary-ref>（第 5 章：拓扑学）<\/span><\/li><li data-term='亏格'>亏格 — 曲面上洞的个数，可定向闭曲面满足 χ=2−2g <span class=glossary-ref>（第 5 章：拓扑学）<\/span><\/li><li data-term='单侧曲面'>单侧曲面 — 只有一个面的曲面，沿法向量走一圈会走到反面，莫比乌斯带是最简例子 <span class=glossary-ref>（第 5 章：拓扑学）<\/span><\/li><li data-term='极限'>极限 — 任意给定误差后，从某项起所有值都落在误差范围内 <span class=glossary-ref>（第 6 章：函数与极限）<\/span><\/li><li data-term='连续'>连续 — 函数在一点的极限存在且等于该点函数值 <span class=glossary-ref>（第 6 章：函数与极限）<\/span><\/li><li data-term='介值定理'>介值定理 — 闭区间上的连续函数从负走到正，必经过零 <span class=glossary-ref>（第 6 章：函数与极限）<\/span><\/li><li data-term='紧致集'>紧致集 — 闭且有界的集合，连续函数在其上必取到最大最小值 <span class=glossary-ref>（第 6 章：函数与极限）<\/span><\/li><li data-term='驻点'>驻点 — 导数为零的点，是极值点的必要条件而非充分条件 <span class=glossary-ref>（第 7 章：极大与极小）<\/span><\/li><li data-term='鞍点'>鞍点 — 沿一个方向上升、沿另一个方向下降的驻点 <span class=glossary-ref>（第 7 章：极大与极小）<\/span><\/li><li data-term='变分法'>变分法 — 在曲线族里找使某个量取极值的曲线，必要条件由欧拉-拉格朗日方程给出 <span class=glossary-ref>（第 7 章：极大与极小）<\/span><\/li><li data-term='定积分'>定积分 — 矩形和当分划无限加密时的极限，结果与分法无关 <span class=glossary-ref>（第 8 章：微积分）<\/span><\/li><li data-term='导数'>导数 — 差商的极限，几何上是切线斜率，物理上是瞬时变化率 <span class=glossary-ref>（第 8 章：微积分）<\/span><\/li><li data-term='牛顿-莱布尼茨公式'>牛顿-莱布尼茨公式 — 定积分等于原函数在端点的差，把求面积降级为找原函数 <span class=glossary-ref>（第 8 章：微积分）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：问题驱动扩张<\/h2>\n<p>柯朗讲每一个新结构，都先把&quot;旧结构不够用&quot;的具体场景摆出来，再引入新定义。数系是全书的原型：自然数不够度量，所以有分数；分数不够表示对角线，所以有无理数；实数不够解方程，所以有复数。这个顺序在几何（欧氏到射影到拓扑）和微积分（有限和到极限）里反复出现。<\/p>\n<p>用法：遇到一个陌生定义时，先问&quot;它解决的是哪个算不下去的场景&quot;。答不上来，说明还没读懂。<\/p>\n<h2>框架：变换与不变量<\/h2>\n<p>判断一个命题属于哪门几何，看它在哪类变换下还成立。长度只在刚体运动下不变，交比在射影变换下不变，洞数在任意连续变形下不变。这个框架能把四门几何排成一条链。<\/p>\n<p>用法：拿到一个命题，先用最宽松的变换去试。如果它在连续变形下仍成立，那是拓扑命题，可以用更粗的工具；如果只在刚体运动下成立，就得用度量。<\/p>\n<h2>框架：先存在再定位<\/h2>\n<p>极值问题是这个框架最清楚的展示，但它的适用范围更广。任何&quot;找最优&quot;的问题，先得说清最优解在不在，再谈怎么找。变分法、微分方程解的存在性、概率里的期望存在性都遵循同一条纪律。<\/p>\n<p>用法：动手算之前先问&quot;候选集合是不是紧的&quot;。不是的话，先改提法或加约束。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n要证&quot;对所有自然数成立&quot;→ 归纳法；要证&quot;存在某个数&quot;→ 构造或反证。\n<\/li><li>\n要证&quot;不可能&quot;→ 找不变量或代数次数，不要试图穷举失败原因。\n<\/li><li>\n要求极限 → 先看单调性与有界性，不行再用定义硬算，最后考虑夹逼。\n<\/li><li>\n要判断两个图形是否相同 → 先试连续变形，再看洞数，最后才用量度。\n<\/li><li>\n要求极值 → 先查紧致性，再用驻点或不等式，最后验证全局。\n<\/ul>\n<h2>反模式<\/h2>\n<p><strong>拿特例当证明。<\/strong> 验了 n=1、2、3 就宣布公式成立，是最常见的错误。柯朗在讲归纳法时专门拆解了这种想法。<\/p>\n<p><strong>先算后证存在。<\/strong> 对着一个不存在的最优解做半天推导，历史上等周问题和狄利克雷原理都栽在这上面。<\/p>\n<p><strong>把记号当运算。<\/strong> <code>dy/dx<\/code> 看着像分数，实际是记号。把它当分数随意约分，会在高阶情形出错。<\/p>\n<p><strong>用直观代替定义。<\/strong> &quot;连续就是一笔画&quot;这类说法在初等情形够用，一旦遇到处处连续处处不可导的函数就失灵。定义是判据，直观是向导，两者不能互换。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式与规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>等差级数求和<\/td><td><code>n·a + d·n(n−1)/2<\/code><\/td><\/tr><tr><td>等比级数求和<\/td><td><code>a(qⁿ−1)/(q−1)<\/code>，q≠1<\/td><\/tr><tr><td>前 n 项平方和<\/td><td><code>n(n+1)(2n+1)/6<\/code><\/td><\/tr><tr><td>二项式系数递推<\/td><td><code>C(n,k)=C(n−1,k−1)+C(n−1,k)<\/code><\/td><\/tr><tr><td>最大公因数<\/td><td><code>gcd(a,b)=gcd(b, a mod b)<\/code><\/td><\/tr><tr><td>费马小定理<\/td><td>p 素、p∤a 时 <code>a^(p−1) ≡ 1 (mod p)<\/code><\/td><\/tr><tr><td>欧拉公式<\/td><td>简单多面体 <code>V−E+F=2<\/code><\/td><\/tr><tr><td>欧拉示性数与亏格<\/td><td>可定向闭曲面 <code>χ=2−2g<\/code><\/td><\/tr><tr><td>交比<\/td><td><code>(A,B;C,D)=(AC/BC)/(AD/BD)<\/code><\/td><\/tr><tr><td>棣莫弗公式<\/td><td><code>(cosθ+i sinθ)ⁿ=cos nθ+i sin nθ<\/code><\/td><\/tr><tr><td>均值不等式<\/td><td><code>(a+b)/2 ≥ √(ab)<\/code>，等号 a=b<\/td><\/tr><tr><td>重要极限<\/td><td><code>lim sin x/x = 1<\/code>（x→0，弧度制）<\/td><\/tr><tr><td>欧拉数<\/td><td><code>e = lim(1+1/n)ⁿ ≈ 2.71828<\/code><\/td><\/tr><tr><td>基本定理<\/td><td><code>d/dx ∫ₐˣ f = f(x)<\/code>；<code>∫ₐᵇ f = F(b)−F(a)<\/code><\/td><\/tr><tr><td>指数方程<\/td><td><code>y&#x27;=ky<\/code> 的解 <code>y=Ce^(kt)<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>常用判据<\/h2>\n<table><thead><tr><th>问题<\/th><th>判据<\/th><\/tr><\/thead><tbody><tr><td>正 n 边形可作？<\/td><td>n = 2^k × 互不相同的费马素数之积<\/td><\/tr><tr><td>三次多项式不可约？<\/td><td>无有理根（有理根只可能是常数项因数除以首项因数）<\/td><\/tr><tr><td>数列收敛？<\/td><td>单调 + 有界；或按 ε-N 定义给出 N<\/td><\/tr><tr><td>连续函数有最值？<\/td><td>定义域闭且有界<\/td><\/tr><tr><td>点是极值点？<\/td><td>驻点 + 导数变号（或二阶导符号）<\/td><\/tr><tr><td>两个曲面同胚？<\/td><td>同亏格且同定向性<\/td><\/tr><\/tbody><\/table>\n<h2>三个古希腊难题的失败原因<\/h2>\n<table><thead><tr><th>问题<\/th><th>要求的数<\/th><th>卡在哪<\/th><\/tr><\/thead><tbody><tr><td>倍立方<\/td><td>³√2<\/td><td>次数 3，不是 2 的幂<\/td><\/tr><tr><td>三等分 60°<\/td><td>2cos20°<\/td><td>次数 3，不是 2 的幂<\/td><\/tr><tr><td>正七边形<\/td><td>cos(2π/7)<\/td><td>次数 3，不是 2 的幂<\/td><\/tr><tr><td>化圆为方<\/td><td>√π<\/td><td>π 是超越数，不属于代数数<\/td><\/tr><\/tbody><\/table>\n<h2>四门几何守住的量<\/h2>\n<table><thead><tr><th>几何<\/th><th>变换<\/th><th>不变量<\/th><\/tr><\/thead><tbody><tr><td>欧氏<\/td><td>刚体运动<\/td><td>长度、角度、面积<\/td><\/tr><tr><td>仿射<\/td><td>平移+线性变换<\/td><td>平行、中点、共线<\/td><\/tr><tr><td>射影<\/td><td>中心投影<\/td><td>交比、共线<\/td><\/tr><tr><td>拓扑<\/td><td>任意连续变形<\/td><td>连通性、洞数、定向性<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：自然数与数学归纳法", "href": "#/chapter/ch01"}, {"label": "第 2 章：数学中的数系", "href": "#/chapter/ch02"}, {"label": "第 3 章：几何作图与数域的代数", "href": "#/chapter/ch03"}, {"label": "第 4 章：射影几何、公理体系与非欧几何", "href": "#/chapter/ch04"}, {"label": "第 5 章：拓扑学", "href": "#/chapter/ch05"}, {"label": "第 6 章：函数与极限", "href": "#/chapter/ch06"}, {"label": "第 7 章：极大与极小", "href": "#/chapter/ch07"}, {"label": "第 8 章：微积分", "href": "#/chapter/ch08"}]}, {"label": "概念", "children": [{"label": "数学归纳法", "href": "#/concept/c01"}, {"label": "实数连续统", "href": "#/concept/c02"}, {"label": "数域与尺规代数", "href": "#/concept/c03"}, {"label": "变换群与不变量", "href": "#/concept/c04"}, {"label": "欧拉示性数", "href": "#/concept/c05"}, {"label": "极限", "href": "#/concept/c06"}, {"label": "极值与存在性", "href": "#/concept/c07"}, {"label": "微积分基本定理", "href": "#/concept/c08"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：自然数与数学归纳法", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：数学中的数系", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：几何作图与数域的代数", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：射影几何、公理体系与非欧几何", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：拓扑学", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：函数与极限", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：极大与极小", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：微积分", "href": "#/quiz/ch08"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true, "ch05": true, "ch06": true, "ch07": true, "ch08": true}},"bronstein-handbook":{"manifest": {"slug": "bronstein-handbook", "title": "数学手册", "subtitle": "布龙施泰因第 10 版：从算术到概率的查表路线", "book": {"title": "数学手册（原书第 10 版）", "a
