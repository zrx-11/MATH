: "c05", "title": "泰勒展开与局部近似", "file": "concepts/泰勒展开.md", "chapterIds": ["ch05", "ch06"]}, {"id": "c06", "title": "雅可比行列式与坐标变换", "file": "concepts/雅可比与坐标变换.md", "chapterIds": ["ch06"]}, {"id": "c07", "title": "定解条件与方程类型", "file": "concepts/定解条件与方程类型.md", "chapterIds": ["ch07"]}, {"id": "c08", "title": "贝叶斯更新", "file": "concepts/贝叶斯更新.md", "chapterIds": ["ch08"]}], "glossary": [{"term": "复利终值", "def": "S=P(1+i)ⁿ，本金按复利计息 n 期后的本息合计", "chapterId": "ch01"}, {"term": "年金现值", "def": "每期支付 R 共 n 期，按利率 i 折现到今天的总额", "chapterId": "ch01"}, {"term": "判别式", "def": "二次方程 Δ=b²−4ac，决定实根个数；二次曲线 Δ=B²−4AC 决定类型", "chapterId": "ch01"}, {"term": "双曲函数", "def": "由 eˣ 与 e⁻ˣ 组合定义的函数，满足 cosh²−sinh²=1", "chapterId": "ch02"}, {"term": "半对数坐标", "def": "一个轴取对数、一个轴取线性，用来把指数律画成直线", "chapterId": "ch02"}, {"term": "双对数坐标", "def": "两个轴都取对数，用来把幂律画成直线", "chapterId": "ch02"}, {"term": "海伦公式", "def": "由三边直接算三角形面积：S=√(p(p−a)(p−b)(p−c))，p 为半周长", "chapterId": "ch03"}, {"term": "球面三角", "def": "球面上以球心角表示的边与角构成的三角形，满足球面余弦定理", "chapterId": "ch03"}, {"term": "点积", "def": "a·b=|a||b|cosθ，结果是一个数，用来算夹角与投影", "chapterId": "ch03"}, {"term": "叉积", "def": "a×b，方向垂直两者，模等于张成平行四边形面积", "chapterId": "ch03"}, {"term": "高斯曲率", "def": "两个主曲率之积 K=κ₁κ₂，是曲面的内蕴量", "chapterId": "ch03"}, {"term": "行列式", "def": "方阵对应的一个数，其绝对值是变换对面积或体积的缩放倍数", "chapterId": "ch04"}, {"term": "秩", "def": "矩阵所含线性无关行或列的个数，决定方程组解的结构", "chapterId": "ch04"}, {"term": "特征值", "def": "使 Av=λv 有非零解 v 的数 λ", "chapterId": "ch04"}, {"term": "四元数", "def": "形如 a+bi+cj+dk 的数，乘法不交换，用于表示三维旋转", "chapterId": "ch04"}, {"term": "偏导数", "def": "把其余变量视为常数时对某一变量的导数", "chapterId": "ch05"}, {"term": "梯度", "def": "各偏导组成的向量，指向函数增长最快的方向", "chapterId": "ch05"}, {"term": "方向导数", "def": "函数沿某单位方向的瞬时变化率，等于梯度在该方向的投影", "chapterId": "ch05"}, {"term": "隐函数定理", "def": "若 F_y≠0，则方程 F(x,y)=0 在局部可解出 y=y(x)", "chapterId": "ch05"}, {"term": "比值判据", "def": "若 lim a(n+1)/a(n)<1 则正项级数收敛，>1 则发散", "chapterId": "ch06"}, {"term": "傅里叶级数", "def": "把周期函数展开成不同频率正弦余弦之和", "chapterId": "ch06"}, {"term": "雅可比行列式", "def": "坐标变换偏导组成的行列式，其绝对值是面积或体积元的缩放倍数", "chapterId": "ch06"}, {"term": "积分因子", "def": "乘以它可把一阶线性方程左边化为一个乘积的导数", "chapterId": "ch07"}, {"term": "特征根", "def": "二阶常系数线性方程对应的二次方程的根，三种情形决定解的形式", "chapterId": "ch07"}, {"term": "分离变量法", "def": "设 u=X(x)T(t) 把偏微分方程拆成若干常微分方程的方法", "chapterId": "ch07"}, {"term": "条件概率", "def": "在已知 B 发生的条件下 A 发生的概率，P(A|B)=P(A∩B)/P(B)", "chapterId": "ch08"}, {"term": "全概率公式", "def": "P(A)=ΣP(A|Bᵢ)P(Bᵢ)，Bᵢ 构成完备事件组", "chapterId": "ch08"}, {"term": "中心极限定理", "def": "大量独立同分布随机变量之和近似正态分布", "chapterId": "ch08"}, {"term": "置信区间", "def": "由样本构造的区间，反复抽样时约有一定比例的区间包含真值", "chapterId": "ch08"}, {"term": "无偏估计", "def": "期望等于被估计参数的估计量", "chapterId": "ch08"}, {"term": "第一类错误", "def": "原假设为真却被拒绝，概率为显著性水平 α", "chapterId": "ch08"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "companion": "bronstein-handbook学习伴侣.html", "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "前 n 项立方和等于？", "options": ["n(n+1)/2", "[n(n+1)/2]²", "n(n+1)(2n+1)/6", "n²(n+1)²/4"], "answer": 1, "explain": "前 n 项立方和等于前 n 项和的平方。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "blank", "question": "本金 1000 元，年利率 10%，按年复利 2 年后的终值是多少元？（填整数）", "options": [], "answer": "1210", "explain": "1000×1.1²=1000×1.21=1210。"}, {"id": "ch02-q01", "chapterId": "ch02", "type": "single", "question": "y=ae^(bx) 的数据在哪种坐标下呈直线？", "options": ["普通直角坐标", "半对数坐标", "双对数坐标", "极坐标"], "answer": 1, "explain": "取对数得 lg y=lg a+(b lg e)x，对 x 线性。"}, {"id": "ch02-q02", "chapterId": "ch02", "type": "blank", "question": "双曲函数满足 cosh²x−sinh²x 等于多少？（填数字）", "options": [], "answer": "1", "explain": "把 cosh 与 sinh 用 e 的表达式代入展开相减即得。"}, {"id": "ch03-q01", "chapterId": "ch03", "type": "single", "question": "球面余弦定理比平面版本多出的项是？", "options": ["sin a sin b cos C", "cos a cos b", "tan a tan b", "a²+b²"], "answer": 0, "explain": "cos c = cos a cos b + sin a sin b cos C。"}, {"id": "ch03-q02", "chapterId": "ch03", "type": "blank", "question": "半径为 R 的圆，曲率是多少？（写成 1/R 形式）", "options": [], "answer": "1/r", "explain": "曲率是切线转角对弧长的变化率，圆周转 2π 走过 2πR，比值为 1/R。"}, {"id": "ch04-q01", "chapterId": "ch04", "type": "single", "question": "A 是 3×2 矩阵，B 是 2×4 矩阵，AB 的尺寸是？", "options": ["3×4", "2×2", "4×3", "不能相乘"], "answer": 0, "explain": "内维都为 2，可以相乘，结果取外维 3×4。"}, {"id": "ch04-q02", "chapterId": "ch04", "type": "blank", "question": "矩阵 [[2,1],[1,2]] 的特征值是 3 和多少？（填数字）", "options": [], "answer": "1", "explain": "特征方程 (2−λ)²−1=0，解得 3 与 1。"}, {"id": "ch05-q01", "chapterId": "ch05", "type": "single", "question": "f(x,y)=x²+y² 在 (1,2) 的梯度是？", "options": ["(1,2)", "(2,4)", "(2,2)", "(1,4)"], "answer": 1, "explain": "∂f/∂x=2x=2，∂f/∂y=2y=4。"}, {"id": "ch05-q02", "chapterId": "ch05", "type": "blank", "question": "eˣ 在 0 处展开到 x² 项时，x² 的系数是 1/2!，即 1/（　）。（填数字）", "options": [], "answer": "2", "explain": "二阶项系数为 f''(0)/2!=1/2。"}, {"id": "ch06-q01", "chapterId": "ch06", "type": "single", "question": "Σ1/n² 的敛散性是？", "options": ["发散", "收敛", "条件收敛", "无法判断"], "answer": 1, "explain": "p 级数在 p>1 时收敛，p=2 满足。"}, {"id": "ch06-q02", "chapterId": "ch06", "type": "blank", "question": "极坐标下面积元 dxdy 等于 r dr d（　）。（填一个希腊字母）", "options": [], "answer": "θ", "explain": "极坐标的雅可比为 r，面积元 dxdy = r dr dθ。"}, {"id": "ch07-q01", "chapterId": "ch07", "type": "single", "question": "y''+4y=0 的通解是？", "options": ["C₁e^(2x)+C₂e^(−2x)", "C₁cos2x+C₂sin2x", "(C₁+C₂x)e^(2x)", "C₁cos x+C₂sin x"], "answer": 1, "explain": "特征方程 λ²+4=0 得 λ=±2i，对应 cos2x 与 sin2x。"}, {"id": "ch07-q02", "chapterId": "ch07", "type": "blank", "question": "热传导方程属于哪一型偏微分方程？（填两字）", "options": [], "answer": "抛物", "explain": "判别式 B²−4AC=0，属抛物型。"}, {"id": "ch08-q01", "chapterId": "ch08", "type": "single", "question": "从 5 人中选 2 人不考虑顺序，有多少种选法？", "options": ["20", "10", "5", "25"], "answer": 1, "explain": "C(5,2)=5×4/2=10。"}, {"id": "ch08-q02", "chapterId": "ch08", "type": "blank", "question": "泊松分布的期望与方差都等于哪个参数？（填一个希腊字母）", "options": [], "answer": "λ", "explain": "泊松分布 P(λ) 的期望和方差都是 λ。"}, {"id": "q01", "chapterId": "__all", "type": "single", "question": "下列哪一组公式属于同一件事的离散与连续两个版本？", "options": ["复利与年金", "级数求和与定积分", "正弦定理与余弦定理", "均值不等式与柯西不等式"], "answer": 1, "explain": "级数是离散求和，定积分是连续求和的极限，判据与技巧一一对应。"}, {"id": "q02", "chapterId": "__all", "type": "single", "question": "用不到雅可比行列式的情形是？", "options": ["极坐标下算二重积分", "球坐标下算三重积分", "普通直角坐标下的二重积分", "曲面参数化后算面积"], "answer": 2, "explain": "直角坐标到自身是恒等变换，雅可比为 1，不需要额外因子。"}, {"id": "q03", "chapterId": "__all", "type": "blank", "question": "二阶常系数线性方程需要几个初始条件才能定出唯一解？（填数字）", "options": [], "answer": "2", "explain": "二阶方程通解含两个独立常数，需要两条独立初始信息。"}], "flashcards": [{"id": "ch01-f01", "chapterId": "ch01", "front": "复利终值公式怎么写？", "back": "S=P(1+i)ⁿ", "tags": ["代数"]}, {"id": "ch01-f02", "chapterId": "ch01", "front": "等差与等比求和各一条公式", "back": "等差 n(a₁+aₙ)/2；等比 a₁(1−qⁿ)/(1−q)", "tags": ["代数"]}, {"id": "ch01-f03", "chapterId": "ch01", "front": "五次方程为什么不能根式解？", "back": "阿贝尔-鲁菲尼定理证明一般五次及以上方程没有根式解，但有数值解", "tags": ["代数"]}, {"id": "ch01-f04", "chapterId": "ch01", "front": "分式方程为什么必须验根？", "back": "去分母时乘以了可能为零的式子，会产生增根", "tags": ["代数"]}, {"id": "ch01-f05", "chapterId": "ch01", "front": "复数除法怎么算？", "back": "分子分母同乘分母的共轭，分母变成 c²+d²", "tags": ["代数"]}, {"id": "ch02-f01", "chapterId": "ch02", "front": "幂律在什么坐标下是直线？", "back": "双对数坐标，斜率就是指数", "tags": ["函数"]}, {"id": "ch02-f02", "chapterId": "ch02", "front": "arcsin 和 1/sin 有什么区别？", "back": "前者是反函数，后者是倒数，两者完全不同", "tags": ["函数"]}, {"id": "ch02-f03", "chapterId": "ch02", "front": "摆线的参数方程？", "back": "x=a(t−sin t)，y=a(1−cos t)", "tags": ["函数"]}, {"id": "ch02-f04", "chapterId": "ch02", "front": "悬链线的方程形式？", "back": "y=a cosh(x/a)", "tags": ["函数"]}, {"id": "ch02-f05", "chapterId": "ch02", "front": "算图法的原理是什么？", "back": "用三条刻度尺的连线读出结果，本质是射影对应", "tags": ["函数"]}, {"id": "ch03-f01", "chapterId": "ch03", "front": "正弦定理怎么写？", "back": "a/sin A = b/sin B = c/sin C = 2R", "tags": ["几何"]}, {"id": "ch03-f02", "chapterId": "ch03", "front": "海伦公式？", "back": "S=√(p(p−a)(p−b)(p−c))，p 为半周长", "tags": ["几何"]}, {"id": "ch03-f03", "chapterId": "ch03", "front": "混合积为零说明什么？", "back": "三个向量共面，平行六面体体积为零", "tags": ["几何"]}, {"id": "ch03-f04", "chapterId": "ch03", "front": "高斯曲率为什么决定能否摊平？", "back": "它是内蕴量，等距变形不能改变它，非零则无法等距映射到平面", "tags": ["几何"]}, {"id": "ch03-f05", "chapterId": "ch03", "front": "二次曲线怎么分类？", "back": "看判别式 B²−4AC：小于零椭圆，等于零抛物线，大于零双曲线", "tags": ["几何"]}, {"id": "ch04-f01", "chapterId": "ch04", "front": "矩阵乘法什么时候能做？", "back": "左矩阵列数等于右矩阵行数，结果取外维", "tags": ["矩阵"]}, {"id": "ch04-f02", "chapterId": "ch04", "front": "行列式为零意味着什么？", "back": "矩阵不可逆，变换把空间压到低维，信息丢失", "tags": ["矩阵"]}, {"id": "ch04-f03", "chapterId": "ch04", "front": "方程组三种解情形怎么判断？", "back": "比较 rank(A) 与 rank([A|b]) 及未知数个数", "tags": ["矩阵"]}, {"id": "ch04-f04", "chapterId": "ch04", "front": "实对称矩阵的特征向量有什么性质？", "back": "特征值全实，特征向量互相正交，可正交对角化", "tags": ["矩阵"]}, {"id": "ch04-f05", "chapterId": "ch04", "front": "四元数适合表示什么？", "back": "三维旋转，优点是无万向锁、可平滑插值", "tags": ["矩阵"]}, {"id": "ch05-f01", "chapterId": "ch05", "front": "梯度的两个性质？", "back": "方向是最快增长方向，模是最大变化率", "tags": ["微分"]}, {"id": "ch05-f02", "chapterId": "ch05", "front": "方向导数怎么写？", "back": "∂f/∂l=∇f·l，l 为单位向量", "tags": ["微分"]}, {"id": "ch05-f03", "chapterId": "ch05", "front": "多元极值的二阶判别式？", "back": "Δ=AC−B²，A=f_xx，C=f_yy，B=f_xy；Δ>0 且 A>0 为极小，Δ<0 为鞍点", "tags": ["微分"]}, {"id": "ch05-f04", "chapterId": "ch05", "front": "隐函数求导公式？", "back": "dy/dx=−F_x/F_y，条件是 F_y≠0", "tags": ["微分"]}, {"id": "ch05-f05", "chapterId": "ch05", "front": "泰勒展开的余项有什么用？", "back": "给出误差上界，决定取几阶才能达到要求精度", "tags": ["微分"]}, {"id": "ch06-f01", "chapterId": "ch06", "front": "比值判据怎么用？", "back": "lim a(n+1)/a(n)<1 收敛，>1 发散，=1 失效", "tags": ["积分"]}, {"id": "ch06-f02", "chapterId": "ch06", "front": "调和级数收敛吗？", "back": "发散，它说明通项趋于零不保证收敛", "tags": ["积分"]}, {"id": "ch06-f03", "chapterId": "ch06", "front": "分部积分公式？", "back": "∫u dv=uv−∫v du", "tags": ["积分"]}, {"id": "ch06-f04", "chapterId": "ch06", "front": "球坐标的体积元？", "back": "ρ²sinφ dρ dφ dθ", "tags": ["积分"]}, {"id": "ch06-f05", "chapterId": "ch06", "front": "傅里叶系数怎么算？", "back": "aₙ=(1/π)∫f cos nx dx，bₙ=(1/π)∫f sin nx dx", "tags": ["积分"]}, {"id": "ch07-f01", "chapterId": "ch07", "front": "一阶线性方程的积分因子？", "back": "e^(∫Pdx)，乘上后左边变成 (y e^(∫Pdx))'", "tags": ["方程"]}, {"id": "ch07-f02", "chapterId": "ch07", "front": "二阶常系数方程三种特征根对应什么？", "back": "相异实根、重根、共轭复根，对应过阻尼、临界、欠阻尼", "tags": ["方程"]}, {"id": "ch07-f03", "chapterId": "ch07", "front": "PDE 三类怎么分？", "back": "按 B²−4AC：小于零椭圆，等于零抛物，大于零双曲", "tags": ["方程"]}, {"id": "ch07-f04", "chapterId": "ch07", "front": "分离变量法的核心动作？", "back": "设 u=X(x)T(t)，把 PDE 拆成两个 ODE", "tags": ["方程"]}, {"id": "ch07-f05", "chapterId": "ch07", "front": "为什么椭圆型方程不需要初始条件？", "back": "它描述稳态，没有时间方向，只需边界条件", "tags": ["方程"]}, {"id": "ch08-f01", "chapterId": "ch08", "front": "贝叶斯公式？", "back": "P(B|A)=P(A|B)P(B)/P(A)", "tags": ["概率"]}, {"id": "ch08-f02", "chapterId": "ch08", "front": "样本方差为什么除以 n−1？", "back": "除以 n 会系统性低估总体方差，n−1 才是无偏估计", "tags": ["概率"]}, {"id": "ch08-f03", "chapterId": "ch08", "front": "95% 置信区间的正确解释？", "back": "反复抽样构造的区间中约 95% 包含真值，不是单个区间有 95% 概率包含真值", "tags": ["概率"]}, {"id": "ch08-f04", "chapterId": "ch08", "front": "中心极限定理说什么？", "back": "大量独立同分布随机变量之和近似正态，是统计推断的基础", "tags": ["概率"]}, {"id": "ch08-f05", "chapterId": "ch08", "front": "两类错误各是什么？", "back": "第一类：H₀ 真却拒绝，概率 α；第二类：H₀ 假却不拒绝，概率 β", "tags": ["概率"]}]}, "rendered": {"ch01": "<h1>第 1 章：算术与初等代数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：初中代数\n<\/li><li>\n<strong>对应原书<\/strong>：第 1 章「算术」§1.1—§1.6（原书 p30—89）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n认出五条基本运算律在代数式变形中的位置，说明哪一步用了哪条。\n<\/li><li>\n用等比级数公式手算复利、年金和折旧，不必逐期累加。\n<\/li><li>\n在不等式、复数、代数方程三类问题中选对工具，知道每一类在手册里查哪一节。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>手册的第一章不是&quot;复习小学算术&quot;，而是把初等运算整理成可以查的规则表：运算律、级数公式、复利公式、不等式解法、复数运算、方程求根。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：运算律与代数式（难度：基础）<\/h3>\n<p><strong>代数式<\/strong>是用字母和数通过加减乘除与乘方组成的表达式。手册把整有理式、有理式、无理式分开处理，因为它们允许的变形不同：整有理式可以随意展开合并，有理式要先定定义域（分母不为零），无理式要检查根号下的符号。<\/p>\n<p><strong>类比<\/strong>：三类式子像三种材料。整式是木头，随便锯；分式是带接缝的板，得避开接缝；根式是受力的构件，得先算强度。失效边界：这个类比只说明限制从哪来，不说明具体限制是什么，限制要看每节的规则。<\/p>\n<h3>概念：有限级数（难度：基础）<\/h3>\n<p>手册列了三类常用求和：<\/p>\n<ul><li>\n等差：<code>Σ = n(a₁+aₙ)/2<\/code>\n<\/li><li>\n等比：<code>Σ = a₁(1−qⁿ)/(1−q)<\/code>，q≠1\n<\/li><li>\n特殊有限级数：<code>Σk = n(n+1)/2<\/code>，<code>Σk² = n(n+1)(2n+1)/6<\/code>，<code>Σk³ = [n(n+1)/2]²<\/code>\n<\/ul>\n<p>最后一组值得记，因为它在积分和数值分析里反复出现。<\/p>\n<h3>概念：商业数学（难度：基础）<\/h3>\n<p>手册专门用一节讲利息、复利、分期付款、年金、折旧。这些公式是同一件事的不同侧面：<\/p>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>单利<\/td><td><code>I = P·i·n<\/code><\/td><\/tr><tr><td>复利终值<\/td><td><code>S = P(1+i)ⁿ<\/code><\/td><\/tr><tr><td>复利现值<\/td><td><code>P = S/(1+i)ⁿ<\/code><\/td><\/tr><tr><td>年金终值<\/td><td><code>S = R[(1+i)ⁿ−1]/i<\/code><\/td><\/tr><tr><td>年金现值<\/td><td><code>P = R[1−(1+i)⁻ⁿ]/i<\/code><\/td><\/tr><\/tbody><\/table>\n<p>其中 P 是本金或现值，S 是终值，i 是每期利率，n 是期数，R 是每期支付额。<\/p>\n<p><strong>实例<\/strong>：本金 10000 元，年利率 5%，按年复利存 10 年。<code>S = 10000 × 1.05^10<\/code>。1.05^10 ≈ 1.628895，所以 S ≈ 16288.95 元。若按单利只有 15000 元，差额就是复利的效果。<\/p>\n<h3>概念：不等式（难度：基础）<\/h3>\n<p>手册把不等式分成纯不等式（对一切实数成立，如 <code>a²+b² ≥ 2ab<\/code>）和条件不等式（在特定范围成立）。解线性不等式要注意除以负数时不等号翻转，解二次不等式则先求根再定区间符号。<\/p>\n<p>常用不等式值得抄进速查表：均值不等式、柯西不等式 <code>(Σaᵢbᵢ)² ≤ (Σaᵢ²)(Σbᵢ²)<\/code>、三角不等式。<\/p>\n<h3>概念：复数（难度：进阶）<\/h3>\n<p>复数写成 <code>z = a + bi<\/code>，几何上是平面上的点。手册给出的核心运算：<\/p>\n<ul><li>\n加减：实部虚部分别相加减。\n<\/li><li>\n乘除：用 <code>i²=−1<\/code> 展开；除法要乘共轭 <code>(a+bi)/(c+di) = (a+bi)(c−di)/(c²+d²)<\/code>。\n<\/li><li>\n三角形式：<code>z = r(cosφ + i sinφ)<\/code>，乘除变成模相乘除、角相加减。\n<\/ul>\n<p><code>r = √(a²+b²)<\/code> 叫模，<code>φ<\/code> 叫辐角。这套形式让 <code>zⁿ<\/code> 的计算变成 <code>rⁿ(cos nφ + i sin nφ)<\/code>。<\/p>\n<h3>概念：代数方程与超越方程（难度：进阶）<\/h3>\n<p>手册按次数分档：一次、二次（求根公式）、三次（卡尔达诺公式）、四次（费拉里法），并明确说五次及以上一般不能用根式解（阿贝尔-鲁菲尼定理）。<\/p>\n<p><strong>超越方程<\/strong>指含指数、对数、三角函数的方程，一般没有公式解，用手册给的方法：图解法找近似根、迭代法、牛顿法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[表达式] --&gt; B[整有理式 展开合并]\n    A --&gt; C[有理式 先定定义域]\n    A --&gt; D[无理式 先查根号符号]\n    B --&gt; E[方程]\n    C --&gt; E\n    D --&gt; E\n    E --&gt; F[代数方程 次数定方法]\n    E --&gt; G[超越方程 图解或迭代]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是变形前的分类，右边是求解路径。分类做错，后面的变形会出错，尤其是分式和根式。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：手册第一章像工具箱的第一层抽屉，里面全是常用扳手。用得最多的是运算律和几个级数公式，其余按需取。失效边界：工具箱只给工具，不给判断，选错工具照样拧不动。<\/p>\n<p><strong>实例<\/strong>：解 <code>x² − 5x + 6 = 0<\/code>。判别式 <code>Δ = 25 − 24 = 1<\/code>，根为 <code>(5±1)/2<\/code>，即 x=3 或 x=2。检验：3+2=5，3×2=6，符合韦达定理。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为复利和单利的差别只是算法不同<\/strong>——长期看差别是量级的，10 年 5% 的差距就有 1289 元。\n<\/li><li>\n<strong>别以为分式可以随便约<\/strong>——约分要先保证约掉的因子不为零，否则定义域变了。\n<\/li><li>\n<strong>别以为五次方程没有解<\/strong>——它有解，只是不能用根式写出。数值解照样能算到任意精度。\n<\/li><li>\n<strong>别以为手册里的公式都要背<\/strong>——手册的用法是查，不是背。要知道&quot;该查哪一节&quot;。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：<code>Σk³<\/code>（k 从 1 到 n）等于（　）。\n<ul>\n<li>\nA. <code>n(n+1)/2<\/code>\n<\/li><li>\nB. <code>[n(n+1)/2]²<\/code>\n<\/li><li>\nC. <code>n(n+1)(2n+1)/6<\/code>\n<\/li><li>\nD. <code>n²(n+1)²/4<\/code>\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：前 n 项立方和等于前 n 项和的平方，这是手册特殊有限级数一节的结论。<\/p>\n<ol><li>\n<strong>填空<\/strong>：本金 1000 元，年利率 10%，按年复利 2 年后的终值是多少元？（填数字）\n<\/ol>\n<p><strong>答案：1210<\/strong>。解析：<code>1000 × 1.1² = 1000 × 1.21 = 1210<\/code>。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么解分式方程时必须检验增根？\n<\/ol>\n<p><strong>答案要点<\/strong>：去分母时乘以了含未知数的式子，若该式在某解处为零，则原方程在这一解处无定义。乘出来的解可能来自这个零点，所以必须代回原方程检验，排除使分母为零的值。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n三类式子（整式、分式、根式）的变形限制不同，先分类再动手。\n<\/li><li>\n复利、年金、折旧是同一组公式的不同变形，记住现值与终值两条主线即可。\n<\/li><li>\n五次以上方程有解但不能用根式表达，求数值解走迭代法。\n<\/ul>", "ch02": "<h1>第 2 章：函数与初等函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 2 章「函数」§2.1—§2.19（原书 p90—196）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出函数的定义方式有哪几种，为什么表格、图像、公式都算函数。\n<\/li><li>\n在幂函数、指数函数、对数函数、三角函数、双曲函数中按图像特征快速辨认。\n<\/li><li>\n认出摆线、螺线、三阶曲线、四阶曲线的方程形式，说出它们各自出现在什么物理场景。\n<\/li><li>\n用对数坐标纸判断一组数据是否服从幂律或指数律。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>手册的函数章不是讲函数论，而是给出一张&quot;曲线与公式的对照表&quot;，让你看到一个形状就能找到方程，看到一个方程就能画出形状。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：函数的定义与表示（难度：基础）<\/h3>\n<p>函数是定义域到值域的对应。手册列了三种定义方式：公式、表格、图像。三者可以互相转换，各有适用场景。公式适合计算，表格适合实验数据，图像适合看趋势。<\/p>\n<p><strong>复合函数<\/strong>和<strong>反函数<\/strong>是两台加工机器。复合是串联，反函数是把输出接回输入。反函数存在的条件是原函数一一对应，否则会&quot;一个输出对应多个输入&quot;。<\/p>\n<h3>概念：初等函数的家族（难度：基础）<\/h3>\n<p>手册按族介绍，每族给方程、定义域、值域、图像特征：<\/p>\n<table><thead><tr><th>族<\/th><th>形式<\/th><th>关键特征<\/th><\/tr><\/thead><tbody><tr><td>幂函数<\/td><td><code>y = xⁿ<\/code><\/td><td>过 (1,1)；n 为偶数时关于 y 轴对称<\/td><\/tr><tr><td>多项式<\/td><td><code>a₀+a₁x+…+aₙxⁿ<\/code><\/td><td>次数决定端点行为<\/td><\/tr><tr><td>有理函数<\/td><td><code>P(x)/Q(x)<\/code><\/td><td>分母零点处有垂直渐近线<\/td><\/tr><tr><td>指数函数<\/td><td><code>y = aˣ<\/code><\/td><td>恒过 (0,1)；a&gt;1 递增<\/td><\/tr><tr><td>对数函数<\/td><td><code>y = log_a x<\/code><\/td><td>恒过 (1,0)；是指数的反函数<\/td><\/tr><tr><td>三角函数<\/td><td><code>sin, cos, tan<\/code><\/td><td>周期 2π（tan 为 π）<\/td><\/tr><tr><td>反三角函数<\/td><td><code>arcsin, arccos, arctan<\/code><\/td><td>定义域受限，取主值<\/td><\/tr><tr><td>双曲函数<\/td><td><code>sinh, cosh, tanh<\/code><\/td><td>由 eˣ 与 e⁻ˣ 组合而成<\/td><\/tr><\/tbody><\/table>\n<p><strong>双曲函数<\/strong>值得单独记：<code>cosh²x − sinh²x = 1<\/code>，它和三角函数的关系是&quot;差一个负号&quot;（圆是 <code>cos²+sin²=1<\/code>，双曲线是 <code>cosh²−sinh²=1<\/code>）。悬链线的方程就是 <code>y = a cosh(x/a)<\/code>。<\/p>\n<h3>概念：特殊曲线（难度：进阶）<\/h3>\n<p>手册用了好几节讲&quot;不常出现在课本里但工程上常见&quot;的曲线：<\/p>\n<ul><li>\n<strong>摆线<\/strong>：圆在直线上滚动时圆周上一点的轨迹，参数方程 <code>x = a(t−sin t)<\/code>，<code>y = a(1−cos t)<\/code>。它是最速降线问题的解，也是摆钟的等时曲线。\n<\/li><li>\n<strong>螺线<\/strong>：阿基米德螺线 <code>r = aθ<\/code>，等角螺线 <code>r = ae^(bθ)<\/code>。后者在缩放后与自己相似，鹦鹉螺的壳就是这个形状。\n<\/li><li>\n<strong>三阶曲线<\/strong>：如 <code>y² = x³ + ax + b<\/code>（椭圆曲线），它在密码学里是主角。\n<\/li><li>\n<strong>四阶曲线<\/strong>：如卡西尼卵形线、双纽线，用于描述某些场的等势线。\n<\/ul>\n<p><strong>类比<\/strong>：这些曲线像方言。标准课本讲普通话（多项式、三角），手册把方言也收录进来，因为工程问题里它们真的会出现。失效边界：方言词表不能替代语法，要看懂曲线的性质还得回到参数方程和导数。<\/p>\n<h3>概念：经验曲线的确定与坐标纸（难度：进阶）<\/h3>\n<p>实验给出若干数据点，要判断它们服从什么规律。手册给的办法是<strong>换坐标<\/strong>：<\/p>\n<ul><li>\n若 <code>y = axᵇ<\/code>（幂律），取 <code>lg y<\/code> 对 <code>lg x<\/code> 作图，得到直线，斜率是 b。\n<\/li><li>\n若 <code>y = ae^(bx)<\/code>（指数律），取 <code>lg y<\/code> 对 x 作图，得到直线，斜率是 <code>b lg e<\/code>。\n<\/ul>\n<p>这是对数坐标纸的用途：把曲线&quot;拉直&quot;，再用直线拟合。<\/p>\n<p><strong>实例<\/strong>：某组数据在双对数纸上呈直线且斜率为 −2，则规律是 <code>y = ax⁻²<\/code>，即平方反比律。万有引力、点电荷的库仑力都符合这个形式。<\/p>\n<h3>概念：多元函数与算图法（难度：进阶）<\/h3>\n<p>多元函数的图像是曲面，等值线是它的等高线。手册还介绍了<strong>算图法<\/strong>（nomography）：用三根刻度尺的连线读出计算结果，是计算器普及之前的工程计算工具。现在少用，但它的几何原理（射影对应）仍值得看。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[函数族] --&gt; B[代数函数 幂 多项式 有理 无理]\n    A --&gt; C[超越函数 指数 对数 三角 双曲]\n    B --&gt; D[曲线形状与渐近线]\n    C --&gt; D\n    D --&gt; E[特殊曲线 摆线 螺线 三次四次曲线]\n    E --&gt; F[工程与物理场景]\n    A --&gt; G[数据拟合 换坐标拉直]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半部分是&quot;从公式到形状&quot;，下半部分是&quot;从数据到公式&quot;。手册的两大用途正好对应这两条路。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：函数家族像乐器。每种乐器有自己的音域（定义域）和音色（图像特征），听一段就知道是哪种。失效边界：乐器不能互相替换，函数可以复合，复合后的行为可能超出任何单一族的特征。<\/p>\n<p><strong>实例<\/strong>：判断 <code>y = 3 · 2^(0.5x)<\/code> 的增长速度。写成 <code>y = 3e^(0.5 ln2 · x)<\/code>，<code>0.5 ln2 ≈ 0.3466<\/code>，即以约 34.66% 的连续增长率增长。每增加 2 个单位 x，y 翻一倍（因为 <code>2^(0.5×2)=2<\/code>）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为函数必须有解析式<\/strong>——分段函数、查表函数、实验曲线都是函数，只要满足&quot;一个输入一个输出&quot;。\n<\/li><li>\n<strong>别以为 <code>arcsin<\/code> 和 <code>1/sin<\/code> 是一回事<\/strong>——前者是反函数，后者是倒数，两者完全不同。\n<\/li><li>\n<strong>别以为双曲函数是&quot;双曲线上的三角函数&quot;<\/strong>——它们由指数组合定义，和双曲线的关系是类比而非定义。\n<\/li><li>\n<strong>别以为对数纸只能画对数<\/strong>——它把乘除变加减，任何幂律或指数律都能在上面变成直线。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：<code>y = ae^(bx)<\/code> 的数据在什么坐标下呈直线？（　）\n<ul>\n<li>\nA. 普通直角坐标\n<\/li><li>\nB. 半对数坐标（lg y 对 x）\n<\/li><li>\nC. 双对数坐标\n<\/li><li>\nD. 极坐标\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：取对数得 <code>lg y = lg a + (b lg e)x<\/code>，对 x 是线性的，所以在半对数纸上成直线。<\/p>\n<ol><li>\n<strong>填空<\/strong>：双曲函数满足的基本恒等式是 <code>cosh²x − sinh²x =<\/code>（　）。\n<\/ol>\n<p><strong>答案：1<\/strong>。解析：由 <code>cosh x=(eˣ+e⁻ˣ)/2<\/code>、<code>sinh x=(eˣ−e⁻ˣ)/2<\/code> 展开相减即得。<\/p>\n<ol><li>\n<strong>简答<\/strong>：摆线的参数方程是什么，它为什么出现在最速降线问题里？\n<\/ol>\n<p><strong>答案要点<\/strong>：<code>x=a(t−sin t)<\/code>，<code>y=a(1−cos t)<\/code>。小球在重力下从一点滑到另一点，最快的路径不是直线而是倒摆线的一段，因为摆线起始段陡、能迅速获得速度，中段平缓、能保持速度。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n函数的三要素：定义域、对应规则、值域；表示方式有公式、表格、图像三种。\n<\/li><li>\n幂律看双对数纸，指数律看半对数纸，这是数据拟合最快的判断法。\n<\/li><li>\n双曲函数由指数定义，<code>cosh²−sinh²=1<\/code> 是它的身份证。\n<\/ul>", "ch03": "<h1>第 3 章：几何学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 3 章「几何学」§3.1—§3.6（原书 p197—389）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在平面几何、三角、立体几何、球面三角、解析几何、微分几何六个分支之间判断一个问题该用哪套工具。\n<\/li><li>\n写出正弦定理、余弦定理和球面余弦定理，说清球面版本为什么多了个余弦乘积项。\n<\/li><li>\n用向量点积与叉积判断垂直、平行，算出面积和体积。\n<\/li><li>\n写出曲线曲率与挠率的公式，解释它们各描述什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>几何的手册章是一条&quot;维度升级&quot;的路线：平面到空间，直线到曲面，平直到弯曲，每一级都换一套度量。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：平面几何与三角（难度：基础）<\/h3>\n<p>平面几何处理直线、三角形、圆的关系。三角把它代数化，给出两条核心定理：<\/p>\n<ul><li>\n正弦定理：<code>a/sin A = b/sin B = c/sin C = 2R<\/code>（R 是外接圆半径）\n<\/li><li>\n余弦定理：<code>c² = a² + b² − 2ab cos C<\/code>\n<\/ul>\n<p>余弦定理是勾股定理的推广：当 C=90° 时 <code>cos C=0<\/code>，退化成 <code>c²=a²+b²<\/code>。<\/p>\n<p><strong>三角形面积<\/strong>有好几种算法：<code>S = ah/2<\/code>、<code>S = (1/2)ab sin C<\/code>、海伦公式 <code>S = √(p(p−a)(p−b)(p−c))<\/code>，其中 p 是半周长。海伦公式只依赖三边，不需要角，适合测量场景。<\/p>\n<h3>概念：立体几何与球面三角（难度：进阶）<\/h3>\n<p>空间里的多面体有欧拉公式 <code>V−E+F=2<\/code>（第 5 章会再讲）。体积公式按形状分类：棱柱、棱锥、圆柱、圆锥、球、球缺。<\/p>\n<p><strong>球面三角<\/strong>是关键升级。球面上的&quot;直线&quot;是大圆弧，三角形的边是弧长（用角度表示）。它的余弦定理是：<\/p>\n<p><code>cos c = cos a cos b + sin a sin b cos C<\/code><\/p>\n<p>和平面版本的差别在于：平面是 <code>c² = a²+b²−2ab cos C<\/code>，球面多出了 <code>sin a sin b<\/code> 这一项，而且是用余弦而不是平方。当球半径趋于无穷、a、b、c 都很小时，球面公式退化为平面公式。<\/p>\n<p><strong>类比<\/strong>：球面三角像在地球仪上量距离。北京到纽约的最短航线不是纬线而是大圆，因为纬线在球面上不是&quot;直线&quot;。失效边界：这个类比只适用于球面，椭球面上要用地测线，公式更复杂。<\/p>\n<h3>概念：向量代数与解析几何（难度：进阶）<\/h3>\n<p><strong>点积<\/strong> <code>a·b = |a||b|cosθ<\/code> 给出夹角和投影，<strong>叉积<\/strong> <code>a×b<\/code> 给出垂直于两者的向量，模等于平行四边形面积。<\/p>\n<table><thead><tr><th>运算<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>点积为零<\/td><td>两向量垂直<\/td><\/tr><tr><td>叉积为零<\/td><td>两向量平行<\/td><\/tr><tr><td>混合积 <code>(a×b)·c<\/code><\/td><td>平行六面体体积，为零则三向量共面<\/td><\/tr><\/tbody><\/table>\n<p>解析几何把图形翻译成方程：直线 <code>Ax+By+C=0<\/code>，圆 <code>(x−a)²+(y−b)²=r²<\/code>，平面 <code>Ax+By+Cz+D=0<\/code>，球 <code>(x−a)²+(y−b)²+(z−c)²=r²<\/code>。二次曲线用判别式 <code>B²−4AC<\/code> 分类：小于零是椭圆，等于零是抛物线，大于零是双曲线。<\/p>\n<h3>概念：微分几何（难度：高难）<\/h3>\n<p>曲线用弧长参数化后，两个量刻画它的弯曲方式：<\/p>\n<ul><li>\n<strong>曲率<\/strong> <code>κ<\/code>：切线方向转动的速率，<code>κ = |r&#x27;&#x27;(s)|<\/code>。直线的曲率为 0，半径 R 的圆曲率为 1/R。\n<\/li><li>\n<strong>挠率<\/strong> <code>τ<\/code>：曲线偏离平面的程度。平面曲线的挠率为 0。\n<\/ul>\n<p>空间曲线由曲率和挠率唯一确定（在刚体运动意义下），这是曲线论基本定理。<\/p>\n<p>曲面用两个主曲率 <code>κ₁<\/code>、<code>κ₂<\/code> 刻画弯曲，<strong>高斯曲率<\/strong> <code>K = κ₁κ₂<\/code>。高斯绝妙定理说 K 只依赖曲面的度量，不依赖它在空间里怎么弯，这是内蕴几何的起点，后来长成了黎曼几何。<\/p>\n<p><strong>实例<\/strong>：圆柱面的高斯曲率为 0（一个主曲率为 0，另一个为 1/R），所以它能摊平成平面而不撕裂。球面的高斯曲率为 <code>1/R²<\/code>，不能摊平，这就是地图投影必然变形的根本原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[平面几何] --&gt; B[三角 正弦余弦定理]\n    B --&gt; C[立体几何 体积与欧拉公式]\n    C --&gt; D[球面三角 大圆弧]\n    A --&gt; E[向量代数 点积叉积]\n    E --&gt; F[解析几何 方程与判别式]\n    F --&gt; G[微分几何 曲率与挠率]\n    G --&gt; H[高斯曲率 内蕴几何]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边两条支线分别从&quot;形状&quot;和&quot;坐标&quot;出发，在微分几何处汇合。最下面那条是通向现代几何的出口。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：几何分支像不同倍率的镜头。平面几何看局部形状，球面三角看整个球面，微分几何看每一点的弯曲。换镜头等于换问题。失效边界：镜头只能换视角，微分几何还要换度量方式，内蕴和外蕴是两种不同的看法。<\/p>\n<p><strong>实例<\/strong>：求过点 (1,2,3) 且垂直于平面 <code>2x−y+2z=5<\/code> 的直线方程。平面的法向量是 <code>(2,−1,2)<\/code>，直线方向就取它。参数方程：<code>x=1+2t<\/code>，<code>y=2−t<\/code>，<code>z=3+2t<\/code>。<\/p>\n<p><strong>第二个实例<\/strong>：求三角形三边 3、4、5 的面积。用海伦公式，<code>p=(3+4+5)/2=6<\/code>，<code>S=√(6·3·2·1)=√36=6<\/code>。用 <code>(1/2)ab sin C<\/code> 验证：这是直角三角形，<code>S=3×4/2=6<\/code>，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为球面三角只是平面三角的近似<\/strong>——它是另一套精确公式，<code>cos c = cos a cos b + sin a sin b cos C<\/code> 在小范围才退化成平面形式。\n<\/li><li>\n<strong>别以为叉积满足交换律<\/strong>——<code>a×b = −b×a<\/code>，顺序决定方向，这在物理的力矩和洛伦兹力里必须注意。\n<\/li><li>\n<strong>别以为曲率就是&quot;弯得厉害&quot;的模糊描述<\/strong>——它有精确定义 <code>κ=|r&#x27;&#x27;(s)|<\/code>，圆、直线、摆线的曲率都能算出具体值。\n<\/li><li>\n<strong>别以为地图画不准是技术不够<\/strong>——球面高斯曲率非零，任何平面地图都必然在长度、角度或面积上失真，这是定理不是工艺问题。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：球面三角形的余弦定理比平面版本多出的项是（　）。\n<ul>\n<li>\nA. <code>sin a sin b cos C<\/code>\n<\/li><li>\nB. <code>cos a cos b<\/code>\n<\/li><li>\nC. <code>tan a tan b<\/code>\n<\/li><li>\nD. <code>a²+b²<\/code>\n<\/ul>\n<\/ol>\n<p><strong>答案：A<\/strong>。解析：球面余弦定理为 <code>cos c = cos a cos b + sin a sin b cos C<\/code>，多出的正是含正弦乘积的那一项。<\/p>\n<ol><li>\n<strong>填空<\/strong>：半径为 R 的圆，其曲率为（　）。\n<\/ol>\n<p><strong>答案：1/R<\/strong>。解析：曲率是切线方向对弧长的转动率，圆周转一圈 2π 走过 2πR，比值为 1/R。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么圆柱面可以摊平而球面不能？用高斯曲率解释。\n<\/ol>\n<p><strong>答案要点<\/strong>：圆柱面两个主曲率分别是 0 和 1/R，乘积为 0，所以高斯曲率为 0，可以等距映射到平面。球面两个主曲率都是 1/R，乘积为 1/R²，非零。高斯绝妙定理说明高斯曲率是内蕴量，等距变形不能改变它，因此球面无法在不撕裂的前提下摊平。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n正弦定理管边角对应，余弦定理管三边一角，海伦公式只用三边。\n<\/li><li>\n球面三角的公式多出正弦乘积项，小范围时才退化成平面形式。\n<\/li><li>\n高斯曲率是内蕴量，它决定了曲面能不能摊平，也决定了地图为什么必然失真。\n<\/ul>", "ch04": "<h1>第 4 章：线性代数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章（复数）、第 3 章（向量）\n<\/li><li>\n<strong>对应原书<\/strong>：第 4 章「线性代数」§4.1—§4.6（原书 p390—460）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n做矩阵的加减乘和转置，说清乘法为什么要求内维相等。\n<\/li><li>\n用行列式判断矩阵是否可逆，算出 2×2 和 3×3 的行列式。\n<\/li><li>\n用高斯消元解线性方程组，判断无解、唯一解、无穷多解三种情形。\n<\/li><li>\n求矩阵的特征值与特征向量，说明它为什么是振动与主成分分析的核心。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>线性代数把&quot;联立方程&quot;整理成一套矩阵运算，矩阵是变换，行列式是体积缩放因子，特征值是变换不改变方向的那些方向上的缩放倍数。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：矩阵（难度：基础）<\/h3>\n<p><strong>矩阵<\/strong>是数排成的矩形表。<code>m×n<\/code> 矩阵有 m 行 n 列。运算规则：<\/p>\n<ul><li>\n加法：同型矩阵对应元素相加。\n<\/li><li>\n数乘：每个元素乘以该数。\n<\/li><li>\n乘法：<code>(m×n)(n×p) = m×p<\/code>，第 i 行第 j 列元素是左矩阵第 i 行与右矩阵第 j 列的点积。\n<\/ul>\n<p>矩阵乘法不满足交换律：<code>AB ≠ BA<\/code> 一般成立不了。这一点必须记牢，因为物理里的旋转顺序不可交换正源于此。<\/p>\n<p><strong>类比<\/strong>：矩阵像一台加工机器，输入一个向量，输出另一个向量。乘法是两台机器串联。失效边界：机器串联的顺序会影响结果，但矩阵还有更抽象的解释（线性映射），后者在换基下不变。<\/p>\n<h3>概念：行列式（难度：进阶）<\/h3>\n<p><strong>行列式<\/strong>是方阵的一个数。2×2 时 <code>det = ad − bc<\/code>，3×3 用对角线法则展开。<\/p>\n<p>几何意义：行列式的绝对值等于矩阵所代表的线性变换对面积（二维）或体积（三维）的缩放倍数。行列式为零表示变换把平面压成一条线，信息丢失，矩阵不可逆。<\/p>\n<p>性质：交换两行变号；某行乘以 k 则行列式乘以 k；两行成比例则行列式为零。这些性质让行列式的计算可以先化简再展开。<\/p>\n<h3>概念：线性方程组（难度：进阶）<\/h3>\n<p>解 <code>Ax = b<\/code> 的标准办法是<strong>高斯消元<\/strong>：用行变换把系数矩阵化成上三角，再回代。<\/p>\n<p>三种结局对应秩的关系：<\/p>\n<table><thead><tr><th>情形<\/th><th>条件<\/th><th>解的情况<\/th><\/tr><\/thead><tbody><tr><td>唯一解<\/td><td>`rank(A) = rank([A<\/td><td>b]) = n`<\/td><td>一组解<\/td><\/tr><tr><td>无解<\/td><td>`rank(A) &lt; rank([A<\/td><td>b])`<\/td><td>矛盾行出现<\/td><\/tr><tr><td>无穷多解<\/td><td>`rank(A) = rank([A<\/td><td>b]) &lt; n`<\/td><td>有自由变量<\/td><\/tr><\/tbody><\/table>\n<p>克拉默法则给出唯一解时的公式解 <code>xᵢ = det(Aᵢ)/det(A)<\/code>，但计算量大，实际用消元。<\/p>\n<h3>概念：特征值与特征向量（难度：高难）<\/h3>\n<p>若存在非零向量 v 使 <code>Av = λv<\/code>，则 λ 是<strong>特征值<\/strong>，v 是对应的<strong>特征向量<\/strong>。几何含义：矩阵代表的变换在这个方向上只拉伸不转向。<\/p>\n<p>求法：解特征方程 <code>det(A − λI) = 0<\/code>，得到 λ，再代回求 v。<\/p>\n<p><strong>实例<\/strong>：<code>A = [[2,1],[1,2]]<\/code>。特征方程 <code>(2−λ)²−1=0<\/code>，λ=3 或 1。λ=3 时解 <code>−x+y=0<\/code> 得 v=(1,1)；λ=1 时得 v=(1,−1)。这两个方向就是变换的主轴。<\/p>\n<p><strong>为什么重要<\/strong>：振动分析里，特征值是固有频率的平方；主成分分析里，特征向量是数据变异最大的方向；马尔可夫链的稳态分布是特征值 1 对应的特征向量。<\/p>\n<h3>概念：张量与四元数（难度：高难）<\/h3>\n<p><strong>张量<\/strong>是矩阵的推广，用多个指标索引。应力张量、曲率张量、度规张量都是它的例子。手册只给定义与基本运算，深入要查专门的教材。<\/p>\n<p><strong>四元数<\/strong>是 <code>a + bi + cj + dk<\/code> 形式的数，乘法不交换，适合表示三维旋转。它的优点是插值平滑、没有万向锁，所以在图形学和姿态控制里还在用。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[矩阵] --&gt; B[加法 数乘 乘法]\n    A --&gt; C[行列式 可逆性判据]\n    A --&gt; D[线性方程组 高斯消元]\n    D --&gt; E[秩 决定解的结构]\n    A --&gt; F[特征值 特征向量]\n    F --&gt; G[振动 主成分 稳态分布]\n    A --&gt; H[张量与四元数 推广]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是运算，中间是&quot;能不能解方程&quot;，右边是&quot;变换的主方向&quot;。三条线都从矩阵出发，分别服务不同问题。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：矩阵像一张变形网。行列式是网的面积变化倍数，特征向量是拉伸后仍保持方向的那几条线。失效边界：网只能拉伸，矩阵还能旋转和剪切，旋转时没有实特征向量（对应复特征值）。<\/p>\n<p><strong>实例<\/strong>：解方程组 <code>2x+y=5<\/code>，<code>x+3y=10<\/code>。<\/p>\n<p>消元：第二式乘以 2 减去第一式，得 <code>5y=15<\/code>，y=3；回代 <code>2x+3=5<\/code>，x=1。检验：<code>1+9=10<\/code>，成立。<\/p>\n<p>行列式检验：<code>det = 2×3 − 1×1 = 5 ≠ 0<\/code>，所以唯一解，与消元结果一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为矩阵乘法可以交换<\/strong>——<code>AB<\/code> 和 <code>BA<\/code> 一般是两个不同的矩阵，只有特殊情形（如同时对角化）才相等。\n<\/li><li>\n<strong>别以为行列式为零就是&quot;没有解&quot;<\/strong>——行列式为零说明矩阵不可逆，方程组可能无解也可能无穷多解，要看增广矩阵的秩。\n<\/li><li>\n<strong>别以为特征值一定是实数<\/strong>——实矩阵也可能有复特征值，对应旋转型变换，比如平面旋转 90°。\n<\/li><li>\n<strong>别以为四元数只是数学玩具<\/strong>——它是工程上表示姿态的实用工具，卫星和游戏引擎都在用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：<code>A<\/code> 是 3×2 矩阵，<code>B<\/code> 是 2×4 矩阵，<code>AB<\/code> 的尺寸是（　）。\n<ul>\n<li>\nA. 3×4\n<\/li><li>\nB. 2×2\n<\/li><li>\nC. 4×3\n<\/li><li>\nD. 不能相乘\n<\/ul>\n<\/ol>\n<p><strong>答案：A<\/strong>。解析：内维都是 2，可以相乘，结果取外维，即 3×4。<\/p>\n<ol><li>\n<strong>填空<\/strong>：矩阵 <code>[[2,1],[1,2]]<\/code> 的两个特征值分别是 3 和（　）。\n<\/ol>\n<p><strong>答案：1<\/strong>。解析：特征方程 <code>(2−λ)²−1=0<\/code>，解得 λ=3 和 λ=1。<\/p>\n<ol><li>\n<strong>简答<\/strong>：行列式的几何意义是什么，为什么行列式为零意味着矩阵不可逆？\n<\/ol>\n<p><strong>答案要点<\/strong>：行列式的绝对值是线性变换对面积或体积的缩放倍数。行列式为零表示变换把整个空间压到低一维的子空间上，不同的输入被映到同一个输出，映射不是一一对应，因此没有逆映射。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n矩阵乘法要求内维相等，结果取外维，且不满足交换律。\n<\/li><li>\n行列式为零等价于不可逆，但方程组解的情况还要看增广矩阵的秩。\n<\/li><li>\n特征向量是变换不转向的方向，特征值是该方向上的缩放倍数。\n<\/ul>", "ch05": "<h1>第 5 章：微分学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章（函数）、第 3 章（向量）\n<\/li><li>\n<strong>对应原书<\/strong>：第 6 章「微分学」§6.1—§6.2（原书 p610—641）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用导数表加链式法则算复合函数的导数，不依赖死记硬背。\n<\/li><li>\n写出泰勒展开并估计余项，说明它和&quot;用直线近似曲线&quot;的关系。\n<\/li><li>\n算偏导数、梯度和方向导数，说明梯度为什么指向最陡上升方向。\n<\/li><li>\n写出多元函数极值的必要条件与二阶判别式，区分极值点和鞍点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>微分学把&quot;局部&quot;这件事系统化：一点附近，任何光滑函数都能用线性函数近似，高阶信息用二阶项补上。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：一元函数的导数（难度：基础）<\/h3>\n<p>手册给了一张基本导数表，加上四条运算法则：和差、乘积、商、链式。有了这张表和链式法则，几乎所有初等函数的导数都能推出来，不需要一个个记。<\/p>\n<table><thead><tr><th>函数<\/th><th>导数<\/th><\/tr><\/thead><tbody><tr><td><code>xⁿ<\/code><\/td><td><code>n x^(n−1)<\/code><\/td><\/tr><tr><td><code>eˣ<\/code><\/td><td><code>eˣ<\/code><\/td><\/tr><tr><td><code>ln x<\/code><\/td><td><code>1/x<\/code><\/td><\/tr><tr><td><code>sin x<\/code><\/td><td><code>cos x<\/code><\/td><\/tr><tr><td><code>cos x<\/code><\/td><td><code>−sin x<\/code><\/td><\/tr><tr><td><code>tan x<\/code><\/td><td><code>1/cos²x<\/code><\/td><\/tr><tr><td><code>arcsin x<\/code><\/td><td><code>1/√(1−x²)<\/code><\/td><\/tr><tr><td><code>arctan x<\/code><\/td><td><code>1/(1+x²)<\/code><\/td><\/tr><\/tbody><\/table>\n<p><strong>高阶导数<\/strong>是对导数再求导。<code>f&#x27;&#x27;<\/code> 描述凹凸性，<code>f&#x27;&#x27;&#x27;<\/code> 在物理里对应加速度的变化率（加加速度）。<\/p>\n<p><strong>微分<\/strong> <code>dy = f&#x27;(x)dx<\/code> 是导数的线性近似版本。它的用途是误差估计：输入有 Δx 的误差，输出约有 <code>|f&#x27;(x)|Δx<\/code> 的误差。<\/p>\n<h3>概念：泰勒展开（难度：进阶）<\/h3>\n<p><code>f(x) = f(a) + f&#x27;(a)(x−a) + f&#x27;&#x27;(a)(x−a)²/2! + … + f⁽ⁿ⁾(a)(x−a)ⁿ/n! + Rₙ<\/code><\/p>\n<p><strong>余项<\/strong> <code>Rₙ<\/code> 是误差。拉格朗日形式 <code>Rₙ = f⁽ⁿ⁺¹⁾(ξ)(x−a)ⁿ⁺¹/(n+1)!<\/code>，其中 ξ 在 a 与 x 之间。<\/p>\n<p><strong>类比<\/strong>：泰勒展开像&quot;用越来越复杂的尺子量曲线&quot;。一阶是直尺，二阶是抛物线尺，阶数越高越贴合。失效边界：只在展开点附近有效，离得远可能发散，比如 <code>ln(1+x)<\/code> 在 x&gt;1 时展开不收敛。<\/p>\n<p><strong>实例<\/strong>：<code>eˣ ≈ 1 + x + x²/2<\/code>，在 x=0.1 处误差约 <code>x³/6 ≈ 0.00017<\/code>，计算精度已经够用。<\/p>\n<h3>概念：偏导数与梯度（难度：进阶）<\/h3>\n<p><strong>偏导数<\/strong>是把其他变量当常数求导。<code>∂f/∂x<\/code> 表示沿 x 方向的变化率。<\/p>\n<p><strong>全微分<\/strong> <code>df = (∂f/∂x)dx + (∂f/∂y)dy<\/code> 把各方向的贡献加起来。<\/p>\n<p><strong>梯度<\/strong> <code>∇f = (∂f/∂x, ∂f/∂y)<\/code> 是这些偏导组成的向量。它的两个性质：<\/p>\n<ul><li>\n方向：指向函数增长最快的方向。\n<\/li><li>\n模：等于该方向的方向导数，即最大变化率。\n<\/ul>\n<p><strong>方向导数<\/strong> <code>∂f/∂l = ∇f · l<\/code>（l 是单位向量），所以任意方向的变化率就是梯度在该方向的投影。<\/p>\n<p><strong>类比<\/strong>：梯度像山坡上最陡的那条上坡线。你朝它走，海拔升得最快；朝垂直方向走，海拔不变。失效边界：这个类比只在二维曲面上直观，高维时&quot;最陡方向&quot;要靠内积定义。<\/p>\n<h3>概念：多元极值与隐函数（难度：高难）<\/h3>\n<p>极值的必要条件是梯度为零（驻点）。判别要二阶偏导：<\/p>\n<p>设 <code>A = f_xx<\/code>，<code>B = f_xy<\/code>，<code>C = f_yy<\/code>，判别式 <code>Δ = AC − B²<\/code>。<\/p>\n<ul><li>\n<code>Δ &gt; 0<\/code> 且 <code>A &gt; 0<\/code>：极小。\n<\/li><li>\n<code>Δ &gt; 0<\/code> 且 <code>A &lt; 0<\/code>：极大。\n<\/li><li>\n<code>Δ &lt; 0<\/code>：鞍点。\n<\/li><li>\n<code>Δ = 0<\/code>：需要更高阶判断。\n<\/ul>\n<p><strong>隐函数定理<\/strong>：方程 <code>F(x,y)=0<\/code> 在一点附近能解出 <code>y=y(x)<\/code> 的条件是 <code>F_y ≠ 0<\/code>。这时 <code>dy/dx = −F_x/F_y<\/code>。<\/p>\n<p><strong>实例<\/strong>：<code>x²+y²=1<\/code> 在 (0,1) 附近，<code>F_y=2y=2≠0<\/code>，可解出 <code>y=√(1−x²)<\/code>，导数为 <code>−x/y<\/code>，在 (0,1) 处为 0，符合圆的切线水平。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[导数] --&gt; B[导数表 链式法则]\n    A --&gt; C[高阶导数]\n    A --&gt; D[泰勒展开 局部近似]\n    A --&gt; E[偏导数]\n    E --&gt; F[梯度 方向导数]\n    E --&gt; G[多元极值 二阶判别]\n    E --&gt; H[隐函数定理]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是一元的工具，右边是把它按变量拆开后的版本。泰勒展开是&quot;局部近似&quot;这条线的顶点，它把一阶、二阶信息组织成一个多项式。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：偏导数像同时看几个仪表。调一个旋钮，其他不动，读变化率；梯度是把所有旋钮的变化率合成一个方向。失效边界：仪表之间可能互相影响（变量耦合），这时单看一个偏导不足以判断全局行为。<\/p>\n<p><strong>实例<\/strong>：求 <code>f(x,y)=x²+2y²<\/code> 在 (1,1) 的梯度与方向导数。<code>∇f=(2x,4y)=(2,4)<\/code>。沿单位向量 <code>(1/√2,1/√2)<\/code> 的方向导数 <code>= (2+4)/√2 = 6/√2 ≈ 4.24<\/code>，这是该方向的变化率。梯度方向 <code>(2,4)<\/code> 归一化后是 <code>(1,2)/√5<\/code>，此时方向导数 <code>= (2+8)/√5 = 10/√5 ≈ 4.47<\/code>，比刚才的 4.24 更大，符合&quot;梯度方向最陡&quot;。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为导数表要全背<\/strong>——基本表加链式法则就够了，其它都能推。\n<\/li><li>\n<strong>别以为泰勒展开总是收敛到原函数<\/strong>——收敛半径有限，超出范围可能发散，<code>1/(1−x)<\/code> 在 x&gt;1 时就是反例。\n<\/li><li>\n<strong>别以为梯度为零就是极值<\/strong>——鞍点也满足梯度为零，必须用二阶判别式。\n<\/li><li>\n<strong>别以为偏导数存在就意味着连续<\/strong>——多元函数在一点各方向偏导都存在，函数仍可能在该点不连续，一元的&quot;可导必连续&quot;不能直接搬。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：<code>f(x,y)=x²+y²<\/code> 在 (1,2) 处的梯度是（　）。\n<ul>\n<li>\nA. (1,2)\n<\/li><li>\nB. (2,4)\n<\/li><li>\nC. (2,2)\n<\/li><li>\nD. (1,4)\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：<code>∂f/∂x=2x=2<\/code>，<code>∂f/∂y=2y=4<\/code>，梯度为 (2,4)。<\/p>\n<ol><li>\n<strong>填空<\/strong>：<code>eˣ<\/code> 的三阶泰勒展开（在 0 处）到 x² 项为 <code>1 + x + x²/<\/code>（　）。\n<\/ol>\n<p><strong>答案：2<\/strong>。解析：<code>eˣ<\/code> 的各阶导数都是 <code>eˣ<\/code>，在 0 处都为 1，所以 x² 项系数是 <code>1/2!<\/code>。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么梯度方向是函数增长最快的方向？\n<\/ol>\n<p><strong>答案要点<\/strong>：方向导数 <code>∂f/∂l = ∇f·l = |∇f|cosθ<\/code>，其中 θ 是 l 与梯度的夹角。cosθ 最大为 1，在 θ=0 时取到，此时 l 与梯度同向，方向导数等于 <code>|∇f|<\/code>，是所有方向中的最大值。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n基本导数表加链式法则，是全部求导的起点。\n<\/li><li>\n泰勒展开是局部近似，阶数越高越贴合，但只在收敛半径内有效。\n<\/li><li>\n梯度同时给出方向和最大变化率，多元极值要用二阶判别式才分得清。\n<\/ul>", "ch06": "<h1>第 6 章：无穷级数与积分学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 5 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 7 章「无穷级数」与第 8 章「积分学」（原书 p642—742）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用比值、根值、比较三种判据判断一个正项级数是否收敛。\n<\/li><li>\n写出幂级数的收敛半径求法，并用它展开 <code>eˣ<\/code>、<code>ln(1+x)<\/code>、<code>1/(1−x)<\/code>。\n<\/li><li>\n把周期函数展开成傅里叶级数，说出系数公式的含义。\n<\/li><li>\n用换元与分部积分算不定积分，用重积分算面积、体积与质心。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>级数是&quot;离散的积分&quot;，积分是&quot;连续的求和&quot;；两者的判据和技巧几乎可以一一对应。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：数项级数的判据（难度：进阶）<\/h3>\n<p>级数 <code>Σaₙ<\/code> 收敛的必要条件是 <code>aₙ→0<\/code>，但不充分（调和级数 <code>Σ1/n<\/code> 发散）。常用判据：<\/p>\n<table><thead><tr><th>判据<\/th><th>条件<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>比值<\/td><td><code>lim aₙ₊₁/aₙ = L<\/code><\/td><td>L&lt;1 收敛，L&gt;1 发散<\/td><\/tr><tr><td>根值<\/td><td><code>lim ⁿ√aₙ = L<\/code><\/td><td>同上<\/td><\/tr><tr><td>比较<\/td><td><code>aₙ ≤ bₙ<\/code> 且 <code>Σbₙ<\/code> 收敛<\/td><td><code>Σaₙ<\/code> 收敛<\/td><\/tr><tr><td>交错<\/td><td><code>aₙ<\/code> 单调减且趋于 0<\/td><td><code>Σ(−1)ⁿaₙ<\/code> 收敛<\/td><\/tr><\/tbody><\/table>\n<p><strong>实例<\/strong>：<code>Σ1/n²<\/code> 收敛（p 级数 p&gt;1 收敛），<code>Σ1/n<\/code> 发散（p=1）。这两条是判断其他级数的基准。<\/p>\n<h3>概念：幂级数与泰勒级数（难度：进阶）<\/h3>\n<p>幂级数 <code>Σcₙ(x−a)ⁿ<\/code> 的收敛半径 <code>R = 1/lim|cₙ₊₁/cₙ|<\/code>（比值法）。在 <code>|x−a|&lt;R<\/code> 内绝对收敛，外面发散，端点上要单独判断。<\/p>\n<p>常用展开：<\/p>\n<ul><li>\n<code>eˣ = Σ xⁿ/n!<\/code>，全轴收敛\n<\/li><li>\n<code>ln(1+x) = Σ(−1)ⁿ⁺¹xⁿ/n<\/code>，<code>|x|≤1<\/code>（x=1 时收敛到 ln2）\n<\/li><li>\n<code>1/(1−x) = Σxⁿ<\/code>，<code>|x|&lt;1<\/code>\n<\/li><li>\n<code>sin x = Σ(−1)ⁿx^(2n+1)/(2n+1)!<\/code>\n<\/ul>\n<p>这些展开是计算器和计算机算函数值的底层方法。<\/p>\n<h3>概念：傅里叶级数（难度：进阶）<\/h3>\n<p>周期为 2π 的函数可以展开成<\/p>\n<p><code>f(x) = a₀/2 + Σ(aₙcos nx + bₙsin nx)<\/code><\/p>\n<p>系数由积分给出：<\/p>\n<p><code>aₙ = (1/π)∫f(x)cos nx dx<\/code>，<code>bₙ = (1/π)∫f(x)sin nx dx<\/code><\/p>\n<p>它的意义是把函数分解成不同频率的正弦波之和，这是信号处理的起点。方波的傅里叶级数只含奇次正弦项，系数按 <code>1/n<\/code> 衰减，所以用少数几项逼近方波时会出现吉布斯现象（边缘过冲）。<\/p>\n<p><strong>类比<\/strong>：傅里叶级数像把一段音乐拆成各个音高的音量。拆开以后，想滤掉某个频率，只要把对应系数置零。失效边界：只有周期函数能这样拆，非周期函数要用傅里叶变换。<\/p>\n<h3>概念：不定积分与基本技巧（难度：进阶）<\/h3>\n<p>不定积分是求原函数。手册给出基本积分表，配合两条技巧：<\/p>\n<ul><li>\n<strong>换元<\/strong>：<code>∫f(g(x))g&#x27;(x)dx = ∫f(u)du<\/code>。\n<\/li><li>\n<strong>分部<\/strong>：<code>∫u dv = uv − ∫v du<\/code>。\n<\/ul>\n<p>分部积分适合&quot;多项式乘指数或三角&quot;的情形，反复用能降次。<\/p>\n<p><strong>实例<\/strong>：<code>∫x eˣ dx<\/code>。取 <code>u=x<\/code>，<code>dv=eˣdx<\/code>，则 <code>du=dx<\/code>，<code>v=eˣ<\/code>，得 <code>x eˣ − ∫eˣdx = x eˣ − eˣ + C<\/code>。<\/p>\n<h3>概念：定积分与重积分（难度：高难）<\/h3>\n<p>定积分有中值定理、变上限求导、换元与分部。重积分把区域切成小块求和：<\/p>\n<ul><li>\n二重积分：<code>∬f(x,y)dxdy<\/code>，极坐标下 <code>dxdy = r dr dθ<\/code>。\n<\/li><li>\n三重积分：柱坐标 <code>dV = r dr dθ dz<\/code>，球坐标 <code>dV = ρ² sinφ dρ dφ dθ<\/code>。\n<\/ul>\n<p>这三个体积元是重积分最容易错的地方，记住&quot;换坐标要乘雅可比行列式&quot;就不会漏。<\/p>\n<p><strong>线积分与曲面积分<\/strong>是重积分的降维版本，它们和格林公式、高斯公式、斯托克斯公式配套，把&quot;边界上的积分&quot;与&quot;内部积分&quot;联系起来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[求和] --&gt; B[离散 数项级数]\n    A --&gt; C[连续 定积分]\n    B --&gt; D[判据 比值 根值 比较]\n    C --&gt; E[技巧 换元 分部]\n    B --&gt; F[幂级数 泰勒]\n    B --&gt; G[傅里叶级数 频率分解]\n    C --&gt; H[重积分 坐标变换]\n    H --&gt; I[格林 高斯 斯托克斯]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左右两列是同一件事的两种形态，中间的判据与技巧分别对应。最下面是三维情形，坐标变换的雅可比是共同的关键。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：级数像分期付款，积分像连续计息。前者一笔笔加，后者一刻刻积；判据管&quot;总额会不会爆&quot;，技巧管&quot;怎么算得快&quot;。失效边界：分期有固定期数，级数要求无穷项收敛，这一点在类比里体现不出来。<\/p>\n<p><strong>实例<\/strong>：判断 <code>Σ n/2ⁿ<\/code> 是否收敛。用比值法：<code>aₙ₊₁/aₙ = [(n+1)/2ⁿ⁺¹]/(n/2ⁿ) = (n+1)/(2n)<\/code>，极限为 1/2 &lt; 1，收敛。<\/p>\n<p><strong>第二个实例<\/strong>：用极坐标算单位圆面积。<code>∬dxdy = ∫₀^(2π)∫₀¹ r dr dθ = 2π · (1/2) = π<\/code>。这里 <code>r dr dθ<\/code> 就是雅可比，漏掉 r 会算出 2π。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 <code>aₙ→0<\/code> 就能保证收敛<\/strong>——调和级数是反例，通项趋于 0 但和发散。\n<\/li><li>\n<strong>别以为幂级数在收敛半径端点一定收敛<\/strong>——端点要单独判断，<code>Σxⁿ/n<\/code> 在 x=1 收敛、在 x=−1 也收敛，但很多级数不同。\n<\/li><li>\n<strong>别以为傅里叶级数处处等于原函数<\/strong>——在不连续点它收敛到左右极限的平均值，这是狄利克雷定理。\n<\/li><li>\n<strong>别以为换坐标不用乘因子<\/strong>——极坐标要乘 r，球坐标要乘 ρ²sinφ，来源是雅可比行列式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：<code>Σ 1/n²<\/code> 的敛散性是（　）。\n<ul>\n<li>\nA. 发散\n<\/li><li>\nB. 收敛\n<\/li><li>\nC. 条件收敛\n<\/li><li>\nD. 无法判断\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：p 级数在 p&gt;1 时收敛，p=2 满足条件。<\/p>\n<ol><li>\n<strong>填空<\/strong>：<code>Σxⁿ<\/code>（n 从 0 开始）的和函数是 <code>1/(1−x)<\/code>，其收敛半径是（　）。\n<\/ol>\n<p><strong>答案：1<\/strong>。解析：几何级数在 <code>|x|&lt;1<\/code> 时收敛到 <code>1/(1−x)<\/code>，收敛半径为 1。<\/p>\n<ol><li>\n<strong>简答<\/strong>：极坐标下二重积分为什么要多乘一个 r？\n<\/ol>\n<p><strong>答案要点<\/strong>：直角坐标到极坐标的变换 <code>x=r cosθ<\/code>，<code>y=r sinθ<\/code> 的雅可比行列式值为 r，面积元 <code>dxdy<\/code> 变成 <code>r dr dθ<\/code>。不乘 r 会低估面积，单位圆会算出 2π 而不是 π。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n判据先看通项是否趋于 0，再用比值或根值，最后用比较。\n<\/li><li>\n幂级数的收敛半径由系数比给出，端点是例外区。\n<\/li><li>\n换坐标必须乘雅可比，这是重积分最常见的失分点。\n<\/ul>", "ch07": "<h1>第 7 章：微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 5 章、第 6 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 9 章「微分方程」§9.1—§9.2（原书 p743—831）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个一阶方程属于可分离、线性、伯努利还是恰当类型，并选对解法。\n<\/li><li>\n解二阶常系数线性齐次与非齐次方程，说清特征根三种情形的物理含义。\n<\/li><li>\n把二阶偏微分方程按判别式分成椭圆、抛物、双曲三类，各举一个物理例子。\n<\/li><li>\n用分离变量法解热传导方程的简单边值问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>微分方程把&quot;变化规律&quot;写成方程，解出的是满足这个规律的全部过程；阶数决定需要几个初始条件，类型决定用什么解法。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：一阶方程的分类与解法（难度：进阶）<\/h3>\n<p><strong>可分离方程<\/strong> <code>y&#x27; = f(x)g(y)<\/code>：把 y 和 x 分到两边，各自积分。注意分离时假设 <code>g(y)≠0<\/code>，<code>g(y)=0<\/code> 对应的常数解要单独检查。<\/p>\n<p><strong>一阶线性方程<\/strong> <code>y&#x27; + P(x)y = Q(x)<\/code>：乘以积分因子 <code>e^(∫Pdx)<\/code>，左边就变成 <code>(y e^(∫Pdx))&#x27;<\/code>，直接积分即可。<\/p>\n<p><strong>伯努利方程<\/strong> <code>y&#x27; + P(x)y = Q(x)yⁿ<\/code>：令 <code>u = y^(1−n)<\/code>，化成一阶线性。<\/p>\n<p><strong>恰当方程<\/strong> <code>M dx + N dy = 0<\/code>，若 <code>∂M/∂y = ∂N/∂x<\/code>，则存在势函数 <code>F(x,y)<\/code>，解为 <code>F = C<\/code>。<\/p>\n<p><strong>实例<\/strong>：解 <code>y&#x27; = 2xy<\/code>，<code>y(0)=1<\/code>。分离得 <code>dy/y = 2x dx<\/code>，积分 <code>ln|y| = x² + C<\/code>，即 <code>y = Ce^(x²)<\/code>。代入初值 C=1，解为 <code>y = e^(x²)<\/code>。<\/p>\n<h3>概念：二阶常系数线性方程（难度：进阶）<\/h3>\n<p>方程 <code>y&#x27;&#x27; + py&#x27; + qy = f(x)<\/code>。先解齐次部分 <code>y&#x27;&#x27; + py&#x27; + qy = 0<\/code>，特征方程 <code>λ² + pλ + q = 0<\/code>：<\/p>\n<table><thead><tr><th>判别式<\/th><th>特征根<\/th><th>齐次通解<\/th><\/tr><\/thead><tbody><tr><td><code>p²−4q &gt; 0<\/code><\/td><td>两个相异实根 λ₁、λ₂<\/td><td><code>C₁e^(λ₁x) + C₂e^(λ₂x)<\/code><\/td><\/tr><tr><td><code>= 0<\/code><\/td><td>重根 λ<\/td><td><code>(C₁ + C₂x)e^(λx)<\/code><\/td><\/tr><tr><td><code>&lt; 0<\/code><\/td><td>共轭复根 α±βi<\/td><td><code>e^(αx)(C₁cos βx + C₂sin βx)<\/code><\/td><\/tr><\/tbody><\/table>\n<p>三种情形对应物理上的过阻尼、临界阻尼、欠阻尼。弹簧振子的三种运动方式就是这三种解。<\/p>\n<p><strong>非齐次<\/strong>用待定系数法或常数变易法。待定系数法适用于 f(x) 是多项式、指数、正弦余弦的组合。<\/p>\n<p><strong>类比<\/strong>：二阶方程像带阻尼的弹簧。特征根是&quot;系统自己的回应方式&quot;，非齐次项是外力。失效边界：这个类比对线性系统成立，非线性方程没有叠加原理，解法完全不同。<\/p>\n<h3>概念：偏微分方程的分类（难度：高难）<\/h3>\n<p>二阶线性偏微分方程 <code>Au_xx + Bu_xy + Cu_yy + … = 0<\/code> 按判别式 <code>B²−4AC<\/code> 分类：<\/p>\n<table><thead><tr><th>判别式<\/th><th>类型<\/th><th>典型方程<\/th><th>物理场景<\/th><\/tr><\/thead><tbody><tr><td><code>&lt; 0<\/code><\/td><td>椭圆型<\/td><td>拉普拉斯方程 <code>u_xx+u_yy=0<\/code><\/td><td>静电场、稳态温度<\/td><\/tr><tr><td><code>= 0<\/code><\/td><td>抛物型<\/td><td>热传导方程 <code>u_t = a²u_xx<\/code><\/td><td>扩散、传热<\/td><\/tr><tr><td><code>&gt; 0<\/code><\/td><td>双曲型<\/td><td>波动方程 <code>u_tt = a²u_xx<\/code><\/td><td>弦振动、声波<\/td><\/tr><\/tbody><\/table>\n<p>这三类的定解条件不同：椭圆型给边界条件，抛物型给初始加边界，双曲型给两个初始条件。给错条件，解不唯一或不稳定。<\/p>\n<h3>概念：分离变量法（难度：高难）<\/h3>\n<p>以热传导为例：<code>u_t = a²u_xx<\/code>，边界 <code>u(0,t)=u(L,t)=0<\/code>，初始 <code>u(x,0)=f(x)<\/code>。<\/p>\n<p>设 <code>u(x,t)=X(x)T(t)<\/code>，代入得 <code>T&#x27;/a²T = X&#x27;&#x27;/X = −λ<\/code>。于是得到两个常微分方程：<\/p>\n<ul><li>\n<code>X&#x27;&#x27; + λX = 0<\/code>，配合边界条件解出 <code>Xₙ = sin(nπx/L)<\/code>，<code>λₙ = (nπ/L)²<\/code>。\n<\/li><li>\n<code>Tₙ&#x27; + a²λₙTₙ = 0<\/code>，解出 <code>Tₙ = e^(−a²λₙt)<\/code>。\n<\/ul>\n<p>把各模态叠加：<code>u(x,t) = Σ bₙ sin(nπx/L) e^(−a²λₙt)<\/code>，系数 <code>bₙ<\/code> 由初始条件用傅里叶正弦级数确定。<\/p>\n<p>这个方法的骨架是&quot;先拆成单变量，再按边界条件挑出允许的模态，最后叠加&quot;。波动方程、拉普拉斯方程在矩形区域上都用同一套。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[微分方程] --&gt; B[常微分 ODE]\n    A --&gt; C[偏微分 PDE]\n    B --&gt; D[一阶 可分离 线性 伯努利 恰当]\n    B --&gt; E[二阶常系数 特征根三情形]\n    C --&gt; F[椭圆 拉普拉斯]\n    C --&gt; G[抛物 热传导]\n    C --&gt; H[双曲 波动]\n    F --&gt; I[分离变量 模态叠加]\n    G --&gt; I\n    H --&gt; I<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半是&quot;按阶数与类型分派解法&quot;，下半是三类物理方程，最下面那条是它们共用的求解框架。分离变量能把 PDE 降成 ODE，这是全章的关键动作。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：微分方程像菜谱，初始条件是食材，解是做出来的菜。同样的菜谱配不同食材，出来的是不同的一份。失效边界：菜谱是确定的，微分方程可能无解、解不唯一或解不稳定，这些都要单独讨论。<\/p>\n<p><strong>实例<\/strong>：解 <code>y&#x27;&#x27; − 3y&#x27; + 2y = 0<\/code>。特征方程 <code>λ²−3λ+2=0<\/code>，根为 1 和 2。通解 <code>y = C₁eˣ + C₂e^(2x)<\/code>。若给 <code>y(0)=1<\/code>、<code>y&#x27;(0)=0<\/code>，则 <code>C₁+C₂=1<\/code>，<code>C₁+2C₂=0<\/code>，解得 <code>C₁=2<\/code>，<code>C₂=−1<\/code>，即 <code>y = 2eˣ − e^(2x)<\/code>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为一个初始条件就够<\/strong>——n 阶方程需要 n 个独立初始条件，少给一个解就带一个自由常数。\n<\/li><li>\n<strong>别以为所有微分方程都有解析解<\/strong>——绝大多数没有，实际计算靠数值方法（龙格-库塔等）。\n<\/li><li>\n<strong>别以为 PDE 的三类只是数学分类<\/strong>——它们对应不同物理过程，定解条件的给法也跟着不同。\n<\/li><li>\n<strong>别以为分离变量总能成功<\/strong>——它要求区域和边界条件能配合成可分离的形式，圆形区域要换成极坐标下的特殊函数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：<code>y&#x27;&#x27;+4y=0<\/code> 的通解是（　）。\n<ul>\n<li>\nA. <code>C₁e^(2x)+C₂e^(−2x)<\/code>\n<\/li><li>\nB. <code>C₁cos 2x + C₂sin 2x<\/code>\n<\/li><li>\nC. <code>(C₁+C₂x)e^(2x)<\/code>\n<\/li><li>\nD. <code>C₁cos x + C₂sin x<\/code>\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：特征方程 <code>λ²+4=0<\/code> 得 <code>λ=±2i<\/code>，对应 <code>cos 2x<\/code> 与 <code>sin 2x<\/code>。<\/p>\n<ol><li>\n<strong>填空<\/strong>：热传导方程 <code>u_t = a²u_xx<\/code> 属于（　）型偏微分方程。\n<\/ol>\n<p><strong>答案：抛物<\/strong>。解析：判别式 <code>B²−4AC = 0−0 = 0<\/code>，属于抛物型。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么二阶方程需要两个初始条件？\n<\/ol>\n<p><strong>答案要点<\/strong>：二阶方程的通解含两个独立常数，要定出唯一解需要两条独立信息。物理上，位置和速度共同决定运动状态，只给位置无法确定接下来的轨迹。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n一阶方程先分类再选法：可分离、线性、伯努利、恰当，各有固定套路。\n<\/li><li>\n二阶常系数方程看特征根，三种情形对应三种物理阻尼状态。\n<\/li><li>\nPDE 按判别式分三类，分离变量把 PDE 降成一组 ODE，再按边界条件选模态。\n<\/ul>", "ch08": "<h1>第 8 章：概率论与数理统计<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 2 章（函数）、第 6 章（积分）\n<\/li><li>\n<strong>对应原书<\/strong>：第 16 章「概率论与数理统计」§16.1—§16.4（原书 p1082—1145）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用排列组合算古典概率，区分&quot;有序&quot;与&quot;无序&quot;两种计数。\n<\/li><li>\n写出条件概率与全概率公式，用贝叶斯公式把先验更新成后验。\n<\/li><li>\n认出二项、泊松、正态、指数、均匀五种分布的形式与适用场景。\n<\/li><li>\n算样本均值与样本方差，说清置信区间的含义，理解假设检验的两类错误。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>概率把&quot;不确定&quot;变成可计算的量：先给每种结果一个权重，再用条件概率处理信息更新，最后用统计把样本推回总体。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：组合计数（难度：基础）<\/h3>\n<p><strong>排列<\/strong>关注顺序：<code>P(n,k) = n!/(n−k)!<\/code>。<strong>组合<\/strong>不关注顺序：<code>C(n,k) = n!/(k!(n−k)!)<\/code>。<\/p>\n<p>区分办法：问&quot;交换两个元素算不算新结果&quot;。算新结果用排列，不算用组合。<\/p>\n<p><strong>实例<\/strong>：从 10 人中选 3 人组成小组，是 <code>C(10,3)=120<\/code> 种；选 3 人分别担任组长、副组长、记录员，是 <code>P(10,3)=720<\/code> 种。<\/p>\n<h3>概念：概率的基本公式（难度：基础）<\/h3>\n<ul><li>\n古典概率：<code>P(A) = 有利结果数/总结果数<\/code>，前提是每个结果等可能。\n<\/li><li>\n加法：<code>P(A∪B) = P(A)+P(B)−P(A∩B)<\/code>。\n<\/li><li>\n条件概率：<code>P(A|B) = P(A∩B)/P(B)<\/code>。\n<\/li><li>\n全概率：<code>P(A) = ΣP(A|Bᵢ)P(Bᵢ)<\/code>，Bᵢ 构成完备事件组。\n<\/li><li>\n贝叶斯：<code>P(Bᵢ|A) = P(A|Bᵢ)P(Bᵢ)/P(A)<\/code>。\n<\/ul>\n<p><strong>实例<\/strong>：某病患病率 1%，检测灵敏度 99%，特异度 95%。一个人检测阳性，患病概率是多少？<\/p>\n<p><code>P(病|阳) = 0.99×0.01/(0.99×0.01 + 0.05×0.99) = 0.0099/(0.0099+0.0495) ≈ 0.167<\/code><\/p>\n<p>也就是说，阳性者真正患病的概率只有约 16.7%。这个结果反直觉，原因在于基础患病率太低，假阳性的人数远多于真阳性。<\/p>\n<h3>概念：随机变量与常见分布（难度：进阶）<\/h3>\n<p><strong>随机变量<\/strong>把结果映射成数。分布用分布函数 <code>F(x)=P(X≤x)<\/code> 或密度函数 <code>f(x)<\/code> 描述。<\/p>\n<table><thead><tr><th>分布<\/th><th>形式<\/th><th>期望<\/th><th>方差<\/th><th>场景<\/th><\/tr><\/thead><tbody><tr><td>二项 B(n,p)<\/td><td><code>C(n,k)p^k(1−p)^(n−k)<\/code><\/td><td>np<\/td><td>np(1−p)<\/td><td>n 次独立试验的成功次数<\/td><\/tr><tr><td>泊松 P(λ)<\/td><td><code>λ^k e^(−λ)/k!<\/code><\/td><td>λ<\/td><td>λ<\/td><td>单位时间的事件数<\/td><\/tr><tr><td>正态 N(μ,σ²)<\/td><td><code>(1/√(2π)σ)e^(−(x−μ)²/(2σ²))<\/code><\/td><td>μ<\/td><td>σ²<\/td><td>大量独立因素叠加<\/td><\/tr><tr><td>指数 E(λ)<\/td><td><code>λe^(−λx)<\/code><\/td><td>1/λ<\/td><td>1/λ²<\/td><td>等待时间<\/td><\/tr><tr><td>均匀 U(a,b)<\/td><td><code>1/(b−a)<\/code><\/td><td>(a+b)/2<\/td><td>(b−a)²/12<\/td><td>等可能的连续取值<\/td><\/tr><\/tbody><\/table>\n<p><strong>泊松是二项的极限<\/strong>：n 很大、p 很小时，二项分布近似泊松，参数 <code>λ=np<\/code>。<\/p>\n<p><strong>正态为什么到处出现<\/strong>：中心极限定理说，大量独立同分布随机变量之和近似正态，不管原来是什么分布。这条定理是统计能用的根本原因。<\/p>\n<h3>概念：数理统计（难度：进阶）<\/h3>\n<p><strong>样本均值<\/strong> <code>x̄ = (1/n)Σxᵢ<\/code> 是总体均值 μ 的无偏估计。<strong>样本方差<\/strong> <code>s² = (1/(n−1))Σ(xᵢ−x̄)²<\/code> 分母是 n−1 而不是 n，这样才是无偏的（自由度扣掉一个）。<\/p>\n<p><strong>置信区间<\/strong>：<code>x̄ ± z·σ/√n<\/code>（大样本）或 <code>x̄ ± t·s/√n<\/code>（小样本）。95% 置信区间的意思是：反复抽样构造的区间里，约 95% 会包含真值。它不是说&quot;真值有 95% 概率落在这个区间里&quot;。<\/p>\n<p><strong>假设检验<\/strong>：先设原假设 H₀，算检验统计量，看它落在拒绝域与否。两类错误：H₀ 为真却拒绝（第一类，概率 α），H₀ 为假却不拒绝（第二类，概率 β）。减小 α 会让 β 增大，两者此消彼长。<\/p>\n<p><strong>类比<\/strong>：置信区间像撒网捕鱼。网的大小固定，鱼在哪不知道；说&quot;95% 的网能罩住鱼&quot;是在说网的质量，不是在说这一网一定罩住。失效边界：这个类比只说明频率解释，贝叶斯学派对&quot;概率&quot;的理解不同，会给出后验区间。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[计数 排列组合] --&gt; B[古典概率]\n    B --&gt; C[条件概率]\n    C --&gt; D[全概率与贝叶斯]\n    C --&gt; E[随机变量与分布]\n    E --&gt; F[期望与方差]\n    E --&gt; G[中心极限定理]\n    G --&gt; H[置信区间]\n    G --&gt; I[假设检验]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;怎么算一个事件的概率&quot;，右边是&quot;怎么用分布描述整体&quot;，最下面两条是统计推断的两件工具，它们都靠中心极限定理站住。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：贝叶斯像改判。先有一个初始判断（先验），来了新证据（检测结果），按证据的可靠程度调整判断（后验）。失效边界：改判的幅度依赖先验，先验错了，后验也会偏；这一点常被忽略。<\/p>\n<p><strong>实例<\/strong>：抛一枚均匀硬币 10 次，恰好 6 次正面的概率。用二项分布：<code>C(10,6)(0.5)^6(0.5)^4 = 210 × 0.5^10 = 210/1024 ≈ 0.205<\/code>。<\/p>\n<p><strong>第二个实例<\/strong>：某灯泡寿命服从指数分布，平均寿命 1000 小时，求用满 500 小时还能再用 500 小时的概率。指数分布无记忆性，<code>P(X&gt;1000|X&gt;500) = P(X&gt;500) = e^(−0.5) ≈ 0.607<\/code>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为小概率事件不会发生<\/strong>——概率小只是频率低，样本足够多时它总会出现。生日悖论里 23 人就有超过 50% 的概率撞生日。\n<\/li><li>\n<strong>别以为置信区间是&quot;真值落在其中的概率&quot;<\/strong>——真值是一个固定的数，要么在里面要么不在；95% 说的是构造方法的覆盖率。\n<\/li><li>\n<strong>别以为 p 值小就说明原假设为假<\/strong>——p 值只是&quot;在原假设成立时出现这么极端结果的概率&quot;，它不直接给出原假设为假的概率。\n<\/li><li>\n<strong>别以为样本方差分母用 n 更好<\/strong>——用 n 会系统性低估总体方差，n−1 才是无偏。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：从 5 人中选 2 人，不考虑顺序，有多少种选法？（　）\n<ul>\n<li>\nA. 20\n<\/li><li>\nB. 10\n<\/li><li>\nC. 5\n<\/li><li>\nD. 25\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：<code>C(5,2)=5×4/2=10<\/code>。<\/p>\n<ol><li>\n<strong>填空<\/strong>：泊松分布的期望与方差都等于（　）。\n<\/ol>\n<p><strong>答案：λ<\/strong>。解析：泊松分布 P(λ) 的期望和方差都是 λ，这是它区别于二项分布的特征。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么检测阳性后患病概率可能远低于检测灵敏度？\n<\/ol>\n<p><strong>答案要点<\/strong>：检测灵敏度是&quot;患病者被测出阳性&quot;的概率，而&quot;阳性者患病&quot;是反过来的条件概率。当基础患病率很低时，健康人数量远多于患者，即使特异度很高，假阳性的绝对数量也会超过真阳性。贝叶斯公式把这两个方向区分开。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n计数先判断是否讲顺序，排列与组合的分界就在这里。\n<\/li><li>\n贝叶斯公式处理&quot;由证据反推原因&quot;，结果强烈依赖先验。\n<\/li><li>\n置信区间的 95% 说的是方法的覆盖率，不是单个区间的概率。\n<\/ul>", "c01": "<h1>复利与年金模型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一笔钱按固定利率增长时，终值等于本金乘以 <code>(1+i)ⁿ<\/code>；反过来，未来的一笔钱折到今天要除以同一个因子。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是手册里少数直接对应现实决策的公式。贷款、存款、养老金、设备折旧，全都落在这四个式子上。理解现值与终值的关系，才能把不同时间点的钱放到同一个尺度上比较。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    P[现值 P] --&gt;|乘以 1+i 的 n 次方| S[终值 S]\n    S --&gt;|除以 1+i 的 n 次方| P\n    R[每期支付 R] --&gt;|年金终值| S2[累计终值]\n    R --&gt;|年金现值| P2[折现总额]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面的往返是单笔钱的复利与折现，下面两端是分期的聚合。所有公式都由这两条基本箭头推出。<\/p>\n<h2>详解<\/h2>\n<p><strong>复利终值<\/strong> <code>S = P(1+i)ⁿ<\/code>。与单利 <code>S = P(1+in)<\/code> 的差别在于利息是否生息。期数越多，差别越大。<\/p>\n<p><strong>复利现值<\/strong> <code>P = S/(1+i)ⁿ<\/code>。这是把未来的钱折回今天的标准动作，贴现率越高，未来同样一笔钱今天越不值钱。<\/p>\n<p><strong>年金终值<\/strong> <code>S = R[(1+i)ⁿ−1]/i<\/code>，是每期支付 R、共 n 期的累计。它等于把每期支付的复利终值加总。<\/p>\n<p><strong>年金现值<\/strong> <code>P = R[1−(1+i)⁻ⁿ]/i<\/code>，是 n 期支付的折现总和。房贷月供就是用这条公式反解出来的。<\/p>\n<p><strong>类比<\/strong>：复利像滚雪球。雪球越大，粘上的雪越多。失效边界：真实世界的利率会变、通胀会侵蚀购买力，固定利率公式只是理想化模型。<\/p>\n<p><strong>实例<\/strong>：贷款 100 万，年利率 6%，30 年等额本息。月利率 0.005，期数 360。月供 <code>R = P·i/[1−(1+i)⁻ⁿ] = 1000000×0.005/[1−1.005⁻³⁶⁰] ≈ 5995.5 元<\/code>。总还款约 215.8 万，利息约 115.8 万。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为单利与复利的差别很小<\/strong>——30 年 6% 的差距接近一倍本金。\n<\/li><li>\n<strong>别以为利率翻倍月供就翻倍<\/strong>——月供与利率不是线性关系，因为分母也在变。\n<\/li><li>\n<strong>别以为折现率可以随便取<\/strong>——它反映资金的机会成本与风险，取错会让整个评估失真。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章 §1.3<\/td><td>商业数学<\/td><td>利息、复利、分期付款、年金、折旧五组公式<\/td><\/tr><tr><td>第 8 章 §7.2<\/td><td>微分方程与复利<\/td><td>连续复利对应 <code>y&#x27;=ky<\/code> 的解 <code>y=Ce^(kt)<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：等比级数求和（第 1 章 §1.2）\n<\/li><li>\n后续：指数增长与微分方程（第 7 章）、连续复利（第 8 章）\n<\/ul>", "c02": "<h1>坐标变换与数据拟合<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把数据画到合适的坐标系里，让原本弯曲的关系变成直线，再用直线的斜率读出参数。<\/p>\n<h2>为什么重要<\/h2>\n<p>实验数据不会自带方程。要靠有限的点判断规律，最省力的办法是换坐标把曲线拉直。手册专门讲了标度与坐标纸，正是为了这件事。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[数据点] --&gt; B{关系形态}\n    B --&gt;|y 等于 a x 的 b 次方| C[双对数坐标 斜率为 b]\n    B --&gt;|y 等于 a e 的 bx| D[半对数坐标 斜率为 b ln e]\n    B --&gt;|y 等于 a 加 bx| E[普通坐标]\n    C --&gt; F[读出 a 与 b]\n    D --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间三个分支对应三种常见规律，右边统一落到&quot;读参数&quot;。判断形态的方法是先看数据在普通坐标下是直线、幂律还是指数律。<\/p>\n<h2>详解<\/h2>\n<p><strong>幂律<\/strong> <code>y = axᵇ<\/code>。两边取对数：<code>lg y = lg a + b lg x<\/code>，对 <code>lg x<\/code> 是线性的，斜率就是 b，截距给出 a。<\/p>\n<p><strong>指数律<\/strong> <code>y = ae^(bx)<\/code>。取对数：<code>lg y = lg a + (b lg e)x<\/code>，对 x 是线性的。<\/p>\n<p><strong>线性<\/strong> <code>y = a + bx<\/code>，普通坐标即可。<\/p>\n<p><strong>判别的实用办法<\/strong>：先画普通坐标，如果明显弯曲，再画半对数；半对数还是弯，就试双对数。哪张图最直，就是哪个规律。<\/p>\n<p><strong>类比<\/strong>：换坐标像换尺子。用同一把尺子量不同单位的东西，读数会乱；换成对应的尺子，数字就整齐。失效边界：拉直只适用于这两类规律，其他形式（比如 <code>y = a + b/x<\/code>）需要别的变换。<\/p>\n<p><strong>实例<\/strong>：某实验测得 (1, 3.0)、(2, 12.0)、(3, 27.0)、(4, 48.0)。在双对数纸上作图，斜率约为 2，截距约为 3，判断规律为 <code>y = 3x²<\/code>。代入 x=5 得 75，可作为预测。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为直线拟合只能用于线性关系<\/strong>——换坐标后任何幂律或指数律都能变成直线。\n<\/li><li>\n<strong>别以为 <code>lg<\/code> 和 <code>ln<\/code> 混用没关系<\/strong>——斜率读数的含义依赖底数，混用会让参数差一个常数因子。\n<\/li><li>\n<strong>别以为拟合出的参数一定可靠<\/strong>——数据点少或噪声大时，斜率估计会有很大误差。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章 §2.16<\/td><td>经验曲线的确定<\/td><td>用换坐标判断幂律与指数律<\/td><\/tr><tr><td>第 2 章 §2.17<\/td><td>标度与坐标纸<\/td><td>对数纸、概率纸的用法<\/td><\/tr><tr><td>第 5 章 §5.1<\/td><td>函数图像<\/td><td>图像变换与伸缩<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：幂函数、指数函数、对数函数（第 2 章）\n<\/li><li>\n后续：最小二乘拟合（第 18 章优化）、回归分析（第 16 章统计）\n<\/ul>", "c03": "<h1>向量与坐标系<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>向量是有方向和大小的量，点积管夹角，叉积管面积与方向，坐标是把向量写成一组分量。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把几何问题翻译成代数运算。判定垂直、求面积、算体积、解平面方程，都能用点积和叉积一次完成，不需要画辅助线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[向量 a b] --&gt; B[点积 a dot b 等于 a b cos θ]\n    A --&gt; C[叉积 a cross b 模为平行四边形面积]\n    B --&gt; D[垂直判定 点积为零]\n    C --&gt; E[平行判定 叉积为零]\n    C --&gt; F[混合积 平行六面体体积]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边两个运算各自管一类问题，右边三条判据是它们的直接用途。叉积的方向按右手定则，顺序不能反。<\/p>\n<h2>详解<\/h2>\n<p><strong>点积<\/strong> <code>a·b=|a||b|cosθ<\/code>，结果是一个数。它可以算投影：<code>a<\/code> 在 <code>b<\/code> 方向上的投影长度是 <code>a·b/|b|<\/code>。<\/p>\n<p><strong>叉积<\/strong> <code>a×b<\/code> 是向量，方向垂直两者，模等于两者张成的平行四边形面积。三维才有叉积，四维以上要用外积。<\/p>\n<p><strong>混合积<\/strong> <code>(a×b)·c<\/code> 等于三向量张成的平行六面体体积，为零说明三向量共面。<\/p>\n<p><strong>类比<\/strong>：点积像问&quot;你们朝同一个方向走了多少&quot;，叉积像问&quot;你们围出的面积有多大&quot;。失效边界：叉积只在三维有直观的&quot;垂直方向&quot;，更高维要靠行列式或外积。<\/p>\n<p><strong>实例<\/strong>：<code>a=(1,2,3)<\/code>，<code>b=(4,5,6)<\/code>，点积 <code>1×4+2×5+3×6=32<\/code>，叉积 <code>(2×6−3×5, 3×4−1×6, 1×5−2×4)=(−3,6,−3)<\/code>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为叉积满足交换律<\/strong>——<code>a×b=−b×a<\/code>，方向相反。\n<\/li><li>\n<strong>别以为点积为零就说明两向量无关<\/strong>——它只说明垂直，垂直的向量在二维里也线性无关，但在更高维不一定。\n<\/li><li>\n<strong>别以为坐标系是绝对的<\/strong>——换基以后分量会变，向量本身不变。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章 §3.5<\/td><td>向量代数与解析几何<\/td><td>点积、叉积、直线与平面方程<\/td><\/tr><tr><td>第 3 章 §3.6<\/td><td>微分几何<\/td><td>切向量、法向量、曲率<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：三角函数（第 2 章）\n<\/li><li>\n后续：矩阵与线性变换（第 4 章）、曲率与挠率（第 3 章）\n<\/ul>", "c04": "<h1>矩阵与特征值<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>矩阵是线性变换的表格表示，特征值是这个变换在特定方向上只拉伸不转向时的拉伸倍数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是解线性方程组的工具，也是描述振动、旋转、数据主方向的通用语言。从结构力学到机器学习，凡是要处理多变量线性关系的地方，最后都落到特征值上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[矩阵 A] --&gt; B[行列式 是否可逆]\n    A --&gt; C[方程组 高斯消元]\n    A --&gt; D[特征方程 det A 减 λI 等于 0]\n    D --&gt; E[特征值 λ]\n    E --&gt; F[特征向量 v]\n    F --&gt; G[振动固有频率]\n    F --&gt; H[数据主成分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是&quot;能不能解&quot;，右边是&quot;变换的主方向&quot;。两条线都由同一个矩阵出发，服务的却是不同问题。<\/p>\n<h2>详解<\/h2>\n<p><strong>行列式<\/strong>衡量变换对体积的缩放。为零意味着维度塌缩，矩阵不可逆。<\/p>\n<p><strong>特征值<\/strong>由 <code>det(A−λI)=0<\/code> 求出，代回解 <code>(A−λI)v=0<\/code> 得特征向量。特征向量的方向在变换后不变，只改变长度。<\/p>\n<p><strong>实对称矩阵<\/strong>的特征值全是实数，特征向量互相正交，可以正交对角化。这一条让它在物理与统计里特别好用。<\/p>\n<p><strong>类比<\/strong>：矩阵像一张拉伸网。多数方向会被拉偏，只有几条特殊方向保持原方向，那几条就是特征向量，伸长倍数就是特征值。失效边界：旋转型变换（如平面转 90°）没有实特征向量，特征值是复数。<\/p>\n<p><strong>实例<\/strong>：<code>A=[[2,1],[1,2]]<\/code>，特征值 3 与 1，特征向量 (1,1) 与 (1,−1)。这两个方向互相垂直，符合实对称矩阵的结论。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为特征值一定是实数<\/strong>——旋转矩阵的特征值是复数。\n<\/li><li>\n<strong>别以为特征向量唯一<\/strong>——同一特征值的特征向量可以任意缩放，通常取单位向量。\n<\/li><li>\n<strong>别以为行列式为零就没有解<\/strong>——可能无解，也可能无穷多解，要看秩。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章 §4.1—§4.2<\/td><td>矩阵与行列式<\/td><td>运算规则与可逆判据<\/td><\/tr><tr><td>第 4 章 §4.5<\/td><td>线性方程组<\/td><td>高斯消元与秩的关系<\/td><\/tr><tr><td>第 4 章 §4.6<\/td><td>矩阵特征值问题<\/td><td>特征方程与对角化<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：向量与点积（第 3 章）\n<\/li><li>\n后续：二次型与正定性（第 18 章优化）、主成分分析（第 16 章统计）\n<\/ul>", "c05": "<h1>泰勒展开与局部近似<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用多项式在一点附近逼近一个光滑函数，阶数越高越贴合，误差由余项控制。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是所有数值计算的基础。计算器算 <code>sin 0.3<\/code>、<code>e^2<\/code>，底层用的就是多项式逼近。它也是判断极值、估计误差、做线性化的统一工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[函数 f] --&gt; B[零阶 常数]\n    B --&gt; C[一阶 切线]\n    C --&gt; D[二阶 抛物线]\n    D --&gt; E[高阶 更贴合]\n    E --&gt; F[余项控制误差]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：每加一阶，逼近曲线多一个弯，局部贴合度提高。误差由余项给出，不是靠眼看。<\/p>\n<h2>详解<\/h2>\n<p>展开式为 <code>f(x)=Σ f⁽ᵏ⁾(a)(x−a)ᵏ/k! + Rₙ<\/code>。余项的拉格朗日形式给出误差上界，计算时用它判断取几阶够用。<\/p>\n<p><strong>一阶展开就是线性化<\/strong>：<code>f(x)≈f(a)+f&#x27;(a)(x−a)<\/code>。单摆在小角度下的近似 <code>sin θ≈θ<\/code> 就是取一阶。<\/p>\n<p><strong>二阶展开用于判极值<\/strong>：<code>f&#x27;&#x27;<\/code> 的符号决定凹凸，这也是多元判别式的来源。<\/p>\n<p><strong>类比<\/strong>：用不同阶的曲线去套一个复杂形状。直尺套不上的地方，改用弯曲的尺。失效边界：只在展开点附近有效，离远了误差会失控。<\/p>\n<p><strong>实例<\/strong>：<code>sin x ≈ x − x³/6<\/code>，在 x=0.5 时，误差约为 <code>x⁵/120 ≈ 0.00026<\/code>，已经很小。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为阶数越高一定越好<\/strong>——超出收敛半径后，高阶项会让结果发散。\n<\/li><li>\n<strong>别以为展开点可以随便选<\/strong>——离数据点太远，误差会变大。\n<\/li><li>\n<strong>别以为余项可以省略不看<\/strong>——不知道误差多大，就不知道结果有几位可信。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 5 章 §6.1<\/td><td>一元函数微分<\/td><td>高阶导数与泰勒公式<\/td><\/tr><tr><td>第 5 章 §6.2<\/td><td>多元函数微分<\/td><td>二阶展开与极值判别<\/td><\/tr><tr><td>第 6 章 §7<\/td><td>幂级数<\/td><td>泰勒级数的收敛半径<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：导数与高阶导数（第 5 章）\n<\/li><li>\n后续：幂级数（第 6 章）、数值分析（第 19 章）\n<\/ul>", "c06": "<h1>雅可比行列式与坐标变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>换坐标时，面积或体积元素要乘以一个缩放因子，这个因子就是变换的雅可比行列式。<\/p>\n<h2>为什么重要<\/h2>\n<p>重积分算错，多半错在这里。极坐标漏了 r 会得到 2π 而不是 π；球坐标漏了 ρ²sinφ，体积会差一大截。它也是概率密度变换、连续介质力学里的基本工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[直角坐标] --&gt;|极坐标 x 等于 r cos θ，y 等于 r sin θ| B[面积元乘 r]\n    A --&gt;|球坐标| C[体积元乘 ρ 平方 sin φ]\n    A --&gt;|任意变换| D[乘雅可比行列式]\n    D --&gt; E[重积分换元]\n    B --&gt; E\n    C --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三种坐标变换各自给出一个因子，右边统一成重积分的换元规则。因子的来源是&quot;小块面积/体积被拉伸了多少倍&quot;。<\/p>\n<h2>详解<\/h2>\n<p><strong>雅可比行列式<\/strong>由变换的偏导数组成：<\/p>\n<p><code>J = ∂(x,y)/∂(u,v) = det[[x_u, x_v],[y_u, y_v]]<\/code><\/p>\n<p>它的绝对值就是小区域面积的缩放倍数。换元公式 <code>∬f dxdy = ∬f|J|dudv<\/code> 就来自这里。<\/p>\n<p><strong>极坐标<\/strong>：<code>x=r cosθ<\/code>，<code>y=r sinθ<\/code>，<code>J=r<\/code>，所以 <code>dxdy = r dr dθ<\/code>。<\/p>\n<p><strong>球坐标<\/strong>：<code>x=ρ sinφ cosθ<\/code>，<code>y=ρ sinφ sinθ<\/code>，<code>z=ρ cosφ<\/code>，<code>J=ρ²sinφ<\/code>。<\/p>\n<p><strong>类比<\/strong>：把一张橡皮膜从小格子拉伸成大格子，每个小格的面积按同一个比例放大。雅可比就是这个比例。失效边界：如果变换在不同点缩放比例不同（一般情形都是这样），要逐点取 J，不能用一个常数。<\/p>\n<p><strong>实例<\/strong>：单位圆面积 <code>∬dxdy = ∫₀^(2π)∫₀¹ r dr dθ = 2π·(1/2) = π<\/code>。漏掉 r 会得到 <code>2π×1 = 2π<\/code>，正好差一倍。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为换元只要替换变量<\/strong>——必须同时乘雅可比，否则面积或体积算错。\n<\/li><li>\n<strong>别以为雅可比总是正的<\/strong>——它可以为负，取绝对值才对。\n<\/li><li>\n<strong>别以为所有变换的雅可比都是常数<\/strong>——只有线性变换才是常数。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章 §8.4<\/td><td>多重积分<\/td><td>二重、三重积分的坐标变换<\/td><\/tr><tr><td>第 6 章 §8.5<\/td><td>曲面积分<\/td><td>曲面参数化的面积元<\/td><\/tr><tr><td>第 5 章 §6.2<\/td><td>多元微分<\/td><td>雅可比矩阵与隐函数存在性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：偏导数与行列式（第 4、5 章）\n<\/li><li>\n后续：曲面积分与高斯公式（第 6 章）、概率密度变换（第 8 章）\n<\/ul>", "c07": "<h1>定解条件与方程类型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>微分方程给出变化规律，定解条件从无穷多个解里挑出那一个；条件的给法由方程类型决定。<\/p>\n<h2>为什么重要<\/h2>\n<p>同一个方程配不同的初始条件，解完全不同。物理上这对应&quot;同样的物理定律，不同的初始状态&quot;。给错条件的类型，解可能不存在、不唯一或不稳定。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[方程类型] --&gt; B[常微分 n 阶 给 n 个初值]\n    A --&gt; C[椭圆型 给边界条件]\n    A --&gt; D[抛物型 给初始加边界]\n    A --&gt; E[双曲型 给两个初始条件]\n    B --&gt; F[唯一解]\n    C --&gt; F\n    D --&gt; F\n    E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条分支对应四类方程，右边统一到&quot;唯一解&quot;。判断类型是给条件之前必须做的一步。<\/p>\n<h2>详解<\/h2>\n<p><strong>常微分方程<\/strong>的阶数决定初值个数。一阶给一个，二阶给两个（通常是函数值与导数）。少给一个，解里留一个自由常数。<\/p>\n<p><strong>椭圆型<\/strong>（拉普拉斯方程）描述稳态，没有时间方向，只需边界条件。<\/p>\n<p><strong>抛物型<\/strong>（热传导）描述扩散，需要初始分布加边界条件。<\/p>\n<p><strong>双曲型<\/strong>（波动）描述传播，需要初始位移与初始速度两个条件。<\/p>\n<p><strong>类比<\/strong>：方程像考试规则，定解条件像考生的答卷。规则相同，答卷不同，成绩不同。失效边界：考试总有人批改，微分方程的解要靠定理保证存在唯一，不是理所当然。<\/p>\n<p><strong>实例<\/strong>：<code>y&#x27;&#x27;+y=0<\/code> 的通解是 <code>C₁cos x + C₂sin x<\/code>。给 <code>y(0)=0<\/code>、<code>y&#x27;(0)=0<\/code> 得 <code>y≡0<\/code>；给 <code>y(0)=1<\/code>、<code>y&#x27;(0)=0<\/code> 得 <code>y=cos x<\/code>。同一个方程，两个不同的物理过程。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为初值条件可以随便加<\/strong>——个数不对，解不唯一；位置不对，可能无解。\n<\/li><li>\n<strong>别以为 PDE 都需要初始条件<\/strong>——椭圆型没有时间变量，只给边界条件。\n<\/li><li>\n<strong>别以为解一定存在唯一<\/strong>——存在唯一性要由定理保证，非线性方程尤其要小心。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章 §9.1<\/td><td>常微分方程<\/td><td>一阶与二阶方程的解法与初值<\/td><\/tr><tr><td>第 7 章 §9.2<\/td><td>偏微分方程<\/td><td>三类方程与分离变量<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：二阶常系数方程（第 7 章）、傅里叶级数（第 6 章）\n<\/li><li>\n后续：数值解法（第 19 章）\n<\/ul>", "c08": "<h1>贝叶斯更新<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>先有一个初始判断，来了新证据，按证据的可靠程度调整，得到更新后的判断。<\/p>\n<h2>为什么重要<\/h2>\n<p>它处理的是&quot;由结果反推原因&quot;这类问题，医学检测、垃圾邮件过滤、故障诊断都靠它。不理解贝叶斯，就很容易把&quot;检测准确率&quot;和&quot;检测阳性后的患病概率&quot;混为一谈。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[先验 P 原因] --&gt; C[贝叶斯公式]\n    B[证据的似然 P 证据 原因] --&gt; C\n    C --&gt; D[后验 P 原因 证据]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边两个输入合成右边的输出。先验变了，后验跟着变，这一点是贝叶斯与频率方法最大的不同。<\/p>\n<h2>详解<\/h2>\n<p>公式 <code>P(B|A) = P(A|B)P(B)/P(A)<\/code>。分母 <code>P(A)<\/code> 通常用全概率公式展开。<\/p>\n<p><strong>关键在区分两个方向<\/strong>：<code>P(阳性|患病)<\/code> 是灵敏度，<code>P(患病|阳性)<\/code> 才是患者关心的问题，两者不能互换。<\/p>\n<p><strong>基础患病率的影响<\/strong>：患病率低时，假阳性的绝对数量会超过真阳性，后验概率被压低。这就是为什么筛查通常只用于高风险人群。<\/p>\n<p><strong>类比<\/strong>：侦探查案。先有嫌疑人名单（先验），找到新物证（证据），按物证的可靠性调整怀疑程度（后验）。失效边界：现实中的证据可能相关，公式假设条件独立。<\/p>\n<p><strong>实例<\/strong>：患病率 1%，灵敏度 99%，特异度 95%。<code>P(病|阳) = 0.0099/(0.0099+0.0495) ≈ 16.7%<\/code>。若患病率升到 10%，同样检测下 <code>P(病|阳) = 0.099/(0.099+0.045) ≈ 68.8%<\/code>，相差四倍。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为灵敏度就是阳性者患病的概率<\/strong>——方向反了，两者差得很远。\n<\/li><li>\n<strong>别以为检测准确率高就可以放心<\/strong>——基础率低时，阳性结果的可信度仍然不高。\n<\/li><li>\n<strong>别以为先验可以随便设<\/strong>——先验偏差会直接带到后验，需要数据或经验支撑。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 8 章 §16.2<\/td><td>概率论<\/td><td>条件概率、全概率、贝叶斯公式<\/td><\/tr><tr><td>第 8 章 §16.3<\/td><td>数理统计<\/td><td>参数估计与后验推断<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：条件概率、全概率公式（第 8 章）\n<\/li><li>\n后续：假设检验（第 8 章）、朴素贝叶斯分类（普林斯顿 VII.5）\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：算术与初等代数<\/strong><br>阅读：<a href=\"#/book/bronstein-handbook/chapter/ch01\">第 1 章：算术与初等代数<\/a><br>检查点：能算复利与年金，能解二次方程<\/li><li class='path-step' id='path-02'><strong>步骤 02：函数与初等函数<\/strong><br>阅读：<a href=\"#/book/bronstein-handbook/chapter/ch02\">第 2 章：函数与初等函数<\/a><br>检查点：能在半对数纸上判断指数律<\/li><li class='path-step' id='path-03'><strong>步骤 03：几何学<\/strong><br>阅读：<a href=\"#/book/bronstein-handbook/chapter/ch03\">第 3 章：几何学<\/a><br>检查点：能写出球面余弦定理<\/li><li class='path-step' id='path-04'><strong>步骤 04：线性代数<\/strong><br>阅读：<a href=\"#/book/bronstein-handbook/chapter/ch04\">第 4 章：线性代数<\/a><br>检查点：能求特征值与特征向量<\/li><li class='path-step' id='path-05'><strong>步骤 05：微分学<\/strong><br>阅读：<a href=\"#/book/bronstein-handbook/chapter/ch05\">第 5 章：微分学<\/a><br>检查点：能算梯度与方向导数<\/li><li class='path-step' id='path-06'><strong>步骤 06：无穷级数与积分学<\/strong><br>阅读：<a href=\"#/book/bronstein-handbook/chapter/ch06\">第 6 章：无穷级数与积分学<\/a><br>检查点：能判断级数收敛并算重积分<\/li><li class='path-step' id='path-07'><strong>步骤 07：微分方程<\/strong><br>阅读：<a href=\"#/book/bronstein-handbook/chapter/ch07\">第 7 章：微分方程<\/a><br>检查点：能解二阶常系数方程<\/li><li class='path-step' id='path-08'><strong>步骤 08：概率论与数理统计<\/strong><br>阅读：<a href=\"#/book/bronstein-handbook/chapter/ch08\">第 8 章：概率论与数理统计<\/a><br>检查点：能用贝叶斯公式更新概率<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：算术与初等代数<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 前 n 项立方和等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type ' name='ch05-q01' value='0'> (1,2)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q01' value='1'> (2,4)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q01' value='2'> (2,2)<\/label><label class='quiz-opt'><input type='radio' name='ch05-q01' value='3'> (1,4)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> eˣ 在 0 处展开到 x² 项时，x² 的系数是 1/2!，即 1/（　）。（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：无穷级数与积分学<\/h1><div class='quiz-item' data-qid='ch06-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Σ1/n² 的敛散性是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q01' value='0'> 发散<\/label><label class='quiz-opt'><input type='radio' name='ch06-q01' value='1'> 收敛<\/label><label class='quiz-opt'><input type='radio' name='ch06-q01' value='2'> 条件收敛<\/label><label class='quiz-opt'><input type='radio' name='ch06-q01' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 极坐标下面积元 dxdy 等于 r dr d（　）。（填一个希腊字母）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：微分方程<\/h1><div class='quiz-item' data-qid='ch07-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> y&#x27;&#x27;+4y=0 的通解是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q01' value='0'> C₁e^(2x)+C₂e^(−2x)<\/label><label class='quiz-opt'><input type='radio' name='ch07-q01' value='1'> C₁cos2x+C₂sin2x<\/label><label class='quiz-opt'><input type='radio' name='ch07-q01' value='2'> (C₁+C₂x)e^(2x)<\/label><label class='quiz-opt'><input type='radio' name='ch07-q01' value='3'> C₁cos x+C₂sin x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 热传导方程属于哪一型偏微分方程？（填两字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：概率论与数理统计<\/h1><div class='quiz-item' data-qid='ch08-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 从 5 人中选 2 人不考虑顺序，有多少种选法？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q01' value='0'> 20<\/label><label class='quiz-opt'><input type='radio' name='ch08-q01' value='1'> 10<\/label><label class='quiz-opt'><input type='radio' name='ch08-q01' value='2'> 5<\/label><label class='quiz-opt'><input type='radio' name='ch08-q01' value='3'> 25<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 泊松分布的期望与方差都等于哪个参数？（填一个希腊字母）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪一组公式属于同一件事的离散与连续两个版本？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 复利与年金<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 级数求和与定积分<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 正弦定理与余弦定理<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 均值不等式与柯西不等式<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 用不到雅可比行列式的情形是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 极坐标下算二重积分<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 球坐标下算三重积分<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 普通直角坐标下的二重积分<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 曲面参数化后算面积<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 二阶常系数线性方程需要几个初始条件才能定出唯一解？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='复利终值'>复利终值 — S=P(1+i)ⁿ，本金按复利计息 n 期后的本息合计 <span class=glossary-ref>（第 1 章：算术与初等代数）<\/span><\/li><li data-term='年金现值'>年金现值 — 每期支付 R 共 n 期，按利率 i 折现到今天的总额 <span class=glossary-ref>（第 1 章：算术与初等代数）<\/span><\/li><li data-term='判别式'>判别式 — 二次方程 Δ=b²−4ac，决定实根个数；二次曲线 Δ=B²−4AC 决定类型 <span class=glossary-ref>（第 1 章：算术与初等代数）<\/span><\/li><li data-term='双曲函数'>双曲函数 — 由 eˣ 与 e⁻ˣ 组合定义的函数，满足 cosh²−sinh²=1 <span class=glossary-ref>（第 2 章：函数与初等函数）<\/span><\/li><li data-term='半对数坐标'>半对数坐标 — 一个轴取对数、一个轴取线性，用来把指数律画成直线 <span class=glossary-ref>（第 2 章：函数与初等函数）<\/span><\/li><li data-term='双对数坐标'>双对数坐标 — 两个轴都取对数，用来把幂律画成直线 <span class=glossary-ref>（第 2 章：函数与初等函数）<\/span><\/li><li data-term='海伦公式'>海伦公式 — 由三边直接算三角形面积：S=√(p(p−a)(p−b)(p−c))，p 为半周长 <span class=glossary-ref>（第 3 章：几何学）<\/span><\/li><li data-term='球面三角'>球面三角 — 球面上以球心角表示的边与角构成的三角形，满足球面余弦定理 <span class=glossary-ref>（第 3 章：几何学）<\/span><\/li><li data-term='点积'>点积 — a·b=|a||b|cosθ，结果是一个数，用来算夹角与投影 <span class=glossary-ref>（第 3 章：几何学）<\/span><\/li><li data-term='叉积'>叉积 — a×b，方向垂直两者，模等于张成平行四边形面积 <span class=glossary-ref>（第 3 章：几何学）<\/span><\/li><li data-term='高斯曲率'>高斯曲率 — 两个主曲率之积 K=κ₁κ₂，是曲面的内蕴量 <span class=glossary-ref>（第 3 章：几何学）<\/span><\/li><li data-term='行列式'>行列式 — 方阵对应的一个数，其绝对值是变换对面积或体积的缩放倍数 <span class=glossary-ref>（第 4 章：线性代数）<\/span><\/li><li data-term='秩'>秩 — 矩阵所含线性无关行或列的个数，决定方程组解的结构 <span class=glossary-ref>（第 4 章：线性代数）<\/span><\/li><li data-term='特征值'>特征值 — 使 Av=λv 有非零解 v 的数 λ <span class=glossary-ref>（第 4 章：线性代数）<\/span><\/li><li data-term='四元数'>四元数 — 形如 a+bi+cj+dk 的数，乘法不交换，用于表示三维旋转 <span class=glossary-ref>（第 4 章：线性代数）<\/span><\/li><li data-term='偏导数'>偏导数 — 把其余变量视为常数时对某一变量的导数 <span class=glossary-ref>（第 5 章：微分学）<\/span><\/li><li data-term='梯度'>梯度 — 各偏导组成的向量，指向函数增长最快的方向 <span class=glossary-ref>（第 5 章：微分学）<\/span><\/li><li data-term='方向导数'>方向导数 — 函数沿某单位方向的瞬时变化率，等于梯度在该方向的投影 <span class=glossary-ref>（第 5 章：微分学）<\/span><\/li><li data-term='隐函数定理'>隐函数定理 — 若 F_y≠0，则方程 F(x,y)=0 在局部可解出 y=y(x) <span class=glossary-ref>（第 5 章：微分学）<\/span><\/li><li data-term='比值判据'>比值判据 — 若 lim a(n+1)/a(n)&lt;1 则正项级数收敛，&gt;1 则发散 <span class=glossary-ref>（第 6 章：无穷级数与积分学）<\/span><\/li><li data-term='傅里叶级数'>傅里叶级数 — 把周期函数展开成不同频率正弦余弦之和 <span class=glossary-ref>（第 6 章：无穷级数与积分学）<\/span><\/li><li data-term='雅可比行列式'>雅可比行列式 — 坐标变换偏导组成的行列式，其绝对值是面积或体积元的缩放倍数 <span class=glossary-ref>（第 6 章：无穷级数与积分学）<\/span><\/li><li data-term='积分因子'>积分因子 — 乘以它可把一阶线性方程左边化为一个乘积的导数 <span class=glossary-ref>（第 7 章：微分方程）<\/span><\/li><li data-term='特征根'>特征根 — 二阶常系数线性方程对应的二次方程的根，三种情形决定解的形式 <span class=glossary-ref>（第 7 章：微分方程）<\/span><\/li><li data-term='分离变量法'>分离变量法 — 设 u=X(x)T(t) 把偏微分方程拆成若干常微分方程的方法 <span class=glossary-ref>（第 7 章：微分方程）<\/span><\/li><li data-term='条件概率'>条件概率 — 在已知 B 发生的条件下 A 发生的概率，P(A|B)=P(A∩B)/P(B) <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><li data-term='全概率公式'>全概率公式 — P(A)=ΣP(A|Bᵢ)P(Bᵢ)，Bᵢ 构成完备事件组 <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><li data-term='中心极限定理'>中心极限定理 — 大量独立同分布随机变量之和近似正态分布 <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><li data-term='置信区间'>置信区间 — 由样本构造的区间，反复抽样时约有一定比例的区间包含真值 <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><li data-term='无偏估计'>无偏估计 — 期望等于被估计参数的估计量 <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><li data-term='第一类错误'>第一类错误 — 原假设为真却被拒绝，概率为显著性水平 α <span class=glossary-ref>（第 8 章：概率论与数理统计）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：查表四问<\/h2>\n<p>手册的用法不是背公式，是四步定位。任何一个计算问题，先问：它属于哪个数学对象（数、函数、图形、方程、随机量）；需要哪类运算（求值、求极值、求累积、求分布）；有没有已知公式；公式的适用条件是什么。四问答完，翻哪一节就定了。<\/p>\n<p>这个框架在全书反复用。第二章查曲线、第三章查体积、第六章查积分、第八章查分布，走的都是同一套提问顺序。<\/p>\n<h2>框架：先变换再计算<\/h2>\n<p>手册里大量技巧本质是&quot;把问题变成已会的形式&quot;。换坐标把幂律变直线，换元把复合积分变简单积分，换变量把伯努利方程变线性方程，分离变量把 PDE 变 ODE。这四件事的骨架相同：找一个变换，让陌生结构落进熟悉的模板。<\/p>\n<p>用法：拿到一个算不动的问题，先别硬算，问&quot;换个变量会不会变简单&quot;。代价是要记得变换带来的因子，比如雅可比。<\/p>\n<h2>框架：必要条件先筛，充分条件后判<\/h2>\n<p>极值用驻点筛，二阶条件判；级数用通项趋于零筛，比值法定论；假设检验用检验统计量筛，p 值定论。手册里凡是&quot;判断&quot;类问题，大多是先给一个便宜的必要条件缩小范围，再上贵的判据。<\/p>\n<p>用法：算不动的时候先看必要条件能不能排除掉大部分情形，能排除就先排除。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n要算一个具体数 → 查公式表，注意定义域和单位。\n<\/li><li>\n要给一组数据定规律 → 先试半对数，再试双对数。\n<\/li><li>\n要判断方程解的情况 → 比秩，不比行列式。\n<\/li><li>\n要算积分 → 先看能否查表，再看换元，最后分部。\n<\/li><li>\n要判断级数 → 通项先趋于零，再比值，再比较。\n<\/li><li>\n要给 PDE 定解 → 先分类，再按类型配条件。\n<\/ul>\n<h2>反模式<\/h2>\n<p><strong>不分类型直接套公式。<\/strong> 分式、根式、微分方程的套法都不一样，跳过分类这一步，后面全错。<\/p>\n<p><strong>忘记坐标变换的因子。<\/strong> 极坐标漏 r、球坐标漏 ρ²sinφ，是最常见的计算错误。<\/p>\n<p><strong>把必要条件当结论。<\/strong> 梯度为零不等于极值，通项趋于零不等于收敛。<\/p>\n<p><strong>用高精度掩盖错误模型。<\/strong> 公式用错了，算得再准也没用；手册的每一条公式都有适用前提，前提不成立就换方法。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>初等公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>复利终值<\/td><td><code>S=P(1+i)ⁿ<\/code><\/td><\/tr><tr><td>复利现值<\/td><td><code>P=S/(1+i)ⁿ<\/code><\/td><\/tr><tr><td>年金终值<\/td><td><code>S=R[(1+i)ⁿ−1]/i<\/code><\/td><\/tr><tr><td>年金现值<\/td><td><code>P=R[1−(1+i)⁻ⁿ]/i<\/code><\/td><\/tr><tr><td>二次方程求根<\/td><td><code>x=(−b±√(b²−4ac))/(2a)<\/code><\/td><\/tr><tr><td>立方和<\/td><td><code>a³+b³=(a+b)(a²−ab+b²)<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>几何与三角<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>正弦定理<\/td><td><code>a/sinA=b/sinB=c/sinC=2R<\/code><\/td><\/tr><tr><td>余弦定理<\/td><td><code>c²=a²+b²−2ab cosC<\/code><\/td><\/tr><tr><td>三角形面积<\/td><td><code>S=(1/2)ab sinC<\/code> 或海伦公式<\/td><\/tr><tr><td>球面余弦定理<\/td><td><code>cos c=cos a cos b+sin a sin b cos C<\/code><\/td><\/tr><tr><td>圆的曲率<\/td><td><code>κ=1/R<\/code><\/td><\/tr><tr><td>高斯曲率<\/td><td><code>K=κ₁κ₂<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>线性代数<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式或判据<\/th><\/tr><\/thead><tbody><tr><td>2×2 行列式<\/td><td><code>ad−bc<\/code><\/td><\/tr><tr><td>可逆判据<\/td><td><code>det(A)≠0<\/code><\/td><\/tr><tr><td>唯一解<\/td><td>`rank(A)=rank([A<\/td><td>b])=n`<\/td><\/tr><tr><td>特征方程<\/td><td><code>det(A−λI)=0<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>微积分<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式
