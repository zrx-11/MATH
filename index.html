ags": ["引论"]}, {"id": "ch01-f05", "chapterId": "ch01", "front": "按问题类型分类与按主题分类有什么区别？", "back": "前者按数学家做什么问，后者按研究对象分；前者更能看出学科统一性", "tags": ["引论"]}, {"id": "ch02-f01", "chapterId": "ch02", "front": "∈ 与 ⊂ 的区别？", "back": "前者是元素属于集合，后者是集合包含于集合", "tags": ["语法"]}, {"id": "ch02-f02", "chapterId": "ch02", "front": "单射、满射、双射各是什么？", "back": "不同输入给不同输出；每个输出都有输入；两者都满足", "tags": ["语法"]}, {"id": "ch02-f03", "chapterId": "ch02", "front": "群的四条公理？", "back": "封闭、结合、有单位元、每元有逆", "tags": ["语法"]}, {"id": "ch02-f04", "chapterId": "ch02", "front": "否定全称命题的规则？", "back": "全称变存在，谓词取反", "tags": ["语法"]}, {"id": "ch02-f05", "chapterId": "ch02", "front": "等价关系的三条性质？", "back": "自反、对称、传递", "tags": ["语法"]}, {"id": "ch03-f01", "chapterId": "ch03", "front": "数系四次扩张各解决什么？", "back": "减法、除法、极限与开方、x²+1=0 的解", "tags": ["起源"]}, {"id": "ch03-f02", "chapterId": "ch03", "front": "几何的三次转向？", "back": "公理化、解析化、变换化与拓扑化", "tags": ["起源"]}, {"id": "ch03-f03", "chapterId": "ch03", "front": "为什么 x⁵−x−1 不能根式解？", "back": "伽罗瓦群是 S₅，S₅ 不可解（含非交换单群 A₅）", "tags": ["起源"]}, {"id": "ch03-f04", "chapterId": "ch03", "front": "罗素悖论讲什么？", "back": "R={x: x∉x}，问 R∈R 两个答案都矛盾，暴露朴素集合论的问题", "tags": ["起源"]}, {"id": "ch03-f05", "chapterId": "ch03", "front": "分析严格化的两个关键人物各做了什么？", "back": "柯西给出 ε-δ 极限定义；魏尔斯特拉斯造出处处不可导的连续函数", "tags": ["起源"]}, {"id": "ch04-f01", "chapterId": "ch04", "front": "基数怎么比较？", "back": "存在双射则基数相同，不靠数个数", "tags": ["概念"]}, {"id": "ch04-f02", "chapterId": "ch04", "front": "紧性的定义与实数中的等价形式？", "back": "任意开覆盖有有限子覆盖；实数中即有界闭区间", "tags": ["概念"]}, {"id": "ch04-f03", "chapterId": "ch04", "front": "高斯曲率为什么重要？", "back": "它是内蕴量，等距变形不变，非零则不能摊平到平面", "tags": ["概念"]}, {"id": "ch04-f04", "chapterId": "ch04", "front": "亏格与欧拉示性数的关系？", "back": "χ = 2 − 2g", "tags": ["概念"]}, {"id": "ch04-f05", "chapterId": "ch04", "front": "傅里叶变换把什么变成什么？", "back": "把按位置描述的函数变成按频率描述，卷积变乘法", "tags": ["概念"]}, {"id": "ch05-f01", "chapterId": "ch05", "front": "代数几何研究什么？", "back": "多项式方程组的解集（代数簇），重点是奇点", "tags": ["分支"]}, {"id": "ch05-f02", "chapterId": "ch05", "front": "表示论为什么服务多个领域？", "back": "它把抽象对称性变成矩阵计算，物理、数论、组合都要用", "tags": ["分支"]}, {"id": "ch05-f03", "chapterId": "ch05", "front": "PDE 三类各对应什么物理过程？", "back": "椭圆稳态、抛物扩散、双曲波动", "tags": ["分支"]}, {"id": "ch05-f04", "chapterId": "ch05", "front": "拉姆齐定理的典型结论？", "back": "6 人中必有 3 人互相认识或 3 人互相不认识（R(3,3)=6）", "tags": ["分支"]}, {"id": "ch05-f05", "chapterId": "ch05", "front": "逻辑与集合论为什么特殊？", "back": "它们研究数学本身，是“关于数学的数学”", "tags": ["分支"]}, {"id": "ch06-f01", "chapterId": "ch06", "front": "费马大定理何时被谁证明？", "back": "1994 年怀尔斯证明，用椭圆曲线与模形式的联系", "tags": ["定理"]}, {"id": "ch06-f02", "chapterId": "ch06", "front": "四色定理为什么引起争议？", "back": "第一次大规模依赖计算机穷举，人工无法逐步复核", "tags": ["定理"]}, {"id": "ch06-f03", "chapterId": "ch06", "front": "连续统假设的独立性由谁证明？", "back": "哥德尔 1938（不矛盾），科恩 1963（否定也不矛盾，力迫法）", "tags": ["定理"]}, {"id": "ch06-f04", "chapterId": "ch06", "front": "庞加莱猜想的内容？", "back": "任何单连通的三维闭流形同胚于三维球面", "tags": ["定理"]}, {"id": "ch06-f05", "chapterId": "ch06", "front": "黎曼假设讲什么？", "back": "ζ 函数的非平凡零点都在 Re(s)=1/2 上", "tags": ["定理"]}, {"id": "ch07-f01", "chapterId": "ch07", "front": "黎曼几何等了多久才被物理用上？", "back": "1854 年建立，1915 年用于广义相对论，六十多年", "tags": ["应用"]}, {"id": "ch07-f02", "chapterId": "ch07", "front": "编码理论靠什么数学？", "back": "有限域上的代数结构，加冗余纠错", "tags": ["应用"]}, {"id": "ch07-f03", "chapterId": "ch07", "front": "金融模型的失效教训？", "back": "对数正态与独立同分布假设在极端行情下失效，尾部风险被低估", "tags": ["应用"]}, {"id": "ch07-f04", "chapterId": "ch07", "front": "十二平均律的频率比？", "back": "相邻半音比值为 2^(1/12)", "tags": ["应用"]}, {"id": "ch07-f05", "chapterId": "ch07", "front": "椭圆曲线从“最没用”到“最有用”的例子？", "back": "1985 年还被看作纯理论，现在支撑比特币与 TLS", "tags": ["应用"]}, {"id": "ch08-f01", "chapterId": "ch08", "front": "五种问题类型？", "back": "存在、唯一、分类、构造、不可能", "tags": ["研究"]}, {"id": "ch08-f02", "chapterId": "ch08", "front": "论文里引理的作用？", "back": "把长证明切成可复核的段，本身不一定重要", "tags": ["研究"]}, {"id": "ch08-f03", "chapterId": "ch08", "front": "猜想有哪几层证据？", "back": "数值验证、特殊情形、类比、从更强假设推出", "tags": ["研究"]}, {"id": "ch08-f04", "chapterId": "ch08", "front": "数学里“漂亮”的证明通常意味着什么？", "back": "短、意外、揭示隐藏联系、可推广", "tags": ["研究"]}, {"id": "ch08-f05", "chapterId": "ch08", "front": "三等分角为什么做不到？", "back": "需解 x³−3x−1=0，其根不能用平方根表达（伽罗瓦群 S₃ 不可解）", "tags": ["研究"]}]}, "rendered": {"ch01": "<h1>第 1 章：数学是做什么的<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无\n<\/li><li>\n<strong>对应原书<\/strong>：第 I 部分 I.1「数学是做什么的」（原书 p42—50），另可参看 I.4「数学研究的一般目的」\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出本书回答&quot;什么是数学&quot;的办法，以及它为什么不给定义。\n<\/li><li>\n用代数、几何、分析三分法给一个陌生命题归类，并说明这个分法的局限。\n<\/li><li>\n说出至少六个主要分支各自关心什么，以及它们之间的交叉关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这本书不定义数学，它用一组条目把数学的概念、定理和应用摊开，让你自己看出这门学科在做什么。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：条目式写作（难度：基础）<\/h3>\n<p>《普林斯顿数学指南》的组织方式和教科书完全不同。它由一百多个独立条目组成，条目之间用编号互相引用，比如「见代数数 [IV.1]」表示去第 IV 部分第 1 条。全书分八部分：引论、历史起源、概念、分支、定理与问题、数学家传记、数学的影响、卷末杂谈。<\/p>\n<p>这种写法有个好处：你可以从任何一个入口进入，不必按顺序读。代价是它不给你一条现成的主线，主线要自己拼。<\/p>\n<p><strong>类比<\/strong>：像一座城市的地图册。每个街区有自己的图，街区之间有索引。想系统走一遍要自己规划路线，想查某个地址则翻一页就够。失效边界：地图册至少还有总图，本书的总图就是这一章和 I.4。<\/p>\n<h3>概念：三分法（难度：基础）<\/h3>\n<p>全书开篇给了一个粗略但有用的分类：数学分成<strong>代数<\/strong>、<strong>几何<\/strong>、<strong>分析<\/strong>三块。<\/p>\n<ul><li>\n代数关心结构：数系、多项式、群、环、域、向量空间。它问&quot;这类对象服从什么规律&quot;。\n<\/li><li>\n几何关心形状与空间：点、线、面、流形、度量、曲率。它问&quot;这些形状有什么关系&quot;。\n<\/li><li>\n分析关心极限与连续：函数、导数、积分、微分方程、无穷维空间。它问&quot;过程如何变化&quot;。\n<\/ul>\n<p>书里立刻加了限定：这个分法是按<strong>主题<\/strong>分的，但同一门学问也可以按<strong>问题类型<\/strong>分。两个领域主题材料差很远，考察的问题却可能很像，这种情况不少见。<\/p>\n<p><strong>实例<\/strong>：代数几何同时是代数的和几何的。它研究多项式方程组的解集，对象是几何的（比如球面可以写成 <code>x²+y²+z²=1<\/code> 的解集），方法是代数的。<\/p>\n<h3>概念：主要分支的一览（难度：基础）<\/h3>\n<p>I.1 第 2 节列了十个分支，每个一两段。这份名单值得记住，因为后面第 5 章会展开：<\/p>\n<table><thead><tr><th>分支<\/th><th>关心什么<\/th><\/tr><\/thead><tbody><tr><td>代数<\/td><td>群、环、域、模等结构与它们的表示<\/td><\/tr><tr><td>数论<\/td><td>整数的加法与乘法结构，素数分布，丢番图方程<\/td><\/tr><tr><td>几何<\/td><td>空间、度量、曲率、对称<\/td><\/tr><tr><td>代数几何<\/td><td>多项式方程组的解集，奇点，与数论和物理的联系<\/td><\/tr><tr><td>分析<\/td><td>极限、连续、微分方程、无穷维空间<\/td><\/tr><tr><td>逻辑<\/td><td>形式系统、可证性、模型<\/td><\/tr><tr><td>组合学<\/td><td>计数、排列、图与网络<\/td><\/tr><tr><td>理论计算机科学<\/td><td>算法、复杂性、可计算性<\/td><\/tr><tr><td>概率论<\/td><td>随机现象、分布、极限定理<\/td><\/tr><tr><td>数学物理<\/td><td>用数学描述自然规律，反哺数学<\/td><\/tr><\/tbody><\/table>\n<p>书里特别指出：这些分支之间不是并列关系，而是互相借用。代数拓扑的名字里就同时有三个词，它用代数工具研究拓扑对象，而那些对象的性质又来自分析。<\/p>\n<h3>概念：按问题类型分类（难度：进阶）<\/h3>\n<p>除了按主题分，还可以按&quot;数学家爱想什么问题&quot;分。同一个工具会在很多领域出现：找不变量、构造反例、分类、证明不存在、估计增长速度。I.4 那一篇就是从这里切入的，末尾还讨论了数学论文的构成（定义、定理、证明、例子、猜想各承担什么角色）。<\/p>\n<p><strong>类比<\/strong>：按主题分类像按部门分办公室，按问题分类像按工作方式分。后者更能看出数学的统一性。失效边界：问题类型没有公认的完整清单，只能举例说明。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[数学] --&gt; B[代数 结构]\n    A --&gt; C[几何 形状]\n    A --&gt; D[分析 极限]\n    B --&gt; E[数论]\n    B --&gt; F[代数几何]\n    C --&gt; F\n    D --&gt; G[微分方程]\n    C --&gt; H[拓扑]\n    B --&gt; H\n    E --&gt; I[算术几何]\n    F --&gt; I<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条主线各有独立分支，交叉处生出新领域。代数几何、拓扑、算术几何都坐在两条线之间，这正是书里反复强调的&quot;交织&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：三分法像把一座城市分成居住区、商业区、工业区。分区有用，但很多建筑同时属于两类，硬分反而看不清。失效边界：城市分区是行政划分，数学分支是研究传统的划分，边界本来就在移动。<\/p>\n<p><strong>实例<\/strong>：判断&quot;证明五次方程不能用根式解&quot;属于哪一块。它用的是群论（代数），讨论的对象是方程的解（代数），但结论是关于&quot;能不能用某种运算表达&quot;的，带一点逻辑味道。书里把它放在代数条目下，同时标注它依赖对称群的结构。这说明分类是粗线条的，一个命题可以同时落在几处。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为这本书是百科全书的替代品<\/strong>——序里明确说&quot;这不是一部百科全书&quot;，它选的是有代表性的条目，不追求全。\n<\/li><li>\n<strong>别以为三分法是严格分类<\/strong>——书里自己说这只是最初的近似，后面要加各种修饰。\n<\/li><li>\n<strong>别以为读这本书要从头读到尾<\/strong>——条目式结构允许跳读，但跳读需要自己补主线，这一章就是补主线的起点。\n<\/li><li>\n<strong>别以为分支名单是固定的<\/strong>——数学在长，名单也在变，比如理论计算机科学进入主流视野只是近几十年的事。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：本书回答&quot;什么是数学&quot;的办法是（　）。\n<ul>\n<li>\nA. 给出严格定义\n<\/li><li>\nB. 描述主要概念、定理和应用\n<\/li><li>\nC. 只讲历史\n<\/li><li>\nD. 只讲分支名单\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：序言明确说不试图定义数学，而是通过描述概念、定理和应用给出看法。<\/p>\n<ol><li>\n<strong>填空<\/strong>：全书把数学粗略分成代数、几何和（　）三块。\n<\/ol>\n<p><strong>答案：分析<\/strong>。解析：这是 I.1 第 1 节给出的最初近似分类。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么说代数几何同时是代数的和几何的？\n<\/ol>\n<p><strong>答案要点<\/strong>：它研究的对象是多项式方程组的解集，这是几何对象（例如球面是二次方程的解集）；它使用的方法是多项式与交换代数，这是代数工具。对象属几何，方法属代数，两者在奇点理论、与数论和物理的联系上交织。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n这本书是条目式结构，靠交叉编号连接，主线要自己拼。\n<\/li><li>\n三分法（代数、几何、分析）是按主题的粗分，按问题类型分是另一条路。\n<\/li><li>\n主要分支互相借用工具，交叉处正是新领域生长的地方。\n<\/ul>", "ch02": "<h1>第 2 章：数学的语言与语法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 I 部分 I.2「数学的语言和语法」、I.3「一些基本的数学定义」（原书 p51—80）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用集合、函数、关系、二元运算四个概念描述一个数学结构。\n<\/li><li>\n看懂 <code>∀<\/code>、<code>∃<\/code>、<code>¬<\/code>、<code>∧<\/code>、<code>∨<\/code> 这几个符号，能正确否定一个带量词的命题。\n<\/li><li>\n说出群、域、向量空间、环各自由哪几条公理定义。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>数学的语法只有四件东西：集合装对象，函数连对象，关系说对象之间如何，运算在对象上做组合。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：集合（难度：基础）<\/h3>\n<p><strong>集合<\/strong>是一堆对象。写法 <code>{1,2,3}<\/code>、<code>{x : x 是素数}<\/code>。基本运算：并 <code>∪<\/code>、交 <code>∩<\/code>、差 <code>\\<\/code>、补。<\/p>\n<p>关键区别：<code>∈<\/code>（属于）和 <code>⊂<\/code>（包含于）不是一回事。<code>1 ∈ {1,2}<\/code>，<code>{1} ⊂ {1,2}<\/code>。<\/p>\n<p>集合描述的对象可以是任何东西：数、函数、曲线、其他集合。这一点让集合成为统一语言。<\/p>\n<h3>概念：函数（难度：基础）<\/h3>\n<p><strong>函数<\/strong>是从一个集合到另一个集合的规则，每个输入对应唯一输出。记号 <code>f: A → B<\/code>。<\/p>\n<p>三类特殊函数：<strong>单射<\/strong>（不同输入给不同输出）、<strong>满射<\/strong>（每个输出都有输入对应）、<strong>双射<\/strong>（两者都满足）。双射才有反函数。<\/p>\n<p><strong>类比<\/strong>：函数像自动售货机。投一个币，出一个确定的东西。单射是&quot;不同币出不同货&quot;，满射是&quot;货架上的货都能买到&quot;，双射是两者兼备。失效边界：售货机可能卡货（对应关系不成立），数学函数不允许。<\/p>\n<h3>概念：关系（难度：基础）<\/h3>\n<p><strong>关系<\/strong>是有序对的集合，<code>R ⊂ A × B<\/code>。等价关系要满足三条：自反（<code>aRa<\/code>）、对称（<code>aRb<\/code> 则 <code>bRa<\/code>）、传递（<code>aRb<\/code> 且 <code>bRc<\/code> 则 <code>aRc<\/code>）。<\/p>\n<p>等价关系的作用是把集合切成互不相交的类。整数的同余 <code>mod 5<\/code> 就是等价关系，把整数分成五类。<\/p>\n<p><strong>序关系<\/strong>是另一类，满足自反、反对称、传递。它不分类，它排序。<\/p>\n<h3>概念：二元运算（难度：基础）<\/h3>\n<p><strong>二元运算<\/strong>是 <code>A × A → A<\/code> 的映射，比如加法、乘法。它要满足的公理定义了各种代数结构：<\/p>\n<table><thead><tr><th>结构<\/th><th>公理要点<\/th><\/tr><\/thead><tbody><tr><td>群<\/td><td>封闭、结合、有单位元、每元有逆<\/td><\/tr><tr><td>环<\/td><td>加法成群，乘法结合，分配律<\/td><\/tr><tr><td>域<\/td><td>环且非零元对乘法成群（可除）<\/td><\/tr><tr><td>向量空间<\/td><td>加法成群，标量乘法满足分配与结合<\/td><\/tr><\/tbody><\/table>\n<p><strong>实例<\/strong>：整数对加法成群（<code>(Z,+)<\/code>），对乘法不成群（2 没有整数逆元）。去掉 0 的有理数对乘法成群（<code>(Q\\{0},·)<\/code>）。<\/p>\n<h3>概念：逻辑与量词（难度：进阶）<\/h3>\n<p><code>∀<\/code>（对所有）、<code>∃<\/code>（存在）、<code>¬<\/code>（非）、<code>∧<\/code>（且）、<code>∨<\/code>（或）、<code>→<\/code>（蕴含）。<\/p>\n<p><strong>否定一个量词命题<\/strong>是最容易出错的地方。规则是：<\/p>\n<p><code>¬(∀x, P(x))<\/code> 等价于 <code>∃x, ¬P(x)<\/code> <code>¬(∃x, P(x))<\/code> 等价于 <code>∀x, ¬P(x)<\/code><\/p>\n<p>也就是说，否定时量词翻转，谓词取反。<\/p>\n<p><strong>实例<\/strong>：&quot;所有天鹅都是白的&quot;的否定不是&quot;所有天鹅都不是白的&quot;，而是&quot;存在一只天鹅不是白的&quot;。这两句话的强度差别很大。<\/p>\n<p><strong>自由变项与约束变项<\/strong>：被量词管住的变量是约束的，换了名字不影响命题；没被管住的是自由的，取值不同命题真假不同。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[集合] --&gt; B[笛卡尔积]\n    B --&gt; C[关系]\n    B --&gt; D[函数]\n    A --&gt; E[二元运算]\n    E --&gt; F[群]\n    E --&gt; G[环]\n    G --&gt; H[域]\n    E --&gt; I[向量空间]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：所有结构都从集合出发，经笛卡尔积分出两条路：一条通向关系与函数，一条通向运算与代数结构。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：这四个概念像语法里的名词、动词、介词、连词。集合是名词，函数是动词，关系是介词，运算是构词规则。失效边界：自然语言允许歧义，数学语法不允许，每个符号只有一个意思。<\/p>\n<p><strong>实例<\/strong>：判断 <code>(Z₅, +)<\/code> 是不是群，其中 Z₅ 是模 5 的剩余类。<\/p>\n<p>封闭：两数相加仍是剩余类，成立。结合：继承整数的结合律。单位元：0。逆元：<code>−a ≡ 5−a<\/code>。四条都满足，是群。它还是交换群，因为加法可交换。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 <code>∈<\/code> 和 <code>⊂<\/code> 可以互换<\/strong>——元素与集合、集合与集合，是两层关系。\n<\/li><li>\n<strong>别以为否定命题就是把&quot;是&quot;改成&quot;不是&quot;<\/strong>——量词必须翻转，否则强度会错。\n<\/li><li>\n<strong>别以为群必须可交换<\/strong>——交换群是特殊情形，一般群不要求交换（矩阵乘法就是反例）。\n<\/li><li>\n<strong>别以为关系只有大小关系<\/strong>——等价关系、偏序关系、函数关系都是关系，各有各的公理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：&quot;所有实数都有平方根&quot;的否定是（　）。\n<ul>\n<li>\nA. 所有实数都没有平方根\n<\/li><li>\nB. 存在一个实数没有平方根\n<\/li><li>\nC. 存在一个实数有平方根\n<\/li><li>\nD. 没有实数有平方根\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：否定全称命题得到存在命题，谓词取反，即&quot;存在实数没有平方根&quot;，负数就是这样的实数。<\/p>\n<ol><li>\n<strong>填空<\/strong>：只满足封闭、结合、有单位元、每元有逆这四条的结构叫（　）。\n<\/ol>\n<p><strong>答案：群<\/strong>。解析：这正是群的四条公理。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么&quot;同余 mod 5&quot;是一个等价关系？\n<\/ol>\n<p><strong>答案要点<\/strong>：自反：<code>a ≡ a<\/code>，因为 a−a=0 能被 5 整除。对称：若 <code>a−b<\/code> 能被 5 整除，则 <code>b−a<\/code> 也能。传递：若 <code>a−b<\/code> 与 <code>b−c<\/code> 都能被 5 整除，则 <code>a−c=(a−b)+(b−c)<\/code> 也能。三条满足，所以是等价关系，它把整数分成五个等价类。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n集合、函数、关系、运算四个概念足以搭出全部代数结构。\n<\/li><li>\n否定带量词的命题时，量词翻转、谓词取反，这是最容易错的一步。\n<\/li><li>\n群、环、域、向量空间的差别只在公理的取舍，看公理清单最快。\n<\/ul>\n<h2>相关条目<\/h2>\n<ul><li>\n群与域：[I.3 §2.1—§2.2]\n<\/li><li>\n集合与基数：[III.7]、[III.11]\n<\/li><li>\n逻辑与模型：[IV.23]\n<\/ul>", "ch03": "<h1>第 3 章：现代数学的起源<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 1、2 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 II 部分「现代数学的起源」（原书 p156—276），重点看 II.1 数、II.2 几何、II.3 抽象代数、II.4 算法、II.6 分析的严格化、II.7 证明的概念\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n讲出数系从自然数扩张到复数、四元数的每一步，以及每一步解决了什么问题。\n<\/li><li>\n说出几何经历的三次转向：公理化、解析化、非欧化。\n<\/li><li>\n解释分析为什么要严格化，魏尔斯特拉斯和柯西各自解决了什么。\n<\/li><li>\n说出证明概念在 20 世纪发生了什么变化。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>现代数学的形态不是一次设计出来的，是四场连续的&quot;补漏&quot;——补数系的洞、补几何的假设、补分析的漏洞、补证明的根基——累积出来的。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：数系的四次扩张（难度：基础）<\/h3>\n<p>数系的每一步都是&quot;旧系统里有做不了的运算&quot;，于是造一个新系统让它可做。<\/p>\n<table><thead><tr><th>扩张<\/th><th>解决的运算<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td>自然数 → 整数<\/td><td>减法 <code>3−5<\/code><\/td><td>引入负数，失去&quot;良序&quot;<\/td><\/tr><tr><td>整数 → 有理数<\/td><td>除法 <code>2÷3<\/code><\/td><td>引入分数，稠密但有空隙<\/td><\/tr><tr><td>有理数 → 实数<\/td><td>开方、极限<\/td><td>要用戴德金分割或柯西序列定义，失去可数性<\/td><\/tr><tr><td>实数 → 复数<\/td><td><code>x²+1=0<\/code><\/td><td>失去序关系，得到代数闭域<\/td><\/tr><\/tbody><\/table>\n<p>复数之后还有四元数，代价更大：乘法不再交换。每一步都是拿一条性质换一条能力，这个模式在数学里反复出现。<\/p>\n<p><strong>实例<\/strong>：<code>x²+1=0<\/code> 在实数里无解，引入 <code>i<\/code> 后有两个解 <code>±i<\/code>。高斯证明复数域是代数闭的：任何多项式在复数里都能分解成一次因子之积。这就是&quot;拿序换完备&quot;的收益。<\/p>\n<p><strong>类比<\/strong>：像修房子时不断加层。每加一层能住更多人，但结构必须重新验算。失效边界：数学的扩张不涉及物理限制，可以一直加下去（四元数、八元数），但每加一层要放弃一条运算律。<\/p>\n<h3>概念：几何的三次转向（难度：进阶）<\/h3>\n<p><strong>第一次：公理化。<\/strong> 欧几里得把几何建立在五条公设上。十九世纪发现第五公设（平行公设）不能由前四条推出，于是有了非欧几何。<\/p>\n<p><strong>第二次：解析化。<\/strong> 笛卡尔把点对应到坐标，几何问题变成方程问题。这一步让几何能用代数算。<\/p>\n<p><strong>第三次：变换化与拓扑化。<\/strong> 克莱因的埃尔朗根纲领说：几何就是研究在某个变换群下不变的性质。欧氏几何研究刚体变换下的不变量（距离、角度），射影几何研究射影变换下的不变量（交比），拓扑研究连续形变下的不变量（连通性、亏格）。<\/p>\n<p>这三步之后，几何不再只是&quot;研究图形的形状&quot;，而是&quot;研究某类变换下的不变量&quot;。<\/p>\n<h3>概念：抽象代数的诞生（难度：进阶）<\/h3>\n<p>十九世纪解方程的努力催生了群论。伽罗瓦发现：一个多项式能不能用根式解，取决于它的根之间的对称群是否可解。这个结论把&quot;解方程&quot;变成了&quot;研究群的结构&quot;。<\/p>\n<p>随后，群、环、域、模被一条条公理定义出来，代数从&quot;算具体对象&quot;变成&quot;研究满足公理的所有对象&quot;。这个转向的收益是：证一次定理，对所有满足公理的对象都成立。<\/p>\n<p><strong>实例<\/strong>：<code>x⁵−x−1=0<\/code> 不能用根式解，因为它的伽罗瓦群是 S₅，而 S₅ 不可解（唯一正规子群链里有 A₅，A₅ 是单群且非交换）。这个结论不是靠试算得出的，是靠群的结构。<\/p>\n<h3>概念：分析的严格化（难度：进阶）<\/h3>\n<p>牛顿和莱布尼茨的微积分用的是&quot;无穷小&quot;，这个说法在逻辑上站不住。柯西把极限定义成&quot;ε-δ&quot;语言，魏尔斯特拉斯造出处处连续但处处不可导的函数，逼着大家承认&quot;直觉不可靠&quot;。<\/p>\n<p>严格化的结果：极限、连续、收敛都有了精确定义，分析从&quot;图形直觉&quot;变成&quot;不等式估计&quot;。二十世纪又把函数空间抽象成巴拿赫空间、希尔伯特空间，分析的对象从函数变成空间。<\/p>\n<h3>概念：证明概念的变化（难度：高难）<\/h3>\n<p>十九世纪末，康托尔的集合论被发现含悖论（罗素悖论：<code>R = {x : x ∉ x}<\/code>，问 <code>R ∈ R<\/code> 是否成立，两个答案都矛盾）。这引发了对数学根基的重新审查。<\/p>\n<p>三个主要方案：逻辑主义（把数学归约到逻辑）、直觉主义（拒绝排中律，只承认可构造的对象）、形式主义（把数学看成符号游戏，用希尔伯特纲领证明其一致性）。哥德尔 1931 年的不完备定理终结了最乐观的版本：任何足够强的形式系统里，都存在既不能证明也不能否证的真命题。<\/p>\n<p>这不代表数学垮了，而是说&quot;证明&quot;这件事本身有边界。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[数系扩张 N 到 Z 到 Q 到 R 到 C] --&gt; E[现代数学]\n    B[几何转向 公理 解析 变换] --&gt; E\n    C[代数转向 具体到公理结构] --&gt; E\n    D[分析严格化 ε-δ 函数空间] --&gt; E\n    F[基础危机 悖论 不完备] --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条线各自解决一类问题，最后汇到&quot;现代数学&quot;这个形态。最下面那条不是建设性的，它是审查性的，作用是给前三条划线。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：现代数学的形成像城市改造。老城区有历史遗留的窄巷（无穷小的模糊），有地基问题（集合论悖论），有新城规划（公理化）。改造不是推倒重来，是一块块补。失效边界：城市改造有完工日，数学没有，新领域还在长。<\/p>\n<p><strong>实例<\/strong>：证明 <code>√2<\/code> 不是有理数。设 <code>√2 = p/q<\/code>，p、q 互素。平方得 <code>2q² = p²<\/code>，故 p 为偶数，设 <code>p=2k<\/code>，代回得 <code>q²=2k²<\/code>，q 也为偶数，与互素矛盾。这个证明只用整数性质，不需要实数理论，是&quot;扩张前&quot;的典型论证。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为非欧几何是&quot;错的几何&quot;<\/strong>——它只是换了一条公设，在球面或双曲面上照样成立，而且有物理应用（广义相对论的时空几何）。\n<\/li><li>\n<strong>别以为数系扩张只是&quot;加新数&quot;<\/strong>——每次扩张都要放弃旧性质（负数失去良序，复数失去序），是有代价的。\n<\/li><li>\n<strong>别以为哥德尔定理说明数学不可靠<\/strong>——它限制的是形式系统的完备性，不是说已证的定理错了。\n<\/li><li>\n<strong>别以为分析严格化是数学家吹毛求疵<\/strong>——处处不可导的连续函数、病态的反例，都是严格化逼出来的真实对象。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：克莱因的埃尔朗根纲领说几何研究的是（　）。\n<ul>\n<li>\nA. 图形的形状\n<\/li><li>\nB. 某变换群下的不变量\n<\/li><li>\nC. 坐标系的选择\n<\/li><li>\nD. 公理的数目\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：纲领的核心是&quot;几何等于变换群下的不变量理论&quot;，不同几何对应不同变换群。<\/p>\n<ol><li>\n<strong>填空<\/strong>：任何次数大于等于 1 的多项式在复数域内都能分解成一次因子之积，这个性质叫代数（　）。\n<\/ol>\n<p><strong>答案：闭<\/strong>。解析：这就是代数闭域的定义，高斯-达朗贝尔定理保证复数域满足它。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么 <code>x⁵−x−1=0<\/code> 不能用根式解？\n<\/ol>\n<p><strong>答案要点<\/strong>：伽罗瓦理论把&quot;能否根式解&quot;翻译成&quot;伽罗瓦群是否可解&quot;。这个方程的伽罗瓦群是 S₅，S₅ 的唯一正规子群链中含 A₅，而 A₅ 是非交换单群，所以 S₅ 不可解。因此方程不能用根式解。这个结论是结构性的，不依赖具体系数。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n数系每扩张一步，都用一条性质换一条能力。\n<\/li><li>\n几何的核心问题从&quot;形状&quot;变成&quot;变换下的不变量&quot;。\n<\/li><li>\n哥德尔不完备定理重新划定了&quot;证明&quot;能走多远。\n<\/ul>\n<h2>相关条目<\/h2>\n<ul><li>\n数：[II.1]\n<\/li><li>\n几何：[II.2]、[III.26]（几何学）\n<\/li><li>\n抽象代数：[II.3]、[IV.2]（群论）\n<\/li><li>\n算法：[II.4]、[IV.20]（计算复杂性）\n<\/li><li>\n分析的严格化：[II.6]\n<\/li><li>\n证明的概念：[II.7]、[V.15]（哥德尔定理）\n<\/ul>", "ch04": "<h1>第 4 章：概念的词典<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2、3 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 III 部分「数学的概念」（原书 p277—544），本章只选八条最常用的概念\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清基数、维、亏格这三个&quot;数&quot;各自量的是什么。\n<\/li><li>\n说明紧性、对偶性、范畴三件事为什么在多个分支里反复出现。\n<\/li><li>\n用傅里叶变换的视角解释&quot;换一组基去看同一个对象&quot;这个动作。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一部分给的是概念词典：每一个词在数学各处反复出现，理解它的准确含义，比记住它在某一章的定义更有用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：基数（难度：基础）<\/h3>\n<p><strong>基数<\/strong>量的是集合的大小，但&quot;大小&quot;要按一一对应来比，不按数个数。两个集合基数相同，当且仅当存在双射。<\/p>\n<p>有限集合的基数就是元素个数。无限集合就不一样了：自然数与偶数基数相同（<code>n ↔ 2n<\/code> 是双射），尽管偶数只是自然数的一部分。这说明&quot;部分可以和整体一样大&quot;，无限集合的这个特征正是它的定义性特征。<\/p>\n<p><strong>可数<\/strong>：能与自然数一一对应。有理数可数，实数不可数（康托尔对角线论证）。<\/p>\n<p><strong>类比<\/strong>：点人数时不用数,让每个人找一个座位，坐满了且没空座，人数就和座位一样。失效边界：无限集合的&quot;座位&quot;需要显式构造双射，不能靠直观。<\/p>\n<h3>概念：紧性（难度：进阶）<\/h3>\n<p><strong>紧空间<\/strong>的定义：任何开覆盖都有有限子覆盖。直观上它排除了&quot;跑到无穷去&quot;和&quot;越靠近边界越挤&quot;这两种情况。<\/p>\n<p>实数里的等价说法：有界闭区间 <code>[a,b]<\/code> 是紧的。这个性质的价值在于：紧集上的连续函数一定取到最大值和最小值。这就是极值定理成立的原因。<\/p>\n<p><strong>为什么重要<\/strong>：分析里大量&quot;存在性&quot;结论都要靠紧性。想证明某个东西存在，常用套路是构造一个序列，用紧性抽出收敛子列，再证明极限就是所要的东西。<\/p>\n<h3>概念：曲率（难度：进阶）<\/h3>\n<p>曲线在一点的<strong>曲率<\/strong>是切线转角对弧长的变化率，<code>κ = dθ/ds<\/code>。圆的曲率是 <code>1/R<\/code>，直线是 0。<\/p>\n<p>曲面有两个<strong>主曲率<\/strong> <code>κ₁<\/code>、<code>κ₂<\/code>，对应两个主方向。<strong>高斯曲率<\/strong> <code>K = κ₁κ₂<\/code>。球面 <code>K = 1/R² &gt; 0<\/code>，平面和圆柱 <code>K = 0<\/code>，马鞍面 <code>K &lt; 0<\/code>。<\/p>\n<p>高斯绝妙定理说：高斯曲率是<strong>内蕴<\/strong>的，只靠曲面上的测量就能定出，不需要看它在三维空间里怎么弯。这条定理是微分几何的转折点。它还有个推论：曲率不为零的曲面不能等距摊平到平面，地图必然变形。<\/p>\n<h3>概念：维（难度：进阶）<\/h3>\n<p>日常的维是&quot;需要几个坐标定位一个点&quot;。数学里的维有好几种定义，彼此不一定等价：拓扑维（覆盖的精细化）、豪斯多夫维（测度随尺度变化的指数）、代数维（独立参数个数）。<\/p>\n<p>它们给出不同答案的例子：分形曲线按拓扑维是 1，按豪斯多夫维可能介于 1 与 2 之间。这说明&quot;维&quot;不是一个绝对的东西，要看用什么尺子量。<\/p>\n<p><strong>实例<\/strong>：康托尔集去掉中间三分之一反复进行，豪斯多夫维是 <code>log 2 / log 3 ≈ 0.63<\/code>，比 0 大比 1 小。<\/p>\n<h3>概念：对偶性（难度：高难）<\/h3>\n<p><strong>对偶<\/strong>是&quot;同一个对象的两套描述，互相翻译&quot;。向量空间与它的对偶空间（线性泛函构成的空间）是最基本的例子。有限维时它们同构，但同构不自然，没有典范的对应。<\/p>\n<p>对偶的价值在于：把难的问题搬到对偶那边可能变简单。傅里叶变换是一种对偶（位置与频率），庞加莱对偶把同调群的高低维接起来，射影几何的对偶把点与线互换而定理仍然成立。<\/p>\n<h3>概念：范畴（难度：高难）<\/h3>\n<p><strong>范畴<\/strong>由对象和对象之间的态射组成。函子是范畴之间的映射，自然变换是函子之间的映射。<\/p>\n<p>它的作用是把&quot;结构保持的映射&quot;这件事本身对象化。群同态、连续映射、线性映射，在范畴语言里都是态射，很多定理可以统一陈述。<\/p>\n<p><strong>类比<\/strong>：范畴像把&quot;翻译&quot;这件事本身当作研究对象。不是研究两种语言，而是研究&quot;什么样的翻译算合格&quot;。失效边界：范畴论抽象层次高，入门阶段容易只见形式不见内容，先有具体例子再学它更稳。<\/p>\n<h3>概念：亏格与傅里叶变换（难度：进阶）<\/h3>\n<p><strong>亏格<\/strong>是曲面上&quot;洞的个数&quot;。球面 0，环面 1。它是拓扑不变量，连续形变不改变它。欧拉示性数 <code>χ = V−E+F<\/code> 与亏格的关系是 <code>χ = 2−2g<\/code>。<\/p>\n<p><strong>傅里叶变换<\/strong>把函数拆成不同频率的成分。<code>f̂(ξ)=∫f(x)e^(−2πixξ)dx<\/code>。它的意义是换一组基：原来按位置描述，现在按频率描述。卷积在频率域变成乘法，微分变成乘以 <code>iξ<\/code>，很多难题因此变简单。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[概念词典] --&gt; B[量大小 基数]\n    A --&gt; C[量形状 曲率 亏格 维]\n    A --&gt; D[量结构 紧性 对偶 范畴]\n    B --&gt; E[判断无穷的等级]\n    C --&gt; F[区分空间的性质]\n    D --&gt; G[统一不同分支的语言]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：八个词按&quot;量什么&quot;分成三组。左组管大小，中组管形状，右组管结构。每一组都能在多个分支里找到用例。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：概念词典像工具箱里的量具。卡尺量长度，量角器量角度，万用表量电路。用错量具不是工具坏了，是问题没看清。失效边界：数学概念比量具灵活，同一个词在不同分支可能有不同定义（比如&quot;维&quot;），要先确认语境。<\/p>\n<p><strong>实例<\/strong>：判断环面与球面是否同胚。看亏格：球面 0，环面 1，亏格是拓扑不变量，所以不同胚。这个判断不需要构造任何映射，只看一个数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;部分不能等于整体&quot;<\/strong>——无限集合里这经常发生，这正是无限的定义性特征。\n<\/li><li>\n<strong>别以为曲率必须看三维嵌入<\/strong>——高斯曲率是内蕴的，曲面上的生物也能测出来。\n<\/li><li>\n<strong>别以为维只有一个定义<\/strong>——拓扑维、豪斯多夫维、代数维可以给出不同数值。\n<\/li><li>\n<strong>别以为对偶是&quot;另一个对象&quot;<\/strong>——对偶是同一個对象的另一套描述，翻译过去再翻回来应当无损。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：自然数集与偶数集的基数关系是（　）。\n<ul>\n<li>\nA. 前者更大\n<\/li><li>\nB. 后者更大\n<\/li><li>\nC. 相同\n<\/li><li>\nD. 无法比较\n<\/ul>\n<\/ol>\n<p><strong>答案：C<\/strong>。解析：<code>n ↔ 2n<\/code> 构成双射，两者基数相同，都是可数无穷。<\/p>\n<ol><li>\n<strong>填空<\/strong>：球面的亏格是（　）。（填数字）\n<\/ol>\n<p><strong>答案：0<\/strong>。解析：球面没有洞，亏格为 0，欧拉示性数为 2。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么紧性对&quot;存在性&quot;证明特别有用？\n<\/ol>\n<p><strong>答案要点<\/strong>：紧性保证任何序列都有收敛子列（在度量空间里等价于序列紧），于是可以&quot;先构造一个逼近序列，再从中抽出收敛的那一支，极限就是所求对象&quot;。极值定理、常微分方程解的存在性、变分问题的最小元，都走这条路。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n基数按一一对应比，不按数个数；无限集合的部分可以与整体等大。\n<\/li><li>\n高斯曲率是内蕴量，曲率非零则无法等距摊平。\n<\/li><li>\n对偶、范畴、紧性都是&quot;跨分支通用&quot;的概念，看到一个分支里用了，别处多半也有对应。\n<\/ul>\n<h2>相关条目<\/h2>\n<ul><li>\n基数：[III.1]\n<\/li><li>\n范畴论：[III.2]、[IV.24]\n<\/li><li>\n紧性：[III.3]\n<\/li><li>\n曲率：[III.4]、[IV.4]\n<\/li><li>\n维：[III.5]\n<\/li><li>\n对偶：[III.6]\n<\/li><li>\n亏格：[III.13]\n<\/li><li>\n傅里叶变换：[III.10]、[IV.11]\n<\/ul>", "ch05": "<h1>第 5 章：数学的各个分支<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 3、4 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 IV 部分「数学的各个分支」（原书 p545—1138），本章选八个分支各给一段定位\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出每个主要分支研究的核心对象和典型问题。\n<\/li><li>\n判断两个分支之间的借用关系，比如表示论为什么服务于数论。\n<\/li><li>\n拿到一个新术语，能大致判断它属于哪个分支。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>分支的差别不在对象，而在&quot;它问什么样的问题&quot;；同一个对象被不同分支问，就长出不同的学问。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>分支：数论（难度：进阶）<\/h3>\n<p>研究整数的加法与乘法结构。核心问题：素数怎么分布、丢番图方程有没有解、同余式的解怎么数。<\/p>\n<p>方法从初等（欧几里得算法、二次互反律）到解析（黎曼 ζ 函数）到代数（代数数域、模形式）。二十世纪最大的进展是把数论与几何、表示论接起来，怀尔斯证费马大定理用的就是这条路。<\/p>\n<p><strong>典型命题<\/strong>：素数有无穷多个（欧几里得证明：假设有限，乘起来加一，得到新素数或矛盾）。<\/p>\n<h3>分支：代数几何（难度：高难）<\/h3>\n<p>研究多项式方程组的解集。核心对象是代数簇，工具是交换代数与层论。它同时是代数的（对象由多项式定义）和几何的（解集是空间）。<\/p>\n<p>二十年来的主线之一是把&quot;奇点&quot;搞清楚：解集大多数地方像流形，少数点例外。锥面的顶点就是奇点。<\/p>\n<h3>分支：几何与拓扑（难度：进阶）<\/h3>\n<p><strong>几何<\/strong>研究带度量或结构的空间：欧氏、射影、双曲、黎曼、辛。核心问题是分类与不变量。<\/p>\n<p><strong>拓扑<\/strong>研究连续形变下不变的性质。基本群、同调群、同伦群是主要工具。它有一个反直觉的特点：允许任意拉伸挤压，只要不撕开不粘合。<\/p>\n<p>两者关系：几何问&quot;度量是什么&quot;，拓扑问&quot;形状的骨架是什么&quot;。庞加莱猜想就是拓扑问题（三维流形是否同胚于球面），用的工具却来自几何（黎奇流）。<\/p>\n<h3>分支：表示论（难度：高难）<\/h3>\n<p>把抽象群&quot;表示&quot;成矩阵群，也就是让每个群元素对应一个可逆矩阵，乘法保持。好处是抽象结构变成可以计算的对象。<\/p>\n<p>它服务的对象很广：量子力学里的对称性、数论里的伽罗瓦表示、组合学里的对称函数。有限群的表示理论是十九世纪末到二十世纪的重要成果，特征标理论是它的核心工具。<\/p>\n<h3>分支：偏微分方程（难度：高难）<\/h3>\n<p>研究含多个变量偏导数的方程。三类基本方程各管一类物理：椭圆（稳态）、抛物（扩散）、双曲（波动）。<\/p>\n<p>核心问题：解存不存在、唯不唯一、稳不稳定。这三件事合称&quot;适定性&quot;。方法从分离变量、傅里叶分析到变分法、弱解理论。<\/p>\n<h3>分支：组合学（难度：进阶）<\/h3>\n<p>研究离散结构的计数与构造：排列、图、网络、划分。它和概率、计算机科学关系密切，算法分析里到处都是组合估计。<\/p>\n<p><strong>典型结果<\/strong>：拉姆齐定理说，足够大的完全图染色后必然出现单色三角形。这类&quot;大到一定程度必然出现某种结构&quot;的结论是组合学的特色。<\/p>\n<h3>分支：逻辑与集合论（难度：高难）<\/h3>\n<p>逻辑研究形式系统：语言、公理、推理规则、模型。集合论研究无穷集合的层级与公理系统（ZFC）。<\/p>\n<p>核心结果：哥德尔不完备定理（足够强的系统必有不可判定的命题）、连续统假设与 ZFC 独立（科恩的力迫法证明）。<\/p>\n<p>这两个分支的特殊之处：它们研究数学本身，是&quot;关于数学的数学&quot;。<\/p>\n<h3>分支：计算复杂性（难度：进阶）<\/h3>\n<p>研究问题的计算难度：需要多少时间、多少空间。P 与 NP 是否相等是最大的开放问题。<\/p>\n<p>它和组合学、逻辑都有交叉。它的价值不只是理论：密码学的安全假设就建立在&quot;某些问题难算&quot;之上，一旦 P=NP，现有公钥体系全部崩塌。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[数论] --&gt; B[代数几何]\n    C[代数] --&gt; B\n    B --&gt; D[算术几何]\n    E[拓扑] --&gt; F[几何]\n    F --&gt; G[PDE]\n    H[表示论] --&gt; A\n    H --&gt; G\n    I[组合] --&gt; J[复杂性]\n    I --&gt; K[概率]\n    L[逻辑] --&gt; K<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这张图不是分类，是&quot;谁借谁的力&quot;。表示论同时喂数论与物理，代数几何坐在代数与几何之间，组合学同时供概率与复杂性。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：分支像医院里的科室。内科外科看的是同一个人的不同问题，工具不同，会诊时互通。失效边界：科室边界是行政划的，数学分支的边界是研究传统自然形成的，经常移动。<\/p>\n<p><strong>实例<\/strong>：判断&quot;证明任意 6 人中必有 3 人互相认识或 3 人互相不认识&quot;属于哪个分支。它是拉姆齐数 R(3,3)=6 的经典结论，属组合学。证明方式是抽屉原理，不需要微积分。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为拓扑是&quot;橡皮几何&quot;所以没内容<\/strong>——允许连续形变后，剩下的不变量反而更难算，同伦群至今算不清楚。\n<\/li><li>\n<strong>别以为数论是&quot;纯算术&quot;<\/strong>——现代数论大量使用代数几何、表示论、解析方法。\n<\/li><li>\n<strong>别以为复杂性只关心计算机<\/strong>——它给&quot;什么算难&quot;一个数学定义，密码学的安全性就靠它。\n<\/li><li>\n<strong>别以为逻辑分支离应用很远<\/strong>——程序验证、类型论、数据库查询语言都从逻辑里长出来。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：研究&quot;连续形变下不变的性质&quot;的分支是（　）。\n<ul>\n<li>\nA. 代数几何\n<\/li><li>\nB. 拓扑\n<\/li><li>\nC. 表示论\n<\/li><li>\nD. 组合学\n<\/ul>\n<\/ol>\n<p><strong>答案：B<\/strong>。解析：拓扑的核心就是连续形变下的不变量，如连通性、亏格、基本群。<\/p>\n<ol><li>\n<strong>填空<\/strong>：把抽象群对应成矩阵群的分支叫（　）论。\n<\/ol>\n<p><strong>答案：表示<\/strong>。解析：表示论把群元素映成可逆矩阵，使抽象结构可以计算。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么 P 与 NP 是否相等会影响密码学？\n<\/ol>\n<p><strong>答案要点<\/strong>：现有公钥密码的安全性假设是&quot;某些问题（如大整数分解、离散对数）难算&quot;。若 P=NP，这些问题的多项式算法就存在，破解成本骤降，整套体系失效。所以这个理论问题有直接的安全后果。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n分支的分界在&quot;问什么问题&quot;，不在&quot;用什么对象&quot;。\n<\/li><li>\n表示论、代数几何、组合学都是&quot;服务型&quot;分支，同时供给多个领域。\n<\/li><li>\n复杂性理论与现实安全直接挂钩，不是纯理论游戏。\n<\/ul>\n<h2>相关条目<\/h2>\n<ul><li>\n数论：[IV.1]、[IV.2]\n<\/li><li>\n代数几何：[IV.3]、[IV.5]\n<\/li><li>\n几何与拓扑：[IV.4]、[IV.6]、[IV.8]\n<\/li><li>\n表示论：[IV.9]\n<\/li><li>\n偏微分方程：[IV.10]、[V.12]\n<\/li><li>\n组合学：[IV.17]、[IV.19]\n<\/li><li>\n逻辑与集合论：[IV.22]、[IV.23]\n<\/li><li>\n计算复杂性：[IV.20]\n<\/ul>", "ch06": "<h1>第 6 章：定理与未解问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 5 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 V 部分「定理与问题」（原书 p1139—1224），本章选九个最有代表性的\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出费马大定理、四色定理、庞加莱猜想各是什么问题，以及它们在什么年代被解决。\n<\/li><li>\n说明&quot;独立性&quot;是什么意思，连续统假设为什么既不能证也不能否。\n<\/li><li>\n分清哪些问题已解决、哪些还开放，以及开放问题为什么难。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一部分给的是数学的&quot;里程碑清单&quot;：有些问题耗了几百年才破，有些证明了&quot;永远破不了&quot;，有些还挂着。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>定理：费马大定理（难度：基础）<\/h3>\n<p><code>xⁿ+yⁿ=zⁿ<\/code> 在 n≥3 时没有正整数解。费马在《算术》书页边上写下这个断言，说&quot;空白太小写不下证明&quot;。<\/p>\n<p>1637 年提出，1994 年由怀尔斯（Andrew Wiles）证明，用了椭圆曲线与模形式的联系（谷山-志村猜想的一个情形）。证明长达 100 多页，中间曾出现漏洞，与泰勒合作修补后于 1995 年正式发表。<\/p>\n<p><strong>为什么难<\/strong>：它不是孤立问题。证明过程逼出了一个大学科（算术几何）的成熟，这也是它价值远超问题本身的原因。<\/p>\n<h3>定理：四色定理（难度：基础）<\/h3>\n<p>任何平面地图用四种颜色就能染，相邻区域不同色。<\/p>\n<p>1852 年提出，1976 年由阿佩尔与哈肯证明，第一次大规模依赖计算机穷举。这一点当时引起争议：算不算证明？后来 2005 年贡蒂埃用 Coq 完成了形式化验证，争议基本平息。<\/p>\n<p><strong>为什么值得记<\/strong>：它是&quot;计算机参与证明&quot;的分界点，此后数学证明的形态开始变化。<\/p>\n<h3>定理：有限单群的分类（难度：高难）<\/h3>\n<p>所有有限单群都被列出来了。结果是四大类：素数阶循环群、交错群、李型群、26 个散在单群。<\/p>\n<p>这项工作由上百位数学家从 1955 年做到 1980 年代，论文加起来数万页。中间出现过缺口，2004 年由阿斯赫巴赫尔与史密斯补上。<\/p>\n<p><strong>意义<\/strong>：单群是有限群的&quot;原子&quot;。分类完成，等于说&quot;有限群的构成元件已经全部知道&quot;。<\/p>\n<h3>定理：哥德尔不完备定理（难度：高难）<\/h3>\n<p>任何足够强、可递归公理化的形式系统，都存在一个命题，既不证明也不否证；而且系统不能在自身内部证明自己的一致性。<\/p>\n<p>1931 年发表。它终结了希尔伯特纲领的最强版本，但没有终结数学：它说的是形式系统有边界，不是说已证的结论错了。<\/p>\n<h3>问题：连续统假设（难度：高难）<\/h3>\n<p>连续统假设（CH）：实数集的基数等于最小的不可数基数，即 <code>2^ℵ₀ = ℵ₁<\/code>。<\/p>\n<p>哥德尔 1938 年证明 CH 与 ZFC 不矛盾（构造可构成宇宙 L），科恩 1963 年证明 CH 的否定也不矛盾（力迫法）。两者合起来说明 CH 独立于 ZFC：在标准公理系统里既不能证也不能否。<\/p>\n<p><strong>这意味着什么<\/strong>：集合论的公理不足以决定实数有多少。想要答案，必须加新公理，而加哪条是数学界的争论。<\/p>\n<h3>问题：P 与 NP（难度：进阶）<\/h3>\n<p>P 是多项式时间可解的问题类，NP 是多项式时间可验证解的问题类。P=NP 吗？<\/p>\n<p>这是千禧年大奖难题之一，仍未解决。多数人猜 P≠NP，但没有证明。它的实际意义极大：若 P=NP，公钥密码体系失效。<\/p>\n<h3>问题：庞加莱猜想（难度：高难）<\/h3>\n<p>三维球面是单连通的，任何没有洞的三维闭流形都同胚于三维球面。<\/p>\n<p>1904 年提出，2002—2003 年由佩雷尔曼用黎奇流解决。他拒绝菲尔兹奖与千禧年奖金，2010 年千禧年奖正式授予。<\/p>\n<h3>问题：黎曼假设（难度：高难）<\/h3>\n<p>黎曼 ζ 函数的非平凡零点都在临界线 <code>Re(s)=1/2<\/code> 上。1859 年提出，至今未解。<\/p>\n<p>它的重要性在于：素数的分布规律几乎完全取决于它。素数定理（1896 年由阿达马与德拉瓦莱普桑独立证明）是它的弱形式，已经解决；完整版本还挂着。<\/p>\n<h3>问题：ABC 猜想（难度：高难）<\/h3>\n<p>对互素的 <code>a+b=c<\/code>，<code>c<\/code> 大致不超过 <code>rad(abc)<\/code> 的 <code>1+ε<\/code> 次方，<code>rad<\/code> 是各素因子只取一次的乘积。<\/p>\n<p>1985 年由马瑟与奥斯特莱提出。它蕴含大量数论结论，包括费马大定理的渐近版本。2012 年望月新一宣称用他自创的 IUTT 理论证明，至今未获广泛接受，争议仍在。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[定理与问题] --&gt; B[已解决]\n    A --&gt; C[已证明不可判定]\n    A --&gt; D[仍开放]\n    B --&gt; E[费马大定理 1994]\n    B --&gt; F[四色定理 1976]\n    B --&gt; G[庞加莱猜想 2003]\n    B --&gt; H[有限单群分类 1980年代]\n    C --&gt; I[连续统假设 独立于 ZFC]\n    D --&gt; J[黎曼假设]\n    D --&gt; K[P 与 NP]\n    D --&gt; L[ABC 猜想 有争议]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三个分支对应三种状态。已解决的不一定是&quot;有答案&quot;，有些是&quot;证明了没有答案&quot;，这一类比另外两类更微妙。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：这些问题是数学的高峰。爬上去的路往往修出了新工具，工具比登顶本身更常用。失效边界：不是所有难题都产出工具，有些问题只是难，解决后没什么副产品。<\/p>\n<p><strong>实例<\/strong>：用 ABC 猜想推费马大定理的思路。设 <code>a=xⁿ<\/code>、<code>b=yⁿ<\/code>、<code>c=zⁿ<\/code> 互素。若 <code>n&gt;4<\/code>，取 <code>ε=1/6<\/code>，则 ABC 给出 <code>c &lt; K rad(abc)^(7/6)<\/code>，而 <code>rad(abc) ≤ abc &lt; c³<\/code>，于是 <code>c &lt; K c^(3×7/6) = K c^(3.5)<\/code>，取足够大的 c 就矛盾。所以 n&gt;4 时解只有有限多个。这是&quot;猜想蕴含定理&quot;的典型用法。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;独立于 ZFC&quot;等于&quot;没有真假&quot;<\/strong>——它在某个具体的模型里可以为真，在另一个里为假，是公理不够，不是命题无意义。\n<\/li><li>\n<strong>别以为计算机证明不算证明<\/strong>——只要验证过程可复核，逻辑上就成立；争议在&quot;人能不能读懂&quot;，不在&quot;对不对&quot;。\n<\/li><li>\n<strong>别以为黎曼假设只关系素数<\/strong>——它在密码、随机矩阵、量子混沌里都有影子，是整个数学的连接点。\n<\/li><li>\n<strong>别以为望月新一的证明被否定了<\/strong>——是&quot;未被广泛接受&quot;，争议点在 IUTT 的可检验性与推理链，不是已判定为错。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：连续统假设的地位是（　）。\n<ul>\n<li>\nA. 已被证明为真\n<\/li><li>\nB. 已被证明为假\n<\/li><li>\nC. 独立于 ZFC，既不能证也不能否\n<\/li><li>\nD. 尚未有人研究\n<\/ul>\n<\/ol>\n<p><strong>答案：C<\/strong>。解析：哥德尔与科恩分别证明它与 ZFC 及其否定都不矛盾，所以独立。<\/p>\n<ol><li>\n<strong>填空<\/strong>：庞加莱猜想由佩雷尔曼用（　）流方法解决。\n<\/ol>\n<p><strong>答案：黎奇<\/strong>。解析：黎奇流是汉密尔顿提出、佩雷尔曼完成关键估计的方法。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么四色定理的证明方式引起过争议？\n<\/ol>\n<p><strong>答案要点<\/strong>：它第一次大规模依赖计算机穷举，人工无法逐步复核。争议的核心是&quot;可验证性&quot;：如果没人能读完证明，它还算证明吗？后来的形式化验证（Coq）缓解了这个问题，因为机器可以独立检查每一步。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n已解决的定理分两种：给出答案的，和证明&quot;没有答案&quot;的。\n<\/li><li>\n独立于 ZFC 意味着公理不足，需要加新公理才能定论。\n<\/li><li>\n开放问题中最有名的几个：黎曼假设、P 与 NP、ABC 猜想。\n<\/ul>\n<h2>相关条目<\/h2>\n<ul><li>\nABC 猜想：[V.1]\n<\/li><li>\n费马大定理：[V.10]\n<\/li><li>\n有限单群的分类：[V.7]\n<\/li><li>\n哥德尔定理：[V.15]\n<\/li><li>\n连续统假设：[IV.22]、[V.18]\n<\/li><li>\n千禧年大奖难题：[V.22] 附近的条目群\n<\/ul>", "ch07": "<h1>第 7 章：数学在外面的用处<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 5 章\n<\/li><li>\n<strong>对应原书<\/strong>：第 VII 部分「数学的影响」（原书 p1383—1583）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n举出数学在物理、生物、通信、金融四个领域各一个具体贡献，说清用的是哪部分数学。\n<\/li><li>\n解释&quot;数学不是先有用才发展，而是发展了才被用上&quot;这个模式，并举两例。\n<\/li><li>\n说出公钥密码与编码理论各自依赖什么数学结构。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>数学的应用大多不是&quot;被设计出来用&quot;的，而是&quot;先长出来，几十年后才被认领&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>应用：物理（难度：进阶）<\/h3>\n<p>牛顿的微积分是为力学造的，这是少见的&quot;需求驱动&quot;案例。但二十世纪之后就反过来了：黎曼几何在 1915 年被爱因斯坦拿来写广义相对论，而黎曼发明它是在 1854 年，隔了六十多年。<\/p>\n<p>量子力学的数学基础是希尔伯特空间与算子理论，冯·诺依曼在 1930 年代把这些工具整理成型。规范场论用的纤维丛理论，也是先有数学后有物理。<\/p>\n<p><strong>模式<\/strong>：物理学界找现成工具，数学界提供&quot;当年看起来没用&quot;的东西。<\/p>\n<h3>应用：生物与医学（难度：进阶）<\/h3>\n<p>种群动力学用微分方程（洛特卡-沃尔泰拉模型描述捕食者与被捕食者的振荡）。基因测序用组合算法与字符串匹配。流行病学用网络模型与统计推断。<\/p>\n<p>医学统计是更直接的一条：临床试验的样本量计算、置信区间、假设检验，全靠第 8 章那套工具。设计不当的试验即使结论&quot;显著&quot;，也可能是假阳性。<\/p>\n<h3>应用：通信与密码（难度：进阶）<\/h3>\n<p><strong>编码理论<\/strong>解决&quot;传输会出错怎么办&quot;。汉明码、里德-所罗门码用有限域上的代数结构加冗余，能纠正一定数量的错误。光盘、卫星通信、二维码都在用。<\/p>\n<p><strong>公钥密码<\/strong>建立在&quot;难算&quot;的问题上。RSA 靠大整数分解难，椭圆曲线密码靠离散对数难。这两者的安全性都不是&quot;证明安全&quot;，而是&quot;目前没人算得动&quot;。量子计算机一旦成熟，这两条都会受威胁，于是有了后量子密码的研究。<\/p>\n<h3>应用：算法与计算（难度：进阶）<\/h3>\n<p>线性代数支撑图形渲染与机器学习，组合优化支撑物流与排程，数值分析支撑仿真。Strassen 算法把矩阵乘法的复杂度从 n³ 降到约 n^2.81，这类改进看似只影响常数，实际决定了大规模计算的可行性。<\/p>\n<p><strong>注意<\/strong>：算法的价值不只看渐近复杂度，还要看常数与实现。理论上的最优算法在小规模上常常输给朴素算法。<\/p>\n<h3>应用：经济与金融（难度：进阶）<\/h3>\n<p>期权定价的布莱克-斯科尔斯公式本质是一个偏微分方程的解（热传导方程经变量替换）。投资组合优化用二次规划。风险管理用极值理论估计尾部概率。<\/p>\n<p>金融数学有个教训值得记：模型假设（如对数正态、独立同分布）在极端行情下失效，2008 年危机里&quot;二十个标准差事件&quot;频繁出现，说明模型的风险被低估了。<\/p>\n<h3>应用：艺术与音乐（难度：基础）<\/h3>\n<p>透视法用射影几何，埃舍尔的镶嵌画用双曲几何，巴赫的赋格结构被音乐理论家用群论描述。音阶的频率比是数学关系，十二平均律是把 <code>2^(1/12)<\/code> 作为比率。<\/p>\n<p>这些例子说明：数学与艺术的联系不只在&quot;用了公式&quot;，更在&quot;结构上的同构&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[纯数学] --&gt; B[物理 黎曼几何 到 广义相对论]\n    A --&gt; C[通信 有限域 到 编码与密码]\n    A --&gt; D[生物 微分方程 到 种群动力学]\n    A --&gt; E[金融 PDE 到 期权定价]\n    A --&gt; F[计算 线性代数 到 图形与学习]\n    B --&gt; G[反过来提出新数学问题]\n    C --&gt; G<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是源头，中间是应用，最下面那条箭头表示反哺：应用提出的问题常常催生新数学。这条回路是数学活力的来源之一。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数学像工具箱，很多工具造出来时不知道干什么用。几十年后有人打开箱子发现正好有一把。失效边界：不是每个工具都会被用上，很多纯数学研究确实一直没找到应用，这也不减损它的价值。<\/p>\n<p><strong>实例<\/strong>：CDMA 通信用的扩频码基于伪随机序列与有限域，这套理论在 1940 年代是数论里的纯理论，几十年后才变成手机通信的基础。类似的还有数论里的椭圆曲线：1985 年还被认为是最&quot;没用&quot;的分支之一，现在它同时支撑着比特币与 TLS 握手。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为应用数学就是&quot;简单的数学&quot;<\/strong>——工业里的问题常常比纯数学更难，因为没有现成框架。\n<\/li><li>\n<strong>别以为模型能预测就一定可靠<\/strong>——金融与气象模型在极端情形下失效，这是模型的边界，不是bug。\n<\/li><li>\n<strong>别以为密码学的安全性被证明了<\/strong>——它建立在&quot;没人算得动&quot;的假设上，是经验性的。\n<\/li><li>\n<strong>别以为数学的应用都是线性的<\/strong>——从理论到产品常常隔几十年，中间还有大量工程转化。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：广义相对论用到的几何是（　）。\n<ul>\n<li>\nA. 欧氏几何\n<\/li><li>\nB. 射影几何\n<\/li><li>\nC. 黎曼几何\n<\/li><li>\nD. 双曲几何\n<\/ul>\n<\/ol>\n<p><strong>答案：C<\/strong>。解析：爱因斯坦用黎曼几何描述弯曲时空，黎曼在 1854 年就建立了这套几何。<\/p>\n<ol><li>\n<strong>填空<\/strong>：RSA 的安全性建立在（　）分解困难这个假设上。\n<\/ol>\n<p><strong>答案：大整数<\/strong>。解析：RSA 靠的是&quot;大整数分解目前没有多项式算法&quot;这一经验事实。<\/p>\n<ol><li>\n<strong>简答<\/strong>：为什么说数学的应用常常滞后几十年？\n<\/ol>\n<p><strong>答案要点<\/strong>：纯数学研究按内部逻辑推进，不为即时应用服务；应用领域要等自己的技术发展到需要某种结构的阶段，才会回头找工具。黎曼几何等了六十年，椭圆曲线等了上百年。这个滞后不是浪费，它保证了工具在被需要时已经成熟。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n数学的应用是&quot;先有工具后被认领&quot;，不是&quot;按需求造工具&quot;。\n<\/li><li>\n密码与编码靠有限域、数论与代数结构，安全性是经验假设。\n<\/li><li>\n模型都有失效边界，极端情形下的表现才是关键检验。\n<\/ul>\n<h2>相关条目<\/h2>\n<ul><li>\n数学物理：[VII.1]、[IV.13]\n<\/li><li>\n生物学：[VII.2]\n<\/li><li>\n算法设计：[VII.5]\n<\/li><li>\n密码学：[VII.7]\n<\/li><li>\n经济与金融：[VII.10]、[VII.11]\n<\/li><li>\n音乐：[VII.13]\n<\/li><li>\n艺术：[VII.14]\n<\/ul>", "ch08": "<h1>第 8 章：数学研究在做什么<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1、6 章\n<\/li><li>\n<strong>对应原书<\/strong>：I.4「数学研究的一般目的」（原书 p42—50 附近）与第 VIII 部分「卷末杂谈」（p1584—1685）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出数学问题的五种基本类型，并给每种举一例。\n<\/li><li>\n看懂一篇数学论文的常见结构，知道定义、引理、定理、例子各起什么作用。\n<\/li><li>\n说明&quot;好问题&quot;与&quot;坏问题&quot;的判断标准，以及猜想在其中的位置。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>数学研究的产出不只是定理，还有定义、例子、反例、猜想和证明方法；这些东西合起来才构成一门学科。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念：五种问题类型（难度：基础）<\/h3>\n<p><strong>存在性问题<\/strong>：这样的对象存在吗？例：任意连续函数在闭区间上一定取到最大值吗（是，紧性保证）。<\/p>\n<p><strong>唯一性问题<\/strong>：如果存在，只有一个吗？例：微分方程给定初值后有唯一解吗（在一定条件下是）。<\/p>\n<p><strong>分类问题<\/strong>：所有这类对象能列全吗？例：有限单群分类，二次曲线按判别式分三类。<\/p>\n<p><strong>构造问题<\/strong>：能不能造一个满足条件的对象？例：用尺规作出正十七边形（高斯证明可以）。<\/p>\n<p><strong>不可能性问题<\/strong>：为什么某件事做不到？例：三等分任意角、化圆为方、五次方程根式解。这类问题往往催生新工具，因为&quot;证明不可能&quot;需要先想清楚&quot;什么算可能&quot;。<\/p>\n<h3>概念：论文的构成（难度：进阶）<\/h3>\n<p>一篇典型论文包含：<strong>定义<\/strong>（引入新对象）、<strong>例子<\/strong>（说明定义不空）、<strong>引理<\/strong>（为定理铺路的技术性结论）、<strong>定理<\/strong>（主要结论）、<strong>证明<\/strong>（推理链）、<strong>猜想<\/strong>（未证但有理据的断言）、<strong>注记<\/strong>（与已有结果的关系）。<\/p>\n<p>I.4 末尾专门讨论了这件事，要点是：这些成分不是装饰，各有功能。定义决定研究对象的边界，例子防止定义空转，引理把长证明切成可复核的段，猜想指明下一步方向。<\/p>\n<p><strong>类比<\/strong>：论文像建筑。定义是地基，例子是样板间，引理是承重墙，定理是屋顶，猜想是下一期的规划。失效边界：不是每篇论文都齐全，短论文可能只有一个定理加证明。<\/p>\n<h3>概念：好问题的标准（难度：进阶）<\/h3>\n<p>一个数学问题值得做，通常满足几条：有明确表述、与已有结构相连、解决后能带出新方法、有可检验的特殊情形。<\/p>\n<p>反例：纯粹为了难而难的问题，解决后没有附带成果。高斯当年就说过费马大定理&quot;过于孤立&quot;，这个判断后来被证明错了——它其实连着整个算术几何。这说明&quot;孤立与否&quot;很难在事前判断。<\/p>\n<h3>概念：猜想的作用（难度：进阶）<\/h3>\n<p>猜想是&quot;有强证据但未证明的命题&quot;。它的作用不是等证明，而是<strong>组织研究方向<\/strong>。黎曼假设挂了一百六十多年，围绕它长出了整个解析数论；ABC 猜想挂了几十年，长出了算术几何的一大片。<\/p>\n<p><strong>证据的层次<\/strong>：数值验证（算到很大范围都成立）、特殊情形（若干情形已证）、类比（与另一领域已知结论相似）、理论支持（从更强假设推出）。这些都不是证明，但足以支撑研究。<\/p>\n<h3>概念：数学的美学判断（难度：进阶）<\/h3>\n<p>数学家说一个证明&quot;漂亮&quot;，通常指：短、意外、揭示隐藏联系、可推广。这些不是主观偏好，它们有实际后果——漂亮的证明往往能推广到别的领域，丑陋的证明往往只能用一次。<\/p>\n<p>外尔说过一句常被引用的话：我的工作总是尽力把美与真统一起来，但当两者冲突时，我通常选择美。这句话的意思不是&quot;美优先于真&quot;，而是&quot;在真已确定的前提下，美的证明更有生命力&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[一个问题] --&gt; B{属于哪类}\n    B --&gt; C[存在性]\n    B --&gt; D[唯一性]\n    B --&gt; E[分类]\n    B --&gt; F[构造]\n    B --&gt; G[不可能性]\n    C --&gt; H[证明方法]\n    D --&gt; H\n    E --&gt; H\n    F --&gt; H\n    G --&gt; I[往往催生新工具]\n    H --&gt; J[定理 论文 猜想]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：五类问题各有解法套路，最右边那条单独指出&quot;不可能性&quot;的特殊价值：它逼着人重新定义&quot;可能&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<p><strong>类比<\/strong>：数学研究像探险。有人画地图（分类），有人找路（构造），有人证明某条路走不通（不可能性）。走不通的证明往往比走通更有价值，因为它划定了边界。失效边界：探险有终点，数学没有，一个问题解决常带出三个新问题。<\/p>\n<p><strong>实例<\/strong>：三等分角的不可解性。用尺规只能作圆与直线，对应坐标只能做加减乘除与开平方。三等分 60° 需要解 <code>x³−3x−1=0<\/code>，它的根不能用平方根表达（伽罗瓦群是 S₃，不可解），所以尺规做不到。这个证明把&quot;几何作图&quot;翻译成&quot;域扩张&quot;，开创了代数方法处理几何问题的路子。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为数学研究就是&quot;证定理&quot;<\/strong>——定义、例子、反例、猜想同样是产出，有时比定理更影响深远。\n<\/li><li>\n<strong>别以为&quot;孤立的问题&quot;不值得做<\/strong>——高斯的判断错了，费马大定理后来成了整个领域的枢纽。\n<\/li><li>\n<strong>别以为数值验证够了<\/strong>——算到一亿个情形都成立，也不等于证明，ABC 猜想的相关数值证据极强，仍未被接受为证明。\n<\/li><li>\n<strong>别以为&quot;美&quot;是主观的<\/strong>——在数学里，美的判断通常对应&quot;可推广、揭示联系&quot;，有实际后果。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<strong>单选<\/strong>：证明&quot;三等分任意角不可能&quot;属于哪类问题？（　）\n<ul>\n<li>\nA. 存在性\n<\/li><li>\nB. 分类\n<\/li><li>\nC. 不可能性\n<\/li><li>\nD. 构造\n<\/ul>\n<\/ol>\n<p><strong>答案：C<\/strong>。解析：它证明的是用尺规这种工具做不到，属于不可能性问题。<\/p>\n<ol><li>\n<strong>填空<\/strong>：数学论文里为定理铺路的技术性结论通常叫（　）。\n<\/ol>\n<p><strong>答案：引理<\/strong>。解析：引理是辅助性命题，本身不一定重要，作用是把长证明切成可复核的段。<\/p>\n<ol><li>\n<strong>简答<\/strong>：猜想在数学研究中起什么作用？\n<\/ol>\n<p><strong>答案要点<\/strong>：猜想组织研究方向。它给出一个明确的目标，围绕它会长出方法、特例、相关结构。黎曼假设与 ABC 猜想都证明了这一点：即使未证，它们已经改变了整个领域的形态。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n数学问题分五类：存在、唯一、分类、构造、不可能。\n<\/li><li>\n论文的成分各有功能，定义与例子防止研究空转。\n<\/li><li>\n猜想的价值在于组织研究，不在等待证明。\n<\/ul>\n<h2>相关条目<\/h2>\n<ul><li>\n数学研究的一般目的：[I.4]\n<\/li><li>\n证明的概念：[II.7]\n<\/li><li>\n数学家传记：[VI]\n<\/li><li>\n卷末杂谈：[VIII]\n<\/ul>", "c01": "<h1>三分法与其他分法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把数学按主题分成代数、几何、分析三块，是最初的近似；按&quot;问什么样的问题&quot;分，是另一条更有统摄力的路。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是这本书的入口分类。不懂这三分法，读条目时会觉得分支之间毫无关系；懂了它，就知道为什么代数几何、代数拓扑这类名字里要拼两个词。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[按主题分] --&gt; B[代数 结构]\n    A --&gt; C[几何 形状]\n    A --&gt; D[分析 极限]\n    E[按问题分] --&gt; F[存在性]\n    E --&gt; G[分类]\n    E --&gt; H[构造]\n    E --&gt; I[不可能性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半是按对象分，下半是按问法分。同一个分支可以落在上半的某一格，同时散在下半的几格。<\/p>\n<h2>详解<\/h2>\n<p><strong>三分法的内容<\/strong>：代数研究结构与运算（群、环、域、模）；几何研究空间与形状（度量、曲率、流形）；分析研究极限与连续（函数、微分方程、无穷维空间）。<\/p>\n<p><strong>三分法的局限<\/strong>：书里自己说这只是最初近似。真实的学科边界是移动的：代数几何同时属两块，代数拓扑的名字里就有三块。<\/p>\n<p><strong>按问题分的好处<\/strong>：两个主题完全不同的领域，可能在问同一类问题。比如数论要&quot;分类所有素数的分布规律&quot;，拓扑要&quot;分类所有三维流形&quot;，动机不同，方法却互相借用。<\/p>\n<p><strong>类比<\/strong>：三分法像按楼层分办公室，按问题分像按工作方式分。前者方便找地方，后者方便找人。失效边界：问题类型没有公认的完整清单，只能举例。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为三分法是严格划分<\/strong>——它是粗线条，书里明说了要加修饰。\n<\/li><li>\n<strong>别以为一个分支只能落在一块<\/strong>——名字里带两个词的领域越来越多。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章<\/td><td>I.1 开篇<\/td><td>给出三分法并说明局限<\/td><\/tr><tr><td>第 5 章<\/td><td>各分支介绍<\/td><td>每个分支明确归属与交叉关系<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n后续：变换群与不变量（第 3、5 章）、分支的交叉（第 5 章）\n<\/ul>", "c02": "<h1>集合、函数、关系、运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>数学的四件基本语法：集合装对象，函数连对象，关系说对象之间如何，运算在对象上做组合。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有代数结构（群、环、域、向量空间）都由这四件搭出来。看懂公理在说什么，前提是知道这四件各是什么。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[集合] --&gt; B[笛卡尔积]\n    B --&gt; C[关系]\n    B --&gt; D[函数]\n    A --&gt; E[二元运算]\n    E --&gt; F[群]\n    E --&gt; G[环]\n    G --&gt; H[域]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：一条路通向关系与函数，一条路通向运算与代数结构。两条都从集合出发。<\/p>\n<h2>详解<\/h2>\n<p><strong>集合<\/strong>：一堆对象。运算有并、交、差。<code>∈<\/code> 是元素与集合的关系，<code>⊂<\/code> 是集合与集合的关系，别混。<\/p>\n<p><strong>函数<\/strong>：<code>f: A→B<\/code>，每输入一个值给唯一输出。单射、满射、双射是三种性质，只有双射有反函数。<\/p>\n<p><strong>关系<\/strong>：有序对的集合。等价关系（自反、对称、传递）用来分类；序关系（自反、反对称、传递）用来排序。<\/p>\n<p><strong>二元运算<\/strong>：<code>A×A→A<\/code>。它满足哪些公理，就决定它构成什么结构。群要四条（封闭、结合、单位元、逆元），加上交换律就是交换群。<\/p>\n<p><strong>类比<\/strong>：四件套像搭积木的四种接口。凸接口接凹接口，不同结构就是不同的拼接方式。失效边界：积木只能拼有限次，数学结构可以无限层地套（比如&quot;所有群的集合&quot;本身又是一个对象）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为函数必须是公式<\/strong>——规则就行，表格、图像、分段定义都是函数。\n<\/li><li>\n<strong>别以为关系只有&quot;大于小于&quot;<\/strong>——等价关系、函数关系都是关系。\n<\/li><li>\n<strong>别以为群必须可交换<\/strong>——矩阵乘法就是不可交换的例子。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>I.3 基本定义<\/td><td>四件套与代数结构的公理<\/td><\/tr><tr><td>第 4 章<\/td><td>概念词典<\/td><td>范畴把态射对象化<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n后续：群与域（第 3 章）、范畴（第 4 章）\n<\/ul>", "c03": "<h1>数系扩张与代数闭<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>每加一类新数，都是为了解开旧系统里做不了的运算，代价是丢掉一条旧性质。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了&quot;为什么要有复数&quot;。不是数学家喜欢虚构，而是 <code>x²+1=0<\/code> 在实数里无解，必须扩域才能解；扩完之后，所有多项式方程都有解了，这就是代数闭。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[自然数 减法不封闭] --&gt; B[整数 除法不封闭]\n    B --&gt; C[有理数 极限不封闭]\n    C --&gt; D[实数 开方不封闭]\n    D --&gt; E[复数 代数闭]\n    E --&gt; F[四元数 乘法不交换]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：每走一步，解决一个&quot;不封闭&quot;，丢掉一条性质。最右边四元数丢掉的是交换律。<\/p>\n<h2>详解<\/h2>\n<table><thead><tr><th>扩张<\/th><th>解决<\/th><th>代价<\/th><\/tr><\/thead><tbody><tr><td>N→Z<\/td><td>减法<\/td><td>失去良序（负数无最小元）<\/td><\/tr><tr><td>Z→Q<\/td><td>除法<\/td><td>稠密但有&quot;空隙&quot;<\/td><\/tr><tr><td>Q→R<\/td><td>极限、开方<\/td><td>不可数，需构造（戴德金分割或柯西序列）<\/td><\/tr><tr><td>R→C<\/td><td><code>x²+1=0<\/code><\/td><td>失去序关系<\/td><\/tr><tr><td>C→H<\/td><td>三维旋转的乘法表示<\/td><td>乘法不交换<\/td><\/tr><\/tbody><\/table>\n<p><strong>代数闭<\/strong>：任何次数≥1 的多项式在域内都能分解为一次因子之积。复数域满足，实数域不满足（<code>x²+1<\/code> 不可约）。<\/p>\n<p><strong>类比<\/strong>：数系扩张像给旧房子加房间。加一间能住人，但承重结构要重新算。失效边界：数学扩张没有物理限制，可以继续到八元数（丢结合律），但每加一层代价变大。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为复数是&quot;假的&quot;<\/strong>——它在物理、工程里都是标准工具，交流电分析全靠它。\n<\/li><li>\n<strong>别以为扩张只加不改<\/strong>——每次扩张都要改运算的定义，减法在自然数里根本不存在。\n<\/li><li>\n<strong>别以为实数够用<\/strong>——<code>x²+1=0<\/code> 这种方程在实数里就没解。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>II.1 数<\/td><td>从计数到复数、四元数的演化<\/td><\/tr><tr><td>第 5 章<\/td><td>IV.1 数论<\/td><td>代数数域、p 进数<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：四件套（第 2 章）\n<\/li><li>\n后续：代数闭与伽罗瓦理论（第 3 章）、有限域（第 7 章）\n<\/ul>", "c04": "<h1>变换群与不变量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一类几何，就是&quot;某个变换群下不变的性质的集合&quot;。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把几何从&quot;画图&quot;变成&quot;找不变量&quot;。认清变换群，就知道哪些量该保留、哪些可以改。这也是判断&quot;两个图形是否等价&quot;的唯一可靠办法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[变换群] --&gt; B[刚体变换 距离 角度]\n    A --&gt; C[相似变换 角度 比值]\n    A --&gt; D[射影变换 交比]\n    A --&gt; E[连续形变 连通性 亏格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从上到下变换越松，保留的不变量越少。最下面是拓扑，只剩骨架性质。<\/p>\n<h2>详解<\/h2>\n<p><strong>克莱因纲领<\/strong>：给定一个变换群 G，几何就是研究在 G 作用下不变的性质。欧氏几何对应刚体变换群，射影几何对应射影变换群，拓扑对应同胚群。<\/p>\n<p><strong>不变量举例<\/strong>：刚体变换保距离与角度；相似变换保角度、保长度比值；射影变换保交比；同胚保连通性、亏格、欧拉示性数。<\/p>\n<p><strong>判断等价的办法<\/strong>：找一个在该变换群下不变、但两个对象取值不同的量。找到就证明不等价；找不到不代表等价，可能只是没找对量。<\/p>\n<p><strong>类比<\/strong>：像判两个人的身份。外貌会变（变换），指纹不变（不变量）。找对了不变量就能判定。失效边界：不变量是必要条件，不是充分条件，除非它构成完全不变量组。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为不变量越少越没用<\/strong>——拓扑的不变量最少，恰恰因为它管用范围最广。\n<\/li><li>\n<strong>别以为找到一个不变量就能判定等价<\/strong>——单个不变量通常只够否定，不够肯定。\n<\/li><li>\n<strong>别以为变换群只是分类工具<\/strong>——它同时决定了&quot;什么问题有意义&quot;，在群外问距离是否不变是无意义的。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 3 章<\/td><td>II.2 几何<\/td><td>几何的三次转向，埃尔朗根纲领<\/td><\/tr><tr><td>第 4 章<\/td><td>III.13 亏格<\/td><td>亏格是拓扑不变量<\/td><\/tr><tr><td>第 5 章<\/td><td>IV.4 几何、IV.8 拓扑<\/td><td>各几何对应各变换群<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：群的定义（第 2 章）\n<\/li><li>\n后续：亏格与欧拉示性数（第 4 章）、庞加莱猜想（第 6 章）\n<\/ul>", "c05": "<h1>基数与可数性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>两个集合&quot;一样大&quot;，当且仅当它们之间能建立一一对应；无限集合可以与自己的真子集一样大。<\/p>\n<h2>为什么重要<\/h2>\n<p>它给出了比较无穷的尺子。没有它，&quot;无穷多&quot;只是一个模糊的词；有了它，可以分出可数无穷与不可数无穷，实数比自然数&quot;多得多&quot;这件事才有了意义。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[有限集合] --&gt; B[基数 数个数]\n    C[无限集合] --&gt; D[基数 找双射]\n    D --&gt; E[可数 与 N 一一对应]\n    D --&gt; F[不可数 不存在这种对应]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：有限时可以直接数，无限时必须靠映射。右边两条是可数与不可数的分界。<\/p>\n<h2>详解<\/h2>\n<p><strong>基数的定义<\/strong>：<code>|A|=|B|<\/code> 当且仅当存在双射 <code>A→B<\/code>。这个定义在有限集合上与&quot;数个数&quot;一致，在无限集合上取代了它。<\/p>\n<p><strong>可数<\/strong>：能与自然数一一对应。<code>Z<\/code>、<code>Q<\/code>、代数数都可数。<strong>不可数<\/strong>：<code>R<\/code>、<code>C<\/code>、<code>R<\/code> 的任意区间都不可数。<\/p>\n<p><strong>对角线论证<\/strong>：假设 <code>(0,1)<\/code> 内的实数可数，排成 <code>0.a₁₁a₁₂…<\/code>、<code>0.a₂₁a₂₂…<\/code>，构造新数 <code>b<\/code>，其第 n 位取 <code>aₙₙ<\/code> 的相反值，则 b 不在表里，矛盾。所以无法枚举。<\/p>\n<p><strong>连续统假设<\/strong>：<code>2^ℵ₀=ℵ₁<\/code>？这个问题独立于 ZFC。<\/p>\n<p><strong>类比<\/strong>：数人数时不用数，让每个人找一个座位。座位坐满且没空座，人数就等于座位数。失效边界：无限情形下&quot;座位表&quot;必须显式构造，不能靠直观。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为&quot;部分小于整体&quot;总是成立<\/strong>——在无限集合里它常常不成立。\n<\/li><li>\n<strong>别以为有理数比整数多<\/strong>——两者都只是可数无穷，基数相同。\n<\/li><li>\n<strong>别以为不可数就没有结构<\/strong>——实数的结构比自然数多得多，但基数比较只看&quot;能否配对&quot;。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>III.1 基数<\/td><td>双射定义、可数与不可数<\/td><\/tr><tr><td>第 6 章<\/td><td>V.18 连续统假设<\/td><td>CH 独立于 ZFC<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：函数与双射（第 2 章）\n<\/li><li>\n后续：连续统假设（第 6 章）、测度与积分（第 4 章）\n<\/ul>", "c06": "<h1>紧性与存在性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>紧性是说&quot;不会跑到无穷，也不会在边界处丢失点&quot;；它的用途是让&quot;存在&quot;这件事能被证明出来。<\/p>\n<h2>为什么重要<\/h2>\n<p>分析里几乎所有&quot;最大值存在&quot;&quot;解存在&quot;的结论都靠它。极值定理、微分方程解的存在性、变分问题的最小元，走的是同一套逻辑。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[紧性 任意开覆盖有有限子覆盖] --&gt; B[实数中 有界闭区间]\n    B --&gt; C[连续函数取到最大最小值]\n    A --&gt; D[序列有收敛子列]\n    D --&gt; E[构造逼近序列 取极限]\n    E --&gt; F[证明解存在]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是定义，中间是它在实数里的具体形态和直接推论，右边是它的用法：先造序列，再取极限。<\/p>\n<h2>详解<\/h2>\n<p><strong>定义<\/strong>：空间的任何开覆盖都含有限子覆盖。直观含义是&quot;空间不能无限延伸，也不能在边界处漏点&quot;。<\/p>\n<p><strong>实数里的判定<\/strong>：<code>[a,b]<\/code> 紧，<code>(a,b)<\/code> 不紧（开覆盖 <code>(a+1/n, b−1/n)<\/code> 没有有限子覆盖），<code>R<\/code> 不紧。<\/p>\n<p><strong>用法模板<\/strong>：要证明某个对象存在，先构造一列逼近的对象，用紧性抽出收敛子列，再证明极限满足要求。这是分析里最常见的三步。<\/p>\n<p><strong>类比<\/strong>：紧集像一个封口的盒子。东西放在里面，一定找得到落脚点。失效边界：开区间像个没封口的盒子，东西可以&quot;滑出去&quot;到端点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为紧等于有界<\/strong>——<code>R<\/code> 中的有界开区间也有界但不紧。\n<\/li><li>\n<strong>别以为紧性是拓扑学里才用的<\/strong>——极值定理、ODE 解的存在性都靠它。\n<\/li><li>\n<strong>别以为序列紧与开覆盖紧总是等价<\/strong>——在度量空间里等价，在一般拓扑空间里不一定。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>III.3 紧性<\/td><td>定义、序列紧、与极值定理的关系<\/td><\/tr><tr><td>第 5 章<\/td><td>IV.10 偏微分方程<\/td><td>弱解存在性用紧性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：开集与连续（第 2、4 章）\n<\/li><li>\n后续：极值定理（第 4 章）、变分法（第 5 章）\n<\/ul>", "c07": "<h1>曲率与内蕴几何<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章、第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>曲率衡量&quot;弯得多厉害&quot;；高斯曲率是内蕴的，住在曲面上的人自己就能测出来，不需要看外面。<\/p>\n<h2>为什么重要<\/h2>\n<p>它决定了曲面能不能摊平。高斯曲率为零的曲面（柱面、锥面）能展成平面做地图，非零的（球面）不能，地图必然变形。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[主曲率 k1 k2] --&gt; B[高斯曲率 K 等于 k1 乘 k2]\n    B --&gt; C[球面 K 大于 0]\n    B --&gt; D[平面 柱面 K 等于 0]\n    B --&gt; E[马鞍面 K 小于 0]\n    C --&gt; F[无法展开成平面地图]\n    D --&gt; G[可以展开]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三个例子对应三种符号。能否摊平只看 K 是否为零，不看它弯成什么样。<\/p>\n<h2>详解<\/h2>\n<p><strong>曲线曲率<\/strong> <code>κ=dθ/ds<\/code>，圆的曲率是 <code>1/R<\/code>，直线是 0。<\/p>\n<p><strong>曲面主曲率<\/strong> <code>κ₁<\/code>、<code>κ₂<\/code> 是两个主方向上的弯曲程度。<strong>高斯曲率<\/strong> <code>K=κ₁κ₂<\/code>，<strong>平均曲率<\/strong> <code>H=(κ₁+κ₂)/2<\/code>。<\/p>\n<p><strong>高斯绝妙定理<\/strong>：K 是内蕴量。曲面上的生物只靠测量距离与角度就能算出 K，不需要嵌入三维空间。<\/p>\n<p><strong>意义<\/strong>：等距变形保 K。这解释了为什么球面不能展平，也解释了地图投影必然有变形（只能选保留什么、放弃什么）。<\/p>\n<p><strong>类比<\/strong>：像一张纸上画三角形，量内角和。平面是 180°，球面大于 180°，马鞍面小于 180°。这个偏差就是曲率的痕迹。失效边界：类比只在小尺度上直观，大范围要积分。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为曲率必须从三维看<\/strong>——它是内蕴量，这是高斯定理的核心。\n<\/li><li>\n<strong>别以为柱面&quot;弯&quot;所以不能摊平<\/strong>——柱面 K=0，能摊平，弯的是外在形状。\n<\/li><li>\n<strong>别以为 K=0 就一定是平面<\/strong>——柱面、锥面都 K=0，它们局部与平面等距。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>III.4 曲率<\/td><td>主曲率、高斯曲率、绝妙定理<\/td><\/tr><tr><td>第 5 章<\/td><td>IV.4 几何<\/td><td>黎曼曲率张量、爱因斯坦方程<\/td><\/tr><tr><td>第 7 章<\/td><td>VII.1 数学物理<\/td><td>广义相对论的时空几何<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：微积分与偏导数（第 3 章）\n<\/li><li>\n后续：黎曼几何（第 5 章）、广义相对论（第 7 章）\n<\/ul>", "c08": "<h1>猜想、独立性与证明的边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 6 章、第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>猜想是有强证据但未证明的命题；独立于公理系统是说&quot;这个命题在系统里既不能证也不能否&quot;；两者合起来划出了证明能走多远。<\/p>\n<h2>为什么重要<\/h2>\n<p>它回答了&quot;数学是不是总有一天能解决所有问题&quot;。哥德尔说不；科恩与哥德尔合起来给出了一个具体的例子（连续统假设）。同时它也说明了猜想为什么值得长期投入。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[命题] --&gt; B{在系统内}\n    B --&gt;|可证| C[定理]\n    B --&gt;|可否证| D[反例]\n    B --&gt;|两者都不可| E[独立]\n    A --&gt; F[证据 数值 特例 类比]\n    F --&gt; G[猜想]\n    G --&gt;|最终被证| C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上面三条是命题在系统里的三种地位，下面那条是&quot;证据推动猜想走向定理&quot;的路。<\/p>\n<h2>详解<\/h2>\n<p><strong>猜想的证据层次<\/strong>：数值验证（算到很大范围）、特殊情形已证、与已知结论的类比、从更强假设推出。四者都不是证明。<\/p>\n<p><strong>独立性<\/strong>：CH 独立于 ZFC，由哥德尔（1938，可构成宇宙）与科恩（1963，力迫法）两边合起来证明。意思是标准公理不足以决定它。<\/p>\n<p><strong>哥德尔不完备<\/strong>：任何足够强、可递归公理化的系统，都有不可判定命题，且不能在内部证明自身一致。<\/p>\n<p><strong>类比<\/strong>：公理系统像一套法律。有些案子法律有明文（定理），有些违法（反例），有些法律没规定（独立）。没规定不代表没是非，只是这套法律管不到。失效边界：法律可以修订，数学加公理也会改变结论，这正是集合论争论的焦点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为独立等于&quot;无意义&quot;<\/strong>——它在不同模型里有不同真值，是公理不足。\n<\/li><li>\n<strong>别以为不完备说明数学不可靠<\/strong>——它限制的是形式系统的完备性，已证定理不受影响。\n<\/li><li>\n<strong>别以为猜想只是&quot;等着被证&quot;<\/strong>——它组织研究方向，本身就在产出方法。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>V.15 哥德尔、V.18 连续统<\/td><td>不完备与独立性<\/td><\/tr><tr><td>第 8 章<\/td><td>I.4 研究的目的<\/td><td>猜想如何组织研究<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：形式系统与量词（第 2 章）\n<\/li><li>\n后续：力迫法与模型论（第 5 章）\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数学是做什么的<\/strong><br>阅读：<a href=\"#/book/princeton-guide/chapter/ch01\">第 1 章：数学是做什么的<\/a><br>检查点：能用三分法归类一个命题<\/li><li class='path-step' id='path-02'><strong>步骤 02：语言与语法<\/strong><br>阅读：<a href=\"#/book/princeton-guide/chapter/ch02\">第 2 章：数学的语言与语法<\/a><br>检查点：能正确否定带量词的命题<\/li><li class='path-step' id='path-03'><strong>步骤 03：现代数学的起源<\/strong><br>阅读：<a href=\"#/book/princeton-guide/chapter/ch03\">第 3 章：现代数学的起源<\/a><br>检查点：能讲出数系扩张的代价<\/li><li class='path-step' id='path-04'><strong>步骤 04：概念的词典<\/strong><br>阅读：<a href=\"#/book/princeton-guide/chapter/ch04\">第 4 章：概念的词典<\/a><br>检查点：能说出基数、维、亏格各量什么<\/li><li class='path-step' id='path-05'><strong>步骤 05：分支地图<\/strong><br>阅读：<a href=\"#/book/princeton-guide/chapter/ch05\">第 5 章：数学的各个分支<\/a><br>检查点：能判断分支间的借用关系<\/li><li class='path-step' id='path-06'><strong>步骤 06：定理与未解问题<\/strong><br>阅读：<a href=\"#/book/princeton-guide/chapter/ch06\">第 6 章：定理与未解问题<\/a><br>检查点：能分清已解决、独立、开放<\/li><li class='path-step' id='path-07'><strong>步骤 07：数学在外面的用处<\/strong><br>阅读：<a href=\"#/book/princeton-guide/chapter/ch07\">第 7 章：数学在外面的用处<\/a><br>检查点：能举四个领域的具体贡献<\/li><li class='path-step' id='path-08'><strong>步骤 08：研究在做什么<\/strong><br>阅读：<a href=\"#/book/princeton-guide/chapter/ch08\">第 8 章：数学研究在做什么<\/a><br>检查点：能说出五种问题类型<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：数学是做什么的<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 本书回答“什么是数学”的办法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 给出严格定义<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 描述主要概念、定理和应用<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 只讲历史<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 只列分支名单<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 全书把数学粗略分成代数、几何和（　）三块。（填两字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：数学的语言与语法<\/h2><div class='quiz-item' data-qid='ch02-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> “所有实数都有平方根”的否定是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q01' value='0'> 所有实数都没有平方根<\/label><label class='quiz-opt'><input type='radio' name='ch02-q01' value='1'> 存在一个实数没有平方根<\/label><label class='quiz-opt'><input type='radio' name='ch02-q01' value='2'> 存 s='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 球面的亏格是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：数学的各个分支<\/h1><div class='quiz-item' data-qid='ch05-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 研究连续形变下不变性质的分支是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch05-q01' value='0'> 代数几何<\/label><label class='quiz-opt'><input type='radio' name='ch05-q01' value='1'> 拓扑<\/label><label class='quiz-opt'><input type='radio' name='ch05-q01' value='2'> 表示论<\/label><label class='quiz-opt'><input type='radio' name='ch05-q01' value='3'> 组合学<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch05-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 把抽象群对应成矩阵群的分支叫（　）论。（填两字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：定理与未解问题<\/h1><div class='quiz-item' data-qid='ch06-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 连续统假设的地位是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch06-q01' value='0'> 已被证明为真<\/label><label class='quiz-opt'><input type='radio' name='ch06-q01' value='1'> 已被证明为假<\/label><label class='quiz-opt'><input type='radio' name='ch06-q01' value='2'> 独立于 ZFC<\/label><label class='quiz-opt'><input type='radio' name='ch06-q01' value='3'> 尚未有人研究<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch06-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 庞加莱猜想由佩雷尔曼用（　）流方法解决。（填两字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：数学在外面的用处<\/h1><div class='quiz-item' data-qid='ch07-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 广义相对论用到的几何是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch07-q01' value='0'> 欧氏几何<\/label><label class='quiz-opt'><input type='radio' name='ch07-q01' value='1'> 射影几何<\/label><label class='quiz-opt'><input type='radio' name='ch07-q01' value='2'> 黎曼几何<\/label><label class='quiz-opt'><input type='radio' name='ch07-q01' value='3'> 双曲几何<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch07-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> RSA 的安全性建立在哪种数分解困难之上？（填两字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：数学研究在做什么<\/h1><div class='quiz-item' data-qid='ch08-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 证明“三等分任意角不可能”属于哪类问题？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch08-q01' value='0'> 存在性<\/label><label class='quiz-opt'><input type='radio' name='ch08-q01' value='1'> 分类<\/label><label class='quiz-opt'><input type='radio' name='ch08-q01' value='2'> 不可能性<\/label><label class='quiz-opt'><input type='radio' name='ch08-q01' value='3'> 构造<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch08-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 数学论文里为定理铺路的技术性结论通常叫（　）。（填两字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪一组关系体现了“先有数学后有应用”？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 微积分与力学<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 黎曼几何与广义相对论<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 傅里叶变换与热传导<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 概率论与赌博<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 下列哪一项不是“独立于 ZFC”的正确含义？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 在标准公理下既不能证也不能否<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 换一套模型可能为真<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 命题本身没有意义<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 需要加新公理才能定论<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 本书把数学粗略分成三块，其中研究极限与连续的那一块叫（　）。（填两字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='条目'>条目 — 本书的基本单元，一个独立主题的文章，用编号互相引用 <span class=glossary-ref>（第 1 章：数学是做什么的）<\/span><\/li><li data-term='三分法'>三分法 — 把数学按主题分成代数、几何、分析的粗略分类 <span class=glossary-ref>（第 1 章：数学是做什么的）<\/span><\/li><li data-term='集合'>集合 — 把一些确定的对象放在一起构成的整体 <span class=glossary-ref>（第 2 章：数学的语言与语法）<\/span><\/li><li data-term='函数'>函数 — 从一个集合到另一个集合的规则，每个输入对应唯一输出 <span class=glossary-ref>（第 2 章：数学的语言与语法）<\/span><\/li><li data-term='单射'>单射 — 不同输入给不同输出的函数 <span class=glossary-ref>（第 2 章：数学的语言与语法）<\/span><\/li><li data-term='双射'>双射 — 既单又满的函数，只有它有反函数 <span class=glossary-ref>（第 2 章：数学的语言与语法）<\/span><\/li><li data-term='等价关系'>等价关系 — 满足自反、对称、传递的关系，用来把集合分类 <span class=glossary-ref>（第 2 章：数学的语言与语法）<\/span><\/li><li data-term='群'>群 — 带一个二元运算且满足封闭、结合、有单位元、每元有逆的结构 <span class=glossary-ref>（第 2 章：数学的语言与语法）<\/span><\/li><li data-term='域'>域 — 环且非零元对乘法成群，即可以四则运算的代数结构 <span class=glossary-ref>（第 2 章：数学的语言与语法）<\/span><\/li><li data-term='代数闭'>代数闭 — 任何次数大于等于 1 的多项式都能分解为一次因子之积 <span class=glossary-ref>（第 3 章：现代数学的起源）<\/span><\/li><li data-term='埃尔朗根纲领'>埃尔朗根纲领 — 克莱因提出：几何就是研究某变换群下的不变量 <span class=glossary-ref>（第 3 章：现代数学的起源）<\/span><\/li><li data-term='伽罗瓦群'>伽罗瓦群 — 多项式根的对称性所构成的群，可解性决定方程能否根式解 <span class=glossary-ref>（第 3 章：现代数学的起源）<\/span><\/li><li data-term='ε-δ 语言'>ε-δ 语言 — 用不等式刻画极限与连续的精确定义方式 <span class=glossary-ref>（第 3 章：现代数学的起源）<\/span><\/li><li data-term='基数'>基数 — 集合的大小，按能否建立双射来比较 <span class=glossary-ref>（第 4 章：概念的词典）<\/span><\/li><li data-term='可数'>可数 — 能与自然数集建立一一对应的集合 <span class=glossary-ref>（第 4 章：概念的词典）<\/span><\/li><li data-term='紧性'>紧性 — 任何开覆盖都存在有限子覆盖的性质 <span class=glossary-ref>（第 4 章：概念的词典）<\/span><\/li><li data-term='主曲率'>主曲率 — 曲面在一点两个主方向上的弯曲程度 <span class=glossary-ref>（第 4 章：概念的词典）<\/span><\/li><li data-term='高斯曲率'>高斯曲率 — 两个主曲率之积，是曲面的内蕴量 <span class=glossary-ref>（第 4 章：概念的词典）<\/span><\/li><li data-term='亏格'>亏格 — 曲面上洞的个数，是拓扑不变量 <span class=glossary-ref>（第 4 章：概念的词典）<\/span><\/li><li data-term='范畴'>范畴 — 由对象与对象间态射组成的结构，用来统一描述数学构造 <span class=glossary-ref>（第 4 章：概念的词典）<\/span><\/li><li data-term='傅里叶变换'>傅里叶变换 — 把函数拆成不同频率成分的积分变换 <span class=glossary-ref>（第 4 章：概念的词典）<\/span><\/li><li data-term='表示论'>表示论 — 把抽象群对应成矩阵群以便计算的理论 <span class=glossary-ref>（第 5 章：数学的各个分支）<\/span><\/li><li data-term='适定性'>适定性 — 偏微分方程的解存在、唯一且稳定 <span class=glossary-ref>（第 5 章：数学的各个分支）<\/span><\/li><li data-term='拉姆齐定理'>拉姆齐定理 — 足够大的结构中必然出现某种规则子结构 <span class=glossary-ref>（第 5 章：数学的各个分支）<\/span><\/li><li data-term='独立性'>独立性 — 命题在给定公理系统中既不能证明也不能否证 <span class=glossary-ref>（第 6 章：定理与未解问题）<\/span><\/li><li data-term='力迫法'>力迫法 — 科恩发明的构造集合论模型的方法，用来证明独立性 <span class=glossary-ref>（第 6 章：定理与未解问题）<\/span><\/li><li data-term='不完备定理'>不完备定理 — 足够强的形式系统中存在不可判定命题，且系统不能在内部证明自身一致 <span class=glossary-ref>（第 6 章：定理与未解问题）<\/span><\/li><li data-term='p 与 np'>P 与 NP — 多项式时间可解与多项式时间可验证的两个问题类 <span class=glossary-ref>（第 6 章：定理与未解问题）<\/span><\/li><li data-term='根基 rad'>根基 rad — 正整数所有素因子各取一次后的乘积 <span class=glossary-ref>（第 6 章：定理与未解问题）<\/span><\/li><li data-term='猜想'>猜想 — 有强证据但尚未证明的命题 <span class=glossary-ref>（第 8 章：数学研究在做什么）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：三分定位法<\/h2>\n<p>拿到一个陌生的数学名词，按三步定位：<\/p>\n<p>第一步问&quot;它研究什么对象&quot;——数、多项式、空间、函数、随机量。 第二步问&quot;它问什么问题&quot;——存在、唯一、分类、构造、不可能。 第三步问&quot;它属于哪一块&quot;——代数、几何、分析，或者两块的交界。<\/p>\n<p>三步走完，通常能猜出它大概在哪一部分，再翻对应条目即可。这个框架在全书所有分支介绍里都适用。<\/p>\n<h2>框架：拿性质换能力<\/h2>\n<p>数系每扩张一次，都放弃一条旧性质换一条新运算能力：负数换减法，分数换除法，实数换极限，复数换代数闭，四元数换三维旋转的乘法表示，代价是交换律。<\/p>\n<p>这个框架可以推广到别的构造：非欧几何放弃平行公设换新模型，非交换几何放弃交换律换量子对应。看到一个&quot;奇怪&quot;的数学对象，先问它放弃了什么，就知道它想换来什么。<\/p>\n<h2>框架：不变量判等价<\/h2>\n<p>判断两个对象是否等价，办法是找一个在允许变换下不变、但两者取值不同的量。<\/p>\n<p>刚体变换保距离，相似变换保角度与比值，射影变换保交比，同胚保亏格与欧拉示性数。找到这样的量就否定等价；找不到，可能是没找对量，也可能真的等价。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n想判断一个命题的地位 → 先看是否已证，再看是否已证独立，最后才考虑&quot;开放&quot;。\n<\/li><li>\n想读懂一个分支的定位 → 看它借用谁的工具、服务谁的问题。\n<\/li><li>\n想判断一个应用案例的价值 → 看它用了哪部分数学，以及滞后了多少年。\n<\/li><li>\n想评价一个证明 → 看长度、意外性、可推广性，不只看对错。\n<\/ul>\n<h2>反模式<\/h2>\n<p><strong>把条目当百科读。<\/strong> 本书明确说不是百科全书，按条目顺序通读会失去主线。<\/p>\n<p><strong>把三分法当严格分类。<\/strong> 它是最初近似，交界处的领域越来越多。<\/p>\n<p><strong>把&quot;独立&quot;当&quot;无意义&quot;。<\/strong> 独立性说明公理不足，不是命题没内容。<\/p>\n<p><strong>把&quot;数值验证&quot;当证明。<\/strong> 算到再大的范围也不构成证明。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>基本结构与公理<\/h2>\n<table><thead><tr><th>结构<\/th><th>公理要点<\/th><\/tr><\/thead><tbody><tr><td>群<\/td><td>封闭、结合、单位元、逆元<\/td><\/tr><tr><td>交换群<\/td><td>群 + 交换律<\/td><\/tr><tr><td>环<\/td><td>加法成群、乘法结合、分配律<\/td><\/tr><tr><td>域<\/td><td>环 + 非零元对乘法成群<\/td><\/tr><tr><td>向量空间<\/td><td>加法成群 + 标量乘法的分配与结合<\/td><\/tr><\/tbody><\/table>\n<h2>几类几何与不变量<\/h2>\n<table><thead><tr><th>几何<\/th><th>变换群<\/th><th>不变量<\/th><\/tr><\/thead><tbody><tr><td>欧氏<\/td><td>刚体变换<\/td><td>距离、角度<\/td><\/tr><tr><td>相似<\/td><td>相似变换<\/td><td>角度、长度比<\/td><\/tr><tr><td>射影<\/td><td>射影变换<\/td><td>交比<\/td><\/tr><tr><td>拓扑<\/td><td>同胚<\/td><td>连通性、亏格、欧拉示性数<\/td><\/tr><\/tbody><\/table>\n<h2>关键数<\/h2>\n<table><thead><tr><th>对象<\/th><th>数值<\/th><\/tr><\/thead><tbody><tr><td>球面亏格<\/td><td>0<\/td><\/tr><tr><td>环面亏格<\/td><td>1<\/td><\/tr><tr><td>欧拉示性数<\/td><td><code>χ=2−2g<\/code><\/td><\/tr><tr><td>球面高斯曲率<\/td><td><code>1/R²<\/code><\/td><\/tr><tr><td>平面、柱面高斯曲率<\/td><td>0<\/td><\/tr><tr><td>可数无穷基数<\/td><td><code>ℵ₀<\/code><\/td><\/tr><tr><td>实数基数<\/td><td><code>2^ℵ₀<\/code>（连续统假设说等于 ℵ₁，独立于 ZFC）<\/td><\/tr><\/tbody><\/table>\n<h2>定理与年代<\/h2>\n<table><thead><tr><th>定理<\/th><th>年代<\/th><th>状态<\/th><\/tr><\/thead><tbody><tr><td>素数定理<\/td><td>1896<\/td><td>已证（阿达马、德拉瓦莱普桑）<\/td><\/tr><tr><td>哥德尔不完备<\/td><td>1931<\/td><td>已证<\/td><\/tr><tr><td>连续统假设独立<\/td><td>1938 / 1963<\/td><td>已证独立（哥德尔、科恩）<\/td><\/tr><tr><td>四色定理<\/td><td>1976<\/td><td>已证（计算机辅助）<\/td><\/tr><tr><td>有限单群分类<\/td><td>1955—1980 年代<\/td><td>已完成（2004 补缺口）<\/td><\/tr><tr><td>费马大定理<\/td><td>1994<\/td><td>已证（怀尔斯）<\/td><\/tr><tr><td>庞加莱猜想<\/td><td>2002—2003<\/td><td>已证（佩雷尔曼）<\/td><\/tr><tr><td>黎曼假设<\/td><td>1859 提出<\/td><td>开放<\/td><\/tr><tr><td>P 与 NP<\/td><td>1971 提出<\/td><td>开放<\/td><\/tr><tr><td>ABC 猜想<\/td><td>1985 提出<\/td><td>开放，有争议的宣称证明<\/td><\/tr><\/tbody><\/table>\n<h2>公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>高斯曲率<\/td><td><code>K=κ₁κ₂<\/code><\/td><\/tr><tr><td>欧拉示性数<\/td><td><code>χ=V−E+F<\/code><\/td><\/tr><tr><td>傅里叶变换<\/td><td><code>f̂(ξ)=∫f(x)e^(−2πixξ)dx<\/code><\/td><\/tr><tr><td>ABC 猜想<\/td><td><code>c &lt; K_ε rad(abc)^(1+ε)<\/code><\/td><\/tr><tr><td>欧拉示性数<\/td><td><code>V−E+F=2−2g<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>分支速查<\/h2>\n<table><thead><tr><th>分支<\/th><th>核心问题<\/th><\/tr><\/thead><tbody><tr><td>数论<\/td><td>素数分布、丢番图方程<\/td><\/tr><tr><td>代数几何<\/td><td>多项式解集的结构与奇点<\/td><\/tr><tr><td>几何<\/td><td>度量与曲率下的分类<\/td><\/tr><tr><td>拓扑<\/td><td>连续形变下的不变量<\/td><\/tr><tr><td>表示论<\/td><td>把群变成矩阵<\/td><\/tr><tr><td>PDE<\/td><td>解的存在、唯一、稳定<\/td><\/tr><tr><td>组合<\/td><td>离散结构的计数与必然出现<\/td><\/tr><tr><td>逻辑<\/td><td>形式系统的能力与边界<\/td><\/tr><tr><td>复杂性<\/td><td>问题需要多少资源<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：数学是做什么的", "href": "#/chapter/ch01"}, {"label": "第 2 章：数学的语言与语法", "href": "#/chapter/ch02"}, {"label": "第 3 章：现代数学的起源", "href": "#/chapter/ch03"}, {"label": "第 4 章：概念的词典", "href": "#/chapter/ch04"}, {"label": "第 5 章：数学的各个分支", "href": "#/chapter/ch05"}, {"label": "第 6 章：定理与未解问题", "href": "#/chapter/ch06"}, {"label": "第 7 章：数学在外面的用处", "href": "#/chapter/ch07"}, {"label": "第 8 章：数
